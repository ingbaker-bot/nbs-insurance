<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 儲蓄險現況</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }
    .header-sub { font-size:11px; color:#bbb; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .main { padding:16px; max-width:560px; margin:0 auto; }

    /* 保單卡片 */
    .savings-card {
      background:#fff; border:1px solid #e8e8e8; border-radius:10px;
      overflow:hidden; margin-bottom:12px;
    }

    .card-header {
      padding:12px 14px; display:flex; align-items:flex-start;
      justify-content:space-between; gap:10px;
    }
    .card-header-left { flex:1; min-width:0; }
    .card-no {
      font-size:11px; font-weight:500; font-family:monospace;
      background:#FBEAF0; color:#72243E;
      padding:1px 7px; border-radius:99px;
      display:inline-block; margin-bottom:4px;
    }
    .card-no.annuity { background:#FCEBEB; color:#791F1F; }
    .card-name { font-size:14px; font-weight:500; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .card-meta { font-size:11px; color:#aaa; }
    .edit-btn { padding:4px 10px; font-size:12px; border:1px solid #ddd; border-radius:5px; background:transparent; cursor:pointer; font-family:inherit; color:#666; flex-shrink:0; }

    /* 設定區 */
    .card-setting { padding:12px 14px; border-top:1px solid #f0f0f0; background:#fafafa; }
    .setting-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
    .setting-row.three { grid-template-columns:1fr 1fr 1fr; }
    .field label { display:block; font-size:11px; color:#888; margin-bottom:3px; }
    .field select, .field input {
      width:100%; padding:7px 9px; font-size:13px;
      border:1px solid #e0e0e0; border-radius:6px;
      outline:none; font-family:inherit; background:#fff;
    }
    .field select:focus, .field input:focus { border-color:#378ADD; }

    /* 領回明細表 */
    .return-table-wrap { overflow-x:auto; }
    .return-table {
      width:100%; border-collapse:collapse; font-size:12px;
    }
    .return-table th {
      padding:7px 10px; text-align:right; font-weight:500;
      color:#888; background:#f7f7f5; border-bottom:1px solid #e8e8e8;
      white-space:nowrap;
    }
    .return-table th:first-child { text-align:left; }
    .return-table td {
      padding:7px 10px; text-align:right;
      border-bottom:1px solid #f5f5f5;
    }
    .return-table td:first-child { text-align:left; color:#555; font-weight:500; }
    .return-table .has-return { color:#0C447C; font-weight:500; }
    .return-table .no-return { color:#e0e0e0; }
    .return-table .total-row td { font-weight:500; color:#27500A; background:#f7f7f5; border-top:2px solid #e8e8e8; }

    /* 年度總領回卡片 */
    .annual-summary {
      background:#E6F1FB; border-radius:8px; padding:10px 14px;
      margin-bottom:12px; display:flex; align-items:center; gap:12px;
    }
    .annual-summary .label { font-size:12px; color:#0C447C; }
    .annual-summary .value { font-size:18px; font-weight:500; color:#0C447C; flex:1; }

    /* 年金險累積期提示 */
    .annuity-notice {
      padding:8px 12px; background:#FFF8E1; border:1px solid #FFE082;
      border-radius:8px; font-size:11px; color:#5D4037;
      margin-bottom:8px;
    }

    .section-label { font-size:11px; font-weight:500; color:#999; letter-spacing:0.05em; margin-bottom:8px; margin-top:4px; }
    .empty-state { text-align:center; padding:40px 20px; color:#bbb; font-size:13px; }
    .loading { text-align:center; padding:40px; color:#bbb; font-size:13px; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#378ADD; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .saved-hint { font-size:11px; color:#27AE8F; text-align:center; padding:6px 0; display:none; }
    .save-all-btn { width:100%; padding:11px; background:#378ADD; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; margin-top:4px; }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="goBack()">‹</button>
  <div class="header-title">儲蓄險現況</div>
  <div class="header-sub" id="header-sub"></div>
</div>

<div class="member-tabs" id="member-tabs"></div>

<div class="main">
  <div id="loading" class="loading"><span class="spinner"></span> 載入中…</div>
  <div id="content" style="display:none"></div>
  <div class="saved-hint" id="saved-hint">✓ 已儲存</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

let currentUser     = null;
let familyData      = null;
let familyFileName  = null;
let personDataMap   = {};
let currentPersonId = null;
let savingsSettings = {}; // policyId → { mode, amount, interval, payEndYear }

window.onload = async function() {
  const saved = localStorage.getItem("nbs_user");
  if (!saved) { window.location.href = "index.html"; return; }
  currentUser = JSON.parse(saved);
  familyFileName = localStorage.getItem("nbs_current_family");
  if (!familyFileName) { window.location.href = "main.html"; return; }

  try {
    const fr = await callGAS("readFile", { email:currentUser.email, fileType:"family", fileName:familyFileName });
    familyData = fr.content;
    document.getElementById("header-sub").textContent = familyData.familyName;

    for (const m of familyData.members.filter(m => m.role !== "beneficiary_only")) {
      const pr = await callGAS("readFile", { email:currentUser.email, fileType:"person", fileName:m.name+"_"+m.personId+".json" });
      if (pr.status === "ok") personDataMap[m.personId] = pr.content;
    }

    const savedPerson = localStorage.getItem("nbs_current_person");
    const primary = familyData.members.find(m => m.role === "primary");
    currentPersonId = savedPerson || primary?.personId;

    // 初始化儲蓄設定（從 savings 陣列讀取）
    initSavingsSettings();
    renderTabs();
    renderContent();
  } catch(e) {
    document.getElementById("loading").innerHTML = '<div style="color:#e74c3c">載入失敗：'+e.message+'</div>';
  }
};

function initSavingsSettings() {
  Object.keys(personDataMap).forEach(pid => {
    const person = personDataMap[pid];
    const savings = person.savings || [];
    savings.forEach(s => {
      savingsSettings[s.policyId] = s;
    });
  });
}

function renderTabs() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  document.getElementById("member-tabs").innerHTML = members.map(m => `
    <div class="member-tab ${currentPersonId===m.personId?'active':''}" onclick="switchPerson('${m.personId}')">
      ${m.name}
    </div>`).join("");
}

function switchPerson(pid) {
  currentPersonId = pid;
  renderTabs();
  renderContent();
}

// ── 渲染內容 ──────────────────────────────────────────────
function renderContent() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";

  const person = personDataMap[currentPersonId];
  const savingsPolicies = (person?.policies || []).filter(p =>
    p.category === "儲蓄險" || p.category === "年金險" ||
    p.category === "儲蓄年金"
  );

  if (savingsPolicies.length === 0) {
    document.getElementById("content").innerHTML =
      '<div class="empty-state">此成員尚無儲蓄險或年金險保單<br/>請先至「保險繳費」頁面新增保單</div>';
    return;
  }

  let html = "";

  savingsPolicies.forEach(p => {
    const isAnnuity = p.category === "年金險";
    const s = savingsSettings[p.id] || { policyId:p.id, mode:"year", amount:0, interval:2, payEndYear:null };
    if (!savingsSettings[p.id]) savingsSettings[p.id] = s;

    // 計算領回明細
    const tableHtml = buildReturnTable(p, s);

    html += `<div class="savings-card">
      <div class="card-header">
        <div class="card-header-left">
          <div><span class="card-no ${isAnnuity?'annuity':''}">${p.policyNo||p.id}</span>
            <span style="font-size:10px;padding:1px 6px;border-radius:99px;background:${isAnnuity?'#FCEBEB':'#FBEAF0'};color:${isAnnuity?'#791F1F':'#72243E'};margin-left:6px">${p.category}</span>
          </div>
          <div class="card-name">${p.itemName||'—'}</div>
          <div class="card-meta">${p.company||'—'}　${p.payMode||''}　NT${(p.premiumTWD||0).toLocaleString()}</div>
        </div>
      </div>

      ${isAnnuity ? `<div style="padding:0 14px"><div class="annuity-notice">⚠ 年金險：繳費期（累積期）身故固定為法定繼承人，給付期可指定受益人</div></div>` : ''}

      <div class="card-setting">
        <div style="font-size:11px;font-weight:500;color:#999;margin-bottom:8px">領回設定</div>
        <div class="setting-row">
          <div class="field">
            <label>${isAnnuity?'給付方式':'還本方式'}</label>
            <select id="mode_${p.id}" onchange="updateSetting('${p.id}')">
              <option value="year" ${s.mode==='year'?'selected':''}>年領</option>
              <option value="month" ${s.mode==='month'?'selected':''}>月領</option>
            </select>
          </div>
          <div class="field">
            <label>每次金額（元）</label>
            <input type="number" id="amount_${p.id}" value="${s.amount||''}" placeholder="如 50000" oninput="updateSetting('${p.id}')" />
          </div>
        </div>
        ${s.mode === 'year' ? `
        <div class="setting-row">
          <div class="field">
            <label>每幾年領一次</label>
            <select id="interval_${p.id}" onchange="updateSetting('${p.id}')">
              ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${s.interval==n?'selected':''}>${n} 年</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>起始年（民國）</label>
            <input type="number" id="startYear_${p.id}" value="${s.startYear||''}" placeholder="如 115" oninput="updateSetting('${p.id}')" />
          </div>
        </div>` : ''}
      </div>

      <div style="padding:0 14px 14px">
        ${tableHtml}
      </div>
    </div>`;
  });

  // 儲存按鈕
  html += `<button class="save-all-btn" onclick="saveAll()">儲存所有設定</button>`;

  document.getElementById("content").innerHTML = html;
}

// ── 更新設定並重新計算表格 ────────────────────────────────
function updateSetting(policyId) {
  const s = savingsSettings[policyId];
  s.mode     = document.getElementById("mode_"+policyId)?.value || "year";
  s.amount   = parseFloat(document.getElementById("amount_"+policyId)?.value) || 0;
  s.interval = parseInt(document.getElementById("interval_"+policyId)?.value) || 2;
  s.startYear = parseInt(document.getElementById("startYear_"+policyId)?.value) || null;

  // 只更新這張保單的表格
  const person = personDataMap[currentPersonId];
  const policy = person?.policies?.find(p => p.id === policyId);
  if (!policy) return;

  const tableEl = document.getElementById("table_"+policyId);
  if (tableEl) tableEl.innerHTML = buildReturnTable(policy, s);

  // 若 mode 切換需要重新渲染設定區
  renderContent();
}

// ── 建立領回明細表 ────────────────────────────────────────
function buildReturnTable(policy, s) {
  if (!s.amount || s.amount <= 0) {
    return `<div style="font-size:12px;color:#bbb;padding:8px 0">請填寫領回金額後自動計算</div>`;
  }

  const startDate = policy.startDate;
  if (!startDate) {
    return `<div style="font-size:12px;color:#bbb;padding:8px 0">請先至「保險繳費」填寫保單起始日</div>`;
  }

  const startWYear = new Date(startDate).getFullYear();
  const startRocYear = startWYear - 1911;

  // 分析日（用家庭的分析日）
  const analysisDate = familyData.analysisDate;
  const analysisRocYear = analysisDate ? new Date(analysisDate).getFullYear() - 1911 : startRocYear;

  // 顯示從起始年往後 20 年
  const displayYears = 20;
  const fromYear = s.startYear || (analysisRocYear);
  const toYear = fromYear + displayYears - 1;

  let rows = [];
  let annualTotal = {};

  for (let y = fromYear; y <= toYear; y++) {
    const westernYear = y + 1911;
    let amount = 0;

    if (s.mode === "month") {
      amount = s.amount * 12;
    } else {
      const yearsFromStart = y - startRocYear;
      if (yearsFromStart >= 0) {
        const interval = s.interval || 1;
        if (yearsFromStart % interval === 0) {
          amount = s.amount;
        }
      }
    }

    rows.push({ roc: y + "年", amount });
    if (amount > 0) annualTotal[y] = amount;
  }

  const totalReturn = Object.values(annualTotal).reduce((s,v)=>s+v, 0);

  let tableHtml = `<div id="table_${policy.id}">`;
  tableHtml += `<div style="font-size:11px;font-weight:500;color:#999;margin-bottom:6px;letter-spacing:0.05em">
    領回明細　共 ${Object.keys(annualTotal).length} 次　合計 NT$${totalReturn.toLocaleString()}
  </div>`;
  tableHtml += `<div class="return-table-wrap"><table class="return-table">
    <thead><tr>
      <th>民國年</th>
      <th>領回金額</th>
    </tr></thead>
    <tbody>`;

  rows.forEach(r => {
    if (r.amount > 0) {
      tableHtml += `<tr>
        <td>${r.roc}</td>
        <td class="has-return">NT$${r.amount.toLocaleString()}</td>
      </tr>`;
    } else {
      tableHtml += `<tr>
        <td>${r.roc}</td>
        <td class="no-return">—</td>
      </tr>`;
    }
  });

  tableHtml += `<tr class="total-row">
    <td>合計</td>
    <td>NT$${totalReturn.toLocaleString()}</td>
  </tr>`;

  tableHtml += `</tbody></table></div></div>`;
  return tableHtml;
}

// ── 儲存所有設定 ──────────────────────────────────────────
async function saveAll() {
  const person = personDataMap[currentPersonId];
  if (!person) return;

  // 收集最新設定值
  const savingsPolicies = (person.policies || []).filter(p =>
    p.category === "儲蓄險" || p.category === "年金險" || p.category === "儲蓄年金"
  );

  person.savings = savingsPolicies.map(p => {
    const s = savingsSettings[p.id] || {};
    return {
      policyId:  p.id,
      mode:      s.mode || "year",
      amount:    s.amount || 0,
      interval:  s.interval || 2,
      startYear: s.startYear || null,
    };
  });

  person.updatedAt = new Date().toISOString();

  try {
    const member = familyData.members.find(m => m.personId === currentPersonId);
    await callGAS("saveFile", {
      email: currentUser.email,
      fileType: "person",
      fileId: currentPersonId,
      fileName: member.name+"_"+currentPersonId+".json",
      content: person,
    });
    const hint = document.getElementById("saved-hint");
    hint.style.display = "block";
    setTimeout(() => hint.style.display = "none", 2000);
  } catch(e) {
    alert("儲存失敗："+e.message);
  }
}

function goBack() { window.location.href = "family.html"; }

function callGAS(action, params) {
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  Object.entries(params||{}).forEach(([k,v]) => {
    if (typeof v === "object") url.searchParams.set(k, encodeURIComponent(JSON.stringify(v)));
    else if (v !== null && v !== undefined) url.searchParams.set(k, v);
  });
  return fetch(url.toString()).then(res => res.json());
}
</script>
</body>
</html>
