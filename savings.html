<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 儲蓄險現況</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }
    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }
    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }
    .main { padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .savings-card { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .card-header { padding:12px 14px; border-bottom:1px solid #f0f0f0; }
    .card-no { font-size:11px; font-weight:500; font-family:monospace; background:#FBEAF0; color:#72243E; padding:1px 7px; border-radius:99px; display:inline-block; margin-bottom:4px; }
    .cat-badge { font-size:10px; padding:1px 6px; border-radius:99px; margin-left:6px; }
    .card-name { font-size:14px; font-weight:500; margin:4px 0 2px; }
    .type-section, .fields-section, .table-section { padding:12px 14px; border-bottom:1px solid #f0f0f0; }
    .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .type-btn { padding:8px 10px; border:1px solid #e0e0e0; border-radius:8px; cursor:pointer; background:#fff; font-family:inherit; transition:all 0.12s; }
    .type-btn.active { border-color:#378ADD; background:#E6F1FB; }
    .type-title { font-size:12px; font-weight:500; color:#333; }
    .type-btn.active .type-title { color:#0C447C; }
    .fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field label { display:block; font-size:11px; color:#888; margin-bottom:3px; }
    .field input, .field select { width:100%; padding:8px 9px; font-size:13px; border:1px solid #e0e0e0; border-radius:6px; outline:none; font-family:inherit; background:#fff; }
    .save-all-btn { width:100%; padding:14px; background:#378ADD; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:20px; }
    
    /* 儲存提示框 (置中、醒目) */
    #saved-hint {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(39, 174, 143, 0.95);
      color: #fff;
      padding: 16px 32px;
      border-radius: 99px;
      font-size: 18px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      pointer-events: none;
    }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <script src="nav.js"></script>
</head>
<body>
  <div class="header"><button class="back-btn" onclick="goBack()">‹</button><div class="header-title">儲蓄險現況</div></div>
  <div class="member-tabs" id="member-tabs"></div>
  <div class="main">
    <div id="loading" style="text-align:center;padding:40px">載入中…</div>
    <div id="content" style="display:none"></div>
    <div id="saved-hint">✓ 已儲存</div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";
    
    // 變數統一宣告
    let currentUser = null, familyData = null, personDataMap = {}, currentPersonId = null, settings = {};

    // 儲存邏輯 (含進度提示)
    async function saveAll() {
      const hint = document.getElementById("saved-hint");
      hint.innerHTML = '<span class="spinner"></span>儲存中...';
      hint.style.background = "rgba(245, 166, 35, 0.95)"; // 橘色代表儲存中
      hint.style.display = "block";

      const person = personDataMap[currentPersonId];
      if (!person) return;

      // 假設您原本有 collectValues 函數來收集畫面資料存入 settings
      if (typeof collectAllValues === "function") collectAllValues();
      
      person.savings = Object.values(settings);
      person.updatedAt = new Date().toISOString();

      try {
        const member = familyData.members.find(m => m.personId === currentPersonId);
        await callGAS("saveFile", { 
          email: currentUser.email, 
          fileType: "person", 
          fileId: currentPersonId, 
          fileName: member.name + "_" + currentPersonId + ".json", 
          content: person 
        });
        
        sessionStorage.setItem("nbs_person_" + currentPersonId, JSON.stringify(person));
        
        // 儲存成功切換狀態
        hint.innerHTML = "✓ 已儲存";
        hint.style.background = "rgba(39, 174, 143, 0.95)"; // 綠色
        setTimeout(() => { hint.style.display = "none"; }, 2000);
      } catch(e) { 
        hint.style.display = "none";
        alert("儲存失敗：" + e.message); 
      }
    }

    // 導覽載入後的處理
    window.addEventListener("nbs_nav_ready", async function(e) {
      currentUser = e.detail.user;
      familyData = e.detail.familyData;
      currentPersonId = e.detail.currentPersonId;
      // ... 載入資料並呼叫 renderContent ...
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";
    });

    function goBack() { window.location.href="family.html"; }
    function callGAS(action, params) { /* 您的 GAS 呼叫邏輯 */ }
  </script>
</body>
</html>
