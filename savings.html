<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 儲蓄險現況</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:26px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:18px; font-weight:500; flex:1; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:14px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; display:flex; align-items:center; gap:5px; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }
    .tab-count { font-size:14px; padding:0 5px; border-radius:99px; background:#f0f0f0; color:#aaa; }
    .member-tab.active .tab-count { background:#E6F1FB; color:#0C447C; }

    .page-tabs { display:flex; background:#fff; border-bottom:1px solid #eee; padding:0 16px; }
    .page-tab { padding:10px 16px; font-size:14px; cursor:pointer; border-bottom:2px solid transparent; color:#888; white-space:nowrap; }
    .page-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .main { padding:16px; max-width:1200px; margin:0 auto; width:100%; }

    /* ── 保單卡片 ── */
    .savings-card { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .card-header { padding:12px 14px; border-bottom:1px solid #f0f0f0; }
    .card-no { font-size:14px; font-weight:500; font-family:monospace; background:#FBEAF0; color:#72243E; padding:1px 7px; border-radius:99px; display:inline-block; margin-bottom:4px; }
    .cat-badge { font-size:14px; padding:1px 6px; border-radius:99px; margin-left:6px; }
    /* 跟 export.html「保單與受益人整合表」、現金流時間軸同一套險種色盤 */
    .cat-儲蓄險 { background:#DCFCE7; color:#15803D; }
    .cat-年金險 { background:#CCFBF1; color:#0F766E; }
    .cat-投資型保險 { background:#EDE9FE; color:#6D28D9; }
    .cat-儲蓄年金 { background:#DCFCE7; color:#15803D; }
    .card-name { font-size:17px; font-weight:500; margin:4px 0 2px; }
    .card-dates { font-size:14px; color:#bbb; margin-top:2px; }

    .type-section { padding:12px 14px; border-bottom:1px solid #f0f0f0; }
    .section-label { font-size:14px; color:#999; margin-bottom:8px; font-weight:500; letter-spacing:.3px; }
    .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .type-grid > :last-child:nth-child(odd) { grid-column:1/-1; }
    .type-btn { padding:8px 10px; border:1px solid #e0e0e0; border-radius:8px; cursor:pointer; background:#fff; font-family:inherit; transition:all 0.12s; text-align:left; }
    .type-btn.active { border-color:#378ADD; background:#E6F1FB; }
    .type-title { font-size:16px; font-weight:500; color:#333; }
    .type-btn.active .type-title { color:#0C447C; }
    .type-desc { font-size:14px; color:#bbb; margin-top:2px; }
    .type-btn.active .type-desc { color:#378ADD; }

    /* 進階設定 */
    .advanced-section { padding:12px 14px; border-bottom:1px solid #f0f0f0; background:#fafafa; display:none; }
    .advanced-section.visible { display:block; }
    .adv-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .adv-grid-1 { display:grid; grid-template-columns:1fr; gap:10px; }
    .adv-block { background:#fff; border:1px solid #ebebeb; border-radius:8px; padding:10px 12px; }
    .adv-block-title { font-size:14px; font-weight:600; color:#378ADD; margin-bottom:8px; }
    .adv-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .adv-row.single { grid-template-columns:1fr; }
    .field label { display:block; font-size:14px; color:#888; margin-bottom:3px; }
    .field input, .field select { width:100%; padding:7px 9px; font-size:17px; border:1px solid #e0e0e0; border-radius:6px; outline:none; font-family:inherit; background:#fff; }
    .field input:focus, .field select:focus { border-color:#378ADD; }

    /* 逐年明細表格 */
    .yearly-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
    .yearly-table th { background:#f0f6fc; padding:5px 8px; text-align:left; color:#0C447C; font-weight:500; border-bottom:1px solid #dde8f5; }
    .yearly-table th:last-child { text-align:right; }
    .yearly-table td { padding:4px 8px; border-bottom:1px solid #f5f5f5; color:#555; }
    .yearly-table td:last-child { text-align:right; }
    .yearly-table input { width:100%; padding:4px 6px; font-size:16px; border:1px solid #e0e0e0; border-radius:4px; outline:none; font-family:inherit; text-align:right; }
    .yearly-table input:focus { border-color:#378ADD; }
    .yr-count-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .yr-count-row label { font-size:14px; color:#888; }
    .yr-count-row input { width:56px; padding:5px 7px; font-size:16px; border:1px solid #e0e0e0; border-radius:5px; outline:none; font-family:inherit; }
    .yr-count-row input:focus { border-color:#378ADD; }

    .fields-section { padding:12px 14px; border-bottom:1px solid #f0f0f0; }

    .save-all-btn { width:100%; padding:14px; background:#378ADD; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; margin-top:4px; font-family:inherit; }
    .save-all-btn:hover { background:#2970c0; }

    #saved-hint { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(39,174,143,0.95); color:#fff; padding:16px 32px; border-radius:99px; font-size:19px; font-weight:600; z-index:9999; box-shadow:0 4px 15px rgba(0,0,0,0.2); pointer-events:none; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── 現金流時間軸 ── */
    #timeline-view { display:none; }
    .timeline-controls { background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:14px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .timeline-controls label { font-size:14px; color:#666; }
    .timeline-controls input[type=number] { width:72px; padding:6px 8px; font-size:16px; border:1px solid #e0e0e0; border-radius:6px; outline:none; font-family:inherit; }
    .timeline-controls input[type=number]:focus { border-color:#378ADD; }
    .tc-sep { color:#ccc; }
    .render-btn { padding:7px 16px; background:#378ADD; color:#fff; border:none; border-radius:7px; font-size:16px; font-weight:500; cursor:pointer; font-family:inherit; margin-left:auto; }

    .timeline-wrap { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .timeline-header { padding:12px 16px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:8px; }
    .timeline-title { font-size:17px; font-weight:600; }
    .timeline-subtitle { font-size:14px; color:#333; font-weight:600; }

    /* 時間軸表格：凍結第一欄（成員名稱） */
    .cf-scroll-wrap { overflow-x:auto; position:relative; }
    .cf-table { border-collapse:separate; border-spacing:0; font-size:16px; }
    .cf-table th { background:#f7f7f5; padding:9px 10px; text-align:center; font-weight:600; color:#333; border-bottom:1px solid #ebebeb; white-space:nowrap; border-right:1px solid #ebebeb; }
    .cf-table th:first-child { text-align:left; min-width:88px; width:88px; position:sticky; left:0; z-index:3; background:#f7f7f5; border-right:2px solid #dde0f7; box-shadow:2px 0 4px rgba(0,0,0,0.04); }
    .cf-table td { padding:6px 10px; text-align:center; border-bottom:1px solid #f5f5f5; border-right:1px solid #f5f5f5; }
    .cf-table td:first-child { text-align:left; font-weight:500; color:#1a1a1a; white-space:nowrap; position:sticky; left:0; z-index:2; background:#fff; border-right:2px solid #dde0f7; box-shadow:2px 0 4px rgba(0,0,0,0.04); }
    .cf-total-row td { background:#4c46b8; font-weight:700; color:#fff; border-top:2px solid #3730a3; }
    .cf-total-row td:first-child { background:#4c46b8; }
    .cf-bar { height:30px; border-radius:6px; background:radial-gradient(ellipse at 30% 20%,#a5a2d6 0%,#4338ca 55%,#241f6a 100%); display:inline-flex; align-items:center; justify-content:center; min-width:36px; padding:0 6px; }
    .cf-bar span { font-size:17px; color:#fff; white-space:nowrap; font-weight:700; }
    .cf-amount { font-size:17px; color:#4338ca; font-weight:700; white-space:nowrap; }
    .cf-total-row .cf-amount { color:#fff; }
    /* 被保險人分組標題列 */
    .cf-member-row td { background:#eef0ff; padding:8px 10px; border-top:3px solid #4338ca; border-bottom:1px solid #dde0f7; }
    /* 保單子列縮排 */
    .cf-policy-row td { background:#fff; }
    .cf-policy-row:hover td { background:#fafaff; }
    /* 每人小計列 */
    .cf-subtotal-row td { background:#eef0ff; border-top:1px solid #dde0f7; border-bottom:2px solid #c7cdf5; font-weight:700; }
    .empty-timeline { text-align:center; padding:40px 20px; color:#bbb; font-size:14px; line-height:1.8; }
    .empty-state { text-align:center; padding:40px 20px; color:#bbb; font-size:14px; }


    /* 保單卡片收合 */
    .card-toggle { cursor:pointer; user-select:none; }
    .card-toggle:hover { background:#fafafa; }
    .card-chevron { font-size:19px; color:#aaa; width:14px; flex-shrink:0; transition:transform 0.15s; }
    .card-summary { font-size:14px; color:#888; white-space:nowrap; flex-shrink:0; margin-left:8px; }
    .card-body { border-top:1px solid #f0f0f0; }

    /* ── 列印樣式（橫式 A4，滿版時間軸）── */
    @media print {
      /* 強制橫向 A4，邊距最小化 */
      @page { size: A4 landscape; margin: 6mm 8mm; }
      /* 隱藏非時間軸的 UI */
      .header, .member-tabs, .page-tabs, .timeline-controls,
      #settings-view, #loading, .back-btn, #saved-hint { display:none !important; }
      /* 確保時間軸可見且展開 */
      #timeline-view { display:block !important; }
      body { background:#fff; margin:0; padding:0; }
      .main { padding:0; margin:0; max-width:100%; }
      .timeline-wrap { border:1px solid #ddd; box-shadow:none; page-break-inside:avoid; }
      .timeline-header { padding:6px 10px; }
      /* 完整展開：取消 overflow */
      .cf-scroll-wrap { overflow:visible !important; width:100%; }
      /* 捲軸隱藏 */
      ::-webkit-scrollbar { display:none; }
      /* 表格字體維持清晰 */
      .cf-table { font-size:14px; width:100%; table-layout:auto; }
      .cf-table th, .cf-table td { padding:4px 6px; }
      .cf-bar { height:24px; min-width:28px; }
      .cf-bar span { font-size:16px; font-weight:600; }
      .cf-amount { font-size:16px; }
      /* sticky 取消 */
      .cf-table th:first-child,
      .cf-table td:first-child { position:static !important; box-shadow:none !important; min-width:130px; }
      /* 時間軸標題 */
      .timeline-title { font-size:17px; }
      .timeline-subtitle { font-size:14px; }
    }
  </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="nav.js"></script>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="header-title">儲蓄險現況</div>
  </div>
  <div class="member-tabs" id="member-tabs"></div>
  <div class="page-tabs">
    <div class="page-tab active" id="tab-settings" onclick="switchPageTab('settings')">保單設定</div>
    <div class="page-tab" id="tab-timeline" onclick="switchPageTab('timeline')">現金流時間軸</div>
  </div>
  <div class="main">
    <div id="loading" style="text-align:center;padding:40px;color:#bbb;font-size:14px">
      <span class="spinner" style="border-top-color:#378ADD;border-color:#e0e0e0"></span> 載入中…
    </div>
    <div id="settings-view" style="display:none"></div>
    <div id="timeline-view">
      <div class="timeline-controls">
        <label>起始年</label>
        <input type="number" id="tl-start" min="2000" max="2099" />
        <span class="tc-sep">—</span>
        <label>結束年</label>
        <input type="number" id="tl-end" min="2000" max="2099" />
        <button class="render-btn" onclick="renderTimeline()">繪製</button>
      </div>
      <div id="timeline-content"></div>
    </div>
    <div id="saved-hint">✓ 已儲存</div>
  </div>

<script>
    // GAS_URL 已移至 nav.js 統一管理
var currentUser = null, familyData = null, personDataMap = {}, currentPersonId = null;
var settings = {}; // { [policyId]: settingObj }
// 退休金(勞保/勞退)：獨立於任何一張保單之外的資料，不掛在policyId上
var laborPensionData = {};
var currentPageTab = "settings";


// ── 領回類型 ──────────────────────────────────────────────
var TYPES_BASE = [
  { key:"1", title:"期滿領整筆",           desc:"保單期滿一次全額領回" },
  { key:"2", title:"繳費期間領＋期滿整筆", desc:"繳費中定期領回，期滿再領整筆" },
  { key:"3", title:"期間不領＋期滿領",     desc:"繳費期間不動，期滿統一領回" },
  { key:"4", title:"期間領＋期滿領",       desc:"期間定期領回，期滿再領" },
];
var TYPE_SAVINGS_EXTRA = { key:"5", title:"月領生存金",  desc:"每月固定領取生存保險金" };
var TYPE_INVEST_EXTRA  = { key:"5", title:"月月配息",    desc:"每月依帳戶價值配息" };
// 類型 6：逐年遞增生存金
var TYPE_YEARLY_DETAIL = { key:"6", title:"逐年領回明細（分紅／還本型）", desc:"含生存金及紅利，依試算表逐年填入" };

function getTypes(category) {
  const extra = category === "投資型保險" ? TYPE_INVEST_EXTRA : TYPE_SAVINGS_EXTRA;
  return [...TYPES_BASE, extra, TYPE_YEARLY_DETAIL];
}
function needsDuringBlock(k) { return ["2","4"].includes(k); }
function isMonthly(k)        { return k === "5"; }
function isYearlyDetail(k)   { return k === "6"; }

// ── 取得被保人 100 歲的西元年 ─────────────────────────────
function getEndYearAt100(memberId, policy) {
  // 優先從 person.profile.birthDate 算
  const person = personDataMap[memberId];
  const bd = person?.profile?.birthDate ||
             familyData?.members?.find(m => m.personId === memberId)?.birthDate;
  if (bd) {
    const birthYear = parseInt(bd.slice(0, 4));
    if (!isNaN(birthYear)) return birthYear + 100;
  }
  // fallback：保單起始日 + 80 年（無生日資料時的保守估算）
  if (policy?.startDate) {
    const startYear = parseInt(policy.startDate.slice(0, 4));
    if (!isNaN(startYear)) return startYear + 80;
  }
  return new Date().getFullYear() + 50;
}

// ── 初始化 ────────────────────────────────────────────────
window.addEventListener("nbs_nav_ready", async function(e) {
  currentUser     = e.detail.user;
  familyData      = e.detail.familyData;
  currentPersonId = e.detail.currentPersonId;
  await loadData();
});

async function loadData() {
  try {
    const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
    await Promise.all(activeMembers.map(async m => {
      const cacheKey = "nbs_person_" + m.personId;
      // 每次重新讀取，確保保單異動即時反映
      const pr = await callGAS("readFile", {
        email: currentUser.email, fileType:"persons",
        fileName: m.name + "_" + m.personId + ".json"
      });
      if (pr.status === "ok") {
        personDataMap[m.personId] = pr.content;
        sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
      } else {
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) personDataMap[m.personId] = JSON.parse(cached);
      }
    }));
    // SPA 底下，這段 await 期間使用者可能已經切到別頁——這時候
    // DOM 已經被替換掉，不該再繼續操作，靜默結束即可，不用報錯
    if (window.NBSRouter && !NBSRouter.isActive("savings.html")) return;
    document.getElementById("loading").style.display = "none";
    document.getElementById("settings-view").style.display = "block";
    renderTabs();
    renderSettings();
    const now = new Date().getFullYear();
    document.getElementById("tl-start").value = now;
    document.getElementById("tl-end").value   = now + 14;  // 15 年（起始+14），橫式 A4 剛好
  } catch(e) {
    // 同上：如果是因為使用者已經切走、DOM 被替換掉導致的錯誤，
    // 不用跳出誤導性的 alert，只記錄到 console 方便除錯即可
    if (window.NBSRouter && !NBSRouter.isActive("savings.html")) { console.warn("[savings] 已切換頁面，略過：", e); return; }
    alert("資料載入異常：" + e.message);
  }
}

// ── 頁面 Tab ──────────────────────────────────────────────
function switchPageTab(tab) {
  currentPageTab = tab;
  ["settings","timeline"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
    document.getElementById(t === "settings" ? "settings-view" : "timeline-view")
            .style.display = t === tab ? "block" : "none";
  });
  if (tab === "timeline") renderTimeline();
}

// ── 成員 Tab ──────────────────────────────────────────────
function renderTabs() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  document.getElementById("member-tabs").innerHTML = members.map(m => {
    const count = (personDataMap[m.personId]?.policies || [])
      .filter(p => ["儲蓄險","年金險","儲蓄年金","投資型保險"].includes(p.category)).length;
    return `<div class="member-tab ${currentPersonId===m.personId?'active':''}"
      onclick="switchMember('${m.personId}')">
      ${m.name}<span class="tab-count">${count}</span></div>`;
  }).join("");
}

function switchMember(pid) {
  currentPersonId = pid;
  settings = {};
  laborPensionData = {};
  renderTabs();
  renderSettings();
  if (currentPageTab === "timeline") renderTimeline();
}

// ── 保單設定渲染 ──────────────────────────────────────────
// 保單顏色：改用跟 export.html「保單與受益人整合表」同一套險種色盤，
// 依「類別」固定顏色（儲蓄險/年金險/投資型保險/儲蓄年金），不再是依保單
// 排列順序輪流交錯的顏色——這樣同一種險種，不管在哪個成員底下、哪張
// 保單，看到的顏色都一致，跟 export.html 的報告色系對得起來。
var SAVINGS_CAT_COLORS = { "儲蓄險":"#16A34A", "年金險":"#0D9488", "投資型保險":"#7C3AED", "儲蓄年金":"#16A34A", "勞保":"#0EA5E9", "勞退":"#D97706", "勞退舊制":"#B45309", "國民年金":"#059669" };
function _shadeHex(hex, pct) {
  // pct > 0 調亮、< 0 調暗
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, ((n>>16)&255) + Math.round(255*pct)));
  const g = Math.min(255, Math.max(0, ((n>>8)&255)  + Math.round(255*pct)));
  const b = Math.min(255, Math.max(0, (n&255)       + Math.round(255*pct)));
  return "#" + [r,g,b].map(v => v.toString(16).padStart(2,"0")).join("");
}
function getPolicyColor(category) {
  const solid = SAVINGS_CAT_COLORS[category] || "#6b7280";
  const light = _shadeHex(solid, 0.45);
  const dark  = _shadeHex(solid, -0.35);
  return { solid: solid, grad: `radial-gradient(ellipse at 30% 20%,${light} 0%,${solid} 55%,${dark} 100%)` };
}

// ── 退休金(勞保/勞退)：獨立於保單之外，用來搭配儲蓄險現金流一起看 ──
// 平均餘命只是台灣近年概略值，畫面上會直接顯示出來、業務員可以自己
// 覆寫起領年齡去對應想要的顯示範圍，不會偷偷藏在背後計算。
var LIFE_EXPECTANCY = { male: 77, female: 84 };

function updateLaborPension(field, val) {
  laborPensionData[field] = val;
}

function renderLaborPensionCard(person) {
  if (!laborPensionData._loaded) {
    const lp = person.laborPension || {};
    laborPensionData = {
      _loaded: true,
      gender:     lp.gender     || "male",
      liType:     lp.liType     || "monthly",   // monthly=月領年金／lumpsum=一次請領
      liAmount:   lp.liAmount   || "",

function renderSettings() {
  const person = personDataMap[currentPersonId];
  if (!person) return;
  const policies = (person.policies || []).filter(p =>
    ["儲蓄險","年金險","儲蓄年金","投資型保險"].includes(p.category));

  if (!policies.length) {
    document.getElementById("settings-view").innerHTML =
      renderLaborPensionCard(person) +
      `<div class="empty-state">此成員尚無儲蓄／年金／投資型保單</div>`;
    return;
  }

  let html = renderLaborPensionCard(person);
  policies.forEach((p, pIdx) => {
    if (!settings[p.id]) {
      const sv = (person.savings || []).find(s => s.policyId === p.id) || {};
      // 從 policy 本身讀取幣別和匯率
      const polCurrency = p.currency || "TWD";
      const polRate     = parseFloat(p.exchangeRate) || 1;
      settings[p.id] = {
        policyId:      p.id,
        currency:      polCurrency,
        exchangeRate:  sv.exchangeRate !== undefined ? sv.exchangeRate : polRate,
        type:          sv.type          || "1",
        duringFreqYr:  sv.duringFreqYr  || "2",
        duringStartYr: sv.duringStartYr || "1",
        duringAmt:     sv.duringAmt     || "",
        afterFreqYr:   sv.afterFreqYr   || "1",
        afterStartYr:  sv.afterStartYr  || "0",
        afterAmt:      sv.afterAmt      || "",
        yearlyRows:    sv.yearlyRows    || "20",
        yearlyAmts:    sv.yearlyAmts    || [],
        accountValue:     sv.accountValue     || "",
        accountValueDate: sv.accountValueDate || "",
        // 分紅保單（類型6）若備註空白，預填警語
        note: sv.note !== undefined && sv.note !== "" ? sv.note :
              (sv.type === "6" ? "領回金額採中分紅預估，實際以保險公司年度公告為準" : ""),
      };
    }
    const s        = settings[p.id];
    const isFx     = s.currency && s.currency !== "TWD";
    const types    = getTypes(p.category);
    const monthly  = isMonthly(s.type);
    const yearly   = isYearlyDetail(s.type);
    const showDuring = needsDuringBlock(s.type);

    const dateStr = [
      p.startDateRaw ? "起：" + p.startDateRaw : "",
      p.payEndRaw    ? "繳滿：" + p.payEndRaw  : "",
    ].filter(Boolean).join("　");

    // 已設定過的保單預設展開，新保單預設收合
    // 用 s（settings[p.id]）判斷，sv 可能不在 scope 內
    const isConfigured = !!(s.type && s.type !== "1") || !!(s.afterAmt) || !!(s.duringAmt) || !!(s.yearlyAmts && s.yearlyAmts.length) || !!(s.accountValue);
    const pColor = getPolicyColor(p.category).solid;
    html += `<div class="savings-card ${isConfigured?'card-open':''}" data-pid="${p.id}" style="border-left:6px solid ${pColor}">
      <div class="card-header card-toggle" onclick="toggleCard('${p.id}')">
        <div style="display:flex;align-items:center;gap:6px;flex:1">
          <span class="card-chevron" id="chevron-${p.id}">${isConfigured?'▾':'▸'}</span>
          <div>
            <div>
              <span class="card-no">${p.policyNo||"—"}</span>
              <span class="cat-badge cat-${p.category}">${p.category}</span>
              ${isFx?`<span style="font-size:14px;background:#FFF3CD;color:#856404;padding:1px 6px;border-radius:3px;margin-left:4px">${s.currency}</span>`:""}
            </div>
            <div class="card-name">${p.itemName||"—"}</div>
            ${dateStr?`<div class="card-dates">${dateStr}</div>`:""}
            ${s.accountValue?`<div class="card-dates" style="color:#185FA5;font-weight:600">目前帳戶價值：${fmtAccountValue(s.accountValue, s.currency, s.exchangeRate)}${s.accountValueDate?`（${s.accountValueDate} 登錄）`:""}</div>`:""}
          </div>
        </div>
        <div class="card-summary" id="summary-${p.id}">${buildCardSummary(s)}</div>
      </div>

      <!-- 展開內容 -->
      <div class="card-body" id="body-${p.id}" style="display:${isConfigured?'block':'none'}">
      <!-- 目前帳戶價值：跟下面的「領回方式」是兩個不同概念——這裡填的是
           現在帳戶裡已經累積多少錢，領回方式填的是未來排定怎麼領。
           外幣保單這裡要填「原幣」金額（跟保單本身的幣別一致），不是台幣，
           不然會跟其他台幣保單的金額混在一起、加總會算錯。 -->
      <div class="adv-block" style="margin-bottom:12px;border-color:#B5D4F4">
        <div class="adv-block-title" style="color:#0C447C">目前帳戶價值（選填）</div>
        <div class="adv-row">
          <div class="field">
            <label>帳戶價值${isFx?`（原幣：${s.currency}）`:"（元）"}</label>
            <input type="number" id="accountValue-${p.id}" value="${s.accountValue}"
                   placeholder="${isFx?"請填原幣金額，如：10000":"如：2020000"}" oninput="updateSetting('${p.id}','accountValue',this.value);_refreshAccountValueHint('${p.id}')" />
            ${isFx?`<div id="accountValueHint-${p.id}" style="font-size:12px;color:#4B5563;font-weight:600;margin-top:3px">${s.accountValue?("≈ 台幣 "+fmtAmt((parseFloat(s.accountValue)||0)*(parseFloat(s.exchangeRate)||1))):""}</div>`:""}
          </div>
          <div class="field">
            <label>登錄日期</label>
            <input type="date" id="accountValueDate-${p.id}" value="${s.accountValueDate}"
                   onchange="updateSetting('${p.id}','accountValueDate',this.value)" />
          </div>
        </div>
      </div>

      <!-- 類型選擇 -->
      <div class="type-section">
        <div class="section-label">領回方式</div>
        <div class="type-grid">
          ${types.map(t=>`
            <button class="type-btn ${s.type===t.key?'active':''}" data-type-key="${t.key}"
                    onclick="selectType('${p.id}','${t.key}')">
              <div class="type-title">${t.title}</div>
              <div class="type-desc">${t.desc}</div>
            </button>`).join("")}
        </div>
      </div>

      <!-- 進階設定 -->
      <div class="advanced-section visible" id="adv-${p.id}">
        <div class="section-label">進階設定</div>
        <div id="adv-inner-${p.id}">
          ${renderAdvInner(p.id, s)}
        </div>
        ${isFx ? `
        <div class="field" style="margin-top:10px">
          <label>匯率（1 ${s.currency} = ? 台幣）
            <span style="font-size:14px;color:#aaa;font-weight:400">保單輸入時的匯率，可修改</span>
          </label>
          <input type="number" id="exrate-${p.id}" value="${s.exchangeRate||''}"
                 step="0.01" placeholder="如美元填 32.0"
                 oninput="updateSetting('${p.id}','exchangeRate',parseFloat(this.value)||1);_refreshAccountValueHint('${p.id}')" />
        </div>` : ""}
        <div class="field" style="margin-top:10px">
          <label>備註</label>
          <input type="text" id="note-${p.id}" value="${escHtml(s.note)}"
                 placeholder="如：每年8月入帳"
                 oninput="updateSetting('${p.id}','note',this.value)" />
        </div>
      </div>
      </div><!-- /.card-body -->
    </div>`;
  });

  html += `<button class="save-all-btn" onclick="saveAll()">儲存所有設定</button>`;
  document.getElementById("settings-view").innerHTML = html;
}

// ── 進階設定內容（依類型） ────────────────────────────────
function renderAdvInner(pid, s) {
  const monthly = isMonthly(s.type);
  const yearly  = isYearlyDetail(s.type);
  const showDuring = needsDuringBlock(s.type);

  if (yearly) {
    return renderYearlyTable(pid, s);
  }

  if (s.type === "1") {
    // 期滿領整筆：只需一個金額
    return `<div class="adv-grid-1">
      <div class="adv-block">
        <div class="adv-block-title">期滿領回</div>
        <div class="adv-row single">
          <div class="field">
            <label>期滿金額（元）</label>
            <input type="number" id="afterAmt-${pid}" value="${s.afterAmt}"
                   placeholder="估算值" oninput="updateSetting('${pid}','afterAmt',this.value)" />
          </div>
        </div>
      </div></div>`;
  }

  const duringBlock = showDuring ? `
    <div class="adv-block" id="adv-during-${pid}">
      <div class="adv-block-title">繳費期間</div>
      <div class="adv-row" style="grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div class="field">
          <label>第幾年開始第一次領</label>
          <input type="number" id="duringStartYr-${pid}" value="${s.duringStartYr||'1'}" min="1" max="30"
                 oninput="updateSetting('${pid}','duringStartYr',this.value)" />
        </div>
        <div class="field">
          <label>之後每 N 年領一次</label>
          <input type="number" id="duringFreqYr-${pid}" value="${s.duringFreqYr}" min="1" max="20"
                 oninput="updateSetting('${pid}','duringFreqYr',this.value)" />
        </div>
        <div class="field">
          <label>每次金額（元）</label>
          <input type="number" id="duringAmt-${pid}" value="${s.duringAmt}"
                 placeholder="估算值" oninput="updateSetting('${pid}','duringAmt',this.value)" />
        </div>
      </div>
      <div style="font-size:14px;color:#aaa;margin-top:4px">
        例：第3年開始、每2年領 → 第3、5、7、9…年觸發
      </div>
    </div>` : "";

  const afterBlock = `
    <div class="adv-block" id="adv-after-${pid}">
      <div class="adv-block-title">${monthly?"月領":"期滿後"}</div>
      ${monthly ? `
        <div class="adv-row single">
          <div class="field">
            <label>每月金額（元）</label>
            <input type="number" id="afterAmt-${pid}" value="${s.afterAmt}"
                   placeholder="估算值" oninput="updateSetting('${pid}','afterAmt',this.value)" />
          </div>
        </div>` : `
        <div class="adv-row" style="grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div class="field">
            <label>第幾年開始第一次領</label>
            <input type="number" id="afterStartYr-${pid}" value="${s.afterStartYr||'0'}" min="0" max="30"
                   oninput="updateSetting('${pid}','afterStartYr',this.value)" />
          </div>
          <div class="field">
            <label>之後每 N 年領一次</label>
            <input type="number" id="afterFreqYr-${pid}" value="${s.afterFreqYr}" min="1" max="10"
                   oninput="updateSetting('${pid}','afterFreqYr',this.value)" />
          </div>
          <div class="field">
            <label>每次金額（元）</label>
            <input type="number" id="afterAmt-${pid}" value="${s.afterAmt}"
                   placeholder="估算值" oninput="updateSetting('${pid}','afterAmt',this.value)" />
          </div>
        </div>
        <div style="font-size:14px;color:#aaa;margin-top:4px">
          第幾年開始：0=繳費期滿當年，1=繳費期滿後第1年，以此類推
        </div>`}
    </div>`;

  return `<div class="${showDuring?'adv-grid-2':'adv-grid-1'}">${duringBlock}${afterBlock}</div>`;
}

// ── 逐年明細表格 ──────────────────────────────────────────
function renderYearlyTable(pid, s) {
  const rows = parseInt(s.yearlyRows) || 10;
  // 補齊 yearlyAmts 到 rows 筆，空白年份自動帶入當年起算
  const baseYear = new Date().getFullYear();
  while (s.yearlyAmts.length < rows) {
    const idx = s.yearlyAmts.length;
    // 若前面的年份有填，接續 +1；否則用當年起算
    const prevYr = idx > 0 ? parseInt(s.yearlyAmts[idx-1].yr) : 0;
    const autoYr = prevYr > 2000 ? prevYr + 1 : baseYear + idx;
    s.yearlyAmts.push({ yr: String(autoYr), amt: "" });
  }

  let tableRows = "";
  for (let i = 0; i < rows; i++) {
    const row = s.yearlyAmts[i] || { yr:"", amt:"" };
    tableRows += `<tr>
      <td><input type="text" value="${escHtml(row.yr)}" placeholder="如 2027"
           oninput="updateYearly('${pid}',${i},'yr',this.value)"
           style="width:80px" /></td>
      <td><input type="number" value="${escHtml(String(row.amt))}" placeholder="0"
           oninput="updateYearly('${pid}',${i},'amt',this.value)" /></td>
      <td><input type="text" value="${escHtml(row.note||'')}" placeholder="如：生存金+中分紅"
           oninput="updateYearly('${pid}',${i},'note',this.value)"
           style="width:120px;font-size:16px;color:#888" /></td>
    </tr>`;
  }

  return `<div class="adv-block">
    <div class="adv-block-title">逐年領回明細（分紅 / 還本型，最多 20 年）</div>
    <div style="background:#FFF8E1;border:1px solid #FFD54F;border-radius:6px;padding:7px 10px;margin-bottom:10px;font-size:14px;color:#7B4F00;line-height:1.6">
      📋 <strong>填入方式</strong>：依保險公司試算表，將各年度「生存保險金＋年度保單紅利（建議採中分紅）」加總後逐年填入<br>
      ⚠️ 領回金額含浮動紅利，時間軸數字僅供參考，實際以保險公司年度公告為準
    </div>
    <div class="yr-count-row">
      <label>顯示年數</label>
      <input type="number" id="yr-rows-${pid}" value="${rows}" min="1" max="20"
             onchange="updateYearlyRows('${pid}',this.value)" />
      <span style="font-size:14px;color:#aaa">年（可填 1–20）</span>
    </div>
    <table class="yearly-table">
      <thead><tr><th>西元年</th><th style="text-align:right">金額（元）</th><th style="text-align:left;padding-left:8px;color:#aaa">說明（選填）</th></tr></thead>
      <tbody id="yr-tbody-${pid}">${tableRows}</tbody>
    </table>
  </div>`;
}

function updateYearly(pid, idx, field, val) {
  if (!settings[pid]) return;
  while (settings[pid].yearlyAmts.length <= idx) settings[pid].yearlyAmts.push({ yr:"", amt:"" });
  settings[pid].yearlyAmts[idx][field] = val;
}

function updateYearlyRows(pid, val) {
  if (!settings[pid]) return;
  const rows = Math.min(20, Math.max(1, parseInt(val) || 10));
  settings[pid].yearlyRows = String(rows);
  // 重繪 tbody
  const s = settings[pid];
  const baseYr2 = new Date().getFullYear();
  while (s.yearlyAmts.length < rows) {
    const idx2 = s.yearlyAmts.length;
    const prevYr2 = idx2 > 0 ? parseInt(s.yearlyAmts[idx2-1].yr) : 0;
    const autoYr2 = prevYr2 > 2000 ? prevYr2 + 1 : baseYr2 + idx2;
    s.yearlyAmts.push({ yr: String(autoYr2), amt: "" });
  }
  let html = "";
  for (let i = 0; i < rows; i++) {
    const row = s.yearlyAmts[i] || { yr:"", amt:"" };
    html += `<tr>
      <td><input type="text" value="${escHtml(row.yr)}" placeholder="如 2027"
           oninput="updateYearly('${pid}',${i},'yr',this.value)"
           style="width:80px" /></td>
      <td><input type="number" value="${escHtml(String(row.amt))}" placeholder="0"
           oninput="updateYearly('${pid}',${i},'amt',this.value)" /></td>
      <td><input type="text" value="${escHtml(row.note||'')}" placeholder="如：生存金+中分紅"
           oninput="updateYearly('${pid}',${i},'note',this.value)"
           style="width:120px;font-size:16px;color:#888" /></td>
    </tr>`;
  }
  const tbody = document.getElementById("yr-tbody-" + pid);
  if (tbody) tbody.innerHTML = html;
}

function toggleCard(pid) {

// 已設定的摘要文字（收合時顯示在標題右側）
function buildCardSummary(s) {
  if (!s || !s.type || s.type === "1") return "";
  const typeNames = { "1":"期滿領","2":"期間+期滿","3":"期滿後領","4":"期間+期滿","5":"月領","6":"逐年明細" };
  const typeName = typeNames[s.type] || "";
  const amt = s.afterAmt || s.duringAmt || "";
  if (!amt) return `<span style="color:#c0c0c0">${typeName}・未填金額</span>`;
  const fmtd = parseFloat(amt) >= 10000
    ? (parseFloat(amt)/10000).toFixed(1) + "萬"
    : parseFloat(amt).toLocaleString();
  return `${typeName}・${fmtd}`;
}

// ── 類型切換（DOM 操作，不重渲染）────────────────────────
function selectType(pid, typeKey) {
  if (!settings[pid]) return;
  settings[pid].type = typeKey;

  // 更新按鈕 active 樣式
  const card = document.querySelector(`[data-pid="${pid}"]`);
  if (!card) return;
  card.querySelectorAll(".type-btn").forEach(btn => {
    const on = btn.dataset.typeKey === typeKey;
    btn.classList.toggle("active", on);
    btn.querySelector(".type-title").style.color = on ? "#0C447C" : "#333";
    btn.querySelector(".type-desc").style.color  = on ? "#378ADD" : "#bbb";
  });

  // 切換到類型 6（分紅/還本型）時，若備註空白自動預填警語
  if (typeKey === "6" && !settings[pid].note) {
    settings[pid].note = "領回金額採中分紅預估，實際以保險公司年度公告為準";
  }
  // 重繪進階設定內容
  const inner = document.getElementById("adv-inner-" + pid);
  if (inner) inner.innerHTML = renderAdvInner(pid, settings[pid]);
  // 更新收合摘要
  const summary = document.getElementById("summary-" + pid);
  if (summary) summary.innerHTML = buildCardSummary(settings[pid]);
}

// ── 儲存 ─────────────────────────────────────────────────
async function saveAll() {
  const person = personDataMap[currentPersonId];
  if (!person) return;

  // 安全防呆：儲存前先確認 settings 有沒有涵蓋這個人「應該要有」的保單數量。
  // 如果兜不起來（例如頁面資料還沒載入完成、或成員剛切換過去），代表
  // settings 是不完整或空的，這時候絕對不能拿去覆蓋後端已經存好的資料——
  // 不然會把之前存過的內容整個蓋成空的，造成資料看起來憑空消失。
  const expectedPolicies = (person.policies || []).filter(p =>
    ["儲蓄險","年金險","儲蓄年金","投資型保險"].includes(p.category));
  const settingsCount = Object.keys(settings).length;
  if (expectedPolicies.length > 0 && settingsCount < expectedPolicies.length) {
    alert(
      "⚠ 儲存已中止\n\n" +
      "畫面資料看起來還沒完全載入完成（這位成員應該有 " + expectedPolicies.length +
      " 張儲蓄／投資型保單，但目前偵測到 " + settingsCount + " 張）。\n\n" +
      "為了不覆蓋掉已經存過的資料，這次不會執行儲存，請重新整理頁面、" +
      "等資料完全載入後再試一次。"
    );
    return;
  }

  const hint = document.getElementById("saved-hint");
  hint.innerHTML = '<span class="spinner"></span>儲存中…';
  hint.style.background = "rgba(245,166,35,0.95)";
  hint.style.display = "block";

  person.savings   = Object.values(settings);
  // 退休金(勞保/勞退)：拿掉內部用的 _loaded 標記，只存實際欄位
  const lpToSave = Object.assign({}, laborPensionData);
  delete lpToSave._loaded;
  person.laborPension = lpToSave;
  person.updatedAt = new Date().toISOString();

  try {
    const member = familyData.members.find(m => m.personId === currentPersonId);
    await callGAS("saveFile", {
      email: currentUser.email, fileType:"persons", fileId: currentPersonId,
      fileName: member.name + "_" + currentPersonId + ".json", content: person,
    });
    sessionStorage.setItem("nbs_person_" + currentPersonId, JSON.stringify(person));
    hint.innerHTML = "✓ 已儲存";
    hint.style.background = "rgba(39,174,143,0.95)";
    setTimeout(() => { hint.style.display = "none"; }, 2000);
  } catch(e) { hint.style.display = "none"; alert("儲存失敗：" + e.message); }
}

// 保單日期解析：優先用 ISO 格式的 startDate/payEndDate 算年份，這兩個欄位
// 若是空的（常見於較早期匯入、只存了畫面顯示用 Raw 字串的舊保單資料），
// 改用 Raw 字串（民國年格式，例：1120923＝民國112年09月23日）換算回西元年，
// 不然這張保單的現金流會因為抓不到起始年，整排都算不出來、全部顯示「—」。
function extractYearSmart(isoDate, rocRaw) {
  if (isoDate) {
    const y = parseInt(String(isoDate).slice(0, 4));
    if (!isNaN(y) && y > 1900) return y;
  }
  if (rocRaw) {
    const digits = String(rocRaw).replace(/\D/g, "");
    if (digits.length >= 7) {
      const rocYear = parseInt(digits.slice(0, 3));
      if (!isNaN(rocYear)) return rocYear + 1911;
    } else if (digits.length >= 4) {
      const y2 = parseInt(digits.slice(0, 4));
      if (!isNaN(y2) && y2 > 1900) return y2;
    }
  }
  return null;
}

// ── 計算單張保單各年現金流 ───────────────────────────────
function calcPolicyFlows(p, s, memberId, years) {
  const startWestern  = extractYearSmart(p.startDate,  p.startDateRaw);
  const payEndWestern = extractYearSmart(p.payEndDate, p.payEndRaw);
  const covEndWestern = p.covEndDate
    ? parseInt(p.covEndDate.slice(0,4))
    : getEndYearAt100(memberId, p);
  if (!startWestern) return {};

  const typeKey       = s.type || "1";
  const duringFreqYr  = parseInt(s.duringFreqYr)  || 2;
  const duringStartYr = parseInt(s.duringStartYr) || 1;  // 第幾年開始第一次領（1=第一年）
  const duringAmt     = parseFloat(s.duringAmt)   || 0;
  const afterFreqYr   = parseInt(s.afterFreqYr)   || 1;
  const afterStartYr  = parseInt(s.afterStartYr !== undefined ? s.afterStartYr : 0); // 期滿後第幾年開始（0=期滿當年）
  const afterAmt      = parseFloat(s.afterAmt)    || 0;
  const monthly      = isMonthly(typeKey);
  const yearly       = isYearlyDetail(typeKey);

  let yearlyMap = {};
  if (yearly && s.yearlyAmts) {
    s.yearlyAmts.forEach(row => {
      const y = parseInt(row.yr), a = parseFloat(row.amt);
      if (!isNaN(y) && !isNaN(a) && a > 0) yearlyMap[y] = (yearlyMap[y]||0) + a;
    });
  }

  // 幣別換算：從 settings 讀取顧問設定的匯率
  const polCur  = (p && p.currency) || "TWD";
  const exRate  = (polCur !== "TWD" && parseFloat(s.exchangeRate)) ? parseFloat(s.exchangeRate) : 1;

  const flows = {};
  years.forEach(yr => {
    if (yr > covEndWestern) return;
    let flow = 0;
    const inDuring = payEndWestern ? (yr >= startWestern && yr < payEndWestern) : false;
    const inAfter  = payEndWestern ? yr >= payEndWestern : yr >= startWestern;

    if (yearly) {
      flow = yearlyMap[yr] || 0;
    } else if (typeKey === "1") {
      if (payEndWestern && yr === payEndWestern) flow = afterAmt;
    } else if (typeKey === "2") {
      if (inDuring && duringAmt > 0) {
        // 第一次領回：保單起始年 + (duringStartYr - 1)，之後每 duringFreqYr 年
        const firstTrigger = startWestern + duringStartYr - 1;
        const e = yr - firstTrigger;
        if (yr >= firstTrigger && e % duringFreqYr === 0) flow += duringAmt;
      }
      if (payEndWestern && yr === payEndWestern) flow += afterAmt;
    } else if (typeKey === "3") {
      if (inAfter && afterAmt > 0) {
        const base = (payEndWestern || startWestern) + afterStartYr;
        const e = yr - base;
        if (yr >= base && e % afterFreqYr === 0) flow = afterAmt;
      }
    } else if (typeKey === "4") {
      if (inDuring && duringAmt > 0) {
        const firstTrigger = startWestern + duringStartYr - 1;
        const e = yr - firstTrigger;
        if (yr >= firstTrigger && e % duringFreqYr === 0) flow += duringAmt;
      }
      if (inAfter && afterAmt > 0) {
        const base = (payEndWestern || startWestern) + afterStartYr;
        const e = yr - base;
        if (yr >= base && e % afterFreqYr === 0) flow += afterAmt;
      }
    } else if (monthly) {
      if (p.category === "投資型保險") {
        // 投資型保險的「月月配息」是帳戶配息，保單成立後就持續每月發放，
        // 不像儲蓄險/年金險的「月領生存金」要等繳費期滿才開始請領。
        if (afterAmt > 0 && yr >= startWestern) flow = afterAmt * 12;
      } else {
        if (inAfter && afterAmt > 0) flow = afterAmt * 12;
      }
    }
    if (flow > 0) flows[yr] = Math.round(flow * exRate);
  });
  return flows;
}

// ── 現金流時間軸 ──────────────────────────────────────────
// ── 退休金(勞保/勞退)現金流計算：算成跟保單一樣的格式，直接併入
// 同一張表的小計/合計，不用另外處理。 ──
function getBirthYearForLP(memberId) {
  const person = personDataMap[memberId];
  const bd = person?.profile?.birthDate ||
             familyData?.members?.find(m => m.personId === memberId)?.birthDate;
  if (bd) {
    const y = parseInt(bd.slice(0, 4));
    if (!isNaN(y)) return y;
  }
  return null;
}
function calcLaborPensionRows(lp, memberId, years) {
  const rows = [];
  if (!lp) return rows;
  const birthYear = getBirthYearForLP(memberId);
  if (birthYear === null) return rows; // 沒有生日資料，算不出起領/終止年份，先跳過

  const lifeExp = LIFE_EXPECTANCY[lp.gender] || LIFE_EXPECTANCY.male;
  const lifeEndYear = birthYear + lifeExp;

  function buildRow(label, type, amount, startAge) {
    const amt = parseFloat(amount) || 0;
    if (amt <= 0) return null;
    const flows = {};
    const startYear = birthYear + (parseInt(startAge) || 0);
    if (type === "lumpsum") {
      if (years.includes(startYear)) flows[startYear] = amt;
    } else {
      const endYear = Math.min(lifeEndYear, years[years.length - 1]);
      years.forEach(y => { if (y >= startYear && y <= endYear) flows[y] = amt * 12; });
    }
    return {
      policyNo: "—",
      itemName: label + (type === "lumpsum" ? "（一次領）" : "（月領，至" + lifeExp + " 歲）"),
      category: label,
      currency: "TWD",
      exchangeRate: 1,
      colorIdx: 0,
      accountValue: "",
      accountValueDate: "",
      stillPaying: false,
      flows,
    };
  }

  const liRow = buildRow("勞保", lp.liType, lp.liAmount, lp.liStartAge);
  if (liRow) rows.push(liRow);
  const lpRow = buildRow("勞退", lp.lpType, lp.lpAmount, lp.lpStartAge);
  if (lpRow) rows.push(lpRow);
  // 勞退舊制固定是雇主一次發給，沒有月領選項
  const osRow = buildRow("勞退舊制", "lumpsum", lp.osAmount, lp.osStartAge);
  if (osRow) rows.push(osRow);
  const npRow = buildRow("國民年金", lp.npType, lp.npAmount, lp.npStartAge);
  if (npRow) rows.push(npRow);
  return rows;
}

function renderTimeline() {
  const startYr = parseInt(document.getElementById("tl-start").value) || new Date().getFullYear();
  const endYr   = parseInt(document.getElementById("tl-end").value)   || startYr + 29;
  if (endYr <= startYr || endYr - startYr > 60) {
    document.getElementById("timeline-content").innerHTML =
      `<div class="empty-timeline">起訖年份設定有誤（最多 60 年）</div>`;
    return;
  }
  const years = [];
  for (let y = startYr; y <= endYr; y++) years.push(y);

  // 結構：groups = [{ memberName, policies: [{ policyNo, itemName, flows }] }]
  const groups = [];
  const totalFlows = {}; // { yr: twdAmt }（已換算台幣）

  familyData.members.filter(m => m.role !== "beneficiary_only").forEach(m => {
    const person = personDataMap[m.personId];
    if (!person) return;
    const savingPolicies = (person.policies || []).filter(p =>
      ["儲蓄險","年金險","儲蓄年金","投資型保險"].includes(p.category));
    // 如果剛好是目前選中的這位成員，優先用尚未存檔的即時退休金資料
    // (跟保單設定同一套邏輯：settings[p.id] 優先於 person.savings)
    const lpSource = (m.personId === currentPersonId && laborPensionData._loaded)
      ? laborPensionData
      : (person.laborPension || {});
    const lpRows = calcLaborPensionRows(lpSource, m.personId, years);
    if (!savingPolicies.length && !lpRows.length) return;

    const policyRows = [];
    savingPolicies.forEach((p, pIdx) => {
      const s = settings[p.id] ||
                (person.savings || []).find(sv => sv.policyId === p.id) ||
                { type:"1" };
      const flows = calcPolicyFlows(p, s, m.personId, years);
      // 累加合計（flows 已換算成台幣）
      Object.entries(flows).forEach(([yr, amt]) => {
        totalFlows[yr] = (totalFlows[yr] || 0) + amt;
      });
      // 「是否仍在繳費期間」要看真正的繳費期滿日，不能用「有沒有算出現金流」
      // 來推斷——很多保單早就繳費期滿了，只是還沒設定領回金額或帳戶價值，
      // 用「沒有現金流＝繳費中」會把這些保單全部誤標成繳費中。
      // 投資型保險另外不判斷這個標籤：這類保單常見不定期繳/彈性繳/單筆躉繳，
      // 「繳費期滿日」欄位對它的意義不像儲蓄險/年金險那麼明確，容易誤標。
      const payEndWestern = extractYearSmart(p.payEndDate, p.payEndRaw);
      const stillPaying = p.category !== "投資型保險" &&
        payEndWestern !== null && new Date().getFullYear() < payEndWestern;
      policyRows.push({
        policyNo:  p.policyNo || p.id,
        itemName:  p.itemName || "",
        category:  p.category || "",
        currency:  p.currency || "TWD",
        exchangeRate: s.exchangeRate || 1,
        colorIdx:  pIdx,
        accountValue:     s.accountValue     || "",
        accountValueDate: s.accountValueDate || "",
        stillPaying,
        flows,
      });
    });

    // 加入勞保/勞退列，現金流一併累加進總計
    lpRows.forEach(row => {
      Object.entries(row.flows).forEach(([yr, amt]) => {
        totalFlows[yr] = (totalFlows[yr] || 0) + amt;
      });
      policyRows.push(row);
    });

    if (policyRows.length > 0) groups.push({ memberName: m.name, policies: policyRows });
  });

  if (!groups.length) {
    document.getElementById("timeline-content").innerHTML =
      `<div class="empty-timeline">尚無儲蓄保單資料或未設定領回金額<br>
       請先在「保單設定」填入各保單的每次領回金額後再查看時間軸</div>`;
    return;
  }

  // 自動裁切尾端空白年份
  const activeYears = years.filter(y => totalFlows[y] > 0);
  // 就算沒有排定的未來現金流，只要有任何一張保單填過「目前帳戶價值」，
  // 還是要把表格畫出來（不然填的帳戶價值會被這個空狀態訊息整個擋住看不到）。
  const hasAnyAccountValue = groups.some(g => g.policies.some(pr => pr.accountValue));
  if (!activeYears.length && !hasAnyAccountValue) {
    document.getElementById("timeline-content").innerHTML =
      `<div class="empty-timeline">所有保單在此時間範圍內均無現金流入</div>`;
    return;
  }
  const trimYears = activeYears.length
    ? years.filter(y => y <= Math.max(...activeYears))
    : years; // 沒有任何排定現金流時，維持使用者選定的完整年份範圍，重點是顯示帳戶價值那一行
  const maxTotal = Math.max(...Object.values(totalFlows), 1);
  const totalPolicies = groups.reduce((s, g) => s + g.policies.length, 0);

  // ── 表頭 ──
  const yearHeaders = trimYears.map(y =>
    `<th><span style="font-size:18px">${y}</span><br><span style="font-size:15px;color:#333;font-weight:700">${y-1911}年</span></th>`
  ).join("");

  // ── 分組列 ──
  const groupRows = groups.map(g => {
    // 被保險人名稱列（分組標題）
    const nameRow = `<tr class="cf-member-row">
      <td colspan="${trimYears.length + 2}">
        <span style="font-size:16px;font-weight:600;color:#1a1a1a">${g.memberName}</span>
        <span style="font-size:14px;color:#555;font-weight:500;margin-left:6px">${g.policies.length} 張保單</span>
        ${g.policies.filter(p=>p.stillPaying).length > 0
          ? `<span style="font-size:14px;color:#b07000;font-weight:500;margin-left:4px">（含 ${g.policies.filter(p=>p.stillPaying).length} 張繳費中）</span>`
          : ""}
      </td>
    </tr>`;

    // 各保單列：顏色用 pr.colorIdx（跟保單設定頁同一張保單同一個顏色，
    // 方便業務員在兩個分頁之間對照是哪一張）
    const policyRowsHtml = g.policies.map(pr => {
      const pColor = getPolicyColor(pr.category);
      const cells = trimYears.map(yr => {
        const amt = pr.flows[yr] || 0;
        if (!amt) return `<td><span style="color:#888;font-size:14px;font-weight:500">—</span></td>`;
        const w = Math.max(34, Math.round((amt / maxTotal) * 80));
        // 用 min-width 而非 width：數字比計算出來的比例寬度還長時，
        // 讓色塊自己撐開，不要讓文字溢出色塊外面。
        return `<td><div class="cf-bar" style="min-width:${w}px;background:${pColor.grad}"><span>${fmtAmt(amt)}</span></div></td>`;
      }).join("");

      // 第一欄：險種 badge + 保單號碼 + 商品名稱（badge 用險種專屬顏色，
      // 跟左側色條、金額色塊同一套顏色，不再是固定不變的靛紫色）
      const badgeStyle = `font-size:14px;padding:1px 5px;border-radius:3px;display:inline-block;background:${pColor.solid}1A;color:${pColor.solid}`;
      // 繳費中標籤：現在改用真正的繳費期滿日判斷，不再用「有沒有現金流」誤判
      const statusTag = pr.stillPaying
        ? `<span style="font-size:14px;color:#888;font-weight:500;margin-left:4px">（繳費中）</span>`
        : "";
      // 第一欄：改為兩行——行1: badge + 號碼，行2: 險種名稱；左側加色條
      // 跟「保單設定」頁的卡片顏色對應，方便對照是哪一張保單
      const firstCell = `<td style="padding-left:11px;min-width:160px;padding-top:5px;padding-bottom:5px;border-left:5px solid ${pColor.solid}">
        <div style="display:flex;align-items:center;gap:5px;white-space:nowrap">
          <span style="${badgeStyle}">${pr.category}</span>
          <span style="font-size:14px;font-weight:700;color:#1a1a1a;font-family:monospace">${pr.policyNo}</span>
          ${statusTag}
        </div>
        ${pr.itemName ? `<div style="font-size:16px;color:#444;font-weight:500;margin-top:2px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">${pr.itemName}</div>` : ""}
      </td>`;

      // 獨立的「保單現金價值」欄，跟後面每年排定要領的錢分開放，
      // 不再擠在第一欄的商品名稱下面當附註文字。
      const cvCell = pr.accountValue
        ? `<td style="text-align:center"><div style="font-size:16px;color:#185FA5;font-weight:700">${fmtAccountValue(pr.accountValue, pr.currency, pr.exchangeRate)}</div><div style="font-size:12px;color:#4B5563;font-weight:600">${pr.accountValueDate||""}</div></td>`
        : `<td style="text-align:center"><span style="color:#c7c9d1;font-size:14px">—</span></td>`;

      return `<tr class="cf-policy-row">${firstCell}${cvCell}${cells}</tr>`;
    }).join("");

    // 小計列：各保單已換算台幣，直接加總
    const memberFlows = {};
    g.policies.forEach(pr => {
      Object.entries(pr.flows).forEach(([yr, amt]) => {
        memberFlows[yr] = (memberFlows[yr] || 0) + amt;
      });
    });
    // 保單現金價值小計：外幣保單先用自己的匯率換算成台幣，才能跟其他
    // 保單加在一起，不然幣別不同直接加總數字會是錯的。
    let cvSubtotal = 0;
    g.policies.forEach(pr => {
      if (!pr.accountValue) return;
      const rate = (pr.currency && pr.currency !== "TWD" && parseFloat(pr.exchangeRate)) ? parseFloat(pr.exchangeRate) : 1;
      cvSubtotal += (parseFloat(pr.accountValue) || 0) * rate;
    });
    const subtotalRows = `<tr class="cf-subtotal-row">
      <td style="padding-left:18px">小計（台幣）</td>
      <td style="text-align:center">${cvSubtotal > 0 ? fmtAmt(cvSubtotal) : `<span style="color:#999;font-size:14px">—</span>`}</td>
      ${trimYears.map(yr => {
        const amt = memberFlows[yr] || 0;
        if (!amt) return `<td><span style="color:#999;font-size:14px">—</span></td>`;
        return `<td class="cf-amount">${fmtAmt(amt)}</td>`;
      }).join("")}
    </tr>`;

    return nameRow + policyRowsHtml + subtotalRows;
  }).join("");

  // 保單現金價值總計：所有成員的小計再加總一次
  let cvGrandTotal = 0;
  groups.forEach(g => g.policies.forEach(pr => {
    if (!pr.accountValue) return;
    const rate = (pr.currency && pr.currency !== "TWD" && parseFloat(pr.exchangeRate)) ? parseFloat(pr.exchangeRate) : 1;
    cvGrandTotal += (parseFloat(pr.accountValue) || 0) * rate;
  }));

  // ── 合計列（統一台幣）──
  const totalRow = `<tr class="cf-total-row">
    <td>合計現金流（台幣）</td>
    <td style="text-align:center">${cvGrandTotal > 0 ? fmtAmt(cvGrandTotal) : `<span style="color:#999;font-size:14px">—</span>`}</td>
    ${trimYears.map(yr => {
      const amt = totalFlows[yr] || 0;
      if (!amt) return `<td><span style="color:#999;font-size:14px">—</span></td>`;
      return `<td class="cf-amount">${fmtAmt(amt)}</td>`;
    }).join("")}
  </tr>`;

  document.getElementById("timeline-content").innerHTML = `
    <div class="timeline-wrap">
      <div class="timeline-header">
        <span class="timeline-title">未來現金流時間軸</span>
        <span class="timeline-subtitle">${startYr}－${trimYears[trimYears.length-1]}年　${groups.length} 位被保險人・${totalPolicies} 張保單</span>
      </div>
      <div class="cf-scroll-wrap">
        <table class="cf-table">
          <thead><tr><th>被保險人 / 保單號碼</th><th>保單現金價值</th>${yearHeaders}</tr></thead>
          <tbody>${groupRows}${totalRow}</tbody>
        </table>
      </div>
    </div>`;
}

// ── 工具函式 ──────────────────────────────────────────────
// 金額格式（台幣）：萬以上顯示到小數第一位，不足萬顯示整數
function fmtAmt(amt) {
  if (amt >= 10000) return (amt / 10000).toFixed(1) + "萬";
  return amt.toLocaleString();
}

// 外幣格式：顯示原幣符號
var CUR_SYMBOL = { USD:"$", EUR:"€", JPY:"¥", CNY:"¥", TWD:"" };
function fmtForeign(amt, cur) {
  const sym = CUR_SYMBOL[cur] || cur + " ";
  if (cur === "JPY") return sym + Math.round(amt).toLocaleString();
  return sym + (amt >= 10000 ? (amt/10000).toFixed(1)+"萬" : amt.toLocaleString());
}

// 帳戶價值的顯示：外幣保單填的是「原幣」金額（跟保單本身的幣別欄位一致），
// 不能直接當台幣用 fmtAmt 顯示——否則會誤會成台幣金額，而且沒辦法跟其他
// 台幣保單的現金流加總。外幣保單改成顯示「原幣金額（≈換算後台幣）」，
// 換算用的匯率沿用這張保單在領回設定裡已經填的匯率。
function fmtAccountValue(rawValue, currency, exchangeRate) {
  const amt = parseFloat(rawValue) || 0;
  const cur = currency || "TWD";
  if (cur === "TWD") return fmtAmt(amt);
  const rate = parseFloat(exchangeRate) || 1;
  return fmtForeign(amt, cur) + `<span style="color:#4B5563;font-weight:700">（≈${fmtAmt(amt*rate)}台幣）</span>`;
}

function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}
function goBack() { window.location.href = "family.html"; }
function callGAS(action, params) {
  // 統一路由到 nav.js 的 NBS_NAV.callGAS（直連 Drive API，含 OAuth token）
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === 'function') {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error('nav.js 未載入，請重新整理頁面'));
}

// ── NBS 導覽 ──────────────────────────────────────────────
NBS_NAV.onMemberChange = function(pid) {
  currentPersonId = pid;
  settings = {};
  laborPensionData = {};
  renderTabs();
  renderSettings();
  if (currentPageTab === "timeline") renderTimeline();
};

// 支援兩種事件：nav.js 自行載入 或 family.html 先載入後通知
window.addEventListener("nbs_family_loaded", function(e) {
  if (typeof familyData !== "undefined" && familyData) return; // 已初始化
  var u = JSON.parse(localStorage.getItem("nbs_user") || "{}");
  window.dispatchEvent(new CustomEvent("nbs_nav_ready", {
    detail: {
      user:            u,
      familyData:      e.detail.familyData,
      currentPersonId: e.detail.familyData && e.detail.familyData.members &&
                       e.detail.familyData.members[0] && e.detail.familyData.members[0].personId,
      familyFileName:  e.detail.familyFileName
    }
  }));
});
NBS_NAV.init({ page:"savings" });
</script>
