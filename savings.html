<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 儲蓄險現況</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }
    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }
    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }
    .main { padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .savings-card { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .card-header { padding:12px 14px; border-bottom:1px solid #f0f0f0; }
    .card-no { font-size:11px; font-weight:500; font-family:monospace; background:#FBEAF0; color:#72243E; padding:1px 7px; border-radius:99px; display:inline-block; margin-bottom:4px; }
    .cat-badge { font-size:10px; padding:1px 6px; border-radius:99px; margin-left:6px; }
    .card-name { font-size:14px; font-weight:500; margin:4px 0 2px; }
    .type-section, .fields-section, .table-section { padding:12px 14px; border-bottom:1px solid #f0f0f0; }
    .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .type-btn { padding:8px 10px; border:1px solid #e0e0e0; border-radius:8px; cursor:pointer; background:#fff; font-family:inherit; transition:all 0.12s; }
    .type-btn.active { border-color:#378ADD; background:#E6F1FB; }
    .type-title { font-size:12px; font-weight:500; color:#333; }
    .type-btn.active .type-title { color:#0C447C; }
    .fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field label { display:block; font-size:11px; color:#888; margin-bottom:3px; }
    .field input, .field select { width:100%; padding:8px 9px; font-size:13px; border:1px solid #e0e0e0; border-radius:6px; outline:none; font-family:inherit; background:#fff; }
    .save-all-btn { width:100%; padding:14px; background:#378ADD; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:20px; }
    
    /* 儲存提示框 (置中、醒目) */
    #saved-hint {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(39, 174, 143, 0.95);
      color: #fff;
      padding: 16px 32px;
      border-radius: 99px;
      font-size: 18px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      pointer-events: none;
    }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <script src="nav.js"></script>
</head>
<body>
  <div class="header"><button class="back-btn" onclick="goBack()">‹</button><div class="header-title">儲蓄險現況</div></div>
  <div class="member-tabs" id="member-tabs"></div>
  <div class="main">
    <div id="loading" style="text-align:center;padding:40px">載入中…</div>
    <div id="content" style="display:none"></div>
    <div id="saved-hint">✓ 已儲存</div>
  </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";
let currentUser = null, familyData = null, personDataMap = {}, currentPersonId = null, settings = {};

// ── 領回方式定義 ──────────────────────────────
const TYPES = [
  { key: "1", title: "期滿領回",     desc: "保單到期一次領回" },
  { key: "2", title: "定期給付",     desc: "每年／每期固定領回" },
  { key: "3", title: "增值回饋金",   desc: "定期撥付增值回饋" },
  { key: "4", title: "年金給付",     desc: "轉換年金後定期領" },
];

// 1. 初始化導覽
window.addEventListener("nbs_nav_ready", async function(e) {
  currentUser = e.detail.user;
  familyData = e.detail.familyData;
  currentPersonId = e.detail.currentPersonId;
  await loadData(); // 開始載入資料
});

// 2. 載入資料 (核心：這裡負責把資料填進 personDataMap)
async function loadData() {
  try {
    const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
    await Promise.all(activeMembers.map(async m => {
      const cacheKey = "nbs_person_" + m.personId;
      const cached = sessionStorage.getItem(cacheKey);
      if(cached) { personDataMap[m.personId] = JSON.parse(cached); }
      else {
        const pr = await callGAS("readFile", { email: currentUser.email, fileType:"person", fileName:m.name+"_"+m.personId+".json" });
        if(pr.status==="ok") { personDataMap[m.personId] = pr.content; sessionStorage.setItem(cacheKey, JSON.stringify(pr.content)); }
      }
    }));
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    renderTabs();
    renderContent(); // 這裡執行您的頁面內容繪製
  } catch(e) { alert("資料載入異常：" + e.message); }
}

// 3. 儲存核心 (您要的功能)
async function saveAll() {
  const hint = document.getElementById("saved-hint");
  hint.innerHTML = '<span class="spinner"></span>儲存中...';
  hint.style.background = "rgba(245, 166, 35, 0.95)";
  hint.style.display = "block";

  const person = personDataMap[currentPersonId];
  if (!person) return;
  
  // ▼ 這裡請保留您原本收集畫面資料的函數，若無則改為直接對 person.savings 賦值
  if (typeof collectAllValues === "function") collectAllValues(); 
  person.savings = Object.values(settings);
  person.updatedAt = new Date().toISOString();

  try {
    const member = familyData.members.find(m=>m.personId===currentPersonId);
    await callGAS("saveFile", { 
      email: currentUser.email, fileType:"person", fileId:currentPersonId, 
      fileName: member.name+"_"+currentPersonId+".json", content: person 
    });
    sessionStorage.setItem("nbs_person_"+currentPersonId, JSON.stringify(person));
    
    hint.innerHTML = "✓ 已儲存";
    hint.style.background = "rgba(39, 174, 143, 0.95)";
    setTimeout(() => { hint.style.display = "none"; }, 2000);
  } catch(e) { hint.style.display="none"; alert("儲存失敗"); }
}

// ── 輔助函式 ──────────────────────────────
function goBack() { window.location.href="family.html"; }
function callGAS(action, params) {
  if (action === "saveFile") return fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action, ...params }) }).then(r=>r.json());
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  Object.entries(params||{}).forEach(([k,v]) => url.searchParams.set(k, v));
  return fetch(url.toString()).then(r=>r.json());
}

// ── 成員 Tab ──────────────────────────────────
function renderTabs() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  let html = "";
  members.forEach(m => {
    const person = personDataMap[m.personId];
    const count = (person?.policies || []).filter(p =>
      ["儲蓄險","年金險","儲蓄年金","投資型保險"].includes(p.category)
    ).length;
    html += `<div class="member-tab ${currentPersonId === m.personId ? 'active' : ''}"
      onclick="switchTab('${m.personId}')">${m.name}
      <span style="font-size:10px;padding:0 5px;background:${currentPersonId===m.personId?'#E6F1FB':'#f0f0f0'};color:${currentPersonId===m.personId?'#0C447C':'#aaa'};border-radius:99px;margin-left:3px">${count}</span>
    </div>`;
  });
  document.getElementById("member-tabs").innerHTML = html;
}

function switchTab(personId) {
  currentPersonId = personId;
  settings = {};
  renderTabs();
  renderContent();
}

// ── 核心渲染與資料收集邏輯 ──────────────────────────────

// 1. 渲染頁面內容
function renderContent() {
    const person = personDataMap[currentPersonId];
    if (!person || !person.policies) return;

    const policies = person.policies.filter(p => ["儲蓄險", "年金險", "儲蓄年金", "投資型保險"].includes(p.category));
    let html = "";
    
    policies.forEach(p => {
        const saved = (person.savings || []).find(s => s.policyId === p.id) || { type: "1" };
        settings[p.id] = saved; // 同步到全域 settings 變數

        html += `
        <div class="savings-card">
            <div class="card-header">
                <div class="card-no">${p.policyNo}</div>
                <span class="cat-badge cat-${p.category}">${p.category}</span>
                <div class="card-name">${p.itemName}</div>
            </div>
            <div class="type-section">
                <div style="font-size:12px;color:#666;margin-bottom:8px">請選擇領回方式：</div>
                <div class="type-grid">
                    ${TYPES.map(t => `
                        <button class="type-btn ${saved.type === t.key ? 'active' : ''}" onclick="selectType('${p.id}', '${t.key}')">
                            <div class="type-title">${t.title}</div>
                            <div style="font-size:9px;color:#aaa;margin-top:2px">${t.desc}</div>
                        </button>
                    `).join('')}
                </div>
            </div>
            <div class="fields-section">
                <div class="fields-grid">
                    <div class="field">
                        <label>預計金額 (元)</label>
                        <input type="number" id="amt_${p.id}" value="${saved.amount || ''}" onchange="settings['${p.id}'].amount=this.value" />
                    </div>
                    <div class="field">
                        <label>領回備註</label>
                        <input type="text" id="note_${p.id}" value="${saved.note || ''}" onchange="settings['${p.id}'].note=this.value" placeholder="如：每年6月" />
                    </div>
                </div>
            </div>
        </div>`;
    });

    html += `<button class="save-all-btn" onclick="saveAll()">儲存所有設定</button>`;
    document.getElementById("content").innerHTML = html;
}

// 2. 切換領回類型
function selectType(policyId, typeKey) {
    if (settings[policyId]) {
        settings[policyId].type = typeKey;
        renderContent(); // 重新渲染以更新 active 樣式
    }
}

// 3. 收集畫面資料 (saveAll 會用到)
function collectAllValues() {
    // 這裡確保 settings 與 input 的值同步
    Object.keys(settings).forEach(pid => {
        const amtEl = document.getElementById("amt_" + pid);
        const noteEl = document.getElementById("note_" + pid);
        if (amtEl) settings[pid].amount = amtEl.value;
        if (noteEl) settings[pid].note = noteEl.value;
    });
}

// ── NBS 導覽 ──────────────────────────────────
NBS_NAV.onMemberChange = function(pid) {
  currentPersonId = pid;
  settings = {};
  renderTabs();
  renderContent();
};
NBS_NAV.init({ page: "savings" });
</script>
</body>
</html>
