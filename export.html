<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBS - 匯出圖片</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;min-height:100vh;color:#1a1a1a}
    .hdr{background:#fff;border-bottom:1px solid #eee;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .back{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:0}
    .hdr-title{font-size:15px;font-weight:500;flex:1}
    .hdr-sub{font-size:11px;color:#bbb}
    /* 選項頁保持窄版（手機友好），預覽頁用獨立 class */
    .wrap{padding:16px;max-width:560px;margin:0 auto}
    .wrap-preview{padding:16px;max-width:1200px;margin:0 auto}
    .sec-lbl{font-size:11px;font-weight:500;color:#999;margin-bottom:8px;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between}
    .blk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #e8e8e8;border-radius:10px;cursor:pointer;background:#fff;margin-bottom:8px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .blk.on{border:1.5px solid #378ADD;background:#F0F7FF}
    .chk{width:20px;height:20px;border-radius:5px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff}
    .blk.on .chk{background:#378ADD;border:none}
    .blk-lbl{font-size:13px;font-weight:500;color:#333}
    .blk.on .blk-lbl{color:#0C447C}
    .blk-desc{font-size:11px;color:#aaa;margin-top:1px}
    .fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .fmt{padding:10px 12px;border:1px solid #e8e8e8;border-radius:10px;cursor:pointer;background:#fff;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .fmt.spng{border:1.5px solid #378ADD;background:#F0F7FF}
    .fmt.spdf{border:1.5px solid #E74C3C;background:#FEF5F8}
    .fmt-title{font-size:13px;font-weight:500;color:#333;margin-bottom:2px}
    .fmt.spng .fmt-title{color:#0C447C}
    .fmt.spdf .fmt-title{color:#791F1F}
    .fmt-desc{font-size:11px;color:#aaa;line-height:1.5}
    .pbtn{width:100%;padding:12px;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:block;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .pbtn:disabled{background:#ccc!important;cursor:default}
    .sbtn{padding:10px;background:#fff;color:#666;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;flex:1;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .brow{display:flex;gap:8px;margin-top:16px}
    .pg{display:none}
    .pg.act{display:block}
    .pv-note{padding:10px 12px;background:#E6F1FB;border-radius:8px;margin-bottom:12px;font-size:11px;color:#0C447C;line-height:1.7}
    .pv-blk{border:1px solid #e8e8e8;border-radius:8px;overflow:hidden;margin-bottom:8px}
    .pv-hdr{padding:6px 12px;background:#f7f7f5;border-bottom:1px solid #f0f0f0;font-size:11px;font-weight:500;color:#666}
    .prog-wrap{background:#f0f0f0;border-radius:99px;height:8px;overflow:hidden;max-width:280px;margin:0 auto 8px}
    .prog-bar{height:100%;border-radius:99px;transition:width .2s}
    .flist{padding:12px 14px;background:#f7f7f5;border-radius:8px;margin-bottom:20px}
    .fitem{font-size:12px;color:#333;display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .spin{display:inline-block;width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:#378ADD;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="nav.js"></script>
</head>
<body>
<div style="display:none" id="HDR_SUB"></div>
<button style="display:none" id="B_BACK"></button>
<div style="display:none" id="HDR_TITLE"></div>

<div class="pg act" id="P_SEL">
  <div class="wrap">
    <div class="sec-lbl">選擇匯出區塊
      <button id="B_TOGALL" style="font-size:11px;padding:3px 12px;border:1px solid #ddd;border-radius:99px;background:#fff;color:#666;cursor:pointer;font-family:inherit">全部取消</button>
    </div>
    <div id="BLKLIST"></div>
    <div style="font-size:12px;font-weight:500;color:#555;margin-top:14px;margin-bottom:6px">🖼️ 圖檔（PNG）</div>
    <div class="fmt-grid" id="FMT_PNG"></div>
    <div style="font-size:12px;font-weight:500;color:#555;margin-top:10px;margin-bottom:6px">📄 文件（PDF）</div>
    <div class="fmt-grid" id="FMT_PDF"></div>
    <button class="pbtn" id="B_PREV" style="background:#378ADD;margin-top:20px">預覽區塊</button>
  </div>
</div>

<div class="pg" id="P_PREV">
  <div class="wrap-preview">
    <div class="pv-note" id="PV_NOTE"></div>
    <div id="PV_BLOCKS"></div>
    <div style="padding:8px 12px;background:#f7f7f5;border-radius:8px;font-size:11px;color:#aaa;margin-bottom:12px">
      💡 <span id="WM_HINT"></span>
    </div>
    <!-- 專屬保單檢視聲明 -->
    <div style="margin-bottom:16px;border-radius:10px;overflow:hidden;border:1px solid #E6EEF8;background:linear-gradient(135deg,#F5F9FF 0%,#EEF4FB 100%)">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #DDE8F5;background:rgba(55,138,221,0.06)">
        <span style="font-size:15px">📋</span>
        <span style="font-size:12px;font-weight:600;color:#0C447C;letter-spacing:0.04em">專屬保單檢視聲明</span>
      </div>
      <div style="padding:12px 14px">
        <p style="font-size:12px;color:#2C4A6E;line-height:1.9;margin-bottom:8px">
          這份保單檢視報告，是我為您逐一梳理過往規劃的專屬紀錄，希望能協助您輕鬆且清晰地掌握目前的保障輪廓。
        </p>
        <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:rgba(245,166,35,0.08);border-radius:6px;border-left:3px solid #F5A623">
          <span style="font-size:13px;flex-shrink:0;margin-top:1px">⚠️</span>
          <p style="font-size:11px;color:#7A5000;line-height:1.8;margin:0">
            本報告彙總之資訊，旨在作為檢視與討論保障內容的參考藍圖；為守護您的權益，實際理賠給付項目與條件，仍須以各家保險公司之最新資料及正式保險契約條款為準。
          </p>
        </div>
      </div>
    </div>
    <div class="brow" style="max-width:560px;margin:0 auto">
      <button class="sbtn" id="B_BACK2">返回修改</button>
      <button class="pbtn" id="B_EXPORT" style="background:#378ADD;flex:2;margin-top:0">下載圖片</button>
    </div>
  </div>
</div>

<div class="pg" id="P_DOING">
  <div class="wrap" style="text-align:center;padding-top:40px">
    <div style="font-size:36px;margin-bottom:16px" id="EX_ICON">🖼️</div>
    <div style="font-weight:500;font-size:15px;margin-bottom:8px" id="EX_MSG">正在產生圖片…</div>
    <div style="font-size:12px;color:#999;margin-bottom:24px" id="EX_SUB"></div>
    <div class="prog-wrap"><div class="prog-bar" id="PROG" style="width:0%;background:#378ADD"></div></div>
    <div style="font-size:12px;font-weight:500;margin-top:8px;color:#378ADD" id="PROG_PCT">0%</div>
  </div>
</div>

<div class="pg" id="P_DONE">
  <div class="wrap" style="text-align:center;padding-top:32px">
    <div style="font-size:48px;margin-bottom:16px">✅</div>
    <div style="font-weight:500;font-size:16px;margin-bottom:8px">匯出完成！</div>
    <div style="font-size:12px;color:#999;line-height:1.8;margin-bottom:20px" id="DONE_MSG"></div>
    <div class="flist" id="DONE_FILES"></div>
    <div class="brow">
      <button class="pbtn" id="B_FINISH" style="background:#378ADD;margin-top:0">← 返回</button>
    </div>
  </div>
</div>

<script>
// ── 設定 ─────────────────────────────────────────────────
const GAS="https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

// ▼ 新增受益人模塊
const BLOCKS=[
  {key:"monthly",          label:"每月應繳保費",      icon:"📅",desc:"月曆式繳費分配"},
  {key:"summary",          label:"保單彙總一覽",      icon:"📊",desc:"保單列表、保費結構、各項保障加總"},
  {key:"savings_timeline", label:"儲蓄險現金流時間軸",icon:"📈",desc:"未來15年各被保險人現金流匯整"},
  {key:"beneficiary",      label:"受益人與傳承",      icon:"👥",desc:"傳承規劃與保額對應關係"},
];
const FMTS=[
  {key:"png_single",  type:"png",label:"PNG 一張長圖",desc:"所有區塊合併，適合 LINE 傳送"},
  {key:"png_multiple",type:"png",label:"PNG 分張",    desc:"每個區塊各自一張"},
  {key:"pdf_merge",   type:"pdf",label:"PDF 合併",    desc:"所有區塊合併為單一 PDF"},
  {key:"pdf_pages",   type:"pdf",label:"PDF 分頁",    desc:"每個區塊各自一頁"},
];
const CC={"壽險保障":"#4A90D9","醫療保障":"#27AE8F","意外險":"#F5A623","重大疾病險":"#9B59B6","重大傷病險":"#8E44AD","特定傷病險":"#7D3C98","儲蓄險":"#E8638A","年金險":"#C0392B","投資型保險":"#95A5A6"};

// ── 狀態 ─────────────────────────────────────────────────
var sel={monthly:false,summary:false,savings_timeline:false,beneficiary:false};
var fmt="png_single";
var person={},policies=[],coverage={},savings=[];
var pName="",pDate="";

// ── 按鈕綁定 ─────────────────────────────────────────────
document.getElementById("B_BACK").onclick    = function(){ window.location.href="family.html"; };
document.getElementById("B_TOGALL").onclick  = doToggleAll;
document.getElementById("B_PREV").onclick    = doShowPreview;
document.getElementById("B_BACK2").onclick   = doShowSelect;
document.getElementById("B_EXPORT").onclick  = doExport;
document.getElementById("B_FINISH").onclick  = function(){ history.back(); };

// ── 建立區塊清單 ──────────────────────────────────────────
function buildBlocks(){
  var c=document.getElementById("BLKLIST");
  c.innerHTML="";
  BLOCKS.forEach(function(b){
    var d=document.createElement("div");
    d.className="blk"+(sel[b.key]?" on":"");
    d.innerHTML='<div class="chk">'+(sel[b.key]?"✓":"")+'</div><span style="font-size:20px;flex-shrink:0">'+b.icon+'</span><div style="flex:1"><div class="blk-lbl">'+b.label+'</div><div class="blk-desc">'+b.desc+'</div></div>';
    d.onclick=(function(key){return function(){
      sel[key]=!sel[key];
      buildBlocks();
      updateToggleBtn();
      updatePrevBtn();
    };})(b.key);
    c.appendChild(d);
  });
}

function buildFmts(){
  ["png","pdf"].forEach(function(t){
    var c=document.getElementById("FMT_"+t.toUpperCase());
    c.innerHTML="";
    FMTS.filter(function(f){return f.type===t;}).forEach(function(f){
      var d=document.createElement("div");
      var sc=fmt===f.key?(t==="png"?"spng":"spdf"):"";
      d.className="fmt "+sc;
      d.innerHTML='<div class="fmt-title">'+f.label+'</div><div class="fmt-desc">'+f.desc+'</div>';
      d.onclick=(function(key,type){return function(){
        fmt=key;
        buildFmts();
        var eb=document.getElementById("B_EXPORT");
        eb.style.background=fmt.startsWith("pdf")?"#E74C3C":"#378ADD";
        eb.textContent=fmt.startsWith("pdf")?"匯出 PDF":"下載圖片";
      };})(f.key,t);
      c.appendChild(d);
    });
  });
}

function updateToggleBtn(){
  var all=BLOCKS.every(function(b){return sel[b.key];});
  document.getElementById("B_TOGALL").textContent=all?"全部取消":"全部勾選";
}

function updatePrevBtn(){
  var keys=BLOCKS.filter(function(b){return sel[b.key];});
  var btn=document.getElementById("B_PREV");
  if(keys.length===0){
    btn.textContent="請至少勾選一個區塊";
    btn.style.background="#ccc";
    btn.disabled=true;
  }else{
    btn.textContent="預覽 "+keys.length+" 個區塊";
    btn.style.background="#378ADD";
    btn.disabled=false;
  }
}

function doToggleAll(){
  var all=BLOCKS.every(function(b){return sel[b.key];});
  BLOCKS.forEach(function(b){sel[b.key]=!all;});
  buildBlocks();
  updateToggleBtn();
  updatePrevBtn();
}

function goPage(id){
  ["P_SEL","P_PREV","P_DOING","P_DONE"].forEach(function(p){
    document.getElementById(p).className="pg"+(p===id?" act":"");
  });
}

function doShowSelect(){
  goPage("P_SEL");
  document.getElementById("HDR_TITLE").textContent="匯出圖片";
}

function doShowPreview(){
  if(document.getElementById("B_PREV").disabled) return;
  if(!policies) { alert("資料仍在載入中，請稍後再試"); return; }
  var selBlks=BLOCKS.filter(function(b){return sel[b.key];});
  var isPdf=fmt.startsWith("pdf");
  document.getElementById("HDR_TITLE").textContent="預覽確認";
  document.getElementById("PV_NOTE").innerHTML='ℹ️ 以下為<strong>真實資料預覽</strong>，點「'+(isPdf?"匯出 PDF":"下載圖片")+'」後系統產生'+(isPdf?"PDF":"PNG")+'檔案。';
  document.getElementById("WM_HINT").textContent='匯出圖片底部將自動加上「NBS 保單體檢 '+pName+' '+pDate+'」浮水印';
  var eb=document.getElementById("B_EXPORT");
  eb.style.background=isPdf?"#E74C3C":"#378ADD";
  eb.textContent=isPdf?"匯出 PDF":"下載圖片";
  var c=document.getElementById("PV_BLOCKS");
  c.innerHTML="";
  selBlks.forEach(function(b,i){
    if(fmt!=="png_single"){
      var tag=document.createElement("div");
      tag.style.cssText="font-size:10px;color:#bbb;margin-bottom:3px";
      tag.textContent="第 "+(i+1)+" "+(fmt.startsWith("pdf")?"頁":"張");
      c.appendChild(tag);
    }
    var div=document.createElement("div");
    div.className="pv-blk";
    div.innerHTML='<div class="pv-hdr">'+b.icon+" "+b.label+'</div><div>'+renderBlock(b.key)+'</div>';
    c.appendChild(div);
  });
  goPage("P_PREV");
}

// ── 現金流時間軸輔助函式 ─────────────────────────────────
function fmtAmtEx(amt){if(amt>=10000)return(amt/10000).toFixed(1)+"萬";return amt.toLocaleString();}
function isMonthlyEx(k){return k==="5";}
function isYearlyDetailEx(k){return k==="6";}
function getEndYearAt100Ex(memberId,policy){
  var bd=(familyData&&familyData.members&&(familyData.members.find(function(m){return m.personId===memberId;})||{}).birthDate);
  if(bd){var by=parseInt(bd.slice(0,4));if(!isNaN(by))return by+100;}
  if(policy&&policy.startDate){var sy=parseInt(policy.startDate.slice(0,4));if(!isNaN(sy))return sy+80;}
  return new Date().getFullYear()+50;
}
function calcPolicyFlowsEx(p,s,memberId,years){
  var sw=p.startDate?parseInt(p.startDate.slice(0,4)):null;
  var pw=p.payEndDate?parseInt(p.payEndDate.slice(0,4)):null;
  var cw=p.covEndDate?parseInt(p.covEndDate.slice(0,4)):getEndYearAt100Ex(memberId,p);
  if(!sw)return{};
  var tk=s.type||"1",dfr=parseInt(s.duringFreqYr)||2,dsy=parseInt(s.duringStartYr)||1;
  var da=parseFloat(s.duringAmt)||0,afr=parseInt(s.afterFreqYr)||1;
  var asy=parseInt(s.afterStartYr!==undefined?s.afterStartYr:0),aa=parseFloat(s.afterAmt)||0;
  var mo=isMonthlyEx(tk),yrd=isYearlyDetailEx(tk);
  var ym={};
  if(yrd&&s.yearlyAmts){s.yearlyAmts.forEach(function(r){var y=parseInt(r.yr),a=parseFloat(r.amt);if(!isNaN(y)&&!isNaN(a)&&a>0)ym[y]=(ym[y]||0)+a;});}
  var er=(p.currency&&p.currency!=="TWD"&&parseFloat(s.exchangeRate))?parseFloat(s.exchangeRate):1;
  var flows={};
  years.forEach(function(yr){
    if(yr>cw)return;
    var fl=0,id=pw?(yr>=sw&&yr<pw):false,ia=pw?yr>=pw:yr>=sw;
    if(yrd){fl=ym[yr]||0;}
    else if(tk==="1"){if(pw&&yr===pw)fl=aa;}
    else if(tk==="2"){
      if(id&&da>0){var ft=sw+dsy-1,e=yr-ft;if(yr>=ft&&e%dfr===0)fl+=da;}
      if(pw&&yr===pw)fl+=aa;
    }else if(tk==="3"){if(ia&&aa>0){var b=(pw||sw)+asy,e2=yr-b;if(yr>=b&&e2%afr===0)fl=aa;}}
    else if(tk==="4"){
      if(id&&da>0){var ft2=sw+dsy-1,e3=yr-ft2;if(yr>=ft2&&e3%dfr===0)fl+=da;}
      if(ia&&aa>0){var b2=(pw||sw)+asy,e4=yr-b2;if(yr>=b2&&e4%afr===0)fl+=aa;}
    }else if(mo){if(ia&&aa>0)fl=aa*12;}
    if(fl>0)flows[yr]=Math.round(fl*er);
  });
  return flows;
}
function renderSavingsTimeline(pdm3,fData,startYr,endYr){
  var years=[];for(var y=startYr;y<=endYr;y++)years.push(y);
  var groups=[],totalFlows={};
  (fData.members||[]).filter(function(m){return m.role!=="beneficiary_only";}).forEach(function(m){
    var p3=pdm3[m.personId];if(!p3)return;
    var sp=(p3.policies||[]).filter(function(p){return["儲蓄險","年金險","儲蓄年金","投資型保險"].indexOf(p.category)>=0;});
    if(!sp.length)return;
    var pRows=[];
    sp.forEach(function(p){
      var s2=(p3.savings||[]).find(function(sv){return sv.policyId===p.id;})||{type:"1"};
      var flows=calcPolicyFlowsEx(p,s2,m.personId,years);
      Object.keys(flows).forEach(function(y2){totalFlows[y2]=(totalFlows[y2]||0)+flows[y2];});
      pRows.push({policyNo:p.policyNo||p.id,itemName:p.itemName||"",category:p.category||"",flows:flows});
    });
    if(pRows.length)groups.push({memberName:m.name,policies:pRows});
  });
  if(!groups.length)return'<div style="padding:20px;text-align:center;color:#bbb;font-size:12px">尚無儲蓄保單設定領回資料</div>';
  var maxTotal=Math.max.apply(null,Object.values(totalFlows).concat([1]));
  var catBg={"儲蓄險":"#FBEAF0","年金險":"#FCEBEB","儲蓄年金":"#FBEAF0","投資型保險":"#f0f0f0"};
  var catCo={"儲蓄險":"#72243E","年金險":"#791F1F","儲蓄年金":"#72243E","投資型保險":"#555"};
  var yh=years.map(function(y3){return'<th style="background:#f7f7f5;padding:4px 5px;text-align:center;font-weight:500;color:#333;border-bottom:1px solid #ebebeb;border-right:1px solid #ebebeb;white-space:nowrap">'+y3+'<br><span style="font-size:8px;color:#666;font-weight:500">'+(y3-1911)+'年</span></th>';}).join("");
  var gr=groups.map(function(g){
    var pay=g.policies.filter(function(pr){return Object.keys(pr.flows).length===0;}).length;
    var nr='<tr><td colspan="'+(years.length+1)+'" style="background:#f4f8fd;padding:6px 10px;font-size:11px;font-weight:600;border-top:2px solid #dde8f5">'+
      g.memberName+'<span style="color:#777;font-weight:400;margin-left:6px;font-size:10px">'+g.policies.length+'張保單</span>'+
      (pay?'<span style="color:#b07000;font-size:10px;margin-left:4px">（含'+pay+'張繳費中）</span>':'')+
    '</td></tr>';
    var pr2=g.policies.map(function(pr){
      var cells=years.map(function(y4){
        var amt=pr.flows[y4]||0;
        if(!amt)return'<td style="text-align:center;color:#ccc;font-size:10px;border-right:1px solid #f5f5f5">—</td>';
        var w=Math.max(18,Math.round((amt/maxTotal)*50));

// ── Summary 輔助函式（移植自 summary.html）──────────────
function sumCovEx(keys, policies, coverage) {
  var total = 0;
  policies.forEach(p => {
    keys.forEach(k => {
      if (p.coverage && typeof p.coverage[k] === "number") {
        total += p.coverage[k];
      }
    });
  });
  // 相容舊格式
  if (total === 0 && coverage) {
      policies.forEach(p => {
          keys.forEach(k => {
              if (coverage[p.id + "_" + k] && typeof coverage[p.id + "_" + k] === "number") {
                  total += coverage[p.id + "_" + k];
              }
          });
      });
  }
  return total;
}

// 核心運算引擎：精準抓取資料庫數字
function getItemCurrentEx(key, policies, coverage, covOverrides) {
  var map = GAP_KEY_MAP_EX[key];
  if(!map) return 0;

  var manualKey = currentPersonId+"_"+key;
  if(covOverrides && covOverrides[manualKey] !== undefined) {
    return covOverrides[manualKey] ? 1 : 0;
  }

  if(["investment","savings","waiver"].includes(key)) {
    if(key==="investment") return policies.some(p=>p.category==="投資型保險")?1:0;
    if(key==="savings")    return policies.some(p=>["儲蓄險","年金險"].includes(p.category))?1:0;
    if(key==="waiver")     return sumCovEx(["ltc_waiver"], policies, coverage) > 0 ? 1 : 0;
    return 0;
  }

  if (["life_permanent", "life_term", "ci_special"].includes(key)) {
      let amt = 0;
      var matchedPolicies = policies.filter(p => map.cats.includes(p.category));
      matchedPolicies.forEach(p => {
         if (p.insuredAmount) amt += parseFloat(p.insuredAmount) || 0;
      });
      if (amt === 0 && matchedPolicies.length > 0) return 1; 
      return amt;
  }

  var NO_FALLBACK_KEYS = [
    "acc_medical","acc_hosp","hosp_real_room","hosp_daily",
    "surgery","cancer_hosp","ltc_disable","ltc_support",
    "ltc_care","cancer_hospice","cancer_death"
  ];
  if (NO_FALLBACK_KEYS.indexOf(key) !== -1) {
    return sumCovEx(map.keys, policies, coverage);
  }

  var amt = sumCovEx(map.keys, policies, coverage);

  var matchedPolicies = policies.filter(p => map.cats.includes(p.category));
  if (amt === 0 && matchedPolicies.length > 0) {
      matchedPolicies.forEach(p => {
          if (p.insuredAmount) amt += parseFloat(p.insuredAmount) || 0;
      });
      if (amt === 0) return 1; 
  }

  return amt;
}

function getItemStatusEx(key, policies, coverage, targets, covOverrides) {
  var item = GAP_GROUPS_EX.flatMap(g=>g.items).find(i=>i.key===key);
  var current = getItemCurrentEx(key, policies, coverage, covOverrides);
  var target  = targets[key];
  var isBool  = item?.isBool;
  if(!current) return {status:"gap", current:0, target, pct:0};
  if(!target||isBool) return {status:"ok", current, target:null, pct:1};
  if(current>=target) return {status:"ok", current, target, pct:1};
  return {status:"insufficient", current, target, pct:current/target};
}

function renderTabs() {
  var members = familyData.members.filter(m=>m.role!=="beneficiary_only");
  document.getElementById("member-tabs").innerHTML = members.map(m=>`
    <div class="member-tab ${currentPersonId===m.personId?'active':''}" onclick="switchPerson('${m.personId}')">
      ${m.name}${getInsAge(m.personId)!==null?' '+getInsAge(m.personId)+'歲':''}
    </div>`).join("");
}

function getInsAge(pid) {
  var p=personDataMap[pid];
  if(!p) return null;
  var b=new Date(p.profile.birthDate), a=new Date(p.profile.analysisDate||new Date());
  var y=a.getFullYear()-b.getFullYear();
  var mo=(a-new Date(b.getFullYear()+y,b.getMonth(),b.getDate()))/(1000*60*60*24*30.4375);
  if(mo>=6)y++;
  return y;
}

function switchPerson(pid) {
  currentPersonId=pid;
  renderTabs();
  renderContent();
}

function buildSvgArrows(phases) {
  var W=600, H=40, tip=14;
  var weights=[1,1.4,1], totalW=3.4;
  var widths=weights.map(function(w){return w/totalW*W;});
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;margin-bottom:16px">';
  var x=0;
  phases.forEach(function(ph,i){
    var w=widths[i], x0=x, x1=x+w, pts;
    if(i===0){
      pts=x0+',0 '+(x1-tip)+',0 '+x1+','+(H/2)+' '+(x1-tip)+','+H+' '+x0+','+H;
    } else if(i===2){
      pts=x0+',0 '+x1+',0 '+x1+','+H+' '+x0+','+H+' '+(x0+tip)+','+(H/2);
    } else {
      pts=x0+',0 '+(x1-tip)+',0 '+x1+','+(H/2)+' '+(x1-tip)+','+H+' '+x0+','+H+' '+(x0+tip)+','+(H/2);
    }
    svg+='<polygon points="'+pts+'" fill="'+ph.color+'"/>';
    var tx=i===0?x0+(w-tip)/2:i===2?x0+tip+(w-tip)/2:x0+tip+(w-tip*2)/2;
    svg+='<text x="'+tx+'" y="'+(H/2+5)+'" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">'+ph.label+'</text>';
    x+=w;
  });
  svg+='</svg>';
  return svg;
}

function buildDonutChartEx(active, coverage, targets, covOverrides) {
  var allItems = GAP_GROUPS_EX.flatMap(g=>g.items);
  var n = allItems.length;
  
  var cx=200, cy=140, OR=90, IR=48;
  var gapA=0.03, sliceA=(Math.PI*2-n*gapA)/n;

  var angle=-Math.PI/2;
  var paths="";
  var labels=""; 

  function renderLegend(g) {
    var legendHtml = `<div style="font-size:12px;font-weight:500;color:${g.color};margin-bottom:8px;border-bottom:1px solid ${g.color}30;padding-bottom:4px">${g.label}</div>`;
    
    g.items.forEach(item => {
      var {status, pct, current, target} = getItemStatusEx(item.key, active, coverage, targets, covOverrides);
      var icon = status==="gap"?"❌":status==="insufficient"?"⚠️":"✅";
      var dotColor = status==="gap"?"#e0e0e0":item.color;

      var amtHtml = "";
      if (item.isBool) {
        amtHtml = current > 0 ? `<span style="color:#555;font-size:11px">有</span>` : `<span style="color:#bbb;font-size:11px">無</span>`;
      } else {
        if (current > 0 || target > 0) {
          var displayVal = current > 0 ? current.toLocaleString() : "0";
          if (target > 0) displayVal += ` / ${target.toLocaleString()}`;
          
          amtHtml = `<span style="color:${current>0?'#0C447C':'#888'};font-family:monospace;font-weight:600;font-size:12px">${displayVal}<span style="font-size:9px;color:#888;margin-left:3px;font-family:sans-serif">${item.unit}</span></span>`;
        } else {
          amtHtml = `<span style="color:#bbb;font-size:11px">0</span>`;
        }
      }

      legendHtml += `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:5px">
        <div style="width:10px;height:10px;border-radius:2px;background:${dotColor};flex-shrink:0"></div>
        <span style="color:${status==="gap"?"#bbb":"#444"};flex:1;white-space:nowrap">${item.label}</span>
        ${amtHtml}
        <span style="margin-left:4px">${icon}</span>
      </div>`;
    });
    return legendHtml;
  }

  var legendFamily = renderLegend(GAP_GROUPS_EX[0]);
  var legendBefore = renderLegend(GAP_GROUPS_EX[1]);
  var legendDuring = renderLegend(GAP_GROUPS_EX[2]);
  var legendAfter  = renderLegend(GAP_GROUPS_EX[3]);

  allItems.forEach(item => {
    var {status,pct} = getItemStatusEx(item.key, active, coverage, targets, covOverrides);
    var start = angle+gapA/2;
    var end   = angle+gapA/2+sliceA;
    var filledEnd = start + sliceA*pct;
    var midA  = start + sliceA/2; 
    angle += sliceA+gapA;

    var px=(r,a)=>cx+r*Math.cos(a), py=(r,a)=>cy+r*Math.sin(a);
    var donut=(a1,a2,lg,r1,r2)=>`M${px(r1,a1)},${py(r1,a1)} A${r1},${r1} 0 ${lg} 1 ${px(r1,a2)},${py(r1,a2)} L${px(r2,a2)},${py(r2,a2)} A${r2},${r2} 0 ${lg} 0 ${px(r2,a1)},${py(r2,a1)} Z`;

    paths += `<path d="${donut(start,end,sliceA>Math.PI?1:0,OR,IR)}" fill="#f0f0f0"/>`;
    if(pct>0.01) paths += `<path d="${donut(start,filledEnd,sliceA*pct>Math.PI?1:0,OR,IR)}" fill="${item.color}"/>`;
    if(status==="insufficient" && pct<0.99) {
      var gapSize=sliceA*(1-pct);
      paths += `<path d="${donut(filledEnd,end,gapSize>Math.PI?1:0,OR,IR)}" fill="none" stroke="${item.color}" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.45"/>`;
    }

    var isRight = Math.cos(midA) >= 0; 
    var x0 = px(OR, midA), y0 = py(OR, midA); 
    var x1 = px(OR + 12, midA), y1 = py(OR + 12, midA); 
    var x2 = x1 + (isRight ? 15 : -15), y2 = y1; 

    var textAnchor = isRight ? "start" : "end";
    var textX = x2 + (isRight ? 4 : -4);
    var textColor = status === "gap" ? "#aaa" : "#555";
    var fw = status === "ok" ? "500" : "400";
    var prefix = status === "gap" ? "❌ " : status === "insufficient" ? "⚠️ " : "";

    labels += `
      <polyline points="${x0},${y0} ${x1},${y1} ${x2},${y2}" fill="none" stroke="${item.color}60" stroke-width="1.2"/>
      <circle cx="${x0}" cy="${y0}" r="2" fill="${item.color}"/>
      <text x="${textX}" y="${y2+4}" text-anchor="${textAnchor}" style="font-size:11px;fill:${textColor};font-weight:${fw};letter-spacing:0.03em">${prefix}${item.label}</text>
    `;
  });

  var okN = allItems.filter(item=>getItemStatusEx(item.key,active,coverage,targets,covOverrides).status==="ok").length;
  var gapN = allItems.filter(item=>getItemStatusEx(item.key,active,coverage,targets,covOverrides).status==="gap").length;
  var insN = allItems.filter(item=>getItemStatusEx(item.key,active,coverage,targets,covOverrides).status==="insufficient").length;

  return `<div style="display:flex;flex-direction:column;width:100%">
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;padding:0">
      <svg viewBox="0 0 400 280" style="width:100%; max-width:440px; flex-shrink:0;">
        ${paths}
        ${labels}
        <text x="${cx}" y="${cy-14}" text-anchor="middle" style="font-size:11px;fill:#888">✅ 達標</text>
        <text x="${cx}" y="${cy+4}"  text-anchor="middle" style="font-size:24px;font-weight:bold;fill:#333">${okN}</text>
        <text x="${cx}" y="${cy+20}" text-anchor="middle" style="font-size:10px;fill:#E74C3C">❌ 缺口 ${gapN}</text>
        <text x="${cx}" y="${cy+34}" text-anchor="middle" style="font-size:10px;fill:#F5A623">⚠ 不足 ${insN}</text>
      </svg>
      <div style="min-width:170px;background:#fafafa;padding:12px 16px;border-radius:10px;border:1px solid #f0f0f0">
        ${legendFamily}
      </div>
    </div>
    
    <div style="border-top:1px dashed #e8e8e8;padding-top:20px">
      ${buildSvgArrows([
        {label:GAP_GROUPS_EX[1].arrowLabel, color:"#4CAF86"},
        {label:GAP_GROUPS_EX[2].arrowLabel, color:"#378ADD"},
        {label:GAP_GROUPS_EX[3].arrowLabel, color:"#E87BAD"}
      ])}
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:16px">
        <div>${legendBefore}</div>
        <div>${legendDuring}</div>
        <div>${legendAfter}</div>
      </div>
    </div>
  </div>`;
}

// ── 缺口／不足分析 ────────────────────────────────────────
function buildGapAnalysisEx(active, coverage, targets, covOverrides) {
  var allItems = GAP_GROUPS_EX.flatMap(g=>g.items);
  var gaps = [], insufficients = [];
  allItems.forEach(item => {
    var s = getItemStatusEx(item.key, active, coverage, targets, covOverrides);
    if(s.status==="gap") gaps.push({item, ...s});
    if(s.status==="insufficient") insufficients.push({item, ...s});
  });

  var html = "";

  if(insufficients.length) {
    html += `<div style="font-size:11px;font-weight:500;color:#F5A623;margin-bottom:8px">⚠ 規劃不足</div>`;
    insufficients.forEach(({item,current,target,pct}) => {
      html += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:12px;color:#555">${item.label}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span style="font-size:11px;color:#555;font-weight:500">${current.toLocaleString()}${item.unit}</span>
            <span style="font-size:10px;color:#aaa">/ 目標 ${target?.toLocaleString()}${item.unit}</span>
          </div>
        </div>
        <div style="height:7px;background:#f0f0f0;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${Math.round(pct*100)}%;background:${item.color};border-radius:99px"></div>
        </div>
        <div style="font-size:11px;color:#E74C3C;margin-top:3px">尚不足 ${(target-current).toLocaleString()}${item.unit}（${Math.round(pct*100)}% 達成）</div>
      </div>`;
    });
  }

  if(gaps.length) {
    html += `<div style="font-size:11px;font-weight:500;color:#E74C3C;margin-bottom:8px;margin-top:${insufficients.length?12:0}px">❌ 尚未規劃</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`;
    gaps.forEach(({item}) => {
      html += `<span style="padding:3px 10px;background:#FCEBEB;border:1px solid #F0A8BF;border-radius:99px;font-size:12px;color:#791F1F">${item.label}</span>`;
    });
    html += `</div><div style="font-size:11px;color:#aaa">💡 可與保戶討論是否有需要規劃</div>`;
  }

  if(!insufficients.length && !gaps.length) {
    html += `<div style="font-size:12px;color:#27AE8F;text-align:center;padding:12px 0">🎉 所有已設目標項目均達標！</div>`;
  }

  html += `<button onclick="openTargetModal()" style="width:100%;margin-top:10px;padding:8px;background:transparent;border:1px dashed #ddd;border-radius:8px;font-size:12px;color:#666;cursor:pointer;font-family:inherit">🎯 設定 / 修改目標保額</button>`;
  return html;
}

  var coverage = {};

    Object.entries(p.coverage||{}).forEach(([k,v]) => {

    });

  var bodyHtml = `<div style="font-size:11px;color:#888;background:#f7f7f5;padding:8px 12px;border-radius:8px;margin-bottom:14px;line-height:1.6">

          <label style="font-size:13px;color:#333">${item.label}</label>

        <div style="display:flex;align-items:center;border:1px solid #e0e0e0;border-radius:7px;overflow:hidden">

            style="flex:1;padding:8px 12px;font-size:13px;border:none;outline:none;font-family:inherit"/>
          ${item.unit?`<span style="padding:0 10px;font-size:11px;color:#aaa;background:#fafafa;border-left:1px solid #f0f0f0">${item.unit}</span>`:""}
        </div>
      </div>`;
    });

  });

  var existing = document.getElementById("target-modal-overlay");
  if(existing) existing.remove();

  var overlay = document.createElement("div");
  overlay.id = "target-modal-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:flex;align-items:flex-end;justify-content:center";
  overlay.innerHTML = `<div style="background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <span style="font-weight:500;font-size:15px">🎯 設定目標保額</span>
      <button onclick="document.getElementById('target-modal-overlay')?.remove()" style="background:none;border:none;font-size:22px;color:#999;cursor:pointer;line-height:1">×</button>
    </div>
    ${bodyHtml}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="document.getElementById('target-modal-overlay')?.remove()"
        style="flex:1;padding:10px;background:transparent;color:#666;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-family:inherit">取消</button>
      <button onclick="saveTargets()"
        style="flex:2;padding:10px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit">儲存目標</button>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function saveTargets() {
  GAP_GROUPS_EX.flatMap(g=>g.items.filter(i=>!i.isBool)).forEach(item => {
    var el = document.getElementById("target_"+item.key);
    if(el) {
      var v = parseFloat(el.value);
      if(!isNaN(v) && v > 0) targets[item.key] = v;
      else delete targets[item.key];
    }
  });
  document.getElementById("target-modal-overlay")?.remove();
  renderContent();
}

function openModal() {
  var person  = personDataMap[currentPersonId];
  var policies= person?.policies||[];
  var coverage= person?.coverage||{};
  var active  = policies.filter(p=>p.status==="有效");
  var covTypes= COVERAGE_TYPES.map(t=>{
    var auto=t.detect(active,coverage);
    var manual=overrides[currentPersonId+"_"+t.key];
    return {...t,covered:manual!==undefined?manual:auto,autoDetected:auto,isManual:manual!==undefined};
  });

  var groups=["壽險","意外","醫療","重大","癌症","長照","財務"];
  var html="";
  groups.forEach(g=>{

    html+=`<div class="type-group-label" style="color:${gc}">${g}</div><div class="type-tags">`;
    gTypes.forEach(t=>{
      html+=`<div class="type-tag" id="tag_${t.key}" onclick="toggleOverride('${t.key}')"
        style="background:${t.covered?t.color+'18':'#f5f5f5'};border:1.5px ${t.covered?'solid':'dashed'} ${t.covered?t.color:'#ddd'}">

        ${t.isManual?'<span class="manual-badge">手動</span>':''}
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById("modal-types").innerHTML=html;
  document.getElementById("edit-modal").classList.add("active");
}

function toggleOverride(key) {
  var fk=currentPersonId+"_"+key;
  var person=personDataMap[currentPersonId];
  var active=(person?.policies||[]).filter(p=>p.status==="有效");
  var cov=person?.coverage||{};
  var t=COVERAGE_TYPES.find(x=>x.key===key);
  var auto=t?t.detect(active,cov):false;
  var cur=overrides[fk];
  if(cur===undefined) overrides[fk]=!auto;
  else delete overrides[fk];
  openModal();
}

        var sm=new Date(p.startDate||"2020-01-01").getMonth(),pr=p.premiumTWD||0;
        if(p.payMode==="月繳")t+=Math.round(pr/12);
        else if(p.payMode==="季繳"&&(mi-sm+12)%3===0)t+=Math.round(pr/4);
        else if(p.payMode==="半年繳"&&(mi-sm+12)%6===0)t+=Math.round(pr/2);
        else if(p.payMode==="年繳"&&mi===sm%12)t+=pr;
      });
      return'<div style="padding:6px 4px;background:'+(mi===now?"#E6F1FB":"#f7f7f5")+';border-radius:6px;text-align:center;border:'+(mi===now?"1.5px solid #378ADD":"1px solid #e0e0e0")+'">'+
        '<div style="font-size:11px;font-weight:500;color:'+(mi===now?"#0C447C":"#444")+'">'+(mi+1)+'月</div>'+
        '<div style="font-size:14px;font-weight:600;color:'+(mi===now?"#0C447C":t>0?"#1a1a1a":"#bbb")+'">'+(t>0?(t>=10000?(t/10000).toFixed(1)+"萬":t.toLocaleString()):"—")+'</div>'+
      '</div>';
    }).join("");
    return'<div style="padding:12px 14px"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">'+cells+'</div></div>';
  }

  if(key==="policy"){
    var tt=policies.filter(function(p){return p.status==="有效";}).reduce(function(s,p){return s+(p.premiumTWD||0);},0);
    var groups={};
    policies.forEach(function(p){
      var k=p.policyNo||p.id;
      if(!groups[k]) groups[k]=[];
      groups[k].push(p);
    });
    var colHeader='<div style="display:grid;grid-template-columns:80px 1fr 80px 70px;gap:4px;font-size:9px;color:#aaa;padding:3px 8px;border-bottom:1px solid #e8e8e8;margin-bottom:4px;font-weight:500">'+
      '<span>類別</span><span>保險項目名稱</span><span style="text-align:right">保額</span><span style="text-align:right">年繳保費</span></div>';

    var groupHtml=Object.entries(groups).map(function(entry){
      var no=entry[0], rows=entry[1];
      var groupTotal=rows.reduce(function(s,p){return s+(p.premiumTWD||0);},0);
      var rowsHtml=rows.map(function(p){
        return'<div style="display:grid;grid-template-columns:80px 1fr 80px 70px;align-items:center;gap:4px;font-size:10px;padding:4px 8px;border-top:1px solid #f5f5f5">'+
          '<span style="padding:1px 6px;border-radius:99px;background:'+(CC[p.category]||"#999")+'20;color:'+(CC[p.category]||"#555")+';text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.category+'</span>'+
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333">'+(p.itemName||"—")+'</span>'+
          '<span style="text-align:right;color:#0C447C;font-weight:500">'+(p.insuredAmount?p.insuredAmount+(p.insuredAmountUnit||'萬元'):'—')+'</span>'+
          '<span style="font-weight:500;text-align:right;color:#333">NT'+(p.premiumTWD||0).toLocaleString()+'</span>'+
        '</div>';
      }).join("");
      return'<div style="border:1px solid #e8e8e8;border-radius:7px;overflow:hidden;margin-bottom:6px">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:#f7f7f5;border-bottom:1px solid #f0f0f0">'+
          '<span style="font-family:monospace;font-size:10px;font-weight:500;background:#E6F1FB;color:#0C447C;padding:1px 7px;border-radius:99px">'+no+'</span>'+
          '<span style="font-size:10px;color:#555;font-weight:500">'+rows[0].company+'</span>'+
          '<span style="font-size:10px;color:#999">NT$'+groupTotal.toLocaleString()+'</span>'+
        '</div>'+
        rowsHtml+
      '</div>';
    }).join("");
    return'<div style="padding:10px 12px">'+colHeader+groupHtml+'<div style="font-size:11px;font-weight:500;color:#27500A;text-align:right;padding-top:5px;border-top:1px solid #e8e8e8;margin-top:3px">年繳總計 NT$'+tt.toLocaleString()+'</div></div>';
  }

  return'<div style="padding:12px;color:#aaa;font-size:12px">建置中</div>';
}

// ── 匯出主流程 ────────────────────────────────────────────
function doExport(){
  var selBlks=BLOCKS.filter(function(b){return sel[b.key];});
  var isPdf=fmt.startsWith("pdf");
  goPage("P_DOING");
  document.getElementById("EX_ICON").textContent=isPdf?"📄":"🖼️";
  document.getElementById("EX_MSG").textContent=isPdf?"正在產生 PDF…":fmt==="png_single"?"正在合併圖片…":"正在產生圖片…";
  document.getElementById("EX_SUB").textContent="共 "+selBlks.length+" 個區塊 "+(fmt==="png_single"?"一張 PNG":fmt==="png_multiple"?selBlks.length+"張 PNG":fmt==="pdf_merge"?"單一 PDF":selBlks.length+" 頁 PDF");
  document.getElementById("PROG").style.background=isPdf?"#E74C3C":"#378ADD";
  document.getElementById("PROG_PCT").style.color=isPdf?"#E74C3C":"#378ADD";

  var div=document.createElement("div");
  div.style.cssText="position:fixed;left:-9999px;top:0;width:1200px;background:#fff;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a";
  document.body.appendChild(div);

  var p=(isPdf?doExportPDF(selBlks,div):doExportPNG(selBlks,div));
  p.then(function(){
    document.body.removeChild(div);
    showDone(selBlks);
  }).catch(function(e){
    document.body.removeChild(div);
    alert("匯出失敗："+e.message);
    doShowSelect();
  });
}

function setP(v){
  document.getElementById("PROG").style.width=v+"%";
  document.getElementById("PROG_PCT").textContent=v+"%";
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function doExportPNG(blks,div){
  var wm='<div style="padding:8px;background:#f7f7f5;text-align:center;font-size:11px;color:#aaa">NBS 保單體檢 '+pName+' '+pDate+'</div>';
  if(fmt==="png_single"){
    div.style.width="1200px";
    div.innerHTML=blks.map(function(b){return'<div style="border-bottom:1px solid #f0f0f0">'+renderBlock(b.key)+'</div>';}).join("")+wm;
    setP(30);await sleep(400);
    var singleW=Math.max(div.scrollWidth,div.offsetWidth,800);
    div.style.width=singleW+"px";
    await sleep(100);
    var c=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff",
      width:singleW,windowWidth:singleW});
    div.style.width="1200px";
    setP(80);await sleep(100);
    var a=document.createElement("a");
    a.download=pName+"_保單體檢_"+pDate+".png";
    a.href=c.toDataURL("image/png");a.click();
    setP(100);
  }else{
    for(var i=0;i<blks.length;i++){
      div.style.width="1200px";
      div.innerHTML=renderBlock(blks[i].key)+wm;
      setP(Math.round(i/blks.length*90));await sleep(300);
      var actualW=Math.max(div.scrollWidth,div.offsetWidth,800);
      div.style.width=actualW+"px";
      await sleep(100);
      var c2=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff",
        width:actualW,windowWidth:actualW});
      div.style.width="1200px";
      var a2=document.createElement("a");
      a2.download=pName+"_"+blks[i].label+"_"+pDate+".png";
      a2.href=c2.toDataURL("image/png");a2.click();
      await sleep(400);
    }
    setP(100);
  }
}

async function doExportPDF(blks,div){
  var J=window.jspdf.jsPDF;
  var pdf=new J("l","mm","a4");  // 預設橫向，更適合寬表格
  var wm='<div style="padding:8px;background:#f7f7f5;text-align:center;font-size:11px;color:#aaa">NBS 保單體檢 '+pName+' '+pDate+'</div>';
  for(var i=0;i<blks.length;i++){
    div.style.width="1200px";
    div.innerHTML=renderBlock(blks[i].key)+wm;
    setP(Math.round(i/blks.length*90));await sleep(300);
    var actualW3=Math.max(div.scrollWidth,div.offsetWidth,800);
    div.style.width=actualW3+"px";
    await sleep(100);
    var c=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff",
      width:actualW3,windowWidth:actualW3});
    div.style.width="1200px";
    if(i>0) pdf.addPage("a4","landscape");
    var iw=277, ih=(c.height/c.width)*iw;
    pdf.addImage(c.toDataURL("image/png"),"PNG",10,10,iw,Math.min(ih,190));
  }
  setP(95);
  pdf.save(pName+"_保單體檢_"+pDate+".pdf");
  setP(100);
}

function showDone(blks){
  var isPdf=fmt.startsWith("pdf");
  document.getElementById("DONE_MSG").textContent=(isPdf?"PDF":"圖片")+"已下載到您的裝置，可直接傳送給保戶";
  var h='<div style="font-size:11px;color:#aaa;margin-bottom:6px">下載的檔案</div>';
  if(fmt==="png_single")h+='<div class="fitem">🖼️ '+pName+'_保單體檢_'+pDate+'.png</div>';
  else if(fmt==="png_multiple")h+=blks.map(function(b){return'<div class="fitem">🖼️ '+pName+'_'+b.label+'_'+pDate+'.png</div>';}).join("");
  else h+='<div class="fitem">📄 '+pName+'_保單體檢_'+pDate+'.pdf'+(fmt==="pdf_pages"?" ("+blks.length+"頁)":"")+'</div>';
  document.getElementById("DONE_FILES").innerHTML=h;
  goPage("P_DONE");
}

// ── GAS 呼叫 ─────────────────────────────────────────────
function gas(action,params){
  if(action==="saveFile"){
    return fetch(GAS,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify(Object.assign({action:action},params)),
    }).then(function(r){return r.json();});
  }
  var url=new URL(GAS);
  url.searchParams.set("action",action);
  Object.entries(params||{}).forEach(function(kv){
    var k=kv[0],v=kv[1];
    if(typeof v==="object")url.searchParams.set(k,encodeURIComponent(JSON.stringify(v)));
    else if(v!==null&&v!==undefined)url.searchParams.set(k,v);
  });
  return fetch(url.toString()).then(function(r){return r.json();});
}

// ── 頁面載入後 ─────────────────────────────────────────
window.addEventListener("nbs_nav_ready", async function(e) {
  var currentUser   = e.detail.user;
  familyData        = e.detail.familyData;
  currentPersonId   = e.detail.currentPersonId;
  familyFileName    = e.detail.familyFileName;

  // 從 URL ?from= 參數預選對應區塊
  var fromPage = new URLSearchParams(window.location.search).get("from") || "";
  var PAGE_TO_BLOCK = {
    "summary":     ["summary"],
    "savings":     ["savings_timeline"],
    "beneficiary": ["beneficiary"],
    "family":      ["summary"],
    "policy":      ["summary","monthly"],
    "coverage":    ["summary"],
  };
  if (fromPage && PAGE_TO_BLOCK[fromPage]) {
    PAGE_TO_BLOCK[fromPage].forEach(function(k){ sel[k]=true; });
  }
  buildBlocks();
  buildFmts();
  var btn=document.getElementById("B_PREV");
  if(btn){btn.disabled=true;btn.textContent="資料載入中…";btn.style.background="#ccc";}

  try {
    var pdm = {};
    var fmem = (familyData && familyData.members) || [];
    var activeMembers = fmem.filter(function(m) { return m.role !== "beneficiary_only"; });

    var fetchPromises = activeMembers.map(function(mem) {
      var cacheKey = "nbs_person_" + mem.personId;
      var cachedData = sessionStorage.getItem(cacheKey);

      if (cachedData) {
        pdm[mem.personId] = JSON.parse(cachedData);
        return Promise.resolve();
      } else {
        return gas("readFile", {
          email: currentUser.email,
          fileType: "persons",
          fileName: mem.name + "_" + mem.personId + ".json"
        }).then(function(pr) {
          if (pr.status === "ok") {
            pdm[mem.personId] = pr.content;
            sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
          }
        }).catch(function(err) { console.error("讀取 " + mem.name + " 失敗", err); });
      }
    });

    await Promise.all(fetchPromises);

    person = pdm[currentPersonId] || {};
    policies = person.policies || [];
    coverage = person.coverage || {};
    savings = person.savings || [];
    pName = (person.profile && person.profile.name) || "—";
    var ad = person.profile && person.profile.analysisDate;
    if (ad) {
      var d = new Date(ad);
      pDate = (d.getFullYear() - 1911) + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }
  } catch (ex) { 
    console.error("export load error", ex); 
  }
  updatePrevBtn();
});

// ── NBS 導覽 ──────────────────────────────────────────────
if (typeof NBS_NAV !== "undefined") { 
    NBS_NAV.onMemberChange = function(pid) {
      currentPersonId = pid;
      // 匯出頁面不需要即時更新內容，但可在這裡補上重新抓人名邏輯
      var pdm_p = JSON.parse(sessionStorage.getItem("nbs_person_" + pid));
      if(pdm_p) {
        person = pdm_p;
        policies = person.policies || [];
        pName = (person.profile && person.profile.name) || "—";
        updatePrevBtn();
      }
    };
}

NBS_NAV.init({ page: "export" });
