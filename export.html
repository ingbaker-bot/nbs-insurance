<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBS - 匯出設定</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;min-height:100vh;color:#1a1a1a}
    .hdr{background:#fff;border-bottom:1px solid #eee;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .back{background:none;border:none;font-size:24px;color:#666;cursor:pointer;padding:4px}
    .wrap{padding:16px}
    .member-tabs{display:flex;gap:8px;padding:12px 16px;background:#fff;overflow-x:auto}
    .member-tab{padding:8px 16px;border-radius:20px;background:#eee;cursor:pointer;white-space:nowrap;font-size:14px}
    .member-tab.active{background:#6366f1;color:#fff}
    .info-card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid #eee}
    .info-card.active{border:2px solid #6366f1}
    .btn-fixed{position:fixed;bottom:20px;left:20px;right:20px;background:#6366f1;color:#fff;padding:16px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer}
    .pg{display:none}.pg.act{display:block}
    .alert{color:red;font-size:14px;text-align:center;padding:10px;display:none}
  </style>
</head>
<body>

<div class="hdr">
  <button class="back" onclick="goBack()">❮</button>
  <div class="hdr-title">匯出設定</div>
</div>

<div id="member-tabs" class="member-tabs"></div>

<div class="pg act" id="P_SEL">
  <div class="wrap" id="BLKLIST"></div>
  <div id="ALERT" class="alert">請至少選擇一個區塊</div>
  <div class="btn-fixed" id="B_PREV">預覽與匯出</div>
</div>

<div class="pg" id="P_PREV">
  <div class="wrap" id="PV_BLOCKS" style="margin-bottom:80px; background:#fff; padding:20px;"></div>
  <div class="btn-fixed" id="B_EXPORT">確認下載圖片</div>
</div>

<script src="nav.js"></script>
<script>
var BLOCKS=[{key:"premium_detail",label:"繳費明細"},{key:"summary",label:"保障總覽"},{key:"policy_detail",label:"保障明細"},{key:"savings_timeline",label:"現金流"}];
var sel={premium_detail:false,summary:false,policy_detail:false,savings_timeline:false};

function goBack() {
    var pPrev = document.getElementById("P_PREV");
    var pSel = document.getElementById("P_SEL");
    if(pPrev.classList.contains("act")) {
        pPrev.classList.remove("act");
        pSel.classList.add("act");
    } else {
        window.history.back();
    }
}

function buildBlocks(){
  var c=document.getElementById("BLKLIST"); c.innerHTML="";
  BLOCKS.forEach(b=>{
    var d=document.createElement("div");
    d.className="info-card "+(sel[b.key]?"active":"");
    d.innerHTML=`<span>${b.label}</span><span>${sel[b.key]?"✅":"⬜"}</span>`;
    d.onclick=()=>{sel[b.key]=!sel[b.key];buildBlocks();};
    c.appendChild(d);
  });
}

document.getElementById("B_PREV").onclick=()=>{
  if(!Object.values(sel).some(v=>v)){document.getElementById("ALERT").style.display="block";return;}
  document.getElementById("ALERT").style.display="none";
  document.getElementById("P_SEL").classList.remove("act");
  document.getElementById("P_PREV").classList.add("act");
  var selected = Object.keys(sel).filter(k=>sel[k]).map(k => BLOCKS.find(b=>b.key===k).label);
  document.getElementById("PV_BLOCKS").innerHTML = "<h3>選取清單</h3><p style='margin-top:10px; color:#333;'>" + selected.join("、") + "</p>";
};

// 實際執行下載圖片的邏輯
document.getElementById("B_EXPORT").onclick = () => {
    const element = document.getElementById("PV_BLOCKS");
    html2canvas(element).then(canvas => {
        const link = document.createElement("a");
        link.download = "保單明細.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
};

window.addEventListener("nbs_nav_ready", (e)=>{
  var container=document.getElementById("member-tabs");
  if(e.detail && e.detail.familyData) {
      e.detail.familyData.members.forEach(m=>{
        var div=document.createElement("div"); div.className="member-tab"; div.innerText=m.name;
        div.onclick=()=>{
          document.querySelectorAll('.member-tab').forEach(t=>t.classList.remove('active'));
          div.classList.add('active');
          if(window.NBS_NAV) {
            if(typeof NBS_NAV.switchPerson === 'function') NBS_NAV.switchPerson(m.id);
            else if(typeof NBS_NAV.onMemberChange === 'function') NBS_NAV.onMemberChange(m.id);
          }
        };
        container.appendChild(div);
      });
  }
  buildBlocks();
});
</script>
</body>
</html>
