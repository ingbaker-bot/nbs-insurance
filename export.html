<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBS - 匯出圖片</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;min-height:100vh;color:#1a1a1a}
    .hdr{background:#fff;border-bottom:1px solid #eee;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .back{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:0}
    .hdr-title{font-size:15px;font-weight:500;flex:1}
    .hdr-sub{font-size:11px;color:#bbb}
    .wrap{padding:16px;max-width:560px;margin:0 auto}
    .sec-lbl{font-size:11px;font-weight:500;color:#999;margin-bottom:8px;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between}
    .blk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #e8e8e8;border-radius:10px;cursor:pointer;background:#fff;margin-bottom:8px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .blk.on{border:1.5px solid #378ADD;background:#F0F7FF}
    .chk{width:20px;height:20px;border-radius:5px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff}
    .blk.on .chk{background:#378ADD;border:none}
    .blk-lbl{font-size:13px;font-weight:500;color:#333}
    .blk.on .blk-lbl{color:#0C447C}
    .blk-desc{font-size:11px;color:#aaa;margin-top:1px}
    .fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .fmt{padding:10px 12px;border:1px solid #e8e8e8;border-radius:10px;cursor:pointer;background:#fff;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .fmt.spng{border:1.5px solid #378ADD;background:#F0F7FF}
    .fmt.spdf{border:1.5px solid #E74C3C;background:#FEF5F8}
    .fmt-title{font-size:13px;font-weight:500;color:#333;margin-bottom:2px}
    .fmt.spng .fmt-title{color:#0C447C}
    .fmt.spdf .fmt-title{color:#791F1F}
    .fmt-desc{font-size:11px;color:#aaa;line-height:1.5}
    .pbtn{width:100%;padding:12px;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:block;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .pbtn:disabled{background:#ccc!important;cursor:default}
    .sbtn{padding:10px;background:#fff;color:#666;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;flex:1;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .brow{display:flex;gap:8px;margin-top:16px}
    .pg{display:none}
    .pg.act{display:block}
    .pv-note{padding:10px 12px;background:#E6F1FB;border-radius:8px;margin-bottom:12px;font-size:11px;color:#0C447C;line-height:1.7}
    .pv-blk{border:1px solid #e8e8e8;border-radius:8px;overflow:hidden;margin-bottom:8px}
    .pv-hdr{padding:6px 12px;background:#f7f7f5;border-bottom:1px solid #f0f0f0;font-size:11px;font-weight:500;color:#666}
    .prog-wrap{background:#f0f0f0;border-radius:99px;height:8px;overflow:hidden;max-width:280px;margin:0 auto 8px}
    .prog-bar{height:100%;border-radius:99px;transition:width .2s}
    .flist{padding:12px 14px;background:#f7f7f5;border-radius:8px;margin-bottom:20px}
    .fitem{font-size:12px;color:#333;display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .spin{display:inline-block;width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:#378ADD;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* ── Summary 區塊 CSS（移植自 summary.html）── */
    .ex-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .ex-stat-card{padding:10px 12px;border-radius:10px}
    .ex-section-lbl{font-size:11px;font-weight:500;color:#999;margin-bottom:8px;letter-spacing:.05em}
    .ex-policy-group{background:#fff;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .ex-group-hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f7f7f5;flex-wrap:wrap}
    .ex-policy-no{font-family:monospace;font-size:12px;font-weight:500;background:#E6F1FB;color:#0C447C;padding:1px 8px;border-radius:99px}
    .ex-policy-row{display:grid;grid-template-columns:88px 1fr 72px 52px;align-items:center;padding:6px 14px;border-top:1px solid #f5f5f5}
    .ex-cat{font-size:11px;padding:2px 6px;border-radius:99px;text-align:center;display:inline-block}
    .ex-prem{font-size:12px;font-weight:500;text-align:right}
    .ex-status{font-size:10px;padding:1px 5px;border-radius:99px;text-align:center}
    .ex-s-有效{background:#EAF3DE;color:#27500A}
    .ex-pie-wrap{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px;margin-bottom:14px}
    /* 各項保障加總 grid */
    .ex-cov-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    .ex-cov-card{background:#fff;border:1px solid #e8e8e8;border-radius:8px;overflow:hidden}
    .ex-cov-hdr{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid #f0f0f0}
    .ex-cov-lbl{font-size:12px;font-weight:600;letter-spacing:.04em}
    .ex-cov-item{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;border-bottom:1px dashed #f5f5f5}
    .ex-cov-item:last-child{border-bottom:none}
    .ex-cov-item-lbl{font-size:11px;color:#444}
    .ex-cov-val{font-size:13px;font-weight:600;font-family:monospace}
    .ex-cov-unit{font-size:10px;color:#999;font-weight:normal;font-family:sans-serif;margin-left:2px}
    .ex-cov-zero{color:#bbb;opacity:.5}
    /* 就醫情況 */
    .ex-med-table{width:100%;border-collapse:collapse}
    .ex-med-table th{padding:7px 10px;text-align:center;font-size:12px;font-weight:500;border-bottom:1px solid #e8e8e8}
    .ex-med-table th:first-child{text-align:left;padding-left:14px;font-weight:400;color:#888}
    .ex-med-table td{padding:7px 10px;text-align:center;font-size:13px}
    .ex-med-table td:first-child{text-align:left;padding-left:14px;font-weight:500;color:#555;background:#fafafa}
    .ex-nhi{display:inline-flex;padding:3px 10px;border-radius:6px;background:#EAF3DE}
    .ex-nhi span{font-size:12px;font-weight:500;color:#27500A}
    /* 缺口分析 */
    .ex-gap-wrap{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px 14px;margin-bottom:14px}
    /* A4 分頁 */
    .ex-page-break{page-break-before:always;padding-top:8px}

    /* 現金流時間軸（匯出版，固定寬度不捲動） */
    .ex-tl-wrap{background:#fff;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;margin-bottom:12px}
    .ex-tl-hdr{padding:10px 14px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px}
    .ex-tl-title{font-size:14px;font-weight:600}
    .ex-tl-sub{font-size:11px;color:#999}
    .ex-cf-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
    .ex-cf-table th{background:#f7f7f5;padding:6px 8px;text-align:center;font-weight:500;color:#666;border-bottom:1px solid #ebebeb;border-right:1px solid #ebebeb;white-space:nowrap}
    .ex-cf-table th:first-child{text-align:left;min-width:120px;border-right:2px solid #dde8f5}
    .ex-cf-table td{padding:5px 8px;text-align:center;border-bottom:1px solid #f5f5f5;border-right:1px solid #f5f5f5}
    .ex-cf-table td:first-child{text-align:left;font-weight:500;color:#1a1a1a;white-space:nowrap;border-right:2px solid #dde8f5}
    .ex-cf-member-row td{background:#f4f8fd;padding:7px 10px;border-top:2px solid #dde8f5;border-bottom:1px solid #dde8f5}
    .ex-cf-policy-row td{background:#fff}
    .ex-cf-subtotal-row td{background:#f0f6fc;font-weight:600;color:#0C447C;border-top:1px solid #dde8f5;border-bottom:2px solid #c5ddf5}
    .ex-cf-total-row td{background:#e8f3fd;font-weight:600;color:#0C447C;border-top:2px solid #c5ddf5}
    .ex-cf-bar{height:18px;border-radius:3px;background:#E6F1FB;display:inline-flex;align-items:center;justify-content:center;min-width:24px;padding:0 3px}
    .ex-cf-bar span{font-size:9px;color:#0C447C;white-space:nowrap}
    .ex-cf-amount{font-size:10px;color:#0C447C;font-weight:500;white-space:nowrap}
  </style>
  <script src="nav.js"></script>
</head>
<body>
<div style="display:none" id="HDR_SUB"></div>
<button style="display:none" id="B_BACK"></button>
<div style="display:none" id="HDR_TITLE"></div>

<div class="pg act" id="P_SEL">
  <div class="wrap">
    <div class="sec-lbl">選擇匯出區塊
      <button id="B_TOGALL" style="font-size:11px;padding:3px 12px;border:1px solid #ddd;border-radius:99px;background:#fff;color:#666;cursor:pointer;font-family:inherit">全部取消</button>
    </div>
    <div id="BLKLIST"></div>
    <div style="font-size:12px;font-weight:500;color:#555;margin-top:14px;margin-bottom:6px">🖼️ 圖檔（PNG）</div>
    <div class="fmt-grid" id="FMT_PNG"></div>
    <div style="font-size:12px;font-weight:500;color:#555;margin-top:10px;margin-bottom:6px">📄 文件（PDF）</div>
    <div class="fmt-grid" id="FMT_PDF"></div>
    <button class="pbtn" id="B_PREV" style="background:#378ADD;margin-top:20px">預覽區塊</button>
  </div>
</div>

<div class="pg" id="P_PREV">
  <div class="wrap">
    <div class="pv-note" id="PV_NOTE"></div>
    <div id="PV_BLOCKS"></div>
    <div style="padding:8px 12px;background:#f7f7f5;border-radius:8px;font-size:11px;color:#aaa;margin-bottom:14px">
      💡 <span id="WM_HINT"></span>
    </div>
    <div class="brow">
      <button class="sbtn" id="B_BACK2">返回修改</button>
      <button class="pbtn" id="B_EXPORT" style="background:#378ADD;flex:2;margin-top:0">下載圖片</button>
    </div>
  </div>
</div>

<div class="pg" id="P_DOING">
  <div class="wrap" style="text-align:center;padding-top:40px">
    <div style="font-size:36px;margin-bottom:16px" id="EX_ICON">🖼️</div>
    <div style="font-weight:500;font-size:15px;margin-bottom:8px" id="EX_MSG">正在產生圖片…</div>
    <div style="font-size:12px;color:#999;margin-bottom:24px" id="EX_SUB"></div>
    <div class="prog-wrap"><div class="prog-bar" id="PROG" style="width:0%;background:#378ADD"></div></div>
    <div style="font-size:12px;font-weight:500;margin-top:8px;color:#378ADD" id="PROG_PCT">0%</div>
  </div>
</div>

<div class="pg" id="P_DONE">
  <div class="wrap" style="text-align:center;padding-top:32px">
    <div style="font-size:48px;margin-bottom:16px">✅</div>
    <div style="font-weight:500;font-size:16px;margin-bottom:8px">匯出完成！</div>
    <div style="font-size:12px;color:#999;line-height:1.8;margin-bottom:20px" id="DONE_MSG"></div>
    <div class="flist" id="DONE_FILES"></div>
    <div class="brow">
      <button class="pbtn" id="B_FINISH" style="background:#378ADD;margin-top:0">← 返回</button>
    </div>
  </div>
</div>

<script>
// ── 設定 ─────────────────────────────────────────────────
const GAS="https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

// ▼ 新增受益人模塊
const BLOCKS=[
  {key:"summary", label:"保單彙總一覽",  icon:"📊",desc:"保單列表、保費結構、各項保障加總"},
  {key:"timeline",label:"醫療前中後保障",icon:"🏥",desc:"前期一次性、中期療程、後期生活幫助"},
  {key:"coverage",label:"附約保障清單",  icon:"🛡️",desc:"各保單附約保障金額明細"},
  {key:"savings", label:"儲蓄險領回明細",icon:"🐷",desc:"各保單領回時間表與總領回金額"},
  {key:"savings_timeline", label:"儲蓄險現金流時間軸",icon:"📈",desc:"未來15年各被保險人現金流匯整"},
  {key:"monthly", label:"每月應繳保費",  icon:"📅",desc:"月曆式繳費分配"},
  {key:"policy",  label:"保險繳費一覽",  icon:"📋",desc:"所有保單號碼、繳費方式、保費明細"},
  {key:"beneficiary", label:"受益人與傳承", icon:"👥",desc:"傳承規劃與保額對應關係"},
];
const FMTS=[
  {key:"png_single",  type:"png",label:"PNG 一張長圖",desc:"所有區塊合併，適合 LINE 傳送"},
  {key:"png_multiple",type:"png",label:"PNG 分張",    desc:"每個區塊各自一張"},
  {key:"pdf_merge",   type:"pdf",label:"PDF 合併",    desc:"所有區塊合併為單一 PDF"},
  {key:"pdf_pages",   type:"pdf",label:"PDF 分頁",    desc:"每個區塊各自一頁"},
];
const CC={"壽險保障":"#4A90D9","醫療保障":"#27AE8F","意外險":"#F5A623","重大疾病險":"#9B59B6","重大傷病險":"#8E44AD","特定傷病險":"#7D3C98","儲蓄險":"#E8638A","年金險":"#C0392B","投資型保險":"#95A5A6"};

// ── 狀態 ─────────────────────────────────────────────────
var sel={summary:false,timeline:false,coverage:false,savings:false,savings_timeline:false,monthly:false,policy:false,beneficiary:false};
var fmt="png_single";
var person={},policies=[],coverage={},savings=[];
var pName="",pDate="";

// ── 按鈕綁定 ─────────────────────────────────────────────
document.getElementById("B_BACK").onclick    = function(){ window.location.href="family.html"; };
document.getElementById("B_TOGALL").onclick  = doToggleAll;
document.getElementById("B_PREV").onclick    = doShowPreview;
document.getElementById("B_BACK2").onclick   = doShowSelect;
document.getElementById("B_EXPORT").onclick  = doExport;
document.getElementById("B_FINISH").onclick  = function(){ history.back(); };

// ── 建立區塊清單 ──────────────────────────────────────────
function buildBlocks(){
  var c=document.getElementById("BLKLIST");
  c.innerHTML="";
  BLOCKS.forEach(function(b){
    var d=document.createElement("div");
    d.className="blk"+(sel[b.key]?" on":"");
    d.innerHTML='<div class="chk">'+(sel[b.key]?"✓":"")+'</div><span style="font-size:20px;flex-shrink:0">'+b.icon+'</span><div style="flex:1"><div class="blk-lbl">'+b.label+'</div><div class="blk-desc">'+b.desc+'</div></div>';
    d.onclick=(function(key){return function(){
      sel[key]=!sel[key];
      buildBlocks();
      updateToggleBtn();
      updatePrevBtn();
    };})(b.key);
    c.appendChild(d);
  });
}

function buildFmts(){
  ["png","pdf"].forEach(function(t){
    var c=document.getElementById("FMT_"+t.toUpperCase());
    c.innerHTML="";
    FMTS.filter(function(f){return f.type===t;}).forEach(function(f){
      var d=document.createElement("div");
      var sc=fmt===f.key?(t==="png"?"spng":"spdf"):"";
      d.className="fmt "+sc;
      d.innerHTML='<div class="fmt-title">'+f.label+'</div><div class="fmt-desc">'+f.desc+'</div>';
      d.onclick=(function(key,type){return function(){
        fmt=key;
        buildFmts();
        var eb=document.getElementById("B_EXPORT");
        eb.style.background=fmt.startsWith("pdf")?"#E74C3C":"#378ADD";
        eb.textContent=fmt.startsWith("pdf")?"匯出 PDF":"下載圖片";
      };})(f.key,t);
      c.appendChild(d);
    });
  });
}

function updateToggleBtn(){
  var all=BLOCKS.every(function(b){return sel[b.key];});
  document.getElementById("B_TOGALL").textContent=all?"全部取消":"全部勾選";
}

function updatePrevBtn(){
  var keys=BLOCKS.filter(function(b){return sel[b.key];});
  var btn=document.getElementById("B_PREV");
  if(keys.length===0){
    btn.textContent="請至少勾選一個區塊";
    btn.style.background="#ccc";
    btn.disabled=true;
  }else{
    btn.textContent="預覽 "+keys.length+" 個區塊";
    btn.style.background="#378ADD";
    btn.disabled=false;
  }
}

function doToggleAll(){
  var all=BLOCKS.every(function(b){return sel[b.key];});
  BLOCKS.forEach(function(b){sel[b.key]=!all;});
  buildBlocks();
  updateToggleBtn();
  updatePrevBtn();
}

function goPage(id){
  ["P_SEL","P_PREV","P_DOING","P_DONE"].forEach(function(p){
    document.getElementById(p).className="pg"+(p===id?" act":"");
  });
}

function doShowSelect(){
  goPage("P_SEL");
  document.getElementById("HDR_TITLE").textContent="匯出圖片";
}

function doShowPreview(){
  if(document.getElementById("B_PREV").disabled) return;
  if(!policies) { alert("資料仍在載入中，請稍後再試"); return; }
  var selBlks=BLOCKS.filter(function(b){return sel[b.key];});
  var isPdf=fmt.startsWith("pdf");
  document.getElementById("HDR_TITLE").textContent="預覽確認";
  document.getElementById("PV_NOTE").innerHTML='ℹ️ 以下為<strong>真實資料預覽</strong>，點「'+(isPdf?"匯出 PDF":"下載圖片")+'」後系統產生'+(isPdf?"PDF":"PNG")+'檔案。';
  document.getElementById("WM_HINT").textContent='匯出圖片底部將自動加上「NBS 保單體檢 '+pName+' '+pDate+'」浮水印';
  var eb=document.getElementById("B_EXPORT");
  eb.style.background=isPdf?"#E74C3C":"#378ADD";
  eb.textContent=isPdf?"匯出 PDF":"下載圖片";
  var c=document.getElementById("PV_BLOCKS");
  c.innerHTML="";
  selBlks.forEach(function(b,i){
    if(fmt!=="png_single"){
      var tag=document.createElement("div");
      tag.style.cssText="font-size:10px;color:#bbb;margin-bottom:3px";
      tag.textContent="第 "+(i+1)+" "+(fmt.startsWith("pdf")?"頁":"張");
      c.appendChild(tag);
    }
    var div=document.createElement("div");
    div.className="pv-blk";
    div.innerHTML='<div class="pv-hdr">'+b.icon+" "+b.label+'</div><div>'+renderBlock(b.key)+'</div>';
    c.appendChild(div);
  });
  goPage("P_PREV");
}

// ══════════════════════════════════════════════════════════
// 儲蓄險現金流時間軸輔助函式（移植自 savings.html）
// ══════════════════════════════════════════════════════════

function isMonthlyEx(k)      { return k === "5"; }
function isYearlyDetailEx(k) { return k === "6"; }

function getEndYearAt100Ex(memberId, policy) {
  var person = (typeof personDataMap !== "undefined") ? personDataMap[memberId] : null;
  var bd = (person && person.profile && person.profile.birthDate) ||
           (familyData && familyData.members &&
            (familyData.members.find(function(m){return m.personId===memberId;})||{}).birthDate);
  if (bd) {
    var by = parseInt(bd.slice(0,4));
    if (!isNaN(by)) return by + 100;
  }
  if (policy && policy.startDate) {
    var sy = parseInt(policy.startDate.slice(0,4));
    if (!isNaN(sy)) return sy + 80;
  }
  return new Date().getFullYear() + 50;
}

function calcPolicyFlowsEx(p, s, memberId, years) {
  var startWestern  = p.startDate  ? parseInt(p.startDate.slice(0,4))  : null;
  var payEndWestern = p.payEndDate ? parseInt(p.payEndDate.slice(0,4)) : null;
  var covEndWestern = p.covEndDate
    ? parseInt(p.covEndDate.slice(0,4))
    : getEndYearAt100Ex(memberId, p);
  if (!startWestern) return {};

  var typeKey       = s.type || "1";
  var duringFreqYr  = parseInt(s.duringFreqYr)  || 2;
  var duringStartYr = parseInt(s.duringStartYr) || 1;
  var duringAmt     = parseFloat(s.duringAmt)   || 0;
  var afterFreqYr   = parseInt(s.afterFreqYr)   || 1;
  var afterStartYr  = parseInt(s.afterStartYr !== undefined ? s.afterStartYr : 0);
  var afterAmt      = parseFloat(s.afterAmt)    || 0;
  var monthly       = isMonthlyEx(typeKey);
  var yearly        = isYearlyDetailEx(typeKey);

  var yearlyMap = {};
  if (yearly && s.yearlyAmts) {
    s.yearlyAmts.forEach(function(row) {
      var y = parseInt(row.yr), a = parseFloat(row.amt);
      if (!isNaN(y) && !isNaN(a) && a > 0) yearlyMap[y] = (yearlyMap[y]||0) + a;
    });
  }

  var polCur = (p && p.currency) || "TWD";
  var exRate = (polCur !== "TWD" && parseFloat(s.exchangeRate)) ? parseFloat(s.exchangeRate) : 1;

  var flows = {};
  years.forEach(function(yr) {
    if (yr > covEndWestern) return;
    var flow = 0;
    var inDuring = payEndWestern ? (yr >= startWestern && yr < payEndWestern) : false;
    var inAfter  = payEndWestern ? yr >= payEndWestern : yr >= startWestern;

    if (yearly) {
      flow = yearlyMap[yr] || 0;
    } else if (typeKey === "1") {
      if (payEndWestern && yr === payEndWestern) flow = afterAmt;
    } else if (typeKey === "2") {
      if (inDuring && duringAmt > 0) {
        var ft = startWestern + duringStartYr - 1;
        var e = yr - ft;
        if (yr >= ft && e % duringFreqYr === 0) flow += duringAmt;
      }
      if (payEndWestern && yr === payEndWestern) flow += afterAmt;
    } else if (typeKey === "3") {
      if (inAfter && afterAmt > 0) {
        var base = (payEndWestern || startWestern) + afterStartYr;
        var e2 = yr - base;
        if (yr >= base && e2 % afterFreqYr === 0) flow = afterAmt;
      }
    } else if (typeKey === "4") {
      if (inDuring && duringAmt > 0) {
        var ft2 = startWestern + duringStartYr - 1;
        var e3 = yr - ft2;
        if (yr >= ft2 && e3 % duringFreqYr === 0) flow += duringAmt;
      }
      if (inAfter && afterAmt > 0) {
        var base2 = (payEndWestern || startWestern) + afterStartYr;
        var e4 = yr - base2;
        if (yr >= base2 && e4 % afterFreqYr === 0) flow += afterAmt;
      }
    } else if (monthly) {
      if (inAfter && afterAmt > 0) flow = afterAmt * 12;
    }
    if (flow > 0) flows[yr] = Math.round(flow * exRate);
  });
  return flows;
}

function fmtAmtEx(amt) {
  if (amt >= 10000) return (amt / 10000).toFixed(1) + "萬";
  return amt.toLocaleString();
}

function renderSavingsTimeline(pdm, fData, startYr, endYr) {
  var years = [];
  for (var y = startYr; y <= endYr; y++) years.push(y);

  var groups = [];
  var totalFlows = {};

  fData.members.filter(function(m){ return m.role !== "beneficiary_only"; }).forEach(function(m) {
    var person = pdm[m.personId];
    if (!person) return;
    var savingPolicies = (person.policies || []).filter(function(p) {
      return ["儲蓄險","年金險","儲蓄年金","投資型保險"].indexOf(p.category) >= 0;
    });
    if (!savingPolicies.length) return;

    var policyRows = [];
    savingPolicies.forEach(function(p) {
      var s = (person.savings || []).find(function(sv){ return sv.policyId === p.id; }) || {type:"1"};
      var flows = calcPolicyFlowsEx(p, s, m.personId, years);
      Object.keys(flows).forEach(function(yr) {
        totalFlows[yr] = (totalFlows[yr] || 0) + flows[yr];
      });
      policyRows.push({
        policyNo: p.policyNo || p.id,
        itemName: p.itemName || "",
        category: p.category || "",
        flows: flows,
      });
    });
    if (policyRows.length) groups.push({ memberName: m.name, policies: policyRows });
  });

  if (!groups.length) {
    return '<div style="padding:20px;text-align:center;color:#bbb;font-size:12px">尚無儲蓄保單設定領回資料</div>';
  }

  // 固定顯示全部 16 年（不自動裁切，確保 A4 橫向完整）
  var dispYears = years;
  var maxTotal = Math.max.apply(null, Object.values(totalFlows).concat([1]));

  var catBg    = {"儲蓄險":"#FBEAF0","年金險":"#FCEBEB","儲蓄年金":"#FBEAF0","投資型保險":"#f0f0f0"};
  var catColor = {"儲蓄險":"#72243E","年金險":"#791F1F","儲蓄年金":"#72243E","投資型保險":"#555"};

  var yearHeaders = dispYears.map(function(y) {
    return '<th>' + y + '<br><span style="font-size:8px;color:#bbb;font-weight:400">' + (y-1911) + '年</span></th>';
  }).join("");

  var groupRows = groups.map(function(g) {
    var paying = g.policies.filter(function(pr){ return Object.keys(pr.flows).length === 0; }).length;
    var nameRow = '<tr class="ex-cf-member-row"><td colspan="' + (dispYears.length+1) + '">' +
      '<span style="font-size:11px;font-weight:600;color:#1a1a1a">' + g.memberName + '</span>' +
      '<span style="font-size:10px;color:#bbb;margin-left:6px">' + g.policies.length + ' 張保單</span>' +
      (paying > 0 ? '<span style="font-size:10px;color:#e0a030;margin-left:4px">（含 ' + paying + ' 張繳費中）</span>' : '') +
      '</td></tr>';

    var pRowsHtml = g.policies.map(function(pr) {
      var cells = dispYears.map(function(yr) {
        var amt = pr.flows[yr] || 0;
        if (!amt) return '<td><span style="color:#ebebeb;font-size:9px">—</span></td>';
        var w = Math.max(20, Math.round((amt / maxTotal) * 60));
        return '<td><div class="ex-cf-bar" style="width:' + w + 'px"><span>' + fmtAmtEx(amt) + '</span></div></td>';
      }).join("");
      var bg = catBg[pr.category] || "#f0f0f0";
      var co = catColor[pr.category] || "#555";
      var hasFlow = Object.keys(pr.flows).length > 0;
      var firstCell = '<td style="padding-left:14px;min-width:120px">' +
        '<div style="margin-bottom:2px"><span style="font-size:9px;padding:1px 4px;border-radius:3px;background:' + bg + ';color:' + co + '">' + pr.category + '</span>' +
        (!hasFlow ? '<span style="font-size:9px;color:#bbb;margin-left:3px">繳費中</span>' : '') + '</div>' +
        '<div style="font-size:10px;font-weight:600;font-family:monospace;color:#333">' + pr.policyNo + '</div>' +
        (pr.itemName ? '<div style="font-size:9px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px">' + pr.itemName + '</div>' : '') +
        '</td>';
      return '<tr class="ex-cf-policy-row">' + firstCell + cells + '</tr>';
    }).join("");

    // 小計
    var mFlows = {};
    g.policies.forEach(function(pr){ Object.keys(pr.flows).forEach(function(yr){ mFlows[yr]=(mFlows[yr]||0)+pr.flows[yr]; }); });
    var subRow = '<tr class="ex-cf-subtotal-row"><td style="padding-left:14px">小計</td>' +
      dispYears.map(function(yr){ var a=mFlows[yr]||0; return a?('<td class="ex-cf-amount">'+fmtAmtEx(a)+'</td>'):'<td><span style="color:#c0c0c0">—</span></td>'; }).join("") +
      '</tr>';

    return nameRow + pRowsHtml + subRow;
  }).join("");

  var totalRow = '<tr class="ex-cf-total-row"><td>合計現金流</td>' +
    dispYears.map(function(yr){ var a=totalFlows[yr]||0; return a?('<td class="ex-cf-amount">'+fmtAmtEx(a)+'</td>'):'<td>—</td>'; }).join("") +
    '</tr>';

  return '<div class="ex-tl-wrap">' +
    '<div class="ex-tl-hdr">' +
      '<span class="ex-tl-title">未來現金流時間軸</span>' +
      '<span class="ex-tl-sub">' + startYr + '－' + endYr + '年・' + groups.length + ' 位被保險人</span>' +
    '</div>' +
    '<div style="overflow:visible">' +
      '<table class="ex-cf-table">' +
        '<thead><tr><th>被保險人 / 保單號碼</th>' + yearHeaders + '</tr></thead>' +
        '<tbody>' + groupRows + totalRow + '</tbody>' +
      '</table>' +
    '</div>' +
  '</div>';
}

function sumCovEx(keys, pols, cov) {
  var t = 0;
  pols.forEach(function(p) {
    keys.forEach(function(k) {
      if (p.coverage && typeof p.coverage[k] === "number") t += p.coverage[k];
    });
  });
  if (t === 0 && cov) {
    pols.forEach(function(p) {
      keys.forEach(function(k) {
        if (cov[p.id+"_"+k] && typeof cov[p.id+"_"+k] === "number") t += cov[p.id+"_"+k];
      });
    });
  }
  return t;
}

// currentPersonId 在 export.html 中是全域變數
function getItemCurrentEx(key, pols, cov, covOverrides) {
  var map = GAP_KEY_MAP_EX[key];
  if (!map) return 0;
  var manualKey = currentPersonId + "_" + key;
  if (covOverrides && covOverrides[manualKey] !== undefined) return covOverrides[manualKey] ? 1 : 0;
  if (["investment","savings","waiver"].includes(key)) {
    if (key==="investment") return pols.some(function(p){return p.category==="投資型保險";})?1:0;
    if (key==="savings")    return pols.some(function(p){return ["儲蓄險","年金險"].includes(p.category);})?1:0;
    if (key==="waiver")     return sumCovEx(["ltc_waiver"],pols,cov)>0?1:0;
    return 0;
  }
  if (["life_permanent","life_term","ci_special"].includes(key)) {
    var matched = pols.filter(function(p){return map.cats.includes(p.category);});
    var amt = 0;
    matched.forEach(function(p){ if(p.insuredAmount) amt += parseFloat(p.insuredAmount)||0; });
    if (amt===0 && matched.length>0) return 1;
    return amt;
  }
  var total = sumCovEx(map.keys, pols, cov);
  var matched2 = pols.filter(function(p){return map.cats.includes(p.category);});
  if (total===0 && matched2.length>0) {
    matched2.forEach(function(p){ if(p.insuredAmount) total += parseFloat(p.insuredAmount)||0; });
    if (total===0) return 1;
  }
  return total;
}

function getItemStatusEx(key, pols, cov, tgts, covOverrides) {
  var item = GAP_GROUPS_EX.flatMap(function(g){return g.items;}).find(function(i){return i.key===key;});
  var current = getItemCurrentEx(key, pols, cov, covOverrides);
  var target  = tgts ? tgts[key] : undefined;
  var isBool  = item && item.isBool;
  if (!current) return {status:"gap",current:0,target:target,pct:0};
  if (!target||isBool) return {status:"ok",current:current,target:null,pct:1};
  if (current>=target) return {status:"ok",current:current,target:target,pct:1};
  return {status:"insufficient",current:current,target:target,pct:current/target};
}

function buildDonutChartEx(active, cov, tgts, covOverrides) {
  var allItems = GAP_GROUPS_EX.flatMap(function(g){return g.items;});

  var angle=-Math.PI/2, paths="", labels="";
  var px=function(r,a){return cx+r*Math.cos(a);};
  var py=function(r,a){return cy+r*Math.sin(a);};
  var donut=function(a1,a2,lg,r1,r2){
    return "M"+px(r1,a1)+","+py(r1,a1)+" A"+r1+","+r1+" 0 "+lg+" 1 "+px(r1,a2)+","+py(r1,a2)+
           " L"+px(r2,a2)+","+py(r2,a2)+" A"+r2+","+r2+" 0 "+lg+" 0 "+px(r2,a1)+","+py(r2,a1)+" Z";

  function renderLegendEx(g) {
    var html = '<div style="font-size:12px;font-weight:500;color:'+g.color+';margin-bottom:8px;border-bottom:1px solid '+g.color+'30;padding-bottom:4px">'+g.label+'</div>';

      html += '<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:5px">'+
        '<div style="width:10px;height:10px;border-radius:2px;background:'+dotColor+';flex-shrink:0"></div>'+
        '<span style="color:'+(s.status==="gap"?"#bbb":"#444")+';flex:1;white-space:nowrap">'+item.label+'</span>'+
        amtHtml+'<span style="margin-left:4px">'+icon+'</span></div>';
    });

  }

  allItems.forEach(function(item) {
    var s = getItemStatusEx(item.key, active, cov, tgts, covOverrides);
    var start=angle+gapA/2, end=angle+gapA/2+sliceA, filledEnd=start+sliceA*s.pct, midA=start+sliceA/2;
    angle += sliceA+gapA;
    paths += '<path d="'+donut(start,end,sliceA>Math.PI?1:0,OR,IR)+'" fill="#f0f0f0"/>';
    if(s.pct>0.01) paths += '<path d="'+donut(start,filledEnd,sliceA*s.pct>Math.PI?1:0,OR,IR)+'" fill="'+item.color+'"/>';
    if(s.status==="insufficient"&&s.pct<0.99) {
      var gs=sliceA*(1-s.pct);
      paths += '<path d="'+donut(filledEnd,end,gs>Math.PI?1:0,OR,IR)+'" fill="none" stroke="'+item.color+'" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.45"/>';
    }
    var isR=Math.cos(midA)>=0;
    var x0=px(OR,midA),y0=py(OR,midA),x1=px(OR+12,midA),y1=py(OR+12,midA),x2=x1+(isR?15:-15),y2=y1;
    var ta=isR?"start":"end", tx=x2+(isR?4:-4);
    var tc=s.status==="gap"?"#aaa":"#555", fw=s.status==="ok"?"500":"400";
    var pfx=s.status==="gap"?"❌ ":s.status==="insufficient"?"⚠️ ":"";
    labels += '<polyline points="'+x0+','+y0+' '+x1+','+y1+' '+x2+','+y2+'" fill="none" stroke="'+item.color+'60" stroke-width="1.2"/>'+
              '<circle cx="'+x0+'" cy="'+y0+'" r="2" fill="'+item.color+'"/>'+
              '<text x="'+tx+'" y="'+(y2+4)+'" text-anchor="'+ta+'" style="font-size:11px;fill:'+tc+';font-weight:'+fw+';letter-spacing:0.03em">'+pfx+item.label+'</text>';
  });

  var okN=allItems.filter(function(i){return getItemStatusEx(i.key,active,cov,tgts,covOverrides).status==="ok";}).length;
  var gapN=allItems.filter(function(i){return getItemStatusEx(i.key,active,cov,tgts,covOverrides).status==="gap";}).length;
  var insN=allItems.filter(function(i){return getItemStatusEx(i.key,active,cov,tgts,covOverrides).status==="insufficient";}).length;

  var lF=renderLegendEx(GAP_GROUPS_EX[0]);
  var lB=renderLegendEx(GAP_GROUPS_EX[1]);
  var lD=renderLegendEx(GAP_GROUPS_EX[2]);
  var lA=renderLegendEx(GAP_GROUPS_EX[3]);

  return '<div style="display:flex;flex-direction:column;width:100%">'+
    '<div style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:16px">'+

    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px dashed #e8e8e8;padding-top:16px">'+
      '<div>'+lB+'</div><div>'+lD+'</div><div>'+lA+'</div>'+
    '</div></div>';
}

function buildGapAnalysisEx(active, cov, tgts, covOverrides) {
  var allItems = GAP_GROUPS_EX.flatMap(function(g){return g.items;});
  var gaps=[], ins=[];
  allItems.forEach(function(item) {
    var s = getItemStatusEx(item.key, active, cov, tgts, covOverrides);
    if(s.status==="gap") gaps.push({item:item, current:s.current, target:s.target, pct:s.pct});
    if(s.status==="insufficient") ins.push({item:item, current:s.current, target:s.target, pct:s.pct});
  });
  var html = "";
  if(ins.length) {
    html += '<div style="font-size:11px;font-weight:500;color:#F5A623;margin-bottom:8px">⚠ 規劃不足</div>';
    ins.forEach(function(x) {
      html += '<div style="margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:3px">'+
          '<span style="font-size:12px;color:#555">'+x.item.label+'</span>'+
          '<span style="font-size:11px;color:#555;font-weight:500">'+x.current.toLocaleString()+x.item.unit+' / 目標 '+(x.target?x.target.toLocaleString():'-')+x.item.unit+'</span>'+
        '</div>'+
        '<div style="height:7px;background:#f0f0f0;border-radius:99px;overflow:hidden">'+
          '<div style="height:100%;width:'+Math.round(x.pct*100)+'%;background:'+x.item.color+';border-radius:99px"></div>'+
        '</div>'+
        '<div style="font-size:11px;color:#E74C3C;margin-top:3px">尚不足 '+(x.target-x.current).toLocaleString()+x.item.unit+'（'+Math.round(x.pct*100)+'% 達成）</div>'+
      '</div>';
    });
  }
  if(gaps.length) {
    html += '<div style="font-size:11px;font-weight:500;color:#E74C3C;margin-bottom:8px;margin-top:'+(ins.length?12:0)+'px">❌ 尚未規劃</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">';
    gaps.forEach(function(x) {
      html += '<span style="padding:2px 10px;background:#FCEBEB;border:1px solid #F0A8BF;border-radius:99px;font-size:12px;color:#791F1F">'+x.item.label+'</span>';
    });
    html += '</div><div style="font-size:11px;color:#aaa">💡 可與保戶討論是否有需要規劃</div>';
  }
  if(!ins.length && !gaps.length) {
    html += '<div style="font-size:12px;color:#27AE8F;text-align:center;padding:10px 0">🎉 所有已設目標項目均達標！</div>';
  }
  return html;
}

// ── 匯出主流程 ────────────────────────────────────────────
function doExport(){
  var selBlks=BLOCKS.filter(function(b){return sel[b.key];});
  var isPdf=fmt.startsWith("pdf");
  goPage("P_DOING");
  document.getElementById("EX_ICON").textContent=isPdf?"📄":"🖼️";
  document.getElementById("EX_MSG").textContent=isPdf?"正在產生 PDF…":fmt==="png_single"?"正在合併圖片…":"正在產生圖片…";
  document.getElementById("EX_SUB").textContent="共 "+selBlks.length+" 個區塊 "+(fmt==="png_single"?"一張 PNG":fmt==="png_multiple"?selBlks.length+"張 PNG":fmt==="pdf_merge"?"單一 PDF":selBlks.length+" 頁 PDF");
  document.getElementById("PROG").style.background=isPdf?"#E74C3C":"#378ADD";
  document.getElementById("PROG_PCT").style.color=isPdf?"#E74C3C":"#378ADD";

  var div=document.createElement("div");
  div.style.cssText="position:fixed;left:-9999px;top:0;width:560px;background:#fff;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a";
  document.body.appendChild(div);

  var p=(isPdf?doExportPDF(selBlks,div):doExportPNG(selBlks,div));
  p.then(function(){
    document.body.removeChild(div);
    showDone(selBlks);
  }).catch(function(e){
    document.body.removeChild(div);
    alert("匯出失敗："+e.message);
    doShowSelect();
  });
}

function setP(v){
  document.getElementById("PROG").style.width=v+"%";
  document.getElementById("PROG_PCT").textContent=v+"%";
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function doExportPNG(blks,div){
  var wm='<div style="padding:8px;background:#f7f7f5;text-align:center;font-size:11px;color:#aaa">NBS 保單體檢 '+pName+' '+pDate+'</div>';
  if(fmt==="png_single"){
    div.innerHTML=blks.map(function(b){return'<div style="border-bottom:1px solid #f0f0f0">'+renderBlock(b.key)+'</div>';}).join("")+wm;
    setP(30);await sleep(200);
    var c=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
    setP(80);await sleep(100);
    var a=document.createElement("a");
    a.download=pName+"_保單體檢_"+pDate+".png";
    a.href=c.toDataURL("image/png");a.click();
    setP(100);
  }else{
    for(var i=0;i<blks.length;i++){
      div.innerHTML=renderBlock(blks[i].key)+wm;
      setP(Math.round(i/blks.length*90));await sleep(100);
      var c2=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
      var a2=document.createElement("a");
      a2.download=pName+"_"+blks[i].label+"_"+pDate+".png";
      a2.href=c2.toDataURL("image/png");a2.click();
      await sleep(400);
    }
    setP(100);
  }
}

async function doExportPDF(blks,div){
  var J=window.jspdf.jsPDF;
  var pdf=new J("p","mm","a4");
  var wm='<div style="padding:8px;background:#f7f7f5;text-align:center;font-size:11px;color:#aaa">NBS 保單體檢 '+pName+' '+pDate+'</div>';
  for(var i=0;i<blks.length;i++){
    div.innerHTML=renderBlock(blks[i].key)+wm;
    // savings_timeline 用橫式 A4（landscape）以容納 16 年的欄位
    var isLandscape = blks[i].key === "savings_timeline";
    if(isLandscape) {
      div.style.width = "1040px"; // A4 橫向約 297mm @ 96dpi ≈ 1122px，留邊後 1040
    } else {
      div.style.width = "560px";
    }
    setP(Math.round(i/blks.length*90));await sleep(200);
    var c=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
    var isTlPage = blks[i].key === "savings_timeline";
    if(i>0) pdf.addPage(isTlPage?"a4":"a4", isTlPage?"landscape":"portrait");
    else if(isTlPage) { pdf = new J("l","mm","a4"); } // 第一頁就是時間軸則直接橫式
    var iw = isTlPage ? 277 : 190;
    var ih = (c.height/c.width)*iw;
    pdf.addImage(c.toDataURL("image/png"),"PNG",10,10,iw,Math.min(ih,isTlPage?190:277));
    div.style.width = "560px"; // 還原
  }
  setP(95);
  pdf.save(pName+"_保單體檢_"+pDate+".pdf");
  setP(100);
}

function showDone(blks){
  var isPdf=fmt.startsWith("pdf");
  document.getElementById("DONE_MSG").textContent=(isPdf?"PDF":"圖片")+"已下載到您的裝置，可直接傳送給保戶";
  var h='<div style="font-size:11px;color:#aaa;margin-bottom:6px">下載的檔案</div>';
  if(fmt==="png_single")h+='<div class="fitem">🖼️ '+pName+'_保單體檢_'+pDate+'.png</div>';
  else if(fmt==="png_multiple")h+=blks.map(function(b){return'<div class="fitem">🖼️ '+pName+'_'+b.label+'_'+pDate+'.png</div>';}).join("");
  else h+='<div class="fitem">📄 '+pName+'_保單體檢_'+pDate+'.pdf'+(fmt==="pdf_pages"?" ("+blks.length+"頁)":"")+'</div>';
  document.getElementById("DONE_FILES").innerHTML=h;
  goPage("P_DONE");
}

// ── GAS 呼叫 ─────────────────────────────────────────────
function gas(action,params){
  if(action==="saveFile"){
    return fetch(GAS,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify(Object.assign({action:action},params)),
    }).then(function(r){return r.json();});
  }
  var url=new URL(GAS);
  url.searchParams.set("action",action);
  Object.entries(params||{}).forEach(function(kv){
    var k=kv[0],v=kv[1];
    if(typeof v==="object")url.searchParams.set(k,encodeURIComponent(JSON.stringify(v)));
    else if(v!==null&&v!==undefined)url.searchParams.set(k,v);
  });
  return fetch(url.toString()).then(function(r){return r.json();});
}

// ── 頁面載入後 ─────────────────────────────────────────
window.addEventListener("nbs_nav_ready", async function(e) {
  var currentUser   = e.detail.user;
  familyData        = e.detail.familyData;
  currentPersonId   = e.detail.currentPersonId;
  familyFileName    = e.detail.familyFileName;

  // 從 URL 參數 ?from= 判斷來自哪個頁面，預選對應匯出區塊
  var fromPage = new URLSearchParams(window.location.search).get("from") || "";
  var PAGE_TO_BLOCK = {
    "summary":     ["summary"],
    "coverage":    ["coverage"],
    "savings":     ["savings","savings_timeline"],
    "policy":      ["policy","summary"],
    "beneficiary": ["beneficiary"],
    "family":      ["summary"],
  };
  if (fromPage && PAGE_TO_BLOCK[fromPage]) {
    PAGE_TO_BLOCK[fromPage].forEach(function(k){ sel[k] = true; });
  }

  buildBlocks();
  buildFmts();
  var btn=document.getElementById("B_PREV");
  if(btn){btn.disabled=true;btn.textContent="資料載入中…";btn.style.background="#ccc";}

  try {
    var pdm = {};
    var fmem = (familyData && familyData.members) || [];
    var activeMembers = fmem.filter(function(m) { return m.role !== "beneficiary_only"; });

    var fetchPromises = activeMembers.map(function(mem) {
      var cacheKey = "nbs_person_" + mem.personId;
      var cachedData = sessionStorage.getItem(cacheKey);

      if (cachedData) {
        pdm[mem.personId] = JSON.parse(cachedData);
        return Promise.resolve();
      } else {
        return gas("readFile", {
          email: currentUser.email,
          fileType: "person",
          fileName: mem.name + "_" + mem.personId + ".json"
        }).then(function(pr) {
          if (pr.status === "ok") {
            pdm[mem.personId] = pr.content;
            sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
          }
        }).catch(function(err) { console.error("讀取 " + mem.name + " 失敗", err); });
      }
    });

    await Promise.all(fetchPromises);

    person = pdm[currentPersonId] || {};
    policies = person.policies || [];
    coverage = person.coverage || {};
    savings = person.savings || [];
    pName = (person.profile && person.profile.name) || "—";
    var ad = person.profile && person.profile.analysisDate;
    if (ad) {
      var d = new Date(ad);
      pDate = (d.getFullYear() - 1911) + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }
  } catch (ex) { 
    console.error("export load error", ex); 
  }
  updatePrevBtn();
});

// ── NBS 導覽 ──────────────────────────────────────────────
if (typeof NBS_NAV !== "undefined") { 
    NBS_NAV.onMemberChange = function(pid) {
      currentPersonId = pid;
      // 匯出頁面不需要即時更新內容，但可在這裡補上重新抓人名邏輯
      var pdm_p = JSON.parse(sessionStorage.getItem("nbs_person_" + pid));
      if(pdm_p) {
        person = pdm_p;
        policies = person.policies || [];
        pName = (person.profile && person.profile.name) || "—";
        updatePrevBtn();
      }
    };
    NBS_NAV.init({ page: "export" }); 
}
