<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBS - 匯出圖片</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --primary:#6366f1; --primary-dark:#4f46e5; --primary-light:#eef2ff;
      --accent-pdf:#f43f5e; --accent-pdf-light:#fff1f2;
      --bg:#f8fafc; --surface:#ffffff; --text:#1e293b; --text-muted:#64748b;
      --border:#e2e8f0; --success:#10b981; --success-light:#ecfdf5;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'PingFang TC',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);min-height:100vh;color:var(--text);padding-bottom:96px}
    .hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .back{background:none;border:none;font-size:26px;color:var(--text-muted);cursor:pointer;padding:0}
    .hdr-title{font-size:18px;font-weight:700;flex:1}
    .hdr-sub{font-size:14px;color:var(--text-muted)}
    .member-tabs{display:flex;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;padding:14px 16px}
    /* 手機版：nav.js 自己的精簡頭部已經有成員切換+列印功能，
       這裡桌面樣式的分頁籤列會跟它疊在一起，手機版直接隱藏 */
    @media (max-width:767px){
      #member-tabs, #export-settings-row { display:none!important; }
    }
    .member-tab{padding:8px 18px;border-radius:99px;background:#f1f5f9;cursor:pointer;white-space:nowrap;color:var(--text-muted);font-weight:600;font-size:14px;transition:.2s}
    .member-tab.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px -2px rgba(99,102,241,.5)}
    /* 選項頁保持窄版（手機友好），預覽頁用獨立 class */
    .wrap{padding:20px;max-width:560px;margin:0 auto}
    @media (min-width:900px){ .wrap{max-width:920px} }
    .wrap-preview{padding:20px;max-width:1240px;margin:0 auto}
    .sec-lbl{font-size:14px;font-weight:700;color:var(--text-muted);margin-bottom:12px;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between}
    #BLKLIST{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:480px){ #BLKLIST{grid-template-columns:1fr 1fr} }
    .blk{display:flex;align-items:center;gap:12px;padding:13px 16px;border:2px solid transparent;border-radius:18px;cursor:pointer;background:var(--surface);margin-bottom:0;box-shadow:0 4px 6px -1px rgba(0,0,0,.06);-webkit-tap-highlight-color:rgba(0,0,0,0);transition:.15s}
    .blk.on{border-color:var(--primary);background:var(--primary-light)}
    .chk{width:24px;height:24px;border-radius:8px;border:1.5px solid #d8dce6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;background:#fff;transition:.15s}
    .blk.on .chk{background:var(--primary);border-color:var(--primary)}
    .blk-lbl{font-size:17px;font-weight:700;color:var(--text)}
    .blk.on .blk-lbl{color:var(--primary-dark)}
    .blk-desc{font-size:13px;color:var(--text-muted);margin-top:2px}
    .fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
    .fmt{padding:14px 14px;border:2px solid transparent;border-radius:16px;cursor:pointer;background:var(--surface);box-shadow:0 4px 6px -1px rgba(0,0,0,.06);-webkit-tap-highlight-color:rgba(0,0,0,0);transition:.15s}
    .fmt.spng{border-color:var(--primary);background:var(--primary-light)}
    .fmt.spdf{border-color:var(--accent-pdf);background:var(--accent-pdf-light)}
    .fmt-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
    .fmt.spng .fmt-title{color:var(--primary-dark)}
    .fmt.spdf .fmt-title{color:var(--accent-pdf)}
    .fmt-desc{font-size:13px;color:var(--text-muted);line-height:1.5}
    .fmt-section-hdr{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--text);margin-top:10px;padding:8px 6px;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0);border-radius:10px}
    .fmt-section-hdr:hover{background:#eef1f6}
    .fmt-hdr-sel{font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--primary-light);color:var(--primary-dark);white-space:nowrap}
    .fmt-section-hdr.is-pdf .fmt-hdr-sel{background:var(--accent-pdf-light);color:var(--accent-pdf)}
    .fmt-chevron{font-size:14px;color:#bbb;transition:transform .15s;width:16px;text-align:center}
    .pbtn{width:100%;padding:16px;color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:block;box-shadow:0 10px 15px -5px rgba(99,102,241,.4);-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .pbtn:disabled{background:#cbd2e0!important;box-shadow:none;cursor:default}
    .sbtn{padding:16px;background:#eef1f6;color:var(--text-muted);border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;flex:1;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    .brow{display:flex;gap:10px;position:sticky;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:90;box-shadow:0 -4px 12px rgba(0,0,0,.04)}
    .brow > .pbtn, .brow > .sbtn{margin-top:0}
    .brow-inner{max-width:560px;margin:0 auto;display:flex;gap:10px;width:100%}
    .pg{display:none}
    .pg.act{display:block}
    #P_PREV{overflow-x:auto}
    .pv-note{padding:12px 14px;background:var(--primary-light);border-radius:14px;margin-bottom:14px;font-size:14px;color:var(--primary-dark);line-height:1.7}
    .pv-blk{border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05)}
    .pv-hdr{padding:8px 12px;background:#f7f7f5;border-bottom:1px solid #f0f0f0;font-size:15px;font-weight:600;color:#444}
    .prog-wrap{background:#eef1f6;border-radius:99px;height:10px;overflow:hidden;max-width:280px;margin:0 auto 8px}
    .prog-bar{height:100%;border-radius:99px;transition:width .2s}
    .flist{padding:14px 16px;background:#f8fafc;border-radius:16px;margin-bottom:24px;border:1px solid var(--border)}
    .fitem{font-size:15px;color:var(--text);display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .spin{display:inline-block;width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
    @keyframes sp{to{transform:rotate(360deg)}}
    .ex-modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:400;align-items:center;justify-content:center;padding:20px}
    .ex-modal-overlay.active{display:flex}
    .ex-modal-card{background:var(--surface);border-radius:24px;padding:26px;width:100%;max-width:420px;box-shadow:0 20px 40px -8px rgba(0,0,0,.25)}
    .ex-modal-title{font-size:19px;font-weight:700;color:var(--text);margin-bottom:4px}
    .ex-modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:18px}
    .ex-modal-field{margin-bottom:14px}
    .ex-modal-field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
    .ex-modal-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:14px;font-size:16px;font-family:inherit;outline:none;box-sizing:border-box;transition:.15s}
    .ex-modal-input:focus{border-color:var(--primary)}
    .ex-modal-input::placeholder{color:#c3c7ce}
    .ex-modal-btns{display:flex;gap:10px;margin-top:20px}
    .ex-modal-btn{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:inherit}
    .ex-modal-btn.cancel{background:#eef1f6;color:var(--text-muted)}
    .ex-modal-btn.save{background:var(--primary);color:#fff;box-shadow:0 6px 14px -4px rgba(99,102,241,.5)}
  </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="nav.js"></script>
</head>
<body>
<div style="display:none" id="HDR_SUB"></div>
<button style="display:none" id="B_BACK"></button>
<div style="display:none" id="HDR_TITLE"></div>
<div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface); border-bottom:1px solid var(--border);">
  <div class="member-tabs" id="member-tabs" style="border-bottom:none; flex:1;"></div>
  <div id="export-settings-row" style="display:flex; gap:8px; padding:0 16px;">
    <button onclick="openNicknameModal()" style="font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:99px;background:var(--primary-light);color:var(--primary-dark);cursor:pointer;font-family:inherit">✏️ 稱呼設定</button>
    <button onclick="openAgentInfoModal()" style="font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:99px;background:var(--primary-light);color:var(--primary-dark);cursor:pointer;font-family:inherit">⚙️ 業務員資訊</button>
  </div>
</div>

<div class="pg act" id="P_SEL">
  <div class="wrap">
    <div class="sec-lbl">選擇匯出區塊
      <button id="B_TOGALL" style="font-size:13px;font-weight:600;padding:5px 14px;border:none;border-radius:99px;background:#eef1f6;color:var(--text-muted);cursor:pointer;font-family:inherit">全部取消</button>
    </div>
    <div id="BLKLIST"></div>
    <div class="fmt-section-hdr" id="FMT_HDR_png" onclick="toggleFmtSection('png')">
      <span style="flex:1">🖼️ 圖檔（PNG）</span>
      <span class="fmt-hdr-sel" id="FMT_SEL_png"></span>
      <span class="fmt-chevron" id="FMT_CHEV_png">▾</span>
    </div>
    <div class="fmt-grid" id="FMT_PNG"></div>
    <div class="fmt-section-hdr is-pdf" id="FMT_HDR_pdf" onclick="toggleFmtSection('pdf')">
      <span style="flex:1">📄 文件（PDF）</span>
      <span class="fmt-hdr-sel" id="FMT_SEL_pdf"></span>
      <span class="fmt-chevron" id="FMT_CHEV_pdf">▾</span>
    </div>
    <div class="fmt-grid" id="FMT_PDF"></div>
    <div class="brow">
      <div class="brow-inner">
        <button class="pbtn" id="B_PREV" style="background:var(--primary)">預覽區塊</button>
      </div>
    </div>
  </div>
</div>

<div class="pg" id="P_PREV">
  <div class="wrap-preview">
    <div class="pv-note" id="PV_NOTE"></div>
    <div id="PV_SCALE_OUTER" style="overflow:hidden;margin:0 auto">
      <div id="PV_BLOCKS" style="width:2400px;transform-origin:top left"></div>
    </div>
    <div style="padding:8px 12px;background:#f7f7f5;border-radius:8px;font-size:14px;color:#aaa;margin-bottom:12px">
      💡 <span id="WM_HINT"></span>
    </div>
    <div class="brow">
      <div class="brow-inner">
        <button class="sbtn" id="B_BACK2">返回修改</button>
        <button class="pbtn" id="B_EXPORT" style="background:var(--primary);flex:2">下載圖片</button>
      </div>
    </div>
  </div>
</div>

<div class="pg" id="P_DOING">
  <div class="wrap" style="text-align:center;padding-top:40px">
    <div style="font-size:72px;margin-bottom:16px" id="EX_ICON">🖼️</div>
    <div style="font-weight:500;font-size:18px;margin-bottom:8px" id="EX_MSG">正在產生圖片…</div>
    <div style="font-size:14px;color:#999;margin-bottom:24px" id="EX_SUB"></div>
    <div class="prog-wrap"><div class="prog-bar" id="PROG" style="width:0%;background:var(--primary)"></div></div>
    <div style="font-size:19px;font-weight:500;margin-top:8px;color:var(--primary)" id="PROG_PCT">0%</div>
  </div>
</div>

<div class="pg" id="P_DONE">
  <div class="wrap" style="text-align:center;padding-top:32px">
    <div style="font-size:96px;margin-bottom:16px">✅</div>
    <div style="font-weight:500;font-size:18px;margin-bottom:8px">匯出完成！</div>
    <div style="font-size:14px;color:#999;line-height:1.8;margin-bottom:20px" id="DONE_MSG"></div>
    <div class="flist" id="DONE_FILES"></div>
    <div class="brow">
      <div class="brow-inner">
        <button class="sbtn" id="B_DONE_PREV" style="flex:1">回前一頁</button>
        <button class="pbtn" id="B_FINISH" style="background:var(--primary);flex:1;width:auto">回家庭首頁</button>
      </div>
    </div>
  </div>
</div>

// 不影響瀏覽器 zoom、不影響旁邊 nav.js 側欄與按鈕的大小。
// 下載的圖片永遠是未縮放的原始 2400px（乘以 html2canvas scale:2），
// 這裡純粹是「畫面上看起來多大」，不影響下載品質。
function fitPreviewScale(){
  var outer = document.getElementById("PV_SCALE_OUTER");
  var inner = document.getElementById("PV_BLOCKS");
  if(!outer || !inner || !inner.offsetParent) return; // 不在畫面上就不用算
  var available = outer.parentElement.clientWidth;
  if(!available) return;
  var scale = Math.min(1, available/2400);
  inner.style.transform = "scale("+scale+")";
  outer.style.width  = Math.round(2400*scale)+"px";
  outer.style.height = Math.round(inner.scrollHeight*scale)+"px";
}

// ── 現金流時間軸輔助函式 ─────────────────────────────────
function fmtAmtEx(amt){if(amt>=10000)return(amt/10000).toFixed(1)+"萬";return amt.toLocaleString();}
function isMonthlyEx(k){return k==="5";}
function isYearlyDetailEx(k){return k==="6";}
function getEndYearAt100Ex(memberId,policy,profileBirthDate){
  var bd=profileBirthDate||(familyData&&familyData.members&&(familyData.members.find(function(m){return m.personId===memberId;})||{}).birthDate);
  if(bd){var by=parseInt(bd.slice(0,4));if(!isNaN(by))return by+100;}
  if(policy&&policy.startDate){var sy=parseInt(policy.startDate.slice(0,4));if(!isNaN(sy))return sy+80;}
  return new Date().getFullYear()+50;
}
function calcPolicyFlowsEx(p,s,memberId,years,profileBirthDate){
  var sw=p.startDate?parseInt(p.startDate.slice(0,4)):null;
  var pw=p.payEndDate?parseInt(p.payEndDate.slice(0,4)):null;
  var cw=p.covEndDate?parseInt(p.covEndDate.slice(0,4)):getEndYearAt100Ex(memberId,p,profileBirthDate);
  if(!sw)return{};
  var tk=s.type||"1",dfr=parseInt(s.duringFreqYr)||2,dsy=parseInt(s.duringStartYr)||1;
  var da=parseFloat(s.duringAmt)||0,afr=parseInt(s.afterFreqYr)||1;
  var asy=parseInt(s.afterStartYr!==undefined?s.afterStartYr:0),aa=parseFloat(s.afterAmt)||0;
  var mo=isMonthlyEx(tk),yrd=isYearlyDetailEx(tk);
  var ym={};
  if(yrd&&s.yearlyAmts){s.yearlyAmts.forEach(function(r){var y=parseInt(r.yr),a=parseFloat(r.amt);if(!isNaN(y)&&!isNaN(a)&&a>0)ym[y]=(ym[y]||0)+a;});}
  var er=(p.currency&&p.currency!=="TWD"&&parseFloat(s.exchangeRate))?parseFloat(s.exchangeRate):1;
  var flows={};
  years.forEach(function(yr){
    if(yr>cw)return;
    var fl=0,id=pw?(yr>=sw&&yr<pw):false,ia=pw?yr>=pw:yr>=sw;
    if(yrd){fl=ym[yr]||0;}
    else if(tk==="1"){if(pw&&yr===pw)fl=aa;}
    else if(tk==="2"){
      if(id&&da>0){var ft=sw+dsy-1,e=yr-ft;if(yr>=ft&&e%dfr===0)fl+=da;}
      if(pw&&yr===pw)fl+=aa;
    }else if(tk==="3"){if(ia&&aa>0){var b=(pw||sw)+asy,e2=yr-b;if(yr>=b&&e2%afr===0)fl=aa;}}
    else if(tk==="4"){
      if(id&&da>0){var ft2=sw+dsy-1,e3=yr-ft2;if(yr>=ft2&&e3%dfr===0)fl+=da;}
      if(ia&&aa>0){var b2=(pw||sw)+asy,e4=yr-b2;if(yr>=b2&&e4%afr===0)fl+=aa;}
    }else if(mo){if(ia&&aa>0)fl=aa*12;}
    if(fl>0)flows[yr]=Math.round(fl*er);
  });
  return flows;
}
// 供 PDF 分頁使用：跟 renderSavingsTimeline 共用同一套資料計算，
// 但把「標題列」「每位被保險人一組」「合計列」拆成可以個別截圖、
// 個別判斷是否需要換頁的獨立小表格，避免整塊硬塞進單一 A4 頁面
// 導致被迫縮小到看不清楚。用同一份 colgroup 欄寬設定，確保各自
// 分開截圖後，欄位仍然對得齊。

    if(!sp.length)return;
    var pRows=[];
    sp.forEach(function(p){
      var s2=(p3.savings||[]).find(function(sv){return sv.policyId===p.id;})||{type:"1"};
      var flows=calcPolicyFlowsEx(p,s2,m.personId,years,p3.profile&&p3.profile.birthDate);
      Object.keys(flows).forEach(function(y2){totalFlows[y2]=(totalFlows[y2]||0)+flows[y2];});
      pRows.push({policyNo:p.policyNo||p.id,itemName:p.itemName||"",category:p.category||"",flows:flows});
    });

      y3+'<br><span style="font-size:18px;color:#6b7280;font-weight:600">'+(y3-1911)+'年</span>'+
    '</th>';
  }).join("");

  var headerBandHtml =
    '<div style="background:#fff;border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,.04);box-shadow:0 4px 14px -4px rgba(0,0,0,.08)">'+
      '<div style="padding:19px 22px;background:linear-gradient(135deg,#EEF2FF,#F5F3FF);display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
        '<span style="font-size:24px;font-weight:800;color:#4338ca">📈 未來現金流時間軸</span>'+
        '<span style="font-size:18px;color:#7c7fa0;font-weight:700;background:#fff;padding:5px 14px;border-radius:99px">'+startYr+' － '+endYr+' 年・'+groups.length+' 位被保險人</span>'+
      '</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:19px;table-layout:fixed">'+colgroupHtml+
      '<thead><tr><th style="background:#f7f8fa;padding:12px 17px;text-align:left;border-bottom:2px solid #e2e5ea;border-right:2px solid #e2e5ea;font-size:17px;font-weight:800;color:#6b7280">被保險人/保單</th>'+yh+'</tr></thead>'+
      '</table></div>';

  function buildGroupChunkHtml(g){
    var pay=g.policies.filter(function(pr){return Object.keys(pr.flows).length===0;}).length;
    var nr='<tr><td colspan="'+(years.length+1)+'" style="padding:14px 19px;font-size:23px;font-weight:800;color:#374151">'+
      '👤 '+g.memberName+'<span style="color:#6b7280;font-weight:700;margin-left:11px;font-size:17px">'+g.policies.length+' 張保單</span>'+
      (pay?'<span style="color:#B07000;font-size:17px;margin-left:8px;font-weight:700">（含 '+pay+' 張繳費中）</span>':'')+
    '</td></tr>';
    var pr2=g.policies.map(function(pr){

        return'<td style="border-left:1px solid #f5f6f8;padding:6px 7px"><div style="height:36px;line-height:36px;border-radius:6px;background:'+PILL_GRAD+';text-align:center;white-space:nowrap"><span style="font-size:19px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums">'+fmtAmtEx(amt)+'</span></div></td>';
      }).join("");
      var fc='<td style="padding:11px 7px 11px 17px;border-right:2px solid #e2e5ea">'+
        '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+

      return'<tr>'+fc+cells+'</tr>';
    }).join("");
    var mf={};g.policies.forEach(function(pr){Object.keys(pr.flows).forEach(function(y5){mf[y5]=(mf[y5]||0)+pr.flows[y5];});});

function renderSavingsTimeline(pdm3,fData,startYr,endYr){
  var years=[];for(var y=startYr;y<=endYr;y++)years.push(y);
  var groups=[],totalFlows={};
  (fData.members||[]).filter(function(m){return m.role!=="beneficiary_only";}).forEach(function(m){
    var p3=pdm3[m.personId];if(!p3)return;
    var sp=(p3.policies||[]).filter(function(p){return["儲蓄險","年金險","儲蓄年金","投資型保險"].indexOf(p.category)>=0;});
    if(!sp.length)return;
    var pRows=[];
    sp.forEach(function(p){
      var s2=(p3.savings||[]).find(function(sv){return sv.policyId===p.id;})||{type:"1"};
      var flows=calcPolicyFlowsEx(p,s2,m.personId,years,p3.profile&&p3.profile.birthDate);
      Object.keys(flows).forEach(function(y2){totalFlows[y2]=(totalFlows[y2]||0)+flows[y2];});
      pRows.push({policyNo:p.policyNo||p.id,itemName:p.itemName||"",category:p.category||"",flows:flows});
    });
    if(pRows.length)groups.push({memberName:m.name,policies:pRows});
  });
  if(!groups.length)return'<div style="padding:30px;text-align:center;color:#9ca3af;font-size:14px">尚無儲蓄保單設定領回資料</div>';

  // 儲蓄/年金/投資型保險統一收斂在同一組靛紫色系裡（不再依類別各自上色），
  // 跟家庭責任/保單明細一覽表用的靛紫主題呼應
  var TAG_BG="#e0e7ff", TAG_CO="#3730a3", PILL_GRAD=pearlGradientEx("#4338ca");

// ── Summary 輔助函式（移植自 summary.html）──────────────
// 保額單位換算成「萬元」，同 summary.html 的 convertToWan
// 判斷保單目前是否仍在保障中：只有「停效」才算失去保障，
// 其餘狀態（有效/繳費期滿/自動墊繳/展期/緩繳/減額繳清）都代表保單
// 仍在繼續提供保障，都應該算進保障覆蓋率計算裡。
function isPolicyActiveEx(p) {
  return p.status !== "停效";
}

function convertToWanEx(amount, unit) {
  var n = parseFloat(amount);
  if (isNaN(n)) return null;
  var u = unit || "萬元";
  if (u === "萬元") return n;
  if (u === "元") return n / 10000;
  return null;
}

// 留愛金額：只採用使用者在保單資料裡實際輸入的 deathBenefit（單位換算成萬元），
// 不再用保額(insuredAmount)自動頂替。保額頂替會把重疾/意外/醫療等「理賠給
// 被保險人本人」性質的保額誤顯示成「留給受益人」的留愛金額，資訊錯誤且
// 容易誤導保戶。彙總小工具與明細表格都呼叫這個函式，確保兩處數字一致。
function getDeathBenefitAmt(p) {
  if (p.deathBenefit !== undefined && p.deathBenefit !== null && p.deathBenefit !== "") {
    var w = convertToWanEx(p.deathBenefit, p.deathBenefitUnit || '萬元');
    return w !== null ? w : 0;
  }
  return 0; // 沒填就是沒有，交由畫面顯示「—」，提醒業務員回頭跟保戶確認
}

function sumCovEx(keys, policies, coverage) {
  var total = 0;
  policies.forEach(p => {
    keys.forEach(k => {
      if (p.coverage && typeof p.coverage[k] === "number") {
        total += p.coverage[k];
      }
    });
  });
  // 相容舊格式
  if (total === 0 && coverage) {
      policies.forEach(p => {
          keys.forEach(k => {
              if (coverage[p.id + "_" + k] && typeof coverage[p.id + "_" + k] === "number") {
                  total += coverage[p.id + "_" + k];
              }
          });
      });
  }
  return total;
}

// 核心運算引擎：精準抓取資料庫數字
function getItemCurrentEx(key, policies, coverage, covOverrides) {
  var map = GAP_KEY_MAP_EX[key];
  if(!map) return 0;

  var manualKey = currentPersonId+"_"+key;
  if(covOverrides && covOverrides[manualKey] !== undefined) {
    return covOverrides[manualKey] ? 1 : 0;
  }

  if(["waiver"].includes(key)) {
    if(key==="waiver") return sumCovEx(["ltc_waiver"], policies, coverage) > 0 ? 1 : 0;
    return 0;
  }

  // 💡 修正：將投資型與儲蓄險併入金額計算邏輯；重大/特傷/重疾、意外險
  // 這類保單通常也附帶身故(留愛)給付，family(家庭責任)區塊需要納入這筆
  // 金額，加總才會等於保戶真正的總身故保障，而不是只算壽險保障類。
  if (["life_permanent", "life_term", "investment", "savings", "ci_death_major", "ci_death_specific", "ci_death_catastrophic", "acc_death_amt"].includes(key)) {
      let amt = 0;
      var wantTerm = (key === "life_term");
      var catMap = {
          "life_permanent": ["壽險保障"],
          "life_term": ["壽險保障"],
          "investment": ["投資型保險"],
          "savings": ["儲蓄險", "年金險"],
          "ci_death_major":        ["重大疾病險"],
          "ci_death_specific":     ["特定傷病險"],
          "ci_death_catastrophic": ["重大傷病險"],
          "acc_death_amt": ["意外險"]
      };
      var matchedPolicies = policies.filter(p => catMap[key].includes(p.category));
      
      matchedPolicies.forEach(p => {
         // 只有壽險需要區分定期或終身，重疾/特傷/重傷/意外身故直接全額加總
         if (key === "life_permanent" || key === "life_term") {
             var pt = (p.coverage && p.coverage.protect_period_type) ? p.coverage.protect_period_type : "終身";
             var isPolTerm = (pt !== "終身");
             if (isPolTerm !== wantTerm) return;
         }
         
         // 只採用使用者實際填寫的留愛金額(deathBenefit)，不再用保額(insuredAmount)頂替
         amt += getDeathBenefitAmt(p);
      });
      return amt;
  }

  if (["ci_major","ci_catastrophic","ci_specific"].includes(key)) {
      var matchedPolicies = policies.filter(p => map.cats.includes(p.category));
      var amt = sumCovEx(map.keys, matchedPolicies, coverage);
      if (amt === 0) {
        matchedPolicies.forEach(p => {
           var w = convertToWanEx(p.insuredAmount, p.insuredAmountUnit);
           if (w !== null) amt += w;
        });
      }
      // 同樣移除「找不到金額就硬回傳 1」的假數字保底邏輯
      return amt;
  }

  var NO_FALLBACK_KEYS = [
    "acc_medical","acc_hosp","hosp_real_room","hosp_daily",
    "surgery","cancer_hosp","cancer_surgery","ltc_disable","ltc_support",
    "ltc_care","cancer_hospice","cancer_death"
  ];
  if (NO_FALLBACK_KEYS.indexOf(key) !== -1) {
    return sumCovEx(map.keys, policies, coverage);
  }

  var amt = sumCovEx(map.keys, policies, coverage);

  var matchedPolicies = policies.filter(p => map.cats.includes(p.category));
  if (amt === 0 && matchedPolicies.length > 0) {
      matchedPolicies.forEach(p => {
          var w = convertToWanEx(p.insuredAmount, p.insuredAmountUnit);
          if (w !== null) amt += w;
      });
      // 移除舊有的「找不到金額就硬回傳 1」保底邏輯——那個「1」不是任何
      // 真實資料，只是為了讓狀態顯示「已規劃」而硬湊的假數字，容易誤導
      // 保戶跟業務員以為有填某個具體金額。現在老實回傳 0，缺口就顯示缺口。
  }

  return amt;
}

function getItemStatusEx(key, policies, coverage, targets, covOverrides) {
  var item = GAP_GROUPS_EX.flatMap(g=>g.items).find(i=>i.key===key);
  var current = getItemCurrentEx(key, policies, coverage, covOverrides);
  var target  = targets[key];
  var isBool  = item?.isBool;
  if(!current) return {status:"gap", current:0, target, pct:0};
  if(!target||isBool) return {status:"ok", current, target:null, pct:1};
  if(current>=target) return {status:"ok", current, target, pct:1};
  return {status:"insufficient", current, target, pct:current/target};
}

function getInsAge(pid) {
  var p=personDataMap[pid];
  if(!p) return null;
  var b=new Date(p.profile.birthDate), a=new Date(p.profile.analysisDate||new Date());
  var y=a.getFullYear()-b.getFullYear();
  var mo=(a-new Date(b.getFullYear()+y,b.getMonth(),b.getDate()))/(1000*60*60*24*30.4375);
  if(mo>=6)y++;
  return y;
}

// 西元日期字串轉民國日期顯示文字（例如 2004-04-19 → 93年4月19日）
function toRocDateStr(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr);
  if (isNaN(d)) return null;
  return (d.getFullYear()-1911)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}

// 計算「某個日期當下」被保險人幾歲（不是現在幾歲，是保單生效日當時幾歲，
// 也就是投保年齡），沒有出生日期資料就回傳 null
function getAgeAtDate(birthDateStr, atDateStr) {
  if (!birthDateStr || !atDateStr) return null;
  var b = new Date(birthDateStr), a = new Date(atDateStr);
  if (isNaN(b) || isNaN(a)) return null;
  var y = a.getFullYear() - b.getFullYear();
  var mo = (a - new Date(b.getFullYear()+y, b.getMonth(), b.getDate())) / (1000*60*60*24*30.4375);
  if (mo >= 6) y++;
  return y >= 0 ? y : null;
}

// 選好照片後：先在瀏覽器端縮圖／壓縮（最長邊 800px），
// 存進 _pendingAgentPhotoDataUrl，按「儲存」才會真的上傳，
// 避免使用者選了照片又按取消，卻已經傳到 Drive 去
function onAgentPhotoSelected(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxSide = 800;
      var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      _pendingAgentPhotoDataUrl = dataUrl;
      var pv = document.getElementById("agent-modal-photo-preview");
      pv.src = dataUrl; pv.style.display = "block";
      document.getElementById("agent-modal-photo-status").textContent = "已選擇新照片，按「儲存」才會真正上傳並替換封面照片";
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 判斷保單是「終身」還是「定期」：改讀 coverage.html 裡的
// protect_period_type（歲/年/終身），不再用容易跟繳費期滿日混淆的
// 保單保障截止日。isTerm 傳 true 找定期的、false 找終身的。
function lifeAmountEx(pols, cats, isTerm) {
  var amt = 0;
  pols.forEach(function(p){
    if (cats.indexOf(p.category) === -1) return;
    // 💡 修正：防呆處理，如果欄位是空字串，強制預設為 "終身"
    var pt = (p.coverage && p.coverage.protect_period_type) ? p.coverage.protect_period_type : "終身";
    var isPolTerm = (pt !== "終身");
    if (isTerm !== isPolTerm) return;
    
    // 只加總使用者實際填寫的留愛金額(deathBenefit)，不再用保額(insuredAmount)頂替，
    // 避免把重疾/意外等非壽險身故給付的保額誤算進終身壽險/重大終身總額。
    amt += getDeathBenefitAmt(p);
  });
  return amt;
}
// 定期保單的保障期間顯示文字（保障至X歲／保障X年）
function lifeRemainYearsEx(pols, cats) {
  var texts = [];
  pols.forEach(function(p){
    if (cats.indexOf(p.category) === -1) return;
    var pt = (p.coverage && p.coverage.protect_period_type) || "終身";
    if (pt === "終身") return;
    var val = p.coverage && p.coverage.protect_period;
    var text = pt === "歲" ? "保障至"+(val||"—")+"歲" : "保障"+(val||"—")+"年";
    if (texts.indexOf(text) === -1) texts.push(text);
  });
  return texts.length ? texts.join("／") : null;
}

// ── Phase 0：共用視覺元件（大數字 Stat 卡片）──────────────
// 設計原則（跟使用者確認過，並依實測回饋修正兩次）：
// - 底色維持各分類原本的語意色（辨識度優先）。
// - 【核心原則】每個保障項目都要獨立成一行，不能合併/隱藏——
//   這份報告的核心用途是業務員跟保戶逐項討論保障缺口，「每一項都
//   能被單獨指出來」比「版面精簡」更重要。
// - 有規劃的項目：大數字、彩色，一眼看出金額。
// - 沒規劃的項目：不用死板的「—」，改用淡灰色圓角「缺口」標籤，
//   用現代 App 常見的狀態標籤語言，取代 Excel 式的破折號。
// 產生分組標題旁的「定期/終身」標示：不同分類在 coverage.html 裡，
// 各自有自己的保障期間欄位（意外險=acc_age、住院醫療=hosp_age、
// 日額型住院=daily_period_type+daily_period、癌症醫療=can_period_type+
// can_period），這裡對應讀取正確的欄位，不是保單本身的保障截止日。
// 定額手術、失能長照目前在 coverage.html 沒有保障期間欄位，回傳空字串。
var TERM_BADGE_FIELD_MAP = {
  "意外險":              { ageKey:"acc_age" },
  "住院醫療 (實支實付)": { ageKey:"hosp_age" },
  "日額型住院":          { typeKey:"daily_period_type", valKey:"daily_period" },
  "定額手術":            { typeKey:"surg_period_type", valKey:"surg_period" },
  "癌症醫療":            { typeKey:"can_period_type", valKey:"can_period" },
  "失能長照":            { typeKey:"ltc_period_type", valKey:"ltc_period" },
};
function getTermBadge(g, policies) {
  var conf = TERM_BADGE_FIELD_MAP[g.label];
  if (!conf || !g.cats || !g.cats.length) return "";
  var matched = policies.filter(function(p){ return g.cats.indexOf(p.category) !== -1; });
  if (!matched.length) return "";

  var labels = [];
  matched.forEach(function(p){
    var cv = p.coverage || {};
    var text;
    if (conf.ageKey) {
      var v = cv[conf.ageKey];
      text = (!v || v === "終身") ? "終身" : "保障至"+v+"歲";
    } else {
      var t = cv[conf.typeKey] || "終身";
      if (t === "終身") text = "終身";
      else if (t === "歲") text = "保障至"+(cv[conf.valKey]||"—")+"歲";
      else text = "保障"+(cv[conf.valKey]||"—")+"年";
    }
    if (labels.indexOf(text) === -1) labels.push(text);
  });
  return labels.join("／");
}

// 通用珍珠光澤漸層：給一個十六進位色碼，自動算出「亮→本色→暗」三段
// 放射狀漸層，讓每個險種都能用自己的顏色套出跟圓餅圖一致的珍珠質感，
// 不用為 7 種顏色各自手刻一組漸層。
function pearlGradientEx(hex) {
  var h = hex.replace("#","");
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  function toHex(n){ n=Math.max(0,Math.min(255,Math.round(n))); var s=n.toString(16); return s.length<2?"0"+s:s; }
  var light = "#"+toHex(r+(255-r)*0.55)+toHex(g+(255-g)*0.55)+toHex(b+(255-b)*0.55);
  var dark  = "#"+toHex(r*0.65)+toHex(g*0.65)+toHex(b*0.65);
  return "radial-gradient(ellipse at 30% 20%,"+light+" 0%,"+hex+" 55%,"+dark+" 100%)";
}

function buildStatGroupCard(g, policies, cov3) {
  var itemsData = g.items.map(function(item){
    var total, isRange=false, minVal=0, maxVal=0, remainNote="";
    if (item.compute) {
      total = item.compute(policies);
      if (item.remain) {
        var ry = item.remain(policies);
        if (ry !== null) remainNote = ' ('+ry+')';
      }
    } else {
      var maxKey = item.keys && item.keys.find(function(k){ return k.endsWith('_max'); });
      var minKey = maxKey ? maxKey.replace('_max','_min') : null;
      minVal = minKey ? sumCovEx([minKey],policies,cov3) : 0;
      maxVal = maxKey ? sumCovEx([maxKey],policies,cov3) : 0;
      isRange = !!(maxKey && (minVal>0 || maxVal>0));
      total = isRange ? maxVal : sumCovEx(item.keys,policies,cov3);
    }
    return { label:item.label, unit:item.unit, total:total, isRange:isRange, minVal:minVal, maxVal:maxVal, remainNote:remainNote };
  });

  // 有規劃的排前面方便先看重點，沒規劃的排後面方便接續討論缺口，
  // 但兩者都是「獨立一行」，資料不刪減、不合併
  var filled = itemsData.filter(function(x){ return x.total>0; });
  var empty  = itemsData.filter(function(x){ return !(x.total>0); });
  var rowsHtml = filled.map(function(x){ return statRowHtml(x, g.color); }).join("")
               + empty.map(function(x){ return statRowHtml(x, g.color); }).join("");

  var termBadge = getTermBadge(g, policies);

  return '<div style="background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px -4px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.04);border-left:8px solid '+g.color+'">'+
    // 珍珠光澤標題底，跟圓餅圖已規劃/部分有的質感呼應
    '<div style="padding:18px 20px;background:'+pearlGradientEx(g.color)+'">'+
      '<div style="display:flex;align-items:center;gap:12px;min-width:0">'+
        // 放大前方的圖示 (icon)
        '<span style="font-size:36px;line-height:1;flex-shrink:0">'+(g.icon||'')+'</span>'+
        // 放大分類標題 (如：住院醫療)，改為白字搭配珍珠光澤底色
        '<span style="font-size:26px;font-weight:800;letter-spacing:.01em;color:#fff;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,.15)">'+g.label+'</span>'+
      '</div>'+
      // 放大終身/定期標籤
      (termBadge ? '<div style="margin-top:8px"><span style="font-size:20px;font-weight:800;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.92);color:'+g.color+';white-space:nowrap">'+termBadge+'</span></div>' : '')+
    '</div>'+
    rowsHtml +
  '</div>';
}
function statRowHtml(x, color) {
  var isFilled = x.total > 0;
  var valueHtml;
  if (!isFilled) {
    // 缺口標籤放大
    valueHtml = '<span style="font-size:22px;font-weight:800;color:#6b7280;background:#eef0f3;padding:4px 12px;border-radius:99px;white-space:nowrap">缺口</span>';
  } else if (x.isRange) {
    // 範圍型數字與單位放大
    valueHtml = '<span style="font-size:28px;font-weight:800;color:'+color+';font-variant-numeric:tabular-nums">'+
      x.minVal.toLocaleString()+'<span style="color:#9ca3af;margin:0 2px;font-weight:400">～</span>'+x.maxVal.toLocaleString()+
      '<span style="font-size:20px;color:#6b7280;font-weight:700;margin-left:4px">'+x.unit+'</span></span>';
  } else {
    // 單一數字與單位放大
    valueHtml = '<span style="font-size:30px;font-weight:800;color:'+color+';font-variant-numeric:tabular-nums">'+x.total.toLocaleString()+
      '<span style="font-size:20px;color:#6b7280;font-weight:700;margin-left:4px">'+x.unit+'</span></span>';
  }
  return '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;padding:'+(isFilled?'14px':'12px')+' 16px;border-top:1px solid #f2f2f4">'+
    // 左側保障項目名稱放大
    '<span style="font-size:24px;color:'+(isFilled?"#555":"#aaacb3")+';font-weight:700">'+x.label+(isFilled?x.remainNote:"")+'</span>'+
    valueHtml+
  '</div>';
}

// 依保單類別，讀取該類別在 coverage.html 裡對應的保障期間欄位，
// 產生「到期日」顯示文字（跟 getTermBadge 用的是同一批欄位，這裡是
// 單張保單版本，給保單與受益人整合表逐筆顯示用）
function getPolicyExpiryDisplay(p) {
  var cv = p.coverage || {};
  var cat = p.category;
  function fmt(typeVal, periodVal) {
    if (!typeVal || typeVal === "終身") return "終身";
    return typeVal === "歲" ? "至"+(periodVal||"—")+"歲" : (periodVal||"—")+"年期";
  }
  if (cat === "意外險") {
    var v = cv.acc_age;
    return (!v || v === "終身") ? "終身" : "至"+v+"歲";
  }
  if (cat === "醫療保障" || cat === "定額手術") {
    if (cv.hosp_age) return (cv.hosp_age === "終身") ? "終身" : "至"+cv.hosp_age+"歲";
    if (cv.daily_period_type) return fmt(cv.daily_period_type, cv.daily_period);
    if (cv.surg_period_type) return fmt(cv.surg_period_type, cv.surg_period);
    return "—";
  }
  if (cat === "癌症醫療") return fmt(cv.can_period_type, cv.can_period);
  if (cat === "失能長照") return fmt(cv.ltc_period_type, cv.ltc_period);
  if (["壽險保障","重大疾病險","重大傷病險","特定傷病險"].indexOf(cat) !== -1) return fmt(cv.protect_period_type, cv.protect_period);
  return "—"; // 儲蓄險/投資型/年金險目前沒有保障期間欄位
}

      else if(p.beneficiaryDeathText) { dStr = p.beneficiaryDeathText; }

        dStr = p.beneficiaryDeathCustom.map(function(c){ return c.customName || "指定家人"; }).join("、");
      }

      var lStr = "", mStr = "";
      if(p.beneficiaryLiveText) lStr = p.beneficiaryLiveText;
      else if(p.beneficiaryLiveType === "self")  lStr = "被保險人本人";
      else if(p.beneficiaryLiveType === "owner") lStr = ownerName + " (要保人)";
      else if(p.beneficiaryLiveType === "other") lStr = p.beneficiaryLiveOther || "指定其他";
      if(p.beneficiaryMaturityText) mStr = p.beneficiaryMaturityText;
      else if(p.beneficiaryMaturityType === "self")  mStr = "被保險人本人";
      else if(p.beneficiaryMaturityType === "owner") mStr = ownerName + " (要保人)";
      else if(p.beneficiaryMaturityType === "other") mStr = p.beneficiaryMaturityOther || "指定其他";
      if(p.category === "年金險" || p.category === "投資型保險" || rule.live === "鎖定本人") {
        lStr = "被保險人本人 🔒"; mStr = "";
      }
      var liveDisplay = "—";
      if(rule.live === "不適用" || p.category === "壽險保障") {
        liveDisplay = '<span style="color:#9ca3af">不適用</span>';
      } else if(rule.live === "鎖定本人" || p.category === "年金險" || p.category === "投資型保險") {
        liveDisplay = '<span style="font-size:22px;background:#f0f0f0;color:#888;padding:2px 6px;border-radius:6px">本人 🔒</span>';
      } else {
        var partsPD = [];
        if(lStr) partsPD.push('<div>生存金：'+lStr+'</div>');
        if(mStr) partsPD.push('<div>滿期金：'+mStr+'</div>');
        liveDisplay = partsPD.length ? partsPD.join("") : '<span style="color:#9ca3af">—</span>';
      }
      var dColor = !dStr ? "#9ca3af" : "#374151";
      dStr = dStr || "—";

      // 留愛金額只適用「留給受益人」性質的保障（壽險、意外、重大身故），
      // 醫療/癌症/手術/日額型住院/失能長照這類理賠對象是被保險人自己
      // （治療/生活costs)，不是留給受益人的錢，不該出現在這個欄位
      // 將投資型、儲蓄、年金險加入，讓它們也能在整合表中顯示留愛金額
      var LEGACY_CATS_PD = ["壽險保障","意外險","重大疾病險","重大傷病險","特定傷病險", "投資型保險", "儲蓄險", "年金險"];
      var dbText;
      if (LEGACY_CATS_PD.indexOf(p.category) === -1) {
        dbText = '—';
      } else {
        // 留愛金額只顯示使用者實際填寫的 deathBenefit，不再用保額(insuredAmount)頂替。
        var dbAmt = getDeathBenefitAmt(p);
        dbText = (dbAmt && dbAmt > 0) ? (dbAmt + ' 萬元') : '—';
      }
      var expiryText = getPolicyExpiryDisplay(p);

      return '<div style="display:grid;grid-template-columns:'+COLS_PD+';border-bottom:1px solid #f2f2f4">'+
        '<div style="'+tdStylePD+'">'+(isMR?'<span style="font-size:20px;color:#fff;background:#378ADD;padding:2px 7px;border-radius:99px;font-weight:700">主</span>':'<span style="font-size:20px;color:#888;background:#ebebeb;padding:2px 7px;border-radius:99px;font-weight:700">附</span>')+'</div>'+
        '<div style="'+tdStylePD+'"><span style="font-size:20px;padding:2px 7px;border-radius:99px;background:'+cc+'1A;color:'+cc+';font-weight:700;white-space:nowrap">'+(p.category||'—')+'</span></div>'+
        '<div style="'+tdStylePD+'font-weight:700;color:#1f2937">'+(p.itemName||'—')+'</div>'+
        '<div style="'+tdStylePD+'text-align:right;font-weight:800;color:#0C447C;font-variant-numeric:tabular-nums;white-space:nowrap">'+amtText+'</div>'+
        '<div style="'+tdStylePD+'text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums">'+premDisplayPD+'</div>'+
        '<div style="'+tdStylePD+'"><span style="font-size:20px;padding:2px 7px;border-radius:99px;background:'+(isPolicyActiveEx(p)?"#EAF3DE":"#f0f0f0")+';color:'+(isPolicyActiveEx(p)?"#27500A":"#888")+'">'+(p.status||"有效")+'</span></div>'+
        '<div style="'+tdStylePD+'font-size:24px;color:'+(expiryText==="終身"?"#374151":expiryText==="—"?"#9ca3af":"#B07000")+';font-weight:700;white-space:nowrap">'+expiryText+'</div>'+
        '<div style="'+tdStylePD+'text-align:right;font-weight:800;color:#B0466F;font-variant-numeric:tabular-nums;white-space:nowrap">'+dbText+'</div>'+
        '<div style="'+tdStylePD+'color:'+dColor+';line-height:1.4;font-size:24px">'+dStr+'</div>'+
        '<div style="'+tdStylePD+'line-height:1.4;font-size:24px">'+liveDisplay+'</div>'+
      '</div>';
    });

    var cardWrapOpen  = '<div style="break-inside:avoid;margin-bottom:20px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px -4px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.04);border-left:8px solid #6366f1">';
    var cardWrapClose = '</div>';
    var fullHtml = cardWrapOpen + cardHeaderHtml + colHeaderRow + rowsHtml.join("") + cardWrapClose;

    return {
      key: grp.key,
      cardHeaderHtml: cardWrapOpen + cardHeaderHtml + colHeaderRow, // 換頁時可以重複印一次，方便閱讀
      rowsHtml: rowsHtml,
      cardWrapClose: cardWrapClose,
      fullHtml: fullHtml
    };
  });

  var groupHtmls = groupPieces.map(function(gp){ return gp.fullHtml; });

  return { headerHtml: headerHtml, groupHtmls: groupHtmls, groupPieces: groupPieces };
}

function switchPerson(pid) {
  currentPersonId = pid;
  var p = personDataMap[pid];
  if (!p) {
    // 保底：優先用已載入的 personDataMap，沒有的話跟 onMemberChange
    // 一樣退回讀 sessionStorage 快取
    try { p = JSON.parse(sessionStorage.getItem("nbs_person_" + pid)); } catch (e) {}
  }
  if (p) {
    person = p;
    policies = person.policies || [];
    coverage = person.coverage || {};
    savings = person.savings || [];
    pName = (person.profile && person.profile.name) || "—";
    var ad = person.profile && person.profile.analysisDate;
    if (ad) {
      var d = new Date(ad);
      pDate = (d.getFullYear() - 1911) + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }
  }
  renderTabs();
  updatePrevBtn();
}

// ── SVG 箭頭列（html2canvas 相容，不使用 clip-path+calc）────────────────
function buildSvgArrows(phases) {
  var W=900, H=50, tip=20;
  var weights=[1,1.4,1], totalW=3.4;
  var widths=weights.map(function(w){return w/totalW*W;});
  // 加上 height="85px" 與 preserveAspectRatio="none"，強制鎖死高度以對齊右側
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="85px" preserveAspectRatio="none" viewBox="0 0 '+W+' '+H+'" style="display:block;margin-bottom:20px">';
  var x=0;
  phases.forEach(function(ph,i){
    var w=widths[i], x0=x, x1=x+w, pts;
    if(i===0){
      pts=x0+',0 '+(x1-tip)+',0 '+x1+','+(H/2)+' '+(x1-tip)+','+H+' '+x0+','+H;
    } else if(i===2){
      pts=x0+',0 '+x1+',0 '+x1+','+H+' '+x0+','+H+' '+(x0+tip)+','+(H/2);
    } else {
      pts=x0+',0 '+(x1-tip)+',0 '+x1+','+(H/2)+' '+(x1-tip)+','+H+' '+x0+','+H+' '+(x0+tip)+','+(H/2);
    }
    svg+='<polygon points="'+pts+'" fill="'+ph.color+'"/>';
    var tx=i===0?x0+(w-tip)/2:i===2?x0+tip+(w-tip)/2:x0+tip+(w-tip*2)/2;
    // 箭頭內文字放大為 28px
    svg+='<text x="'+tx+'" y="'+(H/2+8)+'" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">'+ph.label+'</text>';
    x+=w;
  });
  svg+='</svg>';
  return svg;
}

// ── 保障覆蓋率圓餅圖專用：20項合併為12大類 ──────────────────
// 只影響圓餅圖本身的視覺呈現，跟下方「評估確診/積極修復/康復療養/
// 家庭責任」四張明細卡片完全獨立（那四張卡片繼續用 GAP_GROUPS_EX
// 逐項顯示，不受影響），避免合併後看不出每個總數的組成來源。
var DONUT_CATEGORIES_EX = [
  { key:"life_permanent", label:"終身壽險",     color:"#1565C0", subKeys:["life_permanent"] },
  { key:"life_term",      label:"定期壽險",     color:"#1E88E5", subKeys:["life_term"] },
  { key:"investment",     label:"投資型保險",   color:"#7B1FA2", subKeys:["investment"] },
  { key:"savings",        label:"儲蓄險",       color:"#E91E8C", subKeys:["savings"] },
  { key:"acc",            label:"意外險",       color:"#F5A623", subKeys:["acc_death_amt","acc_medical","acc_hosp"] },
  { key:"ci",             label:"重疾/特傷/重大", color:"#C0392B", subKeys:["ci_major","ci_catastrophic","ci_specific","ci_death_major","ci_death_specific","ci_death_catastrophic"] },
  { key:"cancer",         label:"癌症險",       color:"#C62828", subKeys:["cancer","cancer_hosp","cancer_surgery","cancer_hospice","cancer_death"] },
  { key:"hosp_real_room", label:"住院醫療",     color:"#E65100", subKeys:["hosp_real_room"] },
  { key:"hosp_daily",     label:"住院日額",     color:"#F57C00", subKeys:["hosp_daily"] },
  { key:"surgery",        label:"手術醫療",     color:"#FF9800", subKeys:["surgery"] },
  { key:"ltc",            label:"失能/長照",    color:"#2E7D32", subKeys:["ltc_disable","ltc_support","ltc_care"] },
  { key:"waiver",         label:"豁免",         color:"#A5D6A7", subKeys:["waiver"] },
];

// 合併類別的三態判斷：全部子項目都有 → full(有)；全部都沒有 → none(沒有)；
// 部分子項目有部分沒有 → partial(部分有)。pct 用子項目「有的比例」畫扇形填色。
function getDonutCategoryStatusEx(cat, active, coverage, targets, covOverrides) {
  var n = cat.subKeys.length;
  var presentCount = 0;
  cat.subKeys.forEach(function(k){
    var current = getItemCurrentEx(k, active, coverage, covOverrides);
    if (current > 0) presentCount++;
  });
  var status = presentCount===0 ? "none" : (presentCount===n ? "full" : "partial");
  return { status: status, pct: n ? presentCount/n : 0 };
}

function buildDonutChartEx(active, coverage, targets, covOverrides) {
  var n = DONUT_CATEGORIES_EX.length;
  
  // 放大 SVG 畫布座標，容納超大字體
  var cx=500, cy=350, OR=230, IR=125;
  var gapA=0.03, sliceA=(Math.PI*2-n*gapA)/n;

  var angle=-Math.PI/2;
  var paths="";
  var labels=""; 

  function renderLegend(g) {
    // 標題放大至 36px
    var legendHtml = `<div style="font-size:36px;font-weight:800;color:${g.color};margin-bottom:20px;border-bottom:3px solid ${g.color}30;padding-bottom:12px">${g.label}</div>`;
    
    g.items.forEach(item => {
      var {status, pct, current, target} = getItemStatusEx(item.key, active, coverage, targets, covOverrides);
      var icon = status==="gap"?"❌":status==="insufficient"?"⚠️":"✅";
      var dotColor = status==="gap"?"#e0e0e0":item.color;

      var amtHtml = "";
      if (item.isBool) {
        amtHtml = current > 0 ? `<span style="color:#555;font-size:32px;font-weight:700">有</span>` : `<span style="color:#bbb;font-size:32px;font-weight:700">無</span>`;
      } else {
        if (current > 0 || target > 0) {
          var displayVal = current > 0 ? current.toLocaleString() : "0";
          if (target > 0) displayVal += ` / ${target.toLocaleString()}`;
          // 數字放大至 38px
          amtHtml = `<span style="color:${current>0?'#0C447C':'#888'};font-weight:800;font-size:38px;font-variant-numeric:tabular-nums">${displayVal}<span style="font-size:24px;color:#888;margin-left:6px;font-weight:600">${item.unit}</span></span>`;
        } else {
          amtHtml = `<span style="color:#bbb;font-size:32px;font-weight:700">0</span>`;
        }
      }

      // 項目文字放大至 30px
      legendHtml += `<div style="display:flex;align-items:center;gap:14px;font-size:30px;margin-bottom:16px">
        <div style="width:20px;height:20px;border-radius:6px;background:${dotColor};flex-shrink:0"></div>
        <span style="color:${status==="gap"?"#bbb":"#444"};font-weight:700;flex:1;white-space:nowrap">${item.label}</span>
        ${amtHtml}
        <span style="margin-left:8px;font-size:28px">${icon}</span>
      </div>`;
    });
    return legendHtml;
  }

  var legendFamily = renderLegend(GAP_GROUPS_EX[0]);
  var legendBefore = renderLegend(GAP_GROUPS_EX[1]);
  var legendDuring = renderLegend(GAP_GROUPS_EX[2]);
  var legendAfter  = renderLegend(GAP_GROUPS_EX[3]);

  // 顏色＝狀態，不再＝類別：跟上方圖例（已規劃=綠／部分有=橘／缺口=灰）
  // 完全對齊，類別的識別改由外圍拉線標籤文字負責，不再靠色相分辨。
  var STATUS_COLOR_EX = { full:"url(#donutGradFull)", partial:"url(#donutGradPartial)", none:"#E2E8F0" };
  var DONUT_DEFS = '<defs>' +
    '<radialGradient id="donutGradFull" cx="30%" cy="20%" r="75%">' +
      '<stop offset="0%" stop-color="#7dd3fc"/>' +
      '<stop offset="55%" stop-color="#0ea5e9"/>' +
      '<stop offset="100%" stop-color="#0369a1"/>' +
    '</radialGradient>' +
    '<radialGradient id="donutGradPartial" cx="30%" cy="20%" r="75%">' +
      '<stop offset="0%" stop-color="#fcd34d"/>' +
      '<stop offset="55%" stop-color="#f59e0b"/>' +
      '<stop offset="100%" stop-color="#b45309"/>' +
    '</radialGradient>' +
  '</defs>';

  var chartCats = DONUT_CATEGORIES_EX;
  chartCats.forEach(item => {
    var {status,pct} = getDonutCategoryStatusEx(item, active, coverage, targets, covOverrides);
    var sColor = STATUS_COLOR_EX[status];
    var start = angle+gapA/2;
    var end   = angle+gapA/2+sliceA;
    var filledEnd = start + sliceA*pct;
    var midA  = start + sliceA/2; 
    angle += sliceA+gapA;

    var px=(r,a)=>cx+r*Math.cos(a), py=(r,a)=>cy+r*Math.sin(a);
    var donut=(a1,a2,lg,r1,r2)=>`M${px(r1,a1)},${py(r1,a1)} A${r1},${r1} 0 ${lg} 1 ${px(r1,a2)},${py(r1,a2)} L${px(r2,a2)},${py(r2,a2)} A${r2},${r2} 0 ${lg} 0 ${px(r2,a1)},${py(r2,a1)} Z`;

    paths += `<path d="${donut(start,end,sliceA>Math.PI?1:0,OR,IR)}" fill="#E2E8F0"/>`;
    if(pct>0.01) paths += `<path d="${donut(start,filledEnd,sliceA*pct>Math.PI?1:0,OR,IR)}" fill="${sColor}"/>`;
    if(status==="partial" && pct<0.99) {
      var gapSize=sliceA*(1-pct);
      paths += `<path d="${donut(filledEnd,end,gapSize>Math.PI?1:0,OR,IR)}" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 5" opacity="0.45"/>`;
    }

    var isRight = Math.cos(midA) >= 0; 
    var x0 = px(OR, midA), y0 = py(OR, midA); 
    var x1 = px(OR + 26, midA), y1 = py(OR + 26, midA); 
    var x2 = x1 + (isRight ? 32 : -32), y2 = y1; 

    var textAnchor = isRight ? "start" : "end";
    var textX = x2 + (isRight ? 8 : -8);
    var textColor = status === "none" ? "#94a3b8" : "#555";
    var dotColor = status === "full" ? "#0ea5e9" : status === "partial" ? "#f59e0b" : "#94a3b8";
    var fw = status === "full" ? "600" : "500";
    var prefix = status === "partial" ? "◐ " : "";

    // 圓餅圖外圍文字放大至 26px
    labels += `
      <polyline points="${x0},${y0} ${x1},${y1} ${x2},${y2}" fill="none" stroke="${dotColor}60" stroke-width="2"/>
      <circle cx="${x0}" cy="${y0}" r="4" fill="${dotColor}"/>
      <text x="${textX}" y="${y2+8}" text-anchor="${textAnchor}" style="font-size:26px;fill:${textColor};font-weight:${fw};letter-spacing:0.03em">${prefix}${item.label}</text>
    `;
  });

  var okN  = chartCats.filter(item=>getDonutCategoryStatusEx(item,active,coverage,targets,covOverrides).status==="full").length;
  var gapN = chartCats.filter(item=>getDonutCategoryStatusEx(item,active,coverage,targets,covOverrides).status==="none").length;
  var insN = chartCats.filter(item=>getDonutCategoryStatusEx(item,active,coverage,targets,covOverrides).status==="partial").length;

  // 圓心文字放大，並改為回傳物件格式以供後續精準排版
  return {
    svg: `<svg viewBox="0 0 1000 700" style="width:100%; max-height:620px; height:auto; display:block; margin:0 auto;">
        ${DONUT_DEFS}
        ${paths}
        ${labels}
        <text x="${cx}" y="${cy-24}" text-anchor="middle" style="font-size:26px;fill:#0369a1">✅ 已規劃</text>
        <text x="${cx}" y="${cy+18}"  text-anchor="middle" style="font-size:64px;font-weight:bold;fill:#333">${okN}</text>
        <text x="${cx}" y="${cy+56}" text-anchor="middle" style="font-size:24px;fill:#E74C3C">❌ 缺口 ${gapN}</text>
        <text x="${cx}" y="${cy+88}" text-anchor="middle" style="font-size:24px;fill:#b45309">◐ 部分有 ${insN}</text>
      </svg>`,
    legendFamily: legendFamily,
    legendBefore: legendBefore,
    legendDuring: legendDuring,
    legendAfter: legendAfter
  };
}

// ── 缺口／不足分析 ────────────────────────────────────────
function buildGapAnalysisEx(active, coverage, targets, covOverrides) {
  var allItems = GAP_GROUPS_EX.flatMap(g=>g.items);
  var gaps = [], insufficients = [];
  allItems.forEach(item => {
    var s = getItemStatusEx(item.key, active, coverage, targets, covOverrides);
    if(s.status==="gap") gaps.push({item, ...s});
    if(s.status==="insufficient") insufficients.push({item, ...s});
  });

  var html = "";

  if(insufficients.length) {
    html += `<div style="font-size:17px;font-weight:500;color:#F5A623;margin-bottom:8px">⚠ 規劃不足</div>`;
    insufficients.forEach(({item,current,target,pct}) => {
      html += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:16px;color:#555">${item.label}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span style="font-size:17px;color:#555;font-weight:500">${current.toLocaleString()}${item.unit}</span>
            <span style="font-size:14px;color:#aaa">/ 目標 ${target?.toLocaleString()}${item.unit}</span>
          </div>
        </div>
        <div style="height:7px;background:#f0f0f0;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${Math.round(pct*100)}%;background:${item.color};border-radius:99px"></div>
        </div>
        <div style="font-size:14px;color:#E74C3C;margin-top:3px">尚不足 ${(target-current).toLocaleString()}${item.unit}（${Math.round(pct*100)}% 達成）</div>
      </div>`;
    });
  }

  if(gaps.length) {
    html += `<div style="font-size:17px;font-weight:500;color:#E74C3C;margin-bottom:8px;margin-top:${insufficients.length?12:0}px">❌ 尚未規劃</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`;
    gaps.forEach(({item}) => {
      html += `<span style="padding:3px 10px;background:#FCEBEB;border:1px solid #F0A8BF;border-radius:99px;font-size:14px;color:#791F1F">${item.label}</span>`;
    });
    html += `</div><div style="font-size:14px;color:#aaa">💡 可與保戶討論是否有需要規劃</div>`;
  }

  if(!insufficients.length && !gaps.length) {
    html += `<div style="font-size:17px;color:#27AE8F;text-align:center;padding:12px 0">🎉 所有已設目標項目均達標！</div>`;
  }

  return html;
}

// 註：原本這裡有一段「目標設定 Modal」「手動調整保障有無 Modal」的
// 複製程式碼（openTargetModal/saveTargets/openModal/toggleOverride/
// closeModal/handleModalOverlay），已於這次整理移除：
// - openModal/toggleOverride/closeModal/handleModalOverlay 依賴的
//   #edit-modal、#modal-types 容器在 export.html 畫面裡並不存在，
//   屬於無法觸及、觸及就會報錯的死碼。
// - openTargetModal/saveTargets 雖然本身可以動（自己動態建立彈窗），
//   但「設定目標保額」這個功能設計上屬於 summary.html（那邊行為完整、

// 依生日算星座（西元 yyyy-mm-dd 皆可）
function getZodiacSign(birthDateStr){
  if(!birthDateStr) return null;
  var d = new Date(birthDateStr);
  var m = d.getMonth()+1, day = d.getDate();
  // 用「起訖月/日」區間直接比對，避免月份交界處的日期被漏接
  var ranges = [
    {name:'水瓶座',emoji:'♒',from:[1,20],to:[2,18]},
    {name:'雙魚座',emoji:'♓',from:[2,19],to:[3,20]},
    {name:'牡羊座',emoji:'♈',from:[3,21],to:[4,19]},
    {name:'金牛座',emoji:'♉',from:[4,20],to:[5,20]},
    {name:'雙子座',emoji:'♊',from:[5,21],to:[6,21]},
    {name:'巨蟹座',emoji:'♋',from:[6,22],to:[7,22]},
    {name:'獅子座',emoji:'♌',from:[7,23],to:[8,22]},
    {name:'處女座',emoji:'♍',from:[8,23],to:[9,22]},
    {name:'天秤座',emoji:'♎',from:[9,23],to:[10,23]},
    {name:'天蠍座',emoji:'♏',from:[10,24],to:[11,21]},
    {name:'射手座',emoji:'♐',from:[11,22],to:[12,21]}
  ];
  function inRange(fromMD, toMD){
    var afterStart = (m>fromMD[0]) || (m===fromMD[0] && day>=fromMD[1]);
    var beforeEnd   = (m<toMD[0])   || (m===toMD[0]   && day<=toMD[1]);
    return afterStart && beforeEnd;
  }
  for (var i=0;i<ranges.length;i++){
    if (inRange(ranges[i].from, ranges[i].to)) return {name:ranges[i].name, emoji:ranges[i].emoji};
  }
  // 剩下的就是摩羯座（12/22–12/31 跨到隔年 1/1–1/19）
  return {name:'摩羯座', emoji:'♑'};
}

// 生命靈數：出生年月日全部數字相加，反覆縮到個位數（保留 11/22/33 大師數）
function getLifePathNumber(birthDateStr){
  if(!birthDateStr) return null;
  var digits = birthDateStr.replace(/[^0-9]/g,'').split('').map(Number);
  var sum = digits.reduce(function(a,b){return a+b;},0);
  function reduce(n){
    if (n<10) return n;
    var s = String(n).split('').reduce(function(a,b){return a+Number(b);},0);
    return reduce(s);
  }
  return reduce(sum);
}

async function doExportPDF(blks,div){
  var J=window.jspdf.jsPDF;
  var pdf=new J({ orientation:"l", unit:"mm", format:[297,210] });  // 明確指定橫向寬高（297x210mm），避免文字參數解析問題
  var pageW=297, pageH=210, margin=10, usableW=pageW-margin*2, usableH=pageH-margin*2;
  var wm = ''; // 業務員資訊已移至上方，這裡留空
  var disclaimer='<div style="padding:8px 14px;font-size:32px;color:#999;line-height:1.6;text-align:left">⚠️ 本報告彙總之資訊為檢視與討論保障內容的參考藍圖；為守護您的權益，實際理賠給付項目與條件，仍以各家保險公司之最新資料及正式保險契約條款為準</div>';
  var pageCount=0;
  var pageLabelCounters = {}; // 每個區塊前綴各自累計頁碼，例如 {"繳費":3,"現金流":2}

  // 供「儲蓄險現金流時間軸」分頁使用的資料（跟 renderBlock 同一套取得方式）
  var nowYearGlobal = new Date().getFullYear();
  var pdm2Global = {};
  ((familyData && familyData.members) || []).filter(function(m){ return m.role!=="beneficiary_only"; }).forEach(function(m){
    var cached = sessionStorage.getItem("nbs_person_"+m.personId);
    if(cached) pdm2Global[m.personId]=JSON.parse(cached);
  });

  // 用 canvas 直接畫文字產生標籤圖片，而不是走 html2canvas 擷取整個 DOM，
  // 避免多一次昂貴的擷取；canvas 2D fillText 是瀏覽器原生字型渲染，
  // 中文字不需要額外嵌入字型（這也是 jsPDF 原生 pdf.text() 無法直接顯示
  // 中文的原因，所以整份報告一律用擷取圖片的方式處理文字）。
  function makePageLabelImg(text){
    var c = document.createElement("canvas");
    c.width = 360; c.height = 72;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = "#9CA3AF";
    ctx.font = "700 38px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "right";
    ctx.fillText(text, c.width-12, c.height/2);
    return c.toDataURL("image/png");
  }

  // 在頁面右下角（10mm 頁緣留白處，不會跟內容重疊）蓋上「前綴-頁碼」標籤
  function stampPageLabel(prefix){
    if(!prefix) return;
    pageLabelCounters[prefix] = (pageLabelCounters[prefix]||0)+1;
    var img = makePageLabelImg(prefix+"-"+pageLabelCounters[prefix]);
    pdf.addImage(img,"PNG", pageW-margin-22, pageH-6, 22, 4.4);
  }

  function addNewPage(labelPrefix){ if(pageCount>0) pdf.addPage([297,210],"l"); pageCount++; stampPageLabel(labelPrefix); }

  async function captureHtml(html){
    div.style.width="2400px";
    div.innerHTML=html;
    await sleep(150);
    var aw=Math.max(div.scrollWidth,div.offsetWidth,800);
    div.style.width=aw+"px";
    await sleep(80);
    var c=await html2canvas(div,{scale:2,useCORS:true,backgroundColor:"#ffffff",width:aw,windowWidth:aw});
    div.style.width="2400px";
    return c;
  }

  // 把 canvas 換算成 mm 尺寸，超過最大高度才等比例縮小（避免拉伸變形）
  function canvasToMM(c, maxW, maxH){
    var iw=maxW, ih=(c.height/c.width)*iw;
    if(ih>maxH){ iw=iw*(maxH/ih); ih=maxH; }
    return {iw:iw, ih:ih};
  }

  for(var i=0;i<blks.length;i++){
    var isLast = i===blks.length-1;
    setP(Math.round(i/blks.length*90));

    if(blks[i].key==="premium_detail"){
      // ── 保單繳費明細一覽表：依保單分組動態分頁 ──────────
      // 頭部（統計+月曆）先自成一頁最上方；接著逐組保單依序往下疊，
      // 每加一組前先估算「現在這頁還放不放得下」，放不下才換頁，
      // 絕對不會把同一組保單（主約+附約）從中間切成兩半分散兩頁，
      // 也不會為了硬塞進一頁而把整張圖縮到看不清楚。
      // 每次換頁，標題都會在新的一頁重新印一次，不會只有第一頁有標題。
      var parts = buildPremiumDetailParts();
      var titleC = await captureHtml(getBlockTitleHtml(blks[i]));
      var titleH = (titleC.height/titleC.width)*usableW;

      // 【修改點 1】提早將「年繳保費與月繳費分配」區塊(headerHtml)轉換為圖片，準備作為每頁重複的列印標題
      var headerC = await captureHtml(parts.headerHtml);
      var hd = canvasToMM(headerC, usableW, usableH-titleH-4);

      // 【修改點 2】修改換頁函數，讓每新的一頁都同時印上「主標題」與「保費統計與月曆」
      async function startNewPagePD(){
        addNewPage("繳費");
        // 1. 印上最上方主標題 (【XXX】保單繳費明細一覽表)
        pdf.addImage(titleC.toDataURL("image/jpeg",0.88),"JPEG",margin,margin,usableW,titleH);
        // 2. 緊接著印上列印標題 (年繳保費、月繳保費分配、欄位名稱)
        pdf.addImage(headerC.toDataURL("image/jpeg",0.88),"JPEG",margin,margin+titleH,hd.iw,hd.ih);
        
        // 回傳加上列印標題後的新 Y 座標，讓接下來的保單明細從這裡開始往下排
        return margin+titleH+hd.ih+4; 
      }

      var y = await startNewPagePD();
      
      for(var g=0; g<parts.groupPieces.length; g++){
        var gp = parts.groupPieces[g];
        var wholeC = await captureHtml(gp.fullHtml);
        // 用原始寬高比反推：如果這一整組貼滿版面寬度時的高度，本來就
        // 超過一整頁能用的高度，代表就算自己獨佔一頁也放不下，要拆成
        // 「組頭+逐列」個別分頁，而不是硬縮小塞進去
        var naturalH = (wholeC.height / wholeC.width) * usableW;

        if (naturalH <= usableH) {
          // 整組放得下：維持原本「一組一張圖」的做法，看目前頁面剩餘
          // 空間夠不夠，不夠就直接換頁，圖片本身完全不縮小
          if (y + naturalH > margin+usableH && y > margin+1) { y = await startNewPagePD(); }
          pdf.addImage(wholeC.toDataURL("image/jpeg",0.88),"JPEG",margin,y,usableW,naturalH);
          y += naturalH + 3;
        } else {
          // 整組太高，連自己獨佔一頁都放不下 → 拆成「組頭+欄位標題」
          // 跟「逐列」各自截圖、各自分頁，每一列都不會被縮小
          var chC = await captureHtml(gp.cardHeaderHtml);
          var chH = (chC.height/chC.width)*usableW;
          if (y + chH > margin+usableH && y > margin+1) { y = await startNewPagePD(); }
          pdf.addImage(chC.toDataURL("image/jpeg",0.88),"JPEG",margin,y,usableW,chH);
          y += chH;

          for (var r=0; r<gp.rowsHtml.length; r++){
            var rowC = await captureHtml(gp.rowsHtml[r]);
            var rowH = (rowC.height/rowC.width)*usableW;
            if (y + rowH > margin+usableH) {
              y = await startNewPagePD();
              // 換頁後補印一次「組頭+欄位標題」，方便閱讀接續內容是哪一組保單
              var chC2 = await captureHtml(gp.cardHeaderHtml);
              var chH2 = (chC2.height/chC2.width)*usableW;
              pdf.addImage(chC2.toDataURL("image/jpeg",0.88),"JPEG",margin,y,usableW,chH2);
              y += chH2;
            }
            pdf.addImage(rowC.toDataURL("image/jpeg",0.88),"JPEG",margin,y,usableW,rowH);
            y += rowH;
          }
          y += 3;
        }
      }

      if(isLast || fmt==="pdf_pages"){
        var footerC = await captureHtml(disclaimer+wm);
        var fd = canvasToMM(footerC, usableW, 40);
        if(y + fd.ih > margin+usableH){ y = await startNewPagePD(); }
        pdf.addImage(footerC.toDataURL("image/jpeg",0.88),"JPEG",margin,y,fd.iw,fd.ih);
      }
    } else if(blks[i].key==="savings_timeline"){
      // ── 儲蓄險現金流時間軸：依被保險人分組動態分頁 ──────────
      // 標題+欄位年份先自成一頁最上方，接著每位被保險人的所有保單
      // 自成一組，整組放得下就整組印、放不下才換頁，永遠維持滿版
      // 寬度，不會因為表格太高被迫縮小到看不清楚。
      var stParts = buildSavingsTimelineParts(pdm2Global, familyData, nowYearGlobal, nowYearGlobal+14);
      if(!stParts){
        var emptyC = await captureHtml(getBlockTitleHtml(blks[i])+'<div style="padding:60px;text-align:center;color:#9ca3af;font-size:20px">尚無儲蓄保單設定領回資料</div>'+(isLast||fmt==="pdf_pages"?disclaimer:"")+wm);
        addNewPage("現金流");
        pdf.addImage(emptyC.toDataURL("image/jpeg",0.88),"JPEG",margin,margin,ed.iw,ed.ih);
      } else {
        var titleC2 = await captureHtml(getBlockTitleHtml(blks[i]));
        var titleH2 = (titleC2.height/titleC2.width)*usableW;
        var headC2 = await captureHtml(stParts.headerBandHtml);
        var hd2 = canvasToMM(headC2, usableW, usableH-titleH2-4);

        async function startNewPageST(){
          addNewPage("現金流");
          pdf.addImage(titleC2.toDataURL("image/jpeg",0.88),"JPEG",margin,margin,usableW,titleH2);
          pdf.addImage(headC2.toDataURL("image/jpeg",0.88),"JPEG",margin,margin+titleH2,hd2.iw,hd2.ih);
          return margin+titleH2+hd2.ih;
        }

        var y2 = await startNewPageST();
        for(var g2=0; g2<stParts.groups.length; g2++){
          var chunkC = await captureHtml(stParts.buildGroupChunkHtml(stParts.groups[g2]));
          var chunkH = (chunkC.height/chunkC.width)*usableW;
          if(y2+chunkH > margin+usableH && y2>margin+1){ y2 = await startNewPageST(); }
          pdf.addImage(chunkC.toDataURL("image/jpeg",0.88),"JPEG",margin,y2,usableW,chunkH);
          y2 += chunkH;
        }
        var totC = await captureHtml(stParts.totalRowHtml);
        var totH = (totC.height/totC.width)*usableW;
        if(y2+totH > margin+usableH){ y2 = await startNewPageST(); }
        pdf.addImage(totC.toDataURL("image/jpeg",0.88),"JPEG",margin,y2,usableW,totH);
        y2 += totH;

        if(isLast || fmt==="pdf_pages"){
          var footC2 = await captureHtml(disclaimer+wm);
          var fd2 = canvasToMM(footC2, usableW, 40);
          if(y2+fd2.ih > margin+usableH){ y2 = await startNewPageST(); }
          pdf.addImage(footC2.toDataURL("image/jpeg",0.88),"JPEG",margin,y2,fd2.iw,fd2.ih);
        }
      }
    } else {
      // ── 其餘區塊：維持單頁等比例縮放 ──────────────────
      var PAGE_LABEL_PREFIX = { summary:"彙總", policy_detail:"保障", cover:"封面" };
      var isCover = blks[i].key==="cover";
      var showDisclaimer = isCover ? false : (fmt==="pdf_pages" ? true : isLast);
      var c = await captureHtml((isCover?'':getBlockTitleHtml(blks[i]))+renderBlock(blks[i].key)+(showDisclaimer?disclaimer:"")+(isCover?'':wm));
      addNewPage(PAGE_LABEL_PREFIX[blks[i].key] || "報告");
      var d = canvasToMM(c, usableW, usableH);
      pdf.addImage(c.toDataURL("image/jpeg",0.88),"JPEG",margin,margin,d.iw,d.ih);
    }
  }
  setP(95);
  pdf.save(pName+"_保單體檢_"+pDate+".pdf");
  setP(100);
}

// ── GAS 呼叫 ─────────────────────────────────────────────
function gas(action,params){
  // 一律走 POST：中央 API1 沒有寫 doGet，任何動作用 GET 送出都會被
  // CORS 擋下（沒有 doGet 時 Google 回的錯誤頁沒有 CORS 標頭）。
  // Shell 那邊的 doPost 本來就有「沒對到的 action 轉發給 doGet」的
  // 相容機制，所以全部走 POST 對 Shell 端完全沒有副作用。
  return fetch(GAS,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify(Object.assign({action:action},params)),
  }).then(function(r){return r.json();});
}

  // 從 URL ?from= 參數預選對應區塊

  var PAGE_TO_BLOCK = {
    "summary":     ["summary"],

  }
  buildBlocks();
  buildFmts();
  var btn=document.getElementById("B_PREV");
  if(btn){btn.disabled=true;btn.textContent="資料載入中…";btn.style.background="#ccc";}

  try {
    var pdm = {};
    var fmem = (familyData && familyData.members) || [];
    var activeMembers = fmem.filter(function(m) { return m.role !== "beneficiary_only"; });

    var fetchPromises = activeMembers.map(function(mem) {
      var cacheKey = "nbs_person_" + mem.personId;
      var cachedData = sessionStorage.getItem(cacheKey);

      if (cachedData) {
        pdm[mem.personId] = JSON.parse(cachedData);
        return Promise.resolve();
      } else {
        return gas("readFile", {
          email: currentUser.email,
          fileType: "persons",
          fileName: mem.name + "_" + mem.personId + ".json"
        }).then(function(pr) {
          if (pr.status === "ok") {
            pdm[mem.personId] = pr.content;
            sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
          }
        }).catch(function(err) { console.error("讀取 " + mem.name + " 失敗", err); });
      }
    });

    await Promise.all(fetchPromises);

    personDataMap = pdm;
    person = pdm[currentPersonId] || {};
    policies = person.policies || [];
    coverage = person.coverage || {};
    savings = person.savings || [];
    pName = (person.profile && person.profile.name) || "—";
    var ad = person.profile && person.profile.analysisDate;
    if (ad) {
      var d = new Date(ad);
      pDate = (d.getFullYear() - 1911) + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }
  } catch (ex) { 
    console.error("export load error", ex); 
  }

  // SPA 底下，await 期間使用者可能已經切到別頁，DOM 已經被替換掉
  if (window.NBSRouter && !NBSRouter.isActive("export.html")) return;

  renderTabs();
  updatePrevBtn();

  // 通知 nav.js 更新側邊欄（nav.js 自己讀 Drive 可能失敗）
  if (familyData) {
    window.dispatchEvent(new CustomEvent("nbs_page_data_ready", {
      detail: { familyData: familyData, currentPersonId: currentPersonId }
    }));
  }
});

// ── NBS 導覽 ──────────────────────────────────────────────
if (typeof NBS_NAV !== "undefined") { 
    NBS_NAV.onMemberChange = function(pid) {
      switchPerson(pid);
    };
}

</script>
