<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 受益人設定</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background: linear-gradient(160deg,#EEF4FF 0%,#F5F0FF 50%,#EFF9F4 100%); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size: 26px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size: 18px; font-weight:500; flex:1; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size: 14px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .content-area { padding:16px; max-width:1100px; margin:0 auto; padding-bottom:80px; }
    .locked-tag { font-size: 14px; background:#f0f0f0; color:#888; padding:2px 6px; border-radius:4px; }
    
    /* 險種顏色設定 */
    .cat-壽險保障 { background:#E6F1FB; color:#0C447C; }
    .cat-意外險 { background:#FFF3E0; color:#E67E22; }
    .cat-醫療險 { background:#EAF3DE; color:#27500A; }
    .cat-癌症醫療 { background:#FCEBEB; color:#791F1F; }
    .cat-重大疾病險 { background:#EEEDFE; color:#3C3489; }
    .cat-失能長照 { background:#F3E5F5; color:#4A148C; }
    .cat-儲蓄險 { background:#FBEAF0; color:#72243E; }
    .cat-投資型保險 { background:#f0f0f0; color:#555; }

    /* ── 表格樣式 ── */
    .benef-table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; border:1px solid #e8e8e8; font-size: 17px; }
    .benef-table thead tr { background:#f7f7f5; }
    .benef-table th { padding:9px 10px; text-align:left; font-size: 14px; font-weight:600; color:#888; border-bottom:2px solid #e8e8e8; white-space:nowrap; }
    .benef-table th.col-set { text-align:center; width:52px; }
    .benef-table td { padding:9px 10px; vertical-align:middle; border-bottom:1px solid #f0f0f0; }
    .benef-table tbody tr:last-child td { border-bottom:none; }
    .benef-table tbody tr:hover { background:#fafffe; }
    .policy-no-badge { font-size: 14px; font-family:monospace; background:#E6F1FB; color:#0C447C; padding:1px 7px; border-radius:99px; white-space:nowrap; }
    .cat-badge { font-size: 14px; padding:2px 7px; border-radius:99px; white-space:nowrap; }
    .set-btn { font-size: 14px; padding:4px 10px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; color:#666; font-family:inherit; }
    .amount-val { font-weight:600; color:#0C447C; font-family:monospace; }
    .benef-val { color:#333; line-height:1.5; white-space:pre-wrap; }
    .benef-val.unset { color:#ccc; }
    .col-name { min-width:130px; }
    .col-death { min-width:110px; }
    .col-live { min-width:110px; }

    /* Modal 視窗置中對齊 */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center; padding:16px;}
    .modal { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; }
    .modal-title { font-size: 19px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; color:#333;}
    .modal-close { background:none; border:none; font-size: 26px; color:#999; cursor:pointer; line-height:1; }

    .btn-row { display:flex; gap:10px; margin-top:20px; }
    .btn-primary { flex:1; padding:10px; background:#378ADD; color:#fff; border:none; border-radius:8px; font-size: 16px; font-weight:500; cursor:pointer; font-family:inherit; }
    .btn-secondary { flex:1; padding:10px; background:#f5f5f3; color:#666; border:none; border-radius:8px; font-size: 16px; cursor:pointer; font-family:inherit; }

    #saved-hint { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#27AE8F; color:#fff; padding:8px 16px; border-radius:8px; font-size: 14px; z-index:999; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
    
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#378ADD; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── 列印樣式 ── */
    @media print {
      @page { size: A4 landscape; margin: 12mm 10mm; }
      body { background:#fff; }
      .header, .member-tabs, #saved-hint, .col-set, .print-hide { display:none !important; }
      .content-area { padding:0; max-width:100%; }
      .benef-table { font-size: 14px; border:1px solid #ccc; }
      .benef-table th { font-size: 14px; padding:6px 8px; background:#f0f0f0 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .benef-table td { padding:6px 8px; }
      .print-title { display:block !important; font-size: 18px; font-weight:600; margin-bottom:10px; }
    }
  </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="nav.js"></script>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="header-title">受益人設定</div>
    <button onclick="window.print()" style="font-size:14px;padding:5px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;color:#555;font-family:inherit">🖨 列印</button>
  </div>
  
  <div class="member-tabs print-hide" id="member-tabs"></div>
  <div id="saved-hint">✓ 已儲存</div>

  <div class="content-area">
    <div class="print-title" style="display:none"></div>
    <div id="policy-view" style="display:block;">
      <div id="policy-list"><div style="text-align:center;padding:40px;color:#bbb;font-size:14px">載入資料中，請稍候...</div></div>
    </div>
  </div>

  <!-- 保單設定 Modal -->
  <div class="modal-overlay" id="policy-modal" onclick="if(event.target===this) closePolicyModal()">
    <div class="modal">
      <div class="modal-title">
        <span id="modal-policy-name">保單設定</span>
        <button class="modal-close" onclick="closePolicyModal()">×</button>
      </div>
      <div id="policy-modal-body"></div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="closePolicyModal()">取消</button>
        <button class="btn-primary" onclick="savePolicyBenef()">確認儲存</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";
    
    const BENEF_RULES = {
      "壽險保障":   { death:"可設定", live:"不適用" },
      "意外險":     { death:"可設定", live:"不適用" },
      "醫療險":     { death:"鎖定本人", live:"不適用" },
      "癌症醫療":   { death:"鎖定本人", live:"不適用" },
      "重大疾病險": { death:"可設定", live:"可設定" },
      "重大傷病險": { death:"鎖定本人", live:"鎖定本人" },
      "特定傷病險": { death:"鎖定本人", live:"鎖定本人" },
      "失能長照":   { death:"可設定", live:"鎖定本人" },
      "儲蓄險":     { death:"可設定", live:"可設定" },
      "年金險":     { death:"可設定", live:"鎖定本人" },
      "投資型保險": { death:"可設定", live:"鎖定本人" }
    };

    let currentUser = null, familyData = null, personDataMap = {};
    let currentPersonId = null, editPolicyId = null;

    // ── 初始化：完美對接 NBS 導覽列 ──
    window.addEventListener("nbs_nav_ready", async function(e) {
      currentUser       = e.detail.user;
      familyData        = e.detail.familyData;
      currentPersonId   = e.detail.currentPersonId;

      if (!currentUser || !familyData) {
        // 家庭資料尚未建立，顯示空白
        return;
      }

      try {
        // 效能優化：nav.js 已經用 readFamilyBundle 把家庭+成員資料一起
        // 抓好了，這裡優先直接借用 e.detail.personsData，不再讓每個
        // 成員各自平行打一次 readFile（這也是之前出現 404 的主因之一
        // ——太多平行請求同時打到 GAS，容易互相卡住）。
        // sessionStorage 快取保留，當作 nav.js 也沒有資料時的備援。
        const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
        const navPersons = e.detail.personsData || {};
        personDataMap = Object.assign({}, navPersons);

        const missingMembers = activeMembers.filter(m => !personDataMap[m.personId]);
        if (missingMembers.length) {
          const fetchPromises = missingMembers.map(m => {
            const cacheKey = "nbs_person_" + m.personId;
            const cachedData = sessionStorage.getItem(cacheKey);

            if (cachedData) {
              personDataMap[m.personId] = JSON.parse(cachedData);
              return Promise.resolve();
            } else {
              return callGAS("readFile", {
                email: currentUser.email,
                fileType: "persons",
                fileName: m.name + "_" + m.personId + ".json"
              }).then(pr => {
                if (pr && pr.status === "ok") {
                  personDataMap[m.personId] = pr.content;
                  sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
                } else {
                  personDataMap[m.personId] = { policies: [] };
                }
              }).catch(err => console.error(err));
            }
          });
          await Promise.all(fetchPromises);
        }

        renderTabs();
        renderPolicyView();
      } catch(err) {
        document.getElementById("policy-list").innerHTML = "載入異常：" + err.message;
      }
    });

    function renderTabs() {
      if(!familyData || !familyData.members) return;
      const html = familyData.members.filter(m=>m.role!=="beneficiary_only").map(m => 
        `<div class="member-tab ${m.personId===currentPersonId?'active':''}" onclick="switchMember('${m.personId}')">${m.name}</div>`
      ).join('');
      document.getElementById("member-tabs").innerHTML = html;
    }

    function switchMember(pid) {
      currentPersonId = pid;
      renderTabs();
      renderPolicyView();
    }

    // ── 主畫面表格渲染 ──────────────────────────
    function renderPolicyView() {
      const person = personDataMap[currentPersonId];
      if(!person) return;
      
      const allPolicies = person.policies || [];
      const targetCategories = ["壽險保障", "儲蓄險", "年金險", "投資型保險", "重大疾病險", "重大傷病險", "特定傷病險"];
      const policies = allPolicies.filter(p => targetCategories.includes(p.category));

      // 更新列印標題
      const member = (familyData?.members||[]).find(m=>m.personId===currentPersonId);
      const printTitle = document.querySelector('.print-title');
      if(printTitle) printTitle.textContent = (member?.name||'') + ' 受益人規劃表';

      if (policies.length === 0) {
        document.getElementById("policy-list").innerHTML = '<div style="padding:40px 20px;text-align:center;color:#bbb;font-size:14px">此成員尚無具有傳承或生存金意義之保單</div>';
        return;
      }

      let html = `
      <div style="font-size:14px;color:#999;margin-bottom:10px" class="print-hide">為每筆保單設定受益人，灰色鎖定項目依法令規定無法更改。</div>
      <div style="overflow-x:auto;">
      <table class="benef-table">
        <thead>
          <tr>
            <th class="col-set">設定</th>
            <th>險種類型</th>
            <th>要保人</th>
            <th>被保險人</th>
            <th>保單號碼</th>
            <th class="col-name">商品名稱</th>
            <th>當年度保額</th>
            <th class="col-death">身故受益人</th>
            <th class="col-live">生存/滿期金受益人</th>
          </tr>
        </thead>
        <tbody>`;

      policies.forEach(p => {
        const amountText = (p.insuredAmount !== undefined && p.insuredAmount !== null && p.insuredAmount !== "")
          ? `${p.insuredAmount} ${p.insuredAmountUnit || '萬元'}` : '—';
        const catClass = "cat-" + (p.category || "");
        const rule = BENEF_RULES[p.category] || { death:"可設定", live:"可設定" };

        // 身故受益人
        let dStr = "未設定";
        if (p.isRider) {
          dStr = "同主約";
        } else if (rule.death === "鎖定本人") {
          dStr = "被保險人本人 🔒";
        } else if (p.beneficiaryDeathText) {
          dStr = p.beneficiaryDeathText;
        } else if (Array.isArray(p.beneficiaryDeathCustom) && p.beneficiaryDeathCustom.length > 0) {
          dStr = p.beneficiaryDeathCustom.map(c => c.customName || "指定家人").join("、");
        }

        // 生存與滿期金
        let lStr = "無 / 不適用", mStr = "無 / 不適用";
        if (p.beneficiaryLiveText) lStr = p.beneficiaryLiveText;
        else if (p.beneficiaryLiveType === "self") lStr = "被保險人本人";
        else if (p.beneficiaryLiveType === "owner") lStr = "要保人";
        else if (p.beneficiaryLiveType === "other") lStr = p.beneficiaryLiveOther || "指定其他";
        else if (!p.beneficiaryLiveType) lStr = "無 / 不適用";

        if (p.beneficiaryMaturityText) mStr = p.beneficiaryMaturityText;
        else if (p.beneficiaryMaturityType === "self") mStr = "被保險人本人";
        else if (p.beneficiaryMaturityType === "owner") mStr = "要保人";
        else if (p.beneficiaryMaturityType === "other") mStr = p.beneficiaryMaturityOther || "指定其他";
        else if (!p.beneficiaryMaturityType) mStr = "無 / 不適用";

        if (p.category === "年金險" || p.category === "投資型保險" || rule.live === "鎖定本人") {
          lStr = "被保險人本人 🔒";
          mStr = "無 / 不適用";
        }

        // 生存/滿期金合併顯示
        let liveDisplay = "";
        if (rule.live === "不適用" || (p.category === "壽險保障" && rule.live !== "可設定")) {
          liveDisplay = `<span class="benef-val unset">無 / 不適用</span>`;
        } else if (rule.live === "鎖定本人" || p.category === "年金險" || p.category === "投資型保險") {
          liveDisplay = `<span class="locked-tag">本人 🔒</span>`;
        } else {
          const parts = [];
          if (lStr && !lStr.includes("無")) parts.push(`<div><span style="font-size:14px;color:#aaa">生存金：</span>${lStr}</div>`);
          if (mStr && !mStr.includes("無")) parts.push(`<div><span style="font-size:14px;color:#aaa">滿期金：</span>${mStr}</div>`);
          liveDisplay = parts.length ? parts.join("") : `<span class="benef-val unset">無 / 不適用</span>`;
        }

        const dIsUnset = dStr === "未設定";
        const owner = p.ownerName || person.profile?.name || "—";
        const insured = p.insuredName || person.profile?.name || "—";

        html += `<tr>
          <td class="col-set" style="text-align:center">
            <button class="set-btn" onclick="openPolicyModal('${p.id}')">設定</button>
          </td>
          <td><span class="cat-badge ${catClass}">${p.category || '—'}</span></td>
          <td style="font-size:17px;color:#555">${owner}</td>
          <td style="font-size:17px;color:#555">${insured}</td>
          <td><span class="policy-no-badge">${p.policyNo || p.id}</span></td>
          <td class="col-name" style="font-size:17px;font-weight:500">${p.itemName || '—'}</td>
          <td><span class="amount-val">${amountText}</span></td>
          <td class="col-death"><span class="benef-val ${dIsUnset?'unset':''}" style="white-space:pre-wrap">${dStr}</span></td>
          <td class="col-live">${liveDisplay}</td>
        </tr>`;
      });

      html += `</tbody></table></div>`;
      document.getElementById("policy-list").innerHTML = html;
    }

    // ── 輔助函式：文字框快速輸入 ─────────────────────────────
    function appendText(elId, text) {
      const el = document.getElementById(elId);
      if (el) el.value += text + ' ';
    }
    function clearText(elId) {
      const el = document.getElementById(elId);
      if (el) el.value = '';
    }

    // ── Modal 設定彈窗 ─────────────────────────────
    function openPolicyModal(policyId) {
      editPolicyId = policyId;
      const person = personDataMap[currentPersonId];
      if(!person) return;
      const policy = (person.policies || []).find(p => p.id === policyId);
      if(!policy) return;

      document.getElementById("modal-policy-name").textContent = policy.itemName || "設定受益人";
      const rule = BENEF_RULES[policy.category] || { death:"可設定", live:"可設定" };

      let html = "";
      
      // ▼ 1. 身故受益人
      html += `<div style="margin-bottom:20px">
        <div style="font-size:19px;font-weight:600;color:#0C447C;margin-bottom:10px;border-bottom:1px solid #E6F1FB;padding-bottom:4px">身故受益人</div>`;

      if (policy.isRider) {
        html += `<div style="font-size:14px;color:#888;padding:10px;background:#f9f9f9;border-radius:8px">此為附約，身故受益人同主約。</div>`;
      } else if (rule.death === "鎖定本人") {
        html += `<div style="font-size:14px;color:#888;padding:10px;background:#f9f9f9;border-radius:8px">依法令或險種規定，身故理賠金限被保險人本人。</div>`;
      } else {
        // 解析已存的文字回三個順位欄位
        const deathRaw = policy.beneficiaryDeathText || '';
        const deathLines = deathRaw.split('\n');
        const parseRank = (lines, prefix) => {
          const line = lines.find(l => l.startsWith(prefix));
          return line ? line.replace(prefix,'').trim() : '';
        };
        const d1 = parseRank(deathLines, '第一順位：');
        const d2 = parseRank(deathLines, '第二順位：');
        const d3 = parseRank(deathLines, '第三順位：');
        const dOther = deathLines.filter(l =>
          !l.startsWith('第一順位：') && !l.startsWith('第二順位：') && !l.startsWith('第三順位：')
        ).join('\n');

        html += `
        <div style="display:grid;grid-template-columns:80px 1fr;gap:6px 10px;align-items:center;margin-bottom:10px">
          <label style="font-size:14px;font-weight:600;color:#374151">第一順位</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="death-rank1" type="text" value="${d1}"
              placeholder="如：配偶"
              style="flex:1;padding:7px 10px;font-size:17px;border:1.5px solid #E5E7EB;border-radius:9px;outline:none;font-family:inherit"/>
            <div style="display:flex;gap:4px;flex-wrap:wrap">`;
        (familyData?.members || []).forEach(m => {
          html += `<button type="button" onclick="document.getElementById('death-rank1').value='${m.name}'" style="font-size:14px;padding:3px 8px;border:1px solid #ddd;border-radius:99px;background:#F9FAFB;cursor:pointer;white-space:nowrap">${m.name}</button>`;
        });
        html += `</div></div>
          <label style="font-size:14px;font-weight:600;color:#374151">第二順位</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="death-rank2" type="text" value="${d2}"
              placeholder="如：子女均分"
              style="flex:1;padding:7px 10px;font-size:17px;border:1.5px solid #E5E7EB;border-radius:9px;outline:none;font-family:inherit"/>
            <div style="display:flex;gap:4px;flex-wrap:wrap">`;
        (familyData?.members || []).forEach(m => {
          html += `<button type="button" onclick="document.getElementById('death-rank2').value='${m.name}'" style="font-size:14px;padding:3px 8px;border:1px solid #ddd;border-radius:99px;background:#F9FAFB;cursor:pointer;white-space:nowrap">${m.name}</button>`;
        });
        html += `</div></div>
          <label style="font-size:14px;font-weight:600;color:#374151">第三順位</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="death-rank3" type="text" value="${d3}"
              placeholder="如：法定繼承人"
              style="flex:1;padding:7px 10px;font-size:17px;border:1.5px solid #E5E7EB;border-radius:9px;outline:none;font-family:inherit"/>
            <div style="display:flex;gap:4px;flex-wrap:wrap">`;
        (familyData?.members || []).forEach(m => {
          html += `<button type="button" onclick="document.getElementById('death-rank3').value='${m.name}'" style="font-size:14px;padding:3px 8px;border:1px solid #ddd;border-radius:99px;background:#F9FAFB;cursor:pointer;white-space:nowrap">${m.name}</button>`;
        });
        html += `</div></div>
          <label style="font-size:14px;font-weight:600;color:#374151">自行填寫</label>
          <textarea id="death-custom-text" rows="2"
            placeholder="其他補充說明（選填）"
            style="padding:7px 10px;font-size:17px;border:1.5px solid #E5E7EB;border-radius:9px;outline:none;font-family:inherit;resize:vertical;line-height:1.6">${dOther}</textarea>
        </div>`;
      }
      html += `</div>`; 

      // ▼ 2. 生存與滿期金受益人 (全面改為溫度的自由文字框)
      html += `<div>
        <div style="font-size:19px;font-weight:600;color:#0C447C;margin-bottom:10px;border-bottom:1px solid #E6F1FB;padding-bottom:4px">生存 / 滿期金受益人</div>`;

      if (rule.live === "鎖定本人" || rule.live === "不適用" || policy.category === "年金險" || policy.category === "投資型保險") {
        html += `<div style="font-size:14px;color:#888;padding:10px;background:#f9f9f9;border-radius:8px">此險種限被保險人本人，或不適用生存/滿期金。</div>`;
      } else {
        // 準備相容舊資料的預設文字
        let liveText = policy.beneficiaryLiveText || "";
        if (!liveText && policy.beneficiaryLiveType) { 
             if(policy.beneficiaryLiveType==="self") liveText = "被保險人本人";
             if(policy.beneficiaryLiveType==="owner") liveText = "要保人";
             if(policy.beneficiaryLiveType==="other") liveText = policy.beneficiaryLiveOther || "";
             if(policy.beneficiaryLiveType==="none") liveText = "";
        }
        
        let matText = policy.beneficiaryMaturityText || "";
        if (!matText && policy.beneficiaryMaturityType) {
             if(policy.beneficiaryMaturityType==="self") matText = "被保險人本人";
             if(policy.beneficiaryMaturityType==="owner") matText = "要保人";
             if(policy.beneficiaryMaturityType==="other") matText = policy.beneficiaryMaturityOther || "";
             if(policy.beneficiaryMaturityType==="none") matText = "";
        }

        // 生存金區塊
        html += `<div style="margin-bottom:20px;">
          <div style="font-size:14px;font-weight:500;color:#666;margin-bottom:6px">生存金受益人</div>
          <textarea id="live-custom-text" placeholder="請自由輸入生存金受益人（留空代表無 / 不適用）" style="width:100%;height:60px;padding:8px 10px;font-size:17px;border:1px solid #ddd;border-radius:6px;outline:none;font-family:inherit;resize:vertical;line-height:1.5">${liveText}</textarea>
          <div style="font-size:14px;color:#888;margin-top:6px;margin-bottom:6px">💡 點擊下方家人快速加入文字框：</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">`;
        
        (familyData?.members || []).forEach(m => {
           html += `<button type="button" onclick="appendText('live-custom-text', '${m.name}')" style="font-size:14px;padding:4px 10px;border:1px solid #ddd;border-radius:99px;background:#fff;cursor:pointer">${m.name}</button>`;
        });
        html += `<button type="button" onclick="clearText('live-custom-text')" style="font-size:14px;padding:4px 10px;border:1px solid #fcc;border-radius:99px;background:#fff;cursor:pointer;color:#e74c3c">清空</button></div>
        </div>`;
        
        // 滿期金區塊
        html += `<div>
          <div style="font-size:14px;font-weight:500;color:#666;margin-bottom:6px">滿期金受益人</div>
          <textarea id="mat-custom-text" placeholder="請自由輸入滿期金受益人（留空代表無 / 不適用）" style="width:100%;height:60px;padding:8px 10px;font-size:17px;border:1px solid #ddd;border-radius:6px;outline:none;font-family:inherit;resize:vertical;line-height:1.5">${matText}</textarea>
          <div style="font-size:14px;color:#888;margin-top:6px;margin-bottom:6px">💡 點擊下方家人快速加入文字框：</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">`;
          
        (familyData?.members || []).forEach(m => {
           html += `<button type="button" onclick="appendText('mat-custom-text', '${m.name}')" style="font-size:14px;padding:4px 10px;border:1px solid #ddd;border-radius:99px;background:#fff;cursor:pointer">${m.name}</button>`;
        });
        html += `<button type="button" onclick="clearText('mat-custom-text')" style="font-size:14px;padding:4px 10px;border:1px solid #fcc;border-radius:99px;background:#fff;cursor:pointer;color:#e74c3c">清空</button></div>
        </div>`;
      }
      html += `</div>`;

      document.getElementById("policy-modal-body").innerHTML = html;
      document.getElementById("policy-modal").style.display = "flex";
    }

    function closePolicyModal() { document.getElementById("policy-modal").style.display = "none"; }

    // ── 儲存與寫入雲端 ─────────────────────────────
    async function savePolicyBenef() {
      const person = personDataMap[currentPersonId];
      if(!person) return;
      const policy = (person.policies || []).find(p => p.id === editPolicyId);
      if(!policy) return;

      const rule = BENEF_RULES[policy.category] || { death:"可設定", live:"可設定" };

      // 儲存身故受益人：組合三順位 + 自行填寫
      if (!policy.isRider && rule.death !== "鎖定本人") {
        const rank1 = (document.getElementById("death-rank1")?.value.trim()||"");
        const rank2 = (document.getElementById("death-rank2")?.value.trim()||"");
        const rank3 = (document.getElementById("death-rank3")?.value.trim()||"");
        const rankOther = (document.getElementById("death-custom-text")?.value.trim()||"");
        const deathParts = [];
        if(rank1) deathParts.push("第一順位："+rank1);
        if(rank2) deathParts.push("第二順位："+rank2);
        if(rank3) deathParts.push("第三順位："+rank3);
        if(rankOther) deathParts.push(rankOther);
        policy.beneficiaryDeathText = deathParts.join("\n");
        policy.beneficiaryDeathCustom = [];
        policy.beneficiaryDeathTplId = "";
      }

      // 儲存生存與滿期金 (改為直接存新版文字框)
      if (rule.live !== "鎖定本人" && rule.live !== "不適用" && policy.category !== "年金險" && policy.category !== "投資型保險") {
          
          const lText = document.getElementById("live-custom-text");
          if (lText) {
              policy.beneficiaryLiveText = lText.value.trim();
              policy.beneficiaryLiveType = ""; // 清除舊版設定避免干擾
              policy.beneficiaryLiveOther = "";
          }
          
          const mText = document.getElementById("mat-custom-text");
          if (mText) {
              policy.beneficiaryMaturityText = mText.value.trim();
              policy.beneficiaryMaturityType = ""; // 清除舊版設定避免干擾
              policy.beneficiaryMaturityOther = "";
          }
      }

      closePolicyModal();
      renderPolicyView();
      
      // 觸發帶有進度回饋的存檔
      await saveData();
    }

    async function saveData() {
      const person = personDataMap[currentPersonId];
      if(!person) return;
      person.updatedAt = new Date().toISOString();
      
      const hint = document.getElementById("saved-hint");
      
      try {
        const member = familyData.members.find(m => m.personId === currentPersonId);
        
        // 1. 顯示儲存中動畫 (橘色)
        hint.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-width:2px;margin-right:6px;border-top-color:#fff;"></span>儲存中...';
        hint.style.background = "#F5A623";
        hint.style.display = "block";

        await callGAS("saveFile", { email: currentUser.email, fileType: "persons", fileId: currentPersonId, fileName: member.name+"_"+currentPersonId+".json", content: person });
        sessionStorage.setItem("nbs_person_" + currentPersonId, JSON.stringify(person));
        
        // 2. 顯示已儲存 (綠色)
        hint.innerHTML = "✓ 已儲存";
        hint.style.background = "#27AE8F";
        setTimeout(()=>hint.style.display="none", 2000);
      } catch(e) { 
        hint.style.display = "none";
        alert("儲存失敗：" + e.message); 
      }
    }

    // ── 工具函式與 NBS 連動 ─────────────────────────────
    function goBack() { window.location.href="family.html"; }
function callGAS(action, params) {
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === 'function') {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error('nav.js 未載入'));
}

    if (typeof NBS_NAV !== "undefined") { 
        NBS_NAV.onMemberChange = function(pid) {
          currentPersonId = pid;
          renderTabs();
          renderPolicyView();
        };
        
// 支援兩種事件：nav.js 自行載入 或 family.html 先載入後通知
window.addEventListener("nbs_family_loaded", function(e) {
  if (typeof familyData !== "undefined" && familyData) return; // 已初始化
  var u = JSON.parse(localStorage.getItem("nbs_user") || "{}");
  window.dispatchEvent(new CustomEvent("nbs_nav_ready", {
    detail: {
      user:            u,
      familyData:      e.detail.familyData,
      currentPersonId: e.detail.familyData && e.detail.familyData.members &&
                       e.detail.familyData.members[0] && e.detail.familyData.members[0].personId,
      familyFileName:  e.detail.familyFileName
    }
  }));
});
NBS_NAV.init({ page: "beneficiary" }); 
    }
  </script>
