<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 受益人設定</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .content-area { padding:16px; max-width:600px; margin:0 auto; padding-bottom:80px; }
    .locked-tag { font-size:11px; background:#f0f0f0; color:#888; padding:2px 6px; border-radius:4px; }
    
    .cat-壽險保障 { background:#E6F1FB; color:#0C447C; }
    .cat-意外險 { background:#FFF3E0; color:#E67E22; }
    .cat-醫療險 { background:#EAF3DE; color:#27500A; }
    .cat-癌症醫療 { background:#FCEBEB; color:#791F1F; }
    .cat-重大疾病險 { background:#FCEBEB; color:#791F1F; }
    .cat-失能長照 { background:#F3E5F5; color:#4A148C; }
    .cat-儲蓄險 { background:#FBEAF0; color:#72243E; }
    .cat-投資型保險 { background:#f0f0f0; color:#555; }

    /* Modal 視窗置中對齊 */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center; }
    .modal { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; }
    
    .live-opts, .mat-opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-bottom:8px; }
    .live-opt, .mat-opt { padding:8px; font-size:12px; border:1px solid #e0e0e0; border-radius:6px; background:#fff; color:#666; cursor:pointer; font-family:inherit; text-align:center;}
    .live-opt.active, .mat-opt.active { background:#E6F1FB; color:#0C447C; border-color:#378ADD; font-weight:500; }

    #saved-hint { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#27AE8F; color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:999; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="header-title">受益人設定</div>
  </div>
  
  <div class="member-tabs" id="member-tabs"></div>
  <div id="saved-hint">✓ 已儲存</div>

  <div class="content-area">
    <div id="policy-list"><div style="text-align:center;padding:40px;color:#bbb;font-size:13px">載入中...</div></div>
  </div>

  <div class="modal-overlay" id="edit-modal" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font-size:16px;color:#333" id="modal-policy-name">保單設定</h3>
        <button onclick="closeModal()" style="background:none;border:none;font-size:20px;color:#999;cursor:pointer">×</button>
      </div>
      <div id="modal-body"></div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button onclick="closeModal()" style="flex:1;padding:10px;background:#f5f5f3;border:none;border-radius:8px;color:#666;font-size:14px;cursor:pointer">取消</button>
        <button onclick="savePolicyBenef()" style="flex:1;padding:10px;background:#378ADD;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:500;cursor:pointer">確認儲存</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";
    const BENEF_RULES = {
      "壽險保障":   { death:"可設定", live:"不適用" },
      "意外險":     { death:"可設定", live:"不適用" },
      "醫療險":     { death:"鎖定本人", live:"不適用" },
      "癌症醫療":   { death:"鎖定本人", live:"不適用" },
      "重大疾病險": { death:"可設定", live:"可設定" },
      "失能長照":   { death:"可設定", live:"鎖定本人" },
      "儲蓄險":     { death:"可設定", live:"可設定" },
      "年金險":     { death:"可設定", live:"鎖定本人" },
      "投資型保險": { death:"可設定", live:"鎖定本人" }
    };

    let currentUser = null, familyData = null, personDataMap = {};
    let currentPersonId = null, currentPolicyId = null;

    window.onload = async () => {
      const u = localStorage.getItem("nbs_user");
      if(!u) return window.location.href="login.html";
      currentUser = JSON.parse(u);
      await loadData();
    };

    async function loadData() {
      try {
        const cachedFam = sessionStorage.getItem("nbs_family");
        if(cachedFam) familyData = JSON.parse(cachedFam);
        else {
          const r = await callGAS("getFamily", { email: currentUser.email });
          if(r.status==="ok") { familyData = r.data; sessionStorage.setItem("nbs_family", JSON.stringify(familyData)); }
        }
        if(!familyData || !familyData.members || familyData.members.length===0) return;
        
        currentPersonId = familyData.members[0].personId;
        renderTabs();

        const promises = familyData.members.map(async m => {
          const cached = sessionStorage.getItem("nbs_person_"+m.personId);
          if(cached) personDataMap[m.personId] = JSON.parse(cached);
          else {
            const pr = await callGAS("readFile", { email:currentUser.email, fileType:"person", fileName:m.name+"_"+m.personId+".json" });
            if(pr.status==="ok") { personDataMap[m.personId] = pr.content; sessionStorage.setItem("nbs_person_"+m.personId, JSON.stringify(pr.content)); }
          }
        });
        await Promise.all(promises);
        renderPolicyView();
      } catch(e) { console.error("載入失敗", e); }
    }

    function renderTabs() {
      const html = familyData.members.map(m => 
        `<div class="member-tab ${m.personId===currentPersonId?'active':''}" onclick="switchMember('${m.personId}')">${m.name}</div>`
      ).join('');
      document.getElementById("member-tabs").innerHTML = html;
    }

    function switchMember(pid) {
      currentPersonId = pid;
      renderTabs();
      renderPolicyView();
    }

    // ── 主畫面渲染 ──────────────────────────
    function renderPolicyView() {
      const person = personDataMap[currentPersonId];
      if(!person) return;
      const allPolicies = person.policies || [];
      const targetCategories = ["壽險保障", "儲蓄險", "年金險", "投資型保險", "重大疾病險", "重大傷病險", "特定傷病險"];
      const policies = allPolicies.filter(p => targetCategories.includes(p.category));

      if (policies.length === 0) {
        document.getElementById("policy-list").innerHTML = '<div style="padding:40px 20px;text-align:center;color:#bbb;font-size:13px">此成員尚無具有傳承或生存金意義之保單</div>';
        return;
      }

      let html = `<div style="font-size:11px;color:#999;margin-bottom:10px">為每筆保單設定受益人，灰色鎖定項目依法令規定無法更改。</div>`;

      policies.forEach(p => {
        const amountText = p.insuredAmount ? `${p.insuredAmount} ${p.insuredAmountUnit || '萬元'}` : '—';
        const catClass = "cat-" + (p.category||"");

        // 解析身故受益人
        let dStr = "未設定";
        if (p.isRider) dStr = '<span class="locked-tag">同主約</span>';
        else if (BENEF_RULES[p.category]?.death === "鎖定本人") dStr = '<span class="locked-tag">被保險人本人</span>';
        else if (p.beneficiaryDeathText) dStr = p.beneficiaryDeathText; // 使用自由填寫文字

        // 解析生存與滿期金
        let lStr = "未設定", mStr = "未設定";
        if (p.beneficiaryLiveType === "self") lStr = "被保險人本人";
        else if (p.beneficiaryLiveType === "owner") lStr = "要保人";
        else if (p.beneficiaryLiveType === "other") lStr = p.beneficiaryLiveOther || "指定其他";
        else if (p.beneficiaryLiveType === "none" || !p.beneficiaryLiveType) lStr = "無";

        if (p.beneficiaryMaturityType === "self") mStr = "被保險人本人";
        else if (p.beneficiaryMaturityType === "owner") mStr = "要保人";
        else if (p.beneficiaryMaturityType === "other") mStr = p.beneficiaryMaturityOther || "指定其他";
        else if (p.beneficiaryMaturityType === "none" || !p.beneficiaryMaturityType) mStr = "無";

        if (p.category==="年金險" || p.category==="投資型保險" || BENEF_RULES[p.category]?.live === "鎖定本人") {
           lStr = '<span class="locked-tag">被保險人本人</span>';
        }

        // 實務邏輯隱藏
        let liveMatHtml = "";
        if (BENEF_RULES[p.category]?.live === "可設定") {
            if (lStr === "無" && mStr === "無") {
                liveMatHtml = `<div style="flex:1;"><div style="font-size:11px; color:#888; margin-bottom:4px;">生存 / 滿期金</div><div style="font-size:13px; color:#ccc; line-height:1.5;">無 / 不適用</div></div>`;
            } else {
                if (lStr !== "無") liveMatHtml += `<div style="flex:1;"><div style="font-size:11px; color:#888; margin-bottom:4px;">生存金受益人</div><div style="font-size:13px; color:#333; line-height:1.5;">${lStr}</div></div>`;
                if (mStr !== "無") liveMatHtml += `<div style="flex:1;"><div style="font-size:11px; color:#888; margin-bottom:4px;">滿期金受益人</div><div style="font-size:13px; color:#333; line-height:1.5;">${mStr}</div></div>`;
            }
        } else {
            liveMatHtml = `<div style="flex:1;"><div style="font-size:11px; color:#888; margin-bottom:4px;">生存金受益人</div><div style="font-size:13px; color:#333; line-height:1.5;">${lStr}</div></div>`;
        }

        html += `<div class="policy-card" style="background:#fff; border:1px solid #e8e8e8; border-radius:10px; margin-bottom:12px; overflow:hidden;">
          <div class="card-header" style="display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid #f0f0f0;">
            <span style="font-family:monospace; font-size:11px; background:#E6F1FB; color:#0C447C; padding:1px 7px; border-radius:99px; margin-right:8px;">${p.policyNo || p.id}</span>
            <span style="font-size:14px; font-weight:500; flex:1;">${p.itemName || '—'}</span>
            <span class="cat-badge ${catClass}" style="font-size:11px; padding:2px 6px; border-radius:99px; margin-right:8px;">${p.category || '—'}</span>
            <button onclick="openPolicyModal('${p.id}')" style="padding:4px 12px; font-size:12px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer;">設定</button>
          </div>
          <div style="background:#F5FAFF; padding:8px 14px; border-bottom:1px solid #E6F1FB; display:flex; align-items:center;">
            <span style="font-size:12px; color:#555;">🎯 當年度保額：</span>
            <span style="font-size:15px; font-weight:600; color:#0C447C; margin-left:6px; font-family:monospace;">${amountText}</span>
          </div>
          <div class="card-body" style="display:flex; gap:16px; padding:12px 14px;">
            <div style="flex:1;">
              <div style="font-size:11px; color:#888; margin-bottom:4px;">受益人 (身故)</div>
              <div style="font-size:13px; color:${dStr==='未設定'?'#ccc':'#333'}; line-height:1.5; white-space:pre-wrap;">${dStr}</div>
            </div>
            ${liveMatHtml}
          </div>
        </div>`;
      });
      document.getElementById("policy-list").innerHTML = html;
    }

    // ── Modal 設定與存檔 ─────────────────────────────
    function openPolicyModal(policyId) {
      currentPolicyId = policyId;
      const person = personDataMap[currentPersonId];
      const policy = (person?.policies||[]).find(p=>p.id===policyId);
      if(!policy) return;

      document.getElementById("modal-policy-name").textContent = policy.itemName || "保單設定";
      const rule = BENEF_RULES[policy.category] || { death:"可設定", live:"可設定" };

      let html = "";
      
      // 身故受益人 (自由填寫框)
      html += `<div style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:600;color:#0C447C;margin-bottom:10px;border-bottom:1px solid #E6F1FB;padding-bottom:4px">身故受益人</div>`;

      if (policy.isRider) {
        html += `<div style="font-size:13px;color:#888;padding:10px;background:#f9f9f9;border-radius:8px">此為附約，身故受益人同主約。</div>`;
      } else if (rule.death === "鎖定本人") {
        html += `<div style="font-size:13px;color:#888;padding:10px;background:#f9f9f9;border-radius:8px">依法令或險種規定，身故理賠金限被保險人本人。</div>`;
      } else {
        html += `<div style="font-size:12px;color:#666;margin-bottom:6px">請自由填寫身故受益人 (支援多順位與比例)：</div>
        <textarea id="death-custom-text" placeholder="例如：\n順位一：配偶 (李明)\n順位二：子女均分 (李小華、李大明)" style="width:100%;height:80px;padding:10px;font-size:13px;border:1px solid #ddd;border-radius:6px;outline:none;font-family:inherit;resize:vertical;line-height:1.5">${policy.beneficiaryDeathText || ''}</textarea>
        
        <div style="font-size:11px;color:#888;margin-top:8px;margin-bottom:6px">💡 點擊下方家人快速加入文字框：</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">`;
        
        (familyData?.members||[]).forEach(m => {
           html += `<button onclick="document.getElementById('death-custom-text').value += '${m.name} '" style="font-size:12px;padding:4px 10px;border:1px solid #ddd;border-radius:99px;background:#fff;cursor:pointer">${m.name}</button>`;
        });
        
        html += `<button onclick="document.getElementById('death-custom-text').value = ''" style="font-size:12px;padding:4px 10px;border:1px solid #fcc;border-radius:99px;background:#fff;cursor:pointer;color:#e74c3c">清空</button></div>`;
      }
      html += `</div>`; 

      // 生存金/滿期金
      html += `<div>
        <div style="font-size:13px;font-weight:600;color:#0C447C;margin-bottom:10px;border-bottom:1px solid #E6F1FB;padding-bottom:4px">生存 / 滿期金受益人</div>`;

      if (rule.live === "鎖定本人" || rule.live === "不適用" || policy.category === "年金險" || policy.category === "投資型保險") {
        html += `<div style="font-size:13px;color:#888;padding:10px;background:#f9f9f9;border-radius:8px">此險種限被保險人本人，或不適用生存/滿期金。</div>`;
      } else {
        html += `<div>
          <div style="font-size:12px;font-weight:500;color:#666;margin-bottom:6px">生存金受益人</div>
          <div class="live-opts">
            <button class="live-opt ${policy.beneficiaryLiveType==='none'||!policy.beneficiaryLiveType?'active':''}" onclick="setLiveType('none')">無 / 不適用</button>
            <button class="live-opt ${policy.beneficiaryLiveType==='self'?'active':''}" onclick="setLiveType('self')">被保險人本人</button>
            <button class="live-opt ${policy.beneficiaryLiveType==='owner'?'active':''}" onclick="setLiveType('owner')">要保人</button>
            <button class="live-opt ${policy.beneficiaryLiveType==='other'?'active':''}" onclick="setLiveType('other')">其他（指定）</button>
          </div>
          <div id="live-other-input" style="display:${policy.beneficiaryLiveType==='other'?'block':'none'}; margin-bottom:14px;">
            <input type="text" id="live-other-text" value="${policy.beneficiaryLiveOther||''}" placeholder="請輸入生存金受益人姓名" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #ddd;border-radius:6px;outline:none;" />
          </div>
        </div>
        
        <div>
          <div style="font-size:12px;font-weight:500;color:#666;margin-bottom:6px">滿期金受益人</div>
          <div class="mat-opts">
            <button class="mat-opt ${policy.beneficiaryMaturityType==='none'||!policy.beneficiaryMaturityType?'active':''}" onclick="setMatType('none')">無 / 不適用</button>
            <button class="mat-opt ${policy.beneficiaryMaturityType==='self'?'active':''}" onclick="setMatType('self')">被保險人本人</button>
            <button class="mat-opt ${policy.beneficiaryMaturityType==='owner'?'active':''}" onclick="setMatType('owner')">要保人</button>
            <button class="mat-opt ${policy.beneficiaryMaturityType==='other'?'active':''}" onclick="setMatType('other')">其他（指定）</button>
          </div>
          <div id="mat-other-input" style="display:${policy.beneficiaryMaturityType==='other'?'block':'none'}">
            <input type="text" id="mat-other-text" value="${policy.beneficiaryMaturityOther||''}" placeholder="請輸入滿期金受益人姓名" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #ddd;border-radius:6px;outline:none;" />
          </div>
        </div>`;
      }
      html += `</div>`;

      document.getElementById("modal-body").innerHTML = html;
      document.getElementById("edit-modal").style.display = "flex";
    }

    function setLiveType(t) {
      const types = ["none", "self", "owner", "other"];
      document.querySelectorAll(".live-opt").forEach((el, i) => { 
        if(types[i] === t) { el.classList.add("active"); } else { el.classList.remove("active"); }
      });
      document.getElementById("live-other-input").style.display = t==="other"?"block":"none";
    }

    function setMatType(t) {
      const types = ["none", "self", "owner", "other"];
      document.querySelectorAll(".mat-opt").forEach((el, i) => { 
        if(types[i] === t) { el.classList.add("active"); } else { el.classList.remove("active"); }
      });
      document.getElementById("mat-other-input").style.display = t==="other"?"block":"none";
    }

    function closeModal() { document.getElementById("edit-modal").style.display = "none"; }

    function savePolicyBenef() {
      const person = personDataMap[currentPersonId];
      const policy = (person?.policies||[]).find(p=>p.id===currentPolicyId);
      if(!policy) return;

      const rule = BENEF_RULES[policy.category] || { death:"可設定", live:"可設定" };

      // 儲存身故文字框
      if (!policy.isRider && rule.death !== "鎖定本人") {
         policy.beneficiaryDeathText = document.getElementById("death-custom-text")?.value || "";
      }

      // 儲存生存與滿期金
      if (rule.live !== "鎖定本人" && rule.live !== "不適用" && policy.category !== "年金險" && policy.category !== "投資型保險") {
        const liveTypes = ["none", "self", "owner", "other"];
        let lType = "none", mType = "none";
        document.querySelectorAll(".live-opt").forEach((el, i) => { if (el.classList.contains("active")) lType = liveTypes[i]; });
        document.querySelectorAll(".mat-opt").forEach((el, i) => { if (el.classList.contains("active")) mType = liveTypes[i]; });
        
        policy.beneficiaryLiveType = lType;
        policy.beneficiaryLiveOther = (lType === "other") ? (document.getElementById("live-other-text")?.value || "") : "";
        policy.beneficiaryMaturityType = mType;
        policy.beneficiaryMaturityOther = (mType === "other") ? (document.getElementById("mat-other-text")?.value || "") : "";
      }

      closeModal();
      renderPolicyView();
      saveData();
    }

    async function saveData() {
      const person = personDataMap[currentPersonId];
      if(!person) return;
      person.updatedAt = new Date().toISOString();
      try {
        const member = familyData.members.find(m=>m.personId===currentPersonId);
        await callGAS("saveFile", { email: currentUser.email, fileType: "person", fileId: currentPersonId, fileName: member.name+"_"+currentPersonId+".json", content: person });
        sessionStorage.setItem("nbs_person_" + currentPersonId, JSON.stringify(person));
        const hint = document.getElementById("saved-hint");
        hint.style.display="block";
        setTimeout(()=>hint.style.display="none",2000);
      } catch(e) { alert("儲存失敗：" + e.message); }
    }

    function goBack() { window.location.href="family.html"; }
    function callGAS(action,params) {
      if (action === "saveFile") return fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action, ...params }) }).then(r => r.json());
      const url=new URL(GAS_URL); url.searchParams.set("action",action);
      Object.entries(params||{}).forEach(([k,v])=>{
        if(typeof v==="object") url.searchParams.set(k,encodeURIComponent(JSON.stringify(v)));
        else if(v!==null&&v!==undefined) url.searchParams.set(k,v);
      });
      return fetch(url.toString()).then(r=>r.json());
    }

    if (typeof NBS_NAV !== "undefined") { NBS_NAV.init({ page: "beneficiary" }); }
  </script>
  <script src="nav.js"></script>
</body>
</html>
