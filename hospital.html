<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>醫院病房費查詢</title>
  <script src="nav.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;min-height:100vh;color:#1a1a1a}

    .page-wrap{padding:16px;max-width:900px;margin:0 auto;padding-bottom:80px}

    /* ── 頂部標題 ── */
    .page-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .page-hdr-back{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:0;line-height:1}
    .page-hdr-title{font-size:16px;font-weight:600;color:#1a1a1a;flex:1}
    .data-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:#E6F1FB;color:#0C447C}

    /* ── 成員切換 Tab ── */
    .member-tabs{display:flex;gap:0;border-bottom:1px solid #e8e8e8;margin-bottom:16px;overflow-x:auto}
    .member-tab{padding:8px 16px;font-size:12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;color:#888;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
    .member-tab.active{border-bottom-color:#378ADD;color:#378ADD;font-weight:500}

    /* ── 地址卡片 ── */
    .addr-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
    .addr-icon{font-size:20px;flex-shrink:0}
    .addr-info{flex:1}
    .addr-label{font-size:11px;color:#aaa;margin-bottom:2px}
    .addr-text{font-size:14px;font-weight:500;color:#333}
    .addr-text.none{color:#bbb;font-weight:400}

    /* ── 搜尋匹配結果 ── */
    .match-label{font-size:11px;font-weight:600;color:#666;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .match-badge{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500}
    .match-exact{background:#E8F5E9;color:#2E7D32}
    .match-city{background:#FFF8E1;color:#F57F17}
    .match-region{background:#FBE9E7;color:#BF360C}
    .match-avg{background:#f0f0f0;color:#777}

    /* ── 醫院列表 ── */
    .hospital-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
    .hospital-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px 14px;transition:box-shadow .15s}
    .hospital-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .hospital-card.highlighted{border-color:#378ADD;background:#F8FBFF}
    .h-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .h-level{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
    .level-醫學中心{background:#EEEDFE;color:#3C3489}
    .level-區域醫院{background:#E6F1FB;color:#0C447C}
    .level-地區醫院{background:#EAF3DE;color:#27500A}
    .h-name{font-size:13px;font-weight:600;color:#1a1a1a;flex:1}
    .h-location{font-size:11px;color:#aaa}
    .h-rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .room-item{background:#f7f7f5;border-radius:7px;padding:8px 10px;text-align:center}
    .room-label{font-size:10px;color:#aaa;margin-bottom:4px;line-height:1.4}
    .room-val{font-size:14px;font-weight:700;color:#0C447C;font-family:monospace}
    .room-val.null-val{color:#ccc;font-size:12px;font-weight:400}
    .room-unit{font-size:10px;color:#aaa;font-weight:400}

    /* ── 全台平均 ── */
    .avg-section{background:#f7f7f5;border-radius:10px;padding:14px 16px;margin-bottom:16px}
    .avg-title{font-size:11px;font-weight:600;color:#888;margin-bottom:10px;letter-spacing:.05em}
    .avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .avg-item{background:#fff;border-radius:7px;padding:8px 10px;text-align:center;border:1px solid #eee}

    /* ── 篩選列 ── */
    .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .filter-btn{padding:5px 12px;border-radius:99px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;color:#666;font-family:inherit;transition:all .15s}
    .filter-btn.active{background:#0C447C;border-color:#0C447C;color:#fff}

    /* ── 資料來源 ── */
    .data-src{font-size:11px;color:#bbb;text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid #f0f0f0;line-height:1.8}

    /* ── 載入狀態 ── */
    .loading{text-align:center;padding:40px;color:#aaa;font-size:13px}
    .spin{display:inline-block;width:20px;height:20px;border:2px solid #e0e0e0;border-top-color:#378ADD;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes sp{to{transform:rotate(360deg)}}
    .error-box{background:#FEF5F8;border:1px solid #F5C6D2;border-radius:8px;padding:14px;color:#791F1F;font-size:13px;line-height:1.7}
  </style>
</head>
<body>
<div id="nbs-mobile-hdr"></div>
<div style="display:flex;min-height:100vh">
  <div id="nbs-sidebar"></div>
  <div style="flex:1;min-width:0">
    <div class="page-wrap">

      <div class="page-hdr">
        <button class="page-hdr-back" onclick="history.back()">‹</button>
        <div class="page-hdr-title">🏥 醫院病房費查詢</div>
        <span class="data-badge" id="data-badge">載入中…</span>
      </div>

      <div id="member-tabs" class="member-tabs"></div>
      <div id="main-content">
        <div class="loading"><span class="spin"></span>從雲端讀取醫院資料中…</div>
      </div>

    </div>
  </div>
</div>
<div id="nbs-bottom-tab"></div>

<script>
// ── 設定 ─────────────────────────────────────────────────────
var GDRIVE_FILE_ID = "1Jw0Jbo9AOZg7lwdd7Bs-Pd-BXQxuFoag";
var GDRIVE_URL = "https://www.googleapis.com/drive/v3/files/" + GDRIVE_FILE_ID + "?alt=media&key=AIzaSyD-placeholder";
// Google Drive 公開檔案可用此格式直接下載（無需 API key）
var DIRECT_URL = "https://drive.google.com/uc?export=download&id=" + GDRIVE_FILE_ID;
// CORS proxy 備援
var PROXY_URL = "https://corsproxy.io/?" + encodeURIComponent(DIRECT_URL);

var hospitalsData = null;
var members = [];
var currentMemberId = null;
var activeFilter = "all"; // all / 醫學中心 / 區域醫院 / 地區醫院

// ── 啟動 ─────────────────────────────────────────────────────
window.addEventListener("nbs_nav_ready", function(e) {
  var detail = e.detail;
  if (!detail.familyData) {
    showError("無法載入家庭資料，請確認已進入家庭保單。");
    return;
  }
  // 只取非 beneficiary_only 成員
  members = (detail.familyData.members || []).filter(function(m){
    return m.role !== "beneficiary_only";
  });
  currentMemberId = members.length > 0 ? members[0].personId : null;
  renderTabs();
  loadHospitals();
});

// ── 讀取醫院資料 ─────────────────────────────────────────────
function loadHospitals() {
  // 嘗試直接下載，若 CORS 失敗改走 proxy
  fetch(DIRECT_URL)
    .then(function(r){
      if (!r.ok) throw new Error("direct failed");
      return r.json();
    })
    .catch(function(){
      return fetch(PROXY_URL).then(function(r){ return r.json(); });
    })
    .then(function(data){
      hospitalsData = data;
      var badge = document.getElementById("data-badge");
      if (badge) badge.textContent = "更新：" + (data.updated || "—");
      renderContent();
    })
    .catch(function(err){
      showError("無法載入醫院資料。<br>請確認 Google Drive 檔案已設為「知道連結的任何人可檢視」。<br><small style='color:#aaa'>錯誤：" + err.message + "</small>");
    });
}

// ── 成員 Tab ─────────────────────────────────────────────────
function renderTabs() {
  var el = document.getElementById("member-tabs");
  if (!el) return;
  el.innerHTML = members.map(function(m){
    var active = m.personId === currentMemberId;
    return '<button class="member-tab'+(active?" active":"")+'" onclick="switchMember(\''+m.personId+'\')">'+m.name+'</button>';
  }).join("");
}

function switchMember(pid) {
  currentMemberId = pid;
  renderTabs();
  renderContent();
}

// ── 主內容渲染 ───────────────────────────────────────────────
function renderContent() {
  if (!hospitalsData) return;
  var el = document.getElementById("main-content");
  var member = members.find(function(m){ return m.personId === currentMemberId; });
  if (!member) { el.innerHTML = '<div class="loading">無成員資料</div>'; return; }

  // 取得地址
  var addr = (member.address || "").trim();
  var city = member.addressCity || extractCity(addr);
  var district = member.addressDistrict || extractDistrict(addr);

  // 比對醫院
  var matched = matchHospitals(city, district);

  // 計算全台平均
  var avg = calcAverage(hospitalsData.hospitals);

  var html = "";

  // 地址卡片
  html += '<div class="addr-card">';
  html += '<div class="addr-icon">📍</div>';
  html += '<div class="addr-info">';
  html += '<div class="addr-label">'+member.name+'　的地址</div>';
  if (addr) {
    html += '<div class="addr-text">'+addr+'</div>';
    if (city) html += '<div style="font-size:11px;color:#888;margin-top:2px">搜尋範圍：'+city+(district?" · "+district:"")+'</div>';
  } else {
    html += '<div class="addr-text none">尚未設定地址，顯示全台資料</div>';
    html += '<div style="font-size:11px;color:#aaa;margin-top:2px">可在「家庭成員管理」中設定地址</div>';
  }
  html += '</div></div>';

  // 篩選列
  html += '<div class="filter-bar">';
  var filters = ["all","醫學中心","區域醫院","地區醫院"];
  var filterLabels = {"all":"全部","醫學中心":"醫學中心","區域醫院":"區域醫院","地區醫院":"地區醫院"};
  filters.forEach(function(f){
    html += '<button class="filter-btn'+(activeFilter===f?" active":"")+'" onclick="setFilter(\''+f+'\')">'+filterLabels[f]+'</button>';
  });
  html += '</div>';

  // 匹配結果區塊
  if (addr && city) {
    // 同區
    if (matched.district.length > 0) {
      html += renderGroup("📍 同區醫院（"+district+"）", matched.district, "match-exact", "精確");
    }
    // 同市（排除已出現）
    var shownIds = matched.district.map(function(h){return h.id;});
    var cityOnly = matched.city.filter(function(h){return shownIds.indexOf(h.id)<0;});
    if (cityOnly.length > 0) {
      html += renderGroup("🏙 同市其他醫院（"+city+"）", cityOnly, "match-city", "同市");
    }
    // 同大區
    var shownIds2 = shownIds.concat(matched.city.map(function(h){return h.id;}));
    var regionOnly = matched.region.filter(function(h){return shownIds2.indexOf(h.id)<0;});
    if (regionOnly.length > 0) {
      html += renderGroup("🗺 同大區醫院（"+matched.regionName+"）", regionOnly, "match-region", "同區域");
    }
  } else {
    // 無地址 → 全部
    html += renderGroup("🏥 全台醫院", hospitalsData.hospitals, "match-avg", "全台");
  }

  // 全台平均
  html += '<div class="avg-section">';
  html += '<div class="avg-title">📊 全台平均病房差額（' + hospitalsData.hospitals.length + '家醫院）</div>';
  html += '<div class="avg-grid">';
  html += avgItem("套房/豪華單人", avg.single_hi);
  html += avgItem("一人房", avg.single);
  html += avgItem("二人房", avg.double);
  html += '</div></div>';

  // 資料來源
  html += '<div class="data-src">';
  html += '資料來源：' + (hospitalsData.source || "—") + '<br>';
  html += '最後更新：' + (hospitalsData.updated || "—") + '　·　共 ' + hospitalsData.hospitals.length + ' 家醫院';
  html += '</div>';

  el.innerHTML = html;
}

function renderGroup(title, hospitals, badgeClass, badgeText) {
  var filtered = activeFilter === "all" ? hospitals : hospitals.filter(function(h){ return h.level === activeFilter; });
  if (filtered.length === 0) return "";

  var html = '<div class="match-label">'+title+'<span class="match-badge '+badgeClass+'">'+badgeText+'</span></div>';
  html += '<div class="hospital-list">';
  filtered.forEach(function(h){
    html += '<div class="hospital-card">';
    html += '<div class="h-header">';
    html += '<span class="h-level level-'+h.level+'">'+h.level+'</span>';
    html += '<span class="h-name">'+h.name+'</span>';
    html += '<span class="h-location">'+h.city+' · '+h.district+'</span>';
    html += '</div>';
    html += '<div class="h-rooms">';
    html += roomItem("套房/豪華單人", h.rooms.single_hi, "元/日");
    html += roomItem("一人房差額", h.rooms.single, "元/日");
    html += roomItem("二人房差額", h.rooms.double, "元/日");
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function roomItem(label, val, unit) {
  if (val === null || val === undefined) {
    return '<div class="room-item"><div class="room-label">'+label+'</div><div class="room-val null-val">無資料</div></div>';
  }
  return '<div class="room-item"><div class="room-label">'+label+'</div><div class="room-val">'+val.toLocaleString()+'<span class="room-unit"> '+unit+'</span></div></div>';
}

function avgItem(label, val) {
  return '<div class="avg-item"><div class="room-label">'+label+'</div><div class="room-val">'+(val?Math.round(val).toLocaleString():"—")+'<span class="room-unit"> 元/日</span></div></div>';
}

// ── 地址比對邏輯 ─────────────────────────────────────────────
function matchHospitals(city, district) {
  var hospitals = hospitalsData.hospitals;
  var regionName = "";
  // 找出該城市所屬大區
  if (city) {
    var found = hospitals.find(function(h){ return h.city === city; });
    if (found) regionName = found.region;
  }
  return {
    district: district ? hospitals.filter(function(h){ return h.city===city && h.district===district; }) : [],
    city:     city     ? hospitals.filter(function(h){ return h.city===city; }) : [],
    region:   regionName ? hospitals.filter(function(h){ return h.region===regionName; }) : [],
    regionName: regionName
  };
}

function calcAverage(hospitals) {
  function avg(key) {
    var vals = hospitals.map(function(h){ return h.rooms[key]; }).filter(function(v){ return v !== null && v !== undefined; });
    if (!vals.length) return null;
    return vals.reduce(function(a,b){return a+b;},0) / vals.length;
  }
  return { single_hi: avg("single_hi"), single: avg("single"), double: avg("double") };
}

function extractCity(addr) {
  if (!addr) return "";
  var m = addr.match(/^(.{2,3}[市縣])/);
  return m ? m[1] : "";
}

function extractDistrict(addr) {
  if (!addr) return "";
  var m = addr.match(/[市縣](.{2,3}[區鄉鎮市])/);
  return m ? m[1] : "";
}

// ── 篩選切換 ─────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  renderContent();
}

// ── 錯誤顯示 ─────────────────────────────────────────────────
function showError(msg) {
  var el = document.getElementById("main-content");
  if (el) el.innerHTML = '<div class="error-box">⚠️ ' + msg + '</div>';
}
</script>
</body>
</html>
