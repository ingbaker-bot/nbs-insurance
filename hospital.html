  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;min-height:100vh;color:#1a1a1a}
    .page-wrap{padding:16px;max-width:900px;margin:0 auto;padding-bottom:80px}
    .page-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .page-hdr-back{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:0;line-height:1}
    .page-hdr-title{font-size:16px;font-weight:600;flex:1}
    .data-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:#E6F1FB;color:#0C447C;cursor:pointer}
    .member-tabs{display:flex;border-bottom:1px solid #e8e8e8;margin-bottom:16px;overflow-x:auto}
    .member-tab{padding:8px 16px;font-size:12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;color:#888;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
    .member-tab.active{border-bottom-color:#378ADD;color:#378ADD;font-weight:500}
    .addr-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
    .addr-icon{font-size:20px;flex-shrink:0}
    .addr-info{flex:1}
    .addr-label{font-size:11px;color:#aaa;margin-bottom:2px}
    .addr-text{font-size:14px;font-weight:500;color:#333}
    .addr-text.none{color:#bbb;font-weight:400}
    .match-label{font-size:11px;font-weight:600;color:#555;letter-spacing:.05em;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
    .match-badge{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500}
    .match-exact{background:#E8F5E9;color:#2E7D32}
    .match-city{background:#FFF8E1;color:#F57F17}
    .match-region{background:#FBE9E7;color:#BF360C}
    .match-avg{background:#f0f0f0;color:#777}
    .hospital-list{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
    .hospital-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px 14px}
    .h-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .h-level{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
    .level-醫學中心{background:#EEEDFE;color:#3C3489}
    .level-區域醫院{background:#E6F1FB;color:#0C447C}
    .level-地區醫院{background:#EAF3DE;color:#27500A}
    .h-name{font-size:13px;font-weight:600;flex:1}
    .h-location{font-size:11px;color:#aaa}
    .h-rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .room-item{background:#f7f7f5;border-radius:7px;padding:8px 10px;text-align:center}
    .room-label{font-size:10px;color:#aaa;margin-bottom:4px;line-height:1.4}
    .room-val{font-size:14px;font-weight:700;color:#0C447C;font-family:monospace}
    .room-val.null-val{color:#ccc;font-size:12px;font-weight:400}
    .room-unit{font-size:10px;color:#aaa;font-weight:400}
    .avg-section{background:#f7f7f5;border-radius:10px;padding:14px 16px;margin:16px 0}
    .avg-title{font-size:11px;font-weight:600;color:#888;margin-bottom:10px;letter-spacing:.05em}
    .avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .avg-item{background:#fff;border-radius:7px;padding:8px 10px;text-align:center;border:1px solid #eee}
    .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .filter-btn{padding:5px 12px;border-radius:99px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;color:#666;font-family:inherit}
    .filter-btn.active{background:#0C447C;border-color:#0C447C;color:#fff}
    .data-src{font-size:11px;color:#bbb;text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid #f0f0f0;line-height:1.8}
    .loading{text-align:center;padding:40px;color:#aaa;font-size:13px}
    .spin{display:inline-block;width:18px;height:18px;border:2px solid #e0e0e0;border-top-color:#378ADD;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes sp{to{transform:rotate(360deg)}}
    .src-tag{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px}
    .src-live{background:#E8F5E9;color:#2E7D32}
    .src-local{background:#FFF8E1;color:#856404}

    /* ── 管理員介面 ── */
    .admin-btn{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid #ddd;background:#fff;color:#aaa;cursor:pointer;font-family:inherit}
    .admin-btn:hover{border-color:#378ADD;color:#378ADD}
    .admin-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;overflow-y:auto;padding:20px}
    .admin-panel.open{display:flex;align-items:flex-start;justify-content:center}
    .admin-box{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px;margin:auto}
    .admin-title{font-size:15px;font-weight:600;color:#0C447C;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
    .admin-close{background:none;border:none;font-size:22px;color:#aaa;cursor:pointer;line-height:1}
    .admin-section{margin-bottom:20px}
    .admin-section-title{font-size:12px;font-weight:600;color:#555;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #f0f0f0}
    .admin-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .admin-form-row.trio{grid-template-columns:1fr 1fr 1fr}
    .admin-lbl{font-size:11px;color:#888;margin-bottom:3px}
    .admin-input{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;outline:none}
    .admin-input:focus{border-color:#378ADD}
    .admin-select{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;outline:none;background:#fff}
    .admin-add-btn{width:100%;padding:9px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px}
    .admin-add-btn:hover{background:#2a6fb5}
    .admin-list{max-height:240px;overflow-y:auto;border:1px solid #f0f0f0;border-radius:8px}
    .admin-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f7f7f7;font-size:12px}
    .admin-item:last-child{border-bottom:none}
    .admin-item-name{flex:1;font-weight:500;color:#333}
    .admin-item-meta{font-size:11px;color:#aaa}
    .admin-item-del{background:none;border:none;color:#F44336;font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
    .admin-export-btn{width:100%;padding:11px;background:#27AE8F;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
    .admin-export-btn:hover{background:#1e8a70}
    .admin-note{font-size:11px;color:#aaa;text-align:center;margin-top:8px;line-height:1.7}
    .admin-lock{background:#f7f7f5;border-radius:10px;padding:20px;text-align:center}
    .admin-lock-title{font-size:14px;font-weight:600;color:#333;margin-bottom:12px}
    .admin-pw-row{display:flex;gap:8px;max-width:300px;margin:0 auto}
    .admin-pw-input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;outline:none}
    .admin-pw-btn{padding:8px 16px;background:#378ADD;color:#fff;border:none;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit}
    .admin-err{font-size:12px;color:#F44336;margin-top:8px}
  </style>

<div class="page-wrap">
      <div class="page-hdr">
        <button class="page-hdr-back" onclick="history.back()">‹</button>
        <div class="page-hdr-title">🏥 醫院病房費查詢</div>

        <button class="admin-btn" onclick="openAdmin()">⚙ 管理</button>

<!-- ── 管理員面板 ── -->
<div class="admin-panel" id="admin-panel">
  <div class="admin-box">
    <div class="admin-title">⚙ 醫院資料管理
      <button class="admin-close" onclick="closeAdmin()">×</button>
    </div>
    <!-- 密碼鎖 -->
    <div id="admin-lock">
      <div class="admin-lock">
        <div class="admin-lock-title">🔒 管理員專區</div>
        <div class="admin-pw-row">
          <input class="admin-pw-input" type="password" id="admin-pw" placeholder="輸入管理密碼" onkeydown="if(event.key==='Enter')checkPw()">
          <button class="admin-pw-btn" onclick="checkPw()">進入</button>
        </div>
        <div id="admin-pw-err" class="admin-err"></div>
        <div style="font-size:11px;color:#bbb;margin-top:12px">此功能限管理員使用，資料異動需重新上傳 hospitals.json 至 GitHub</div>
      </div>
    </div>
    <!-- 管理內容（解鎖後顯示）-->
    <div id="admin-content" style="display:none">
      <!-- 新增醫院 -->
      <div class="admin-section">
        <div class="admin-section-title">➕ 新增 / 編輯醫院</div>
        <div class="admin-form-row">
          <div><div class="admin-lbl">醫院名稱 *</div><input class="admin-input" id="f-name" placeholder="例：台大醫院"></div>
          <div><div class="admin-lbl">醫院等級 *</div>
            <select class="admin-select" id="f-level">
              <option value="醫學中心">醫學中心</option>
              <option value="區域醫院">區域醫院</option>
              <option value="地區醫院">地區醫院</option>
            </select>
          </div>
        </div>
        <div class="admin-form-row">
          <div><div class="admin-lbl">縣市 *</div><input class="admin-input" id="f-city" placeholder="例：台北市"></div>
          <div><div class="admin-lbl">區鄉鎮 *</div><input class="admin-input" id="f-district" placeholder="例：中正區"></div>
        </div>
        <div class="admin-form-row">
          <div><div class="admin-lbl">大區域</div>
            <select class="admin-select" id="f-region">
              <option value="大台北地區">大台北地區</option>
              <option value="北部地區">北部地區</option>
              <option value="中部地區">中部地區</option>
              <option value="南部地區">南部地區</option>
              <option value="宜花東地區">宜花東地區</option>
            </select>
          </div>
        </div>
        <div class="admin-section-title" style="margin-top:12px">病房差額（元/日，留空表示無資料）</div>
        <div class="admin-form-row trio">
          <div><div class="admin-lbl">套房/豪華單人</div><input class="admin-input" id="f-single-hi" type="number" placeholder="例：8000"></div>
          <div><div class="admin-lbl">一人房</div><input class="admin-input" id="f-single" type="number" placeholder="例：3500"></div>
          <div><div class="admin-lbl">二人房</div><input class="admin-input" id="f-double" type="number" placeholder="例：2000"></div>
        </div>
        <button class="admin-add-btn" onclick="addHospital()">➕ 加入醫院資料</button>
        <div id="admin-add-msg" style="font-size:12px;color:#27AE8F;margin-top:6px;text-align:center"></div>
      </div>
      <!-- 現有資料列表 -->
      <div class="admin-section">
        <div class="admin-section-title">📋 目前資料（<span id="admin-count">0</span> 家醫院）
          <input id="admin-search" type="text" placeholder="搜尋醫院名稱…" style="margin-left:8px;padding:3px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px;outline:none" oninput="renderAdminList()">
        </div>
        <div class="admin-list" id="admin-list"></div>
      </div>
      <!-- 匯出 -->
      <div class="admin-section">
        <div class="admin-section-title">📥 匯出更新後的資料</div>
        <button class="admin-export-btn" onclick="exportJson()">⬇ 下載 hospitals.json</button>
        <div class="admin-note">
          下載後，請上傳至 GitHub repo 根目錄（覆蓋舊檔）<br>
          所有使用者下次開啟頁面即自動取得最新資料
        </div>
      </div>
    </div>
  </div>
</div>

// ── 設定 ─────────────────────────────────────────────────────
var GDRIVE_FILE_ID = "1Jw0Jbo9AOZg7lwdd7Bs-Pd-BXQxuFoag";
var hospitalsData = null;
var members = [];
var currentMemberId = null;
var activeFilter = "all";
var manualAddr = "";
var searchMode = "addr"; // "addr" or "name"
var nameQuery = "";

function searchAddr() {
  var input = document.getElementById("addr-input");
  if (!input) return;
  var val = input.value.trim();
  // 判斷是地址還是醫院名稱：包含醫院/診所/醫學/醫療等字樣 → 名稱搜尋
  if (val && (val.match(/醫院|診所|醫學|醫療|榮總|慈濟|馬偕|長庚|台大|成大|高醫|奇美|秀傳|基督教|天主教|聖母|博愛|仁愛|耕莘|亞東|安泰|澄清|童綜合|阮綜/) || isHospitalName(val))) {
    searchMode = "name";
    nameQuery = val;
  } else {
    searchMode = "addr";
    manualAddr = val;
    nameQuery = "";
  }
  renderContent();
}

function isHospitalName(val) {
  // 檢查是否為醫院名稱片段（非地址格式）
  if (!hospitalsData) return false;
  return hospitalsData.hospitals.some(function(h){
    return h.name.indexOf(val) >= 0;
  });
}
var dataSource = "local"; // "live" or "local"

// ── nav ready ─────────────────────────────────────────────────
// 同時監聽事件與 DOMContentLoaded，以防事件已在頁面載入前觸發
var navReady = false;
function onNavReady(detail) {
  if (navReady) return;
  navReady = true;
  var fd = detail && detail.familyData;
  members = fd ? (fd.members || []).filter(function(m){ return m.role !== "beneficiary_only"; }) : [];
  currentMemberId = members.length > 0 ? members[0].personId : null;
  renderTabs();
  loadHospitals();
}

window.addEventListener("nbs_nav_ready", function(e){ onNavReady(e.detail); });

// 保護：若 3 秒後 nav 還沒 ready，用空成員繼續
setTimeout(function(){
  if (!navReady) {
    // 嘗試直接讀取
    if (window.NBS_NAV && NBS_NAV.getFamilyData) {
      onNavReady({ familyData: NBS_NAV.getFamilyData() });
    } else {
      onNavReady({ familyData: null });
    }
  }
}, 3000);

// ── 讀取醫院資料：先用內嵌立即顯示，背景嘗試 Drive 更新 ────
function loadHospitals() {
  // 立即用內嵌資料顯示，不讓使用者等待
  hospitalsData = FALLBACK_DATA;
  dataSource = "local";
  updateBadge();
  renderContent();

  // 背景嘗試從同 repo 的 hospitals.json 取得最新版
  // 只在確定存在時才 fetch（將 hospitals.json 上傳到 GitHub repo 後自動生效）
  var _fetchDone = false;
  var _fetchTimer = setTimeout(function(){
    if (!_fetchDone) _fetchDone = true; // timeout 保護
  }, 1500);
  fetch("hospitals.json", { cache: "no-cache" })
    .then(function(r){ _fetchDone = true; clearTimeout(_fetchTimer); if (!r.ok) throw new Error("not found " + r.status); return r.json(); })
    .then(function(data){
      if (!data.hospitals) throw new Error("invalid");
      hospitalsData = data;
      dataSource = "live";
      updateBadge();
      renderContent();
    })
    .catch(function(e){
      _fetchDone = true;
      clearTimeout(_fetchTimer);
      // 404 = 檔案不存在，靜默略過；其他錯誤也靜默
    });
}

function reloadFromDrive() {
  navReady = true; // 防止重複觸發
  loadHospitals();
}

function updateBadge() {
  var b = document.getElementById("data-badge");
  if (!b) return;
  if (dataSource === "live") {
    b.innerHTML = '更新：' + (hospitalsData.updated||"—") + '<span class="src-tag src-live">雲端</span>';
  } else {
    b.innerHTML = '內嵌資料 ' + (hospitalsData.updated||"") + '<span class="src-tag src-local">本機</span>';
  }
}

// ── Tab ──────────────────────────────────────────────────────
function renderTabs() {
  var el = document.getElementById("member-tabs");
  if (!el) return;
  if (!members.length) { el.style.display = "none"; return; }
  el.innerHTML = members.map(function(m){
    return '<button class="member-tab'+(m.personId===currentMemberId?" active":"")+'" onclick="switchMember(\''+m.personId+'\')">'+m.name+'</button>';
  }).join("");
}

function switchMember(pid) {
  currentMemberId = pid;
  renderTabs();
  renderContent();
}

// ── 主內容 ───────────────────────────────────────────────────
function renderContent() {
  var el = document.getElementById("main-content");
  var member = members.find(function(m){ return m.personId === currentMemberId; });
  var memberName = member ? member.name : "查詢者";
  var addr = manualAddr || (member ? (member.address || "").trim() : "");
  var city = extractCity(addr);
  var district = extractDistrict(addr);
  var avg = calcAverage(hospitalsData.hospitals);
  var html = "";

  // ── 搜尋框（通用：地址 or 醫院名稱）──
  var inputVal = searchMode === "name" ? nameQuery : addr;
  html += '<div class="addr-card"><div class="addr-icon">'+(searchMode==="name"?"🔍":"📍")+'</div><div class="addr-info">';
  html += '<div class="addr-label">' + memberName + ' · 地址或醫院名稱</div>';
  if (inputVal) {
    html += '<div class="addr-text">' + inputVal + '</div>';
    if (searchMode === "addr" && city) html += '<div style="font-size:11px;color:#888;margin-top:2px">搜尋：' + city + (district?" · "+district:"") + '</div>';
    if (searchMode === "name") html += '<div style="font-size:11px;color:#378ADD;margin-top:2px">醫院名稱搜尋</div>';
  }
  html += '<div style="margin-top:8px;display:flex;gap:6px">';
  html += '<input id="addr-input" type="text" value="'+inputVal.replace(/"/g,"&quot;")+'" placeholder="地址（板橋、高雄市…）或醫院名（長庚、榮總…）" style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:7px;font-size:12px;font-family:inherit;outline:none" onkeydown="if(event.key===\'Enter\')searchAddr()">';
  html += '<button onclick="searchAddr()" style="padding:6px 14px;background:#378ADD;color:#fff;border:none;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap">查詢</button>';
  html += '</div></div></div>';

  // ── 篩選列 ──
  html += '<div class="filter-bar">';
  [{k:"all",l:"全部"},{k:"醫學中心",l:"醫學中心"},{k:"區域醫院",l:"區域醫院"},{k:"地區醫院",l:"地區醫院"}].forEach(function(f){
    html += '<button class="filter-btn'+(activeFilter===f.k?" active":"")+'" onclick="setFilter(\''+f.k+'\')">'+f.l+'</button>';
  });
  html += '</div>';

  // ── 名稱搜尋模式 ──
  if (searchMode === "name" && nameQuery) {
    var results = hospitalsData.hospitals.filter(function(h){
      return h.name.indexOf(nameQuery) >= 0;
    });
    var filtered = activeFilter === "all" ? results : results.filter(function(h){ return h.level === activeFilter; });
    if (filtered.length === 0) {
      html += '<div style="padding:24px;text-align:center;color:#aaa;font-size:13px">查無「' + nameQuery + '」相關醫院</div>';
    } else {
      html += '<div class="match-label">🔍 「' + nameQuery + '」搜尋結果<span class="match-badge match-exact">' + filtered.length + ' 家</span></div>';
      html += '<div class="hospital-list">';
      filtered.forEach(function(h){ html += renderHospitalCard(h); });
      html += '</div>';
    }
  } else {
    // ── 地址模式 ──
    var matched = matchHospitals(city, district);
    if (addr && city) {
      var shownIds = [];
      if (matched.district.length) {
        html += renderGroup("📍 同區醫院（" + district + "）", matched.district, "match-exact", "精確");
        matched.district.forEach(function(h){ shownIds.push(h.id); });
      }
      var cityOnly = matched.city.filter(function(h){ return shownIds.indexOf(h.id) < 0; });
      if (cityOnly.length) {
        html += renderGroup("🏙 同市其他醫院（" + city + "）", cityOnly, "match-city", "同市");
        cityOnly.forEach(function(h){ shownIds.push(h.id); });
      }
      var regionOnly = matched.region.filter(function(h){ return shownIds.indexOf(h.id) < 0; });
      if (regionOnly.length) {
        html += renderGroup("🗺 同大區醫院（" + matched.regionName + "）", regionOnly, "match-region", "同大區");
      }
      if (!matched.district.length && !cityOnly.length && !regionOnly.length) {
        html += '<div style="padding:20px;text-align:center;color:#aaa;font-size:13px">查無鄰近醫院資料，顯示全台列表</div>';
        html += renderGroup("🏥 全台醫院", hospitalsData.hospitals, "match-avg", "全台");
      }
    } else {
      html += renderGroup("🏥 全台醫院", hospitalsData.hospitals, "match-avg", "全台");
    }
  }

  // ── 全台平均 ──
  html += '<div class="avg-section"><div class="avg-title">📊 全台平均病房差額（' + hospitalsData.hospitals.length + ' 家醫院）</div>';
  html += '<div class="avg-grid">' + avgItem("套房/豪華單人", avg.single_hi) + avgItem("一人房", avg.single) + avgItem("二人房", avg.double) + '</div></div>';
  html += '<div class="data-src">資料來源：' + (hospitalsData.source||"—") + '<br>最後更新：' + (hospitalsData.updated||"—") + '　·　共 ' + hospitalsData.hospitals.length + ' 家醫院</div>';
  el.innerHTML = html;
}

function renderHospitalCard(h) {
  var html = '<div class="hospital-card"><div class="h-header">';
  html += '<span class="h-level level-' + h.level + '">' + h.level + '</span>';
  html += '<span class="h-name">' + h.name + '</span>';
  html += '<span class="h-location">' + h.city + ' · ' + h.district + '</span>';
  html += '</div><div class="h-rooms">';
  html += roomItem("套房/豪華單人", h.rooms.single_hi);
  html += roomItem("一人房差額", h.rooms.single);
  html += roomItem("二人房差額", h.rooms.double);
  html += '</div></div>';
  return html;
}

function renderGroup(title, hospitals, badgeClass, badgeText) {
  var list = activeFilter === "all" ? hospitals : hospitals.filter(function(h){ return h.level === activeFilter; });
  if (!list.length) return "";
  var html = '<div class="match-label">' + title + '<span class="match-badge ' + badgeClass + '">' + badgeText + '</span></div>';
  html += '<div class="hospital-list">';
  list.forEach(function(h){ html += renderHospitalCard(h); });
  html += '</div>';
  return html;
}

function roomItem(label, val) {
  if (val === null || val === undefined)
    return '<div class="room-item"><div class="room-label">' + label + '</div><div class="room-val null-val">無資料</div></div>';
  return '<div class="room-item"><div class="room-label">' + label + '</div><div class="room-val">' + val.toLocaleString() + '<span class="room-unit"> 元/日</span></div></div>';
}

function avgItem(label, val) {
  return '<div class="avg-item"><div class="room-label">' + label + '</div><div class="room-val">' + (val ? Math.round(val).toLocaleString() : "—") + '<span class="room-unit"> 元/日</span></div></div>';
}

function matchHospitals(city, district) {
  var h = hospitalsData.hospitals;
  var regionName = "";
  if (city) { var f = h.find(function(x){ return x.city===city; }); if(f) regionName = f.region; }
  return {
    district: district ? h.filter(function(x){ return x.city===city && x.district===district; }) : [],
    city:     city     ? h.filter(function(x){ return x.city===city; }) : [],
    region:   regionName ? h.filter(function(x){ return x.region===regionName; }) : [],
    regionName: regionName
  };
}

function calcAverage(hospitals) {
  function avg(key) {
    var vals = hospitals.map(function(h){ return h.rooms[key]; }).filter(function(v){ return v!=null; });
    return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
  }
  return { single_hi: avg("single_hi"), single: avg("single"), double: avg("double") };
}

// ── 城市名稱標準化對照 ──────────────────────────────────────
var CITY_ALIASES = {
  "台北":"台北市","臺北":"台北市","新北":"新北市","桃園":"桃園市",
  "台中":"台中市","臺中":"台中市","台南":"台南市","臺南":"台南市",
  "高雄":"高雄市","基隆":"基隆市","新竹市":"新竹市","新竹縣":"新竹縣",
  "新竹":"新竹市","苗栗":"苗栗縣","彰化":"彰化縣","南投":"南投縣",
  "雲林":"雲林縣","嘉義市":"嘉義市","嘉義縣":"嘉義縣","嘉義":"嘉義市",
  "屏東":"屏東縣","宜蘭":"宜蘭縣","花蓮":"花蓮縣","台東":"台東縣",
  "臺東":"台東縣","澎湖":"澎湖縣","金門":"金門縣","連江":"連江縣"
};

function normalizeCity(raw) {
  if (!raw) return "";
  // 已是完整城市名
  if (raw.match(/^.{2,3}[市縣]$/)) return raw;
  // 查對照表
  return CITY_ALIASES[raw] || raw;
}

// ── 地址解析（支援多種輸入格式）────────────────────────────
function buildDistrictMap() {
  var map = {};
  if (!hospitalsData) return map;
  hospitalsData.hospitals.forEach(function(h){
    if (h.district && h.city) map[h.district] = h.city;
  });
  return map;
}

function extractCity(addr) {
  if (!addr) return "";
  addr = addr.trim();
  // 完整地址：台北市信義區…
  var m = addr.match(/^(.{2,3}[市縣])/);
  if (m) return m[1];
  // 只輸入縣市（含不完整如「高雄」）
  var normalized = normalizeCity(addr);
  if (normalized !== addr && normalized.match(/[市縣]$/)) return normalized;
  // 只輸入區（含「區」字）：板橋區 → 從醫院資料反查城市
  var districtMap = buildDistrictMap();
  var distOnly = addr.match(/^(.{2,4}[區鄉鎮市])$/);
  if (distOnly && districtMap[distOnly[1]]) return districtMap[distOnly[1]];
  // 模糊匹配：輸入「板橋」→ 找 districtMap 中包含「板橋」的 key
  if (addr.length >= 2) {
    for (var dk in districtMap) {
      if (dk.indexOf(addr) === 0 || addr.indexOf(dk.replace(/[區鄉鎮市]$/,"")) === 0) {
        return districtMap[dk];
      }
    }
  }
  // 從地址中間找市縣
  m = addr.match(/([^\s]{2,3}[市縣])/);
  if (m) return m[1];
  // 最後嘗試對照表（允許輸入「高雄」等不含市縣字的簡稱）
  for (var alias in CITY_ALIASES) {
    if (addr.startsWith(alias)) return CITY_ALIASES[alias];
  }
  return "";
}

function extractDistrict(addr) {
  if (!addr) return "";
  // 完整地址中的區
  var m = addr.match(/[市縣](.{2,4}[區鄉鎮市])/);
  if (m) return m[1];
  // 只輸入區名（含「區」字）
  m = addr.match(/^(.{2,4}[區鄉鎮市])$/);
  if (m) return m[1];
  // 模糊匹配：輸入「板橋」→ 找 districtMap 中開頭匹配的 key
  if (addr.length >= 2) {
    var districtMap = buildDistrictMap();
    for (var dk in districtMap) {
      if (dk.indexOf(addr) === 0) return dk;
    }
  }
  return "";
}
function setFilter(f) { activeFilter = f; renderContent(); }

// ── 管理員功能 ───────────────────────────────────────────────
var ADMIN_PW = "NBS2024"; // ← 可自行修改
var adminUnlocked = false;
var editingId = null;

function openAdmin() {
  document.getElementById("admin-panel").classList.add("open");
  if (adminUnlocked) renderAdminList();
}
function closeAdmin() {
  document.getElementById("admin-panel").classList.remove("open");
  editingId = null;
}
function checkPw() {
  var pw = document.getElementById("admin-pw").value;
  if (pw === ADMIN_PW) {
    adminUnlocked = true;
    document.getElementById("admin-lock").style.display = "none";
    document.getElementById("admin-content").style.display = "block";
    renderAdminList();
  } else {
    document.getElementById("admin-pw-err").textContent = "密碼錯誤，請再試一次";
    document.getElementById("admin-pw").value = "";
  }
}
function renderAdminList() {
  var q = (document.getElementById("admin-search").value || "").trim();
  var list = hospitalsData.hospitals.filter(function(h){ return !q || h.name.indexOf(q) >= 0; });
  document.getElementById("admin-count").textContent = hospitalsData.hospitals.length;
  document.getElementById("admin-list").innerHTML = list.map(function(h){
    return '<div class="admin-item">' +
      '<span class="admin-item-name">' + h.name + '</span>' +
      '<span class="admin-item-meta">' + h.city + ' · ' + h.district + '</span>' +
      '<span class="admin-item-meta" style="margin-left:4px">' + (h.rooms.single ? h.rooms.single.toLocaleString()+'元' : '—') + '</span>' +
      '<button class="admin-item-del" onclick="editHospital(\''+h.id+'\')" title="編輯">✏️</button>' +
      '<button class="admin-item-del" onclick="deleteHospital(\''+h.id+'\')" title="刪除">🗑</button>' +
    '</div>';
  }).join("") || '<div style="padding:16px;text-align:center;color:#bbb;font-size:12px">無符合資料</div>';
}
function addHospital() {
  var name = document.getElementById("f-name").value.trim();
  var level = document.getElementById("f-level").value;
  var city = document.getElementById("f-city").value.trim();
  var district = document.getElementById("f-district").value.trim();
  var region = document.getElementById("f-region").value;
  var shi = document.getElementById("f-single-hi").value;
  var si  = document.getElementById("f-single").value;
  var di  = document.getElementById("f-double").value;
  var msg = document.getElementById("admin-add-msg");
  if (!name || !city || !district) {
    msg.style.color = "#F44336";
    msg.textContent = "請填寫醫院名稱、縣市、區鄉鎮";
    return;
  }
  var newH = { id: editingId || ("h"+String(Date.now()).slice(-6)), name:name, level:level, region:region, city:city, district:district,
    rooms:{ single_hi: shi?parseInt(shi):null, single: si?parseInt(si):null, double: di?parseInt(di):null } };
  if (editingId) {
    var idx = hospitalsData.hospitals.findIndex(function(h){ return h.id===editingId; });
    if (idx >= 0) hospitalsData.hospitals[idx] = newH;
    editingId = null;
    msg.textContent = "✅ 已更新「" + name + "」";
  } else {
    hospitalsData.hospitals.push(newH);
    msg.textContent = "✅ 已新增「" + name + "」（共 " + hospitalsData.hospitals.length + " 家）";
  }
  msg.style.color = "#27AE8F";
  ["f-name","f-city","f-district","f-single-hi","f-single","f-double"].forEach(function(id){ document.getElementById(id).value=""; });
  renderAdminList();
  renderContent();
}
function editHospital(id) {
  var h = hospitalsData.hospitals.find(function(x){ return x.id===id; });
  if (!h) return;
  editingId = id;
  document.getElementById("f-name").value = h.name;
  document.getElementById("f-level").value = h.level;
  document.getElementById("f-city").value = h.city;
  document.getElementById("f-district").value = h.district;
  document.getElementById("f-region").value = h.region;
  document.getElementById("f-single-hi").value = h.rooms.single_hi||"";
  document.getElementById("f-single").value = h.rooms.single||"";
  document.getElementById("f-double").value = h.rooms.double||"";
  var msg = document.getElementById("admin-add-msg");
  msg.style.color = "#F57F17";
  msg.textContent = "✏️ 編輯模式：「"+h.name+"」，修改後按加入";
}
function deleteHospital(id) {
  var h = hospitalsData.hospitals.find(function(x){ return x.id===id; });
  if (!h || !confirm("確定刪除「"+h.name+"」？")) return;
  hospitalsData.hospitals = hospitalsData.hospitals.filter(function(x){ return x.id!==id; });
  renderAdminList(); renderContent();
}
function exportJson() {
  var today = new Date();
  hospitalsData.updated = (today.getFullYear()-1911) + "/" + String(today.getMonth()+1).padStart(2,"0");
  var blob = new Blob([JSON.stringify(hospitalsData, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "hospitals.json"; a.click();
  URL.revokeObjectURL(a.href);
}
