var GDRIVE_FILE_ID = "1Jw0Jbo9AOZg7lwdd7Bs-Pd-BXQxuFoag";
var hospitalsData = null;
var members = [];
var currentMemberId = null;
var activeFilter = "all";
var dataSource = "local"; // "live" or "local"

// ── nav ready ─────────────────────────────────────────────────
// 同時監聽事件與 DOMContentLoaded，以防事件已在頁面載入前觸發
var navReady = false;
function onNavReady(detail) {
  if (navReady) return;
  navReady = true;
  var fd = detail && detail.familyData;
  members = fd ? (fd.members || []).filter(function(m){ return m.role !== "beneficiary_only"; }) : [];
  currentMemberId = members.length > 0 ? members[0].personId : null;
  renderTabs();
  loadHospitals();
}

window.addEventListener("nbs_nav_ready", function(e){ onNavReady(e.detail); });

// 保護：若 3 秒後 nav 還沒 ready，用空成員繼續
setTimeout(function(){
  if (!navReady) {
    // 嘗試直接讀取
    if (window.NBS_NAV && NBS_NAV.getFamilyData) {
      onNavReady({ familyData: NBS_NAV.getFamilyData() });
    } else {
      onNavReady({ familyData: null });
    }
  }
}, 3000);

// ── 讀取醫院資料 ─────────────────────────────────────────────
function loadHospitals() {
  document.getElementById("main-content").innerHTML = '<div class="loading"><span class="spin"></span>從雲端讀取最新資料…</div>';

  // 嘗試各種 URL 格式
  var urls = [
    "https://drive.google.com/uc?export=download&id=" + GDRIVE_FILE_ID,
    "https://corsproxy.io/?" + encodeURIComponent("https://drive.google.com/uc?export=download&id=" + GDRIVE_FILE_ID),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://drive.google.com/uc?export=download&id=" + GDRIVE_FILE_ID)
  ];

  function tryUrl(i) {
    if (i >= urls.length) {
      // 全部失敗，用內嵌備援資料
      console.warn("Drive fetch failed, using fallback data");
      hospitalsData = FALLBACK_DATA;
      dataSource = "local";
      updateBadge();
      renderContent();
      return;
    }
    fetch(urls[i], { signal: AbortSignal.timeout ? AbortSignal.timeout(6000) : undefined })
      .then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data){
        if (!data.hospitals) throw new Error("invalid format");
        hospitalsData = data;
        dataSource = "live";
        updateBadge();
        renderContent();
      })
      .catch(function(){ tryUrl(i + 1); });
  }

  tryUrl(0);
}

function reloadFromDrive() {
  navReady = true; // 防止重複觸發
  loadHospitals();
}

function updateBadge() {
  var b = document.getElementById("data-badge");
  if (!b) return;
  if (dataSource === "live") {
    b.innerHTML = '更新：' + (hospitalsData.updated||"—") + '<span class="src-tag src-live">雲端</span>';
  } else {
    b.innerHTML = '內嵌資料 ' + (hospitalsData.updated||"") + '<span class="src-tag src-local">本機</span>';
  }
}

// ── Tab ──────────────────────────────────────────────────────
function renderTabs() {
  var el = document.getElementById("member-tabs");
  if (!el) return;
  if (!members.length) { el.style.display = "none"; return; }
  el.innerHTML = members.map(function(m){
    return '<button class="member-tab'+(m.personId===currentMemberId?" active":"")+'" onclick="switchMember(\''+m.personId+'\')">'+m.name+'</button>';
  }).join("");
}

function switchMember(pid) {
  currentMemberId = pid;
  renderTabs();
  renderContent();
}

// ── 主內容 ───────────────────────────────────────────────────
function renderContent() {
  var el = document.getElementById("main-content");
  var member = members.find(function(m){ return m.personId === currentMemberId; });

  var addr = member ? (member.address || "").trim() : "";
  var city = member ? (member.addressCity || extractCity(addr)) : "";
  var district = member ? (member.addressDistrict || extractDistrict(addr)) : "";
  var memberName = member ? member.name : "查詢者";

  var matched = matchHospitals(city, district);
  var avg = calcAverage(hospitalsData.hospitals);

  var html = "";

  // 地址卡片
  html += '<div class="addr-card"><div class="addr-icon">📍</div><div class="addr-info">';
  html += '<div class="addr-label">' + memberName + ' 的地址</div>';
  if (addr) {
    html += '<div class="addr-text">' + addr + '</div>';
    if (city) html += '<div style="font-size:11px;color:#888;margin-top:2px">搜尋：' + city + (district?" · "+district:"") + '</div>';
  } else {
    html += '<div class="addr-text none">尚未設定地址，顯示全台資料</div>';
  }
  html += '</div></div>';

  // 篩選
  html += '<div class="filter-bar">';
  [{k:"all",l:"全部"},{k:"醫學中心",l:"醫學中心"},{k:"區域醫院",l:"區域醫院"},{k:"地區醫院",l:"地區醫院"}].forEach(function(f){
    html += '<button class="filter-btn'+(activeFilter===f.k?" active":"")+'" onclick="setFilter(\''+f.k+'\')">'+f.l+'</button>';
  });
  html += '</div>';

  if (addr && city) {
    var shownIds = [];
    if (matched.district.length) {
      html += renderGroup("📍 同區醫院（" + district + "）", matched.district, "match-exact", "精確");
      matched.district.forEach(function(h){ shownIds.push(h.id); });
    }
    var cityOnly = matched.city.filter(function(h){ return shownIds.indexOf(h.id) < 0; });
    if (cityOnly.length) {
      html += renderGroup("🏙 同市其他醫院（" + city + "）", cityOnly, "match-city", "同市");
      cityOnly.forEach(function(h){ shownIds.push(h.id); });
    }
    var regionOnly = matched.region.filter(function(h){ return shownIds.indexOf(h.id) < 0; });
    if (regionOnly.length) {
      html += renderGroup("🗺 同大區醫院（" + matched.regionName + "）", regionOnly, "match-region", "同大區");
    }
    if (!matched.district.length && !cityOnly.length && !regionOnly.length) {
      html += '<div style="padding:20px;text-align:center;color:#aaa;font-size:13px">查無鄰近醫院資料，顯示全台列表</div>';
      html += renderGroup("🏥 全台醫院", hospitalsData.hospitals, "match-avg", "全台");
    }
  } else {
    html += renderGroup("🏥 全台醫院", hospitalsData.hospitals, "match-avg", "全台");
  }

  // 全台平均
  html += '<div class="avg-section"><div class="avg-title">📊 全台平均病房差額（' + hospitalsData.hospitals.length + ' 家醫院）</div>';
  html += '<div class="avg-grid">' + avgItem("套房/豪華單人", avg.single_hi) + avgItem("一人房", avg.single) + avgItem("二人房", avg.double) + '</div></div>';

  html += '<div class="data-src">資料來源：' + (hospitalsData.source||"—") + '<br>最後更新：' + (hospitalsData.updated||"—") + '　·　共 ' + hospitalsData.hospitals.length + ' 家醫院<br><span style="color:#bbb">點上方標籤可重新從 Google Drive 取得最新資料</span></div>';

  el.innerHTML = html;
}

function renderGroup(title, hospitals, badgeClass, badgeText) {
  var list = activeFilter === "all" ? hospitals : hospitals.filter(function(h){ return h.level === activeFilter; });
  if (!list.length) return "";
  var html = '<div class="match-label">' + title + '<span class="match-badge ' + badgeClass + '">' + badgeText + '</span></div>';
  html += '<div class="hospital-list">';
  list.forEach(function(h){
    html += '<div class="hospital-card"><div class="h-header">';
    html += '<span class="h-level level-' + h.level + '">' + h.level + '</span>';
    html += '<span class="h-name">' + h.name + '</span>';
    html += '<span class="h-location">' + h.city + ' · ' + h.district + '</span>';
    html += '</div><div class="h-rooms">';
    html += roomItem("套房/豪華單人", h.rooms.single_hi);
    html += roomItem("一人房差額", h.rooms.single);
    html += roomItem("二人房差額", h.rooms.double);
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function roomItem(label, val) {
  if (val === null || val === undefined)
    return '<div class="room-item"><div class="room-label">' + label + '</div><div class="room-val null-val">無資料</div></div>';
  return '<div class="room-item"><div class="room-label">' + label + '</div><div class="room-val">' + val.toLocaleString() + '<span class="room-unit"> 元/日</span></div></div>';
}

function avgItem(label, val) {
  return '<div class="avg-item"><div class="room-label">' + label + '</div><div class="room-val">' + (val ? Math.round(val).toLocaleString() : "—") + '<span class="room-unit"> 元/日</span></div></div>';
}

function matchHospitals(city, district) {
  var h = hospitalsData.hospitals;
  var regionName = "";
  if (city) { var f = h.find(function(x){ return x.city===city; }); if(f) regionName = f.region; }
  return {
    district: district ? h.filter(function(x){ return x.city===city && x.district===district; }) : [],
    city:     city     ? h.filter(function(x){ return x.city===city; }) : [],
    region:   regionName ? h.filter(function(x){ return x.region===regionName; }) : [],
    regionName: regionName
  };
}

function calcAverage(hospitals) {
  function avg(key) {
    var vals = hospitals.map(function(h){ return h.rooms[key]; }).filter(function(v){ return v!=null; });
    return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
  }
  return { single_hi: avg("single_hi"), single: avg("single"), double: avg("double") };
}

function extractCity(addr) {
  if (!addr) return "";
  var m = addr.match(/^(.{2,3}[市縣])/); return m ? m[1] : "";
}
function extractDistrict(addr) {
  if (!addr) return "";
  var m = addr.match(/[市縣](.{2,3}[區鄉鎮市])/); return m ? m[1] : "";
}
function setFilter(f) { activeFilter = f; renderContent(); }
</script>
</body>
</html>
