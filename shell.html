<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS 雲端保單體檢（SPA 試點）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: linear-gradient(160deg, #EEF4FF 0%, #F5F0FF 50%, #EFF9F4 100%);
      min-height: 100vh;
      color: #111827;
    }
    #nbs-app-content { position: relative; z-index: 1; min-height: 100vh; }
    #nbs-shell-boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9CA3AF; font-size: 13px; z-index: 999;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="nav.js"></script>
  <script src="router.js"></script>
</head>
<body>

  <div id="nbs-app-content">
    <div id="nbs-shell-boot">連線同步中…</div>
  </div>

  <script>
    // Phase 1 試點說明：
    // 1. initShell() 只在這裡執行一次：注入側欄樣式、建立側欄 DOM、載入家庭資料一次。
    // 2. 側欄點擊（policy/coverage/... 等）都會呼叫 nav.js 的 _go()，
    //    _go() 偵測到 window.NBSRouter 存在，會走前端路由；
    //    目前試點白名單只有 summary.html / coverage.html，
    //    其餘項目點擊仍會整頁導航（正常、預期中的行為，等 Phase 2 逐步加入白名單）。
    // 重要：監聽器一定要在呼叫 initShell() 之前註冊！
    // initShell() 內部如果 sessionStorage 已經有快取資料，會同步、
    // 立即觸發 nbs_nav_ready（不會等到下一個事件循環），如果監聽器
    // 註冊的順序寫在 initShell() 後面，就會錯過這個同步觸發的事件，
    // 導致側欄資料正常顯示、但畫面卡在「連線同步中…」永遠不會跳轉
    // 到家庭總覽（因為背景靜默更新資料時，刻意不會再觸發第二次
    // nbs_nav_ready，所以事件錯過一次就再也等不到了）。
    window.addEventListener("nbs_nav_ready", function boot() {
      window.removeEventListener("nbs_nav_ready", boot);
      NBSRouter.navigate("family.html", { skipPush: true });
    });

    // 進來 shell 後的預設畫面：先進「家庭總覽」（family.html），
    // 跟舊架構「main.html 選完家庭 → family.html」的概念一致
    NBS_NAV.initShell();
  </script>

</body>
</html>
