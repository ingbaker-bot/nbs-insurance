<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS 雲端保單體檢 - 家庭詳細</title>

  <script>
    (function(){
      // 清除舊快取，但保留登入資訊與 token，避免重新觸發 OAuth 授權
      const keepUser    = localStorage.getItem("nbs_user");
      const keepFam     = localStorage.getItem("nbs_current_family");
      const keepPerson  = localStorage.getItem("nbs_current_person");
      const keepToken   = localStorage.getItem("nbs_access_token");
      const keepExpiry  = localStorage.getItem("nbs_token_expiry");
      localStorage.clear();
      sessionStorage.clear();
      if (keepUser)   localStorage.setItem("nbs_user",           keepUser);
      if (keepFam)    localStorage.setItem("nbs_current_family",  keepFam);
      if (keepPerson) localStorage.setItem("nbs_current_person",  keepPerson);
      if (keepToken)  localStorage.setItem("nbs_access_token",    keepToken);
      if (keepExpiry) localStorage.setItem("nbs_token_expiry",    keepExpiry);
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg,#EEF4FF 0%,#F5F0FF 50%,#EFF9F4 100%);
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn-unused {
      background: none;
      border: none;
      font-size: 40px;
      color: #999;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .header-title { font-size: 30px; font-weight: 500; flex: 1; }

    .header-date { font-size: 22px; color: #bbb; }

    /* ── 主內容 ── */
    .main {
      padding: 16px 24px;
      width: 100%;      /* 真正撐滿整個內容區 */
      max-width: none;  /* 移除最大寬度限制，讓 4 欄模組能完整滿版 */
    }

/* 針對手機版自動微調邊距，保持原本的緊湊感 */
@media (max-width: 768px) {
  .main { padding: 16px; }
}

    /* ── 區塊標題 ── */
    .section-label {
      font-size: 22px;
      font-weight: 500;
      color: #999;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    /* ── 成員切換列 ── */
    .members-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .member-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid rgba(120,140,255,.12);
      border-radius: 13px;
      cursor: pointer;
      background: rgba(255,255,255,.75);
      min-width: 74px;
      transition: all .15s;
      box-shadow: 0 2px 8px rgba(100,120,255,.05);
      position: relative;
    }

    .member-card.active {
      border: 2px solid #7C3AED;
      background: rgba(255,255,255,.95);
      box-shadow: 0 4px 16px rgba(124,58,237,.18);
    }

    .member-card:hover:not(.active) {
      background: rgba(255,255,255,.92);
      border-color: rgba(124,58,237,.20);
      transform: translateY(-1px);
    }

    .member-avatar { display: none; } /* 已移除，只顯示名字 */

    .member-edit-hint {
      font-size: 11px;
      color: #7C3AED;
      background: rgba(124,58,237,.08);
      border-radius: 4px;
      padding: 1px 5px;
      margin-bottom: 2px;
      pointer-events: none;
    }

    .member-edit-btn {
      position: absolute;
      top: 5px; right: 5px;
      font-size: 13px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 6px;
      padding: 2px 5px;
      cursor: pointer;
      line-height: 1;
      color: #7C3AED;
    }
    .member-edit-btn:hover { background: #fff; }

    .member-name { font-size: 20px; font-weight: 700; color: #111827; }
    .member-age  { font-size: 15px; color: #9CA3AF; }

    .role-badge {
      font-size: 15px;
      padding: 1px 6px;
      border-radius: 99px;
    }

    .role-primary   { background: linear-gradient(90deg,#EEF4FF,#EDE9FF); color: #4F46E5; border: 1px solid rgba(79,70,229,.15); }
    .role-secondary { background: #E1F5EE; color: #085041; }
    .role-benef     { background: #FAEEDA; color: #633806; }

    /* 新增成員按鈕 */
    .add-member-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 12px;
      border: 1px dashed #ddd;
      border-radius: 10px;
      cursor: pointer;
      min-width: 74px;
      color: #bbb;
      background: transparent;
      font-family: inherit;
    }

    .add-member-btn:hover { background: #fafafa; }

    /* 受益人名單 */
    .benef-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: #fafafa;
      border-radius: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .benef-tag {
      font-size: 24px;
      padding: 2px 8px;
      background: #FAEEDA;
      color: #633806;
      border-radius: 99px;
    }

    /* ── 選中成員資料卡 ── */
    .person-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .person-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f7f7f5;
      border-bottom: 1px solid #e8e8e8;
    }

    .person-card-header .left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ins-age-badge {
      font-size: 22px;
      padding: 2px 8px;
      background: #E6F1FB;
      color: #0C447C;
      border-radius: 99px;
    }

    .edit-btn {
      font-size: 24px;
      padding: 3px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      color: #666;
    }

    .edit-btn:hover { background: #f0f0f0; }

    .person-card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .info-cell {
      padding: 10px 14px;
      border-right: 1px solid #f0f0f0;
    }

    .info-cell:last-child { border-right: none; }
    .info-label { font-size: 22px; color: #aaa; margin-bottom: 2px; }
    .info-value { font-size: 26px; font-weight: 500; }

    /* ── 功能模組 ── */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .module-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 20px 8px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(120,140,255,.10);
      border-radius: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      box-shadow: 0 2px 8px rgba(100,120,255,.04);
      width: 100%;
    }

    .module-btn:hover {
      background: rgba(255,255,255,.96);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(100,120,255,.12);
      border-color: rgba(124,58,237,.20);
    }
    .module-btn:active { transform: translateY(0); }

    .module-icon { font-size: 30px; }
    .module-label { font-size: 18px; font-weight: 600; color: #374151; }

    /* ── 新增成員 Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45); backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 44px;
      color: #999;
      cursor: pointer;
      line-height: 1;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 24px;
      color: #666;
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      font-size: 28px;
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      outline: none;
      font-family: inherit;
      background: #fff;
    }

    .field input:focus, .field select:focus { border-color: #378ADD; }
    .field .hint { font-size: 22px; color: #0C447C; margin-top: 3px; }

    .btn-row { display: flex; gap: 8px; margin-top: 20px; }

    .btn-primary {
      flex: 2;
      padding: 10px;
      background: #378ADD;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 28px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary:disabled { background: #ccc; cursor: default; }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: transparent;
      color: #666;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 26px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── 儲存狀態 ── */
    .save-hint {
      font-size: 22px;
      color: #ccc;
      text-align: center;
      padding: 8px 0 4px;
    }

    /* ── 載入 ── */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #e0e0e0;
      border-top-color: #378ADD;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    /* nav.js 側欄整合 */
    @media (min-width: 768px) {
      body { padding-left: 220px !important; }
    }
    @media (max-width: 767px) {
      body { padding-top: 50px !important; padding-bottom: 66px !important; }
    }
  </style>
  <script src="nav.js"></script>
</head>
<body>

  <!-- Header（分析日已在 nav 顯示，返回按鈕改由 nav 負責，此處僅顯示家庭名稱）-->
  <div class="header">
    <div class="header-title" id="family-title" style="padding-left:4px">載入中…</div>
  </div>

  <!-- 主內容 -->
  <div class="main" id="main-content" style="display:none">

    <!-- 家庭成員切換列 -->
    <div class="section-label">家庭成員</div>
    <div class="members-row" id="members-row"></div>

    <!-- 僅受益人名單 -->
    <div id="benef-row" style="display:none" class="benef-row"></div>

    <!-- 選中成員資料卡已移除：編輯入口整合至成員卡片上方 -->
    <!-- 保留隱藏元素供 JS 讀取（selectMember 仍會設定這些值）-->
    <span id="card-name" style="display:none">—</span>
    <span id="card-age-badge" style="display:none"></span>
    <div id="card-birth" style="display:none"></div>
    <div id="card-analysis" style="display:none"></div>
    <div id="person-card" style="display:none"></div>

    <!-- 功能模組 -->
    <div class="section-label">
      功能模組　<span id="module-hint" style="font-weight:400; color:#bbb;"></span>
    </div>
    <div class="modules-grid">
      <button class="module-btn" onclick="goModule('policy')">
        <span class="module-icon">📋</span>
        <span class="module-label">保險繳費</span>
      </button>
      <button class="module-btn" onclick="goModule('beneficiary')">
        <span class="module-icon">👥</span>
        <span class="module-label">受益人</span>
      </button>
      <button class="module-btn" onclick="goModule('coverage')">
        <span class="module-icon">🛡️</span>
        <span class="module-label">保障清單</span>
      </button>
      <button class="module-btn" onclick="goModule('summary')">
        <span class="module-icon">📊</span>
        <span class="module-label">保單彙總</span>
      </button>
      <button class="module-btn" onclick="goModule('savings')">
        <span class="module-icon">🐷</span>
        <span class="module-label">儲蓄險</span>
      </button>
      <button class="module-btn" onclick="goModule('export')">
        <span class="module-icon">🖼️</span>
        <span class="module-label">匯出圖片</span>
      </button>
      <button class="module-btn" onclick="goModule('hospital')">
        <span class="module-icon">🏥</span>
        <span class="module-label">醫院病房</span>
      </button>
      <button class="module-btn" onclick="goModule('visit')">
        <span class="module-icon">📝</span>
        <span class="module-label">訪談紀錄</span>
      </button>
    </div>

    <div class="save-hint" style="color:#9CA3AF;font-size: 22px;text-align:center;padding:14px 0 4px;letter-spacing:.02em">☁️ 資料自動儲存至 Google Drive</div>

  </div>

  <!-- 載入中 -->
  <div id="loading-view" style="text-align:center; padding:60px 20px; color:#bbb; font-size: 26px;">
    <span class="spinner"></span> <span id="family-loading-text">保單資料庫安全連線中...</span>
  </div>

  <!-- 新增成員 Modal -->
  <div class="modal-overlay" id="add-member-modal" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        新增家庭成員
        <button class="modal-close" onclick="closeAddMember()">×</button>
      </div>

      <div class="field">
        <label>姓名 <span style="color:#e74c3c">*</span></label>
        <input type="text" id="new-name" placeholder="請輸入姓名" oninput="updateAddBtn()" />
      </div>

      <div class="field">
        <label>與主要成員的關係</label>
        <select id="new-relation">
          <option>配偶</option>
          <option>子女</option>
          <option>父母</option>
          <option>祖父母</option>
          <option>兄弟姊妹</option>
          <option>其他</option>
        </select>
      </div>

      <div class="field">
        <label>出生日期</label>
        <input type="date" id="new-birth" oninput="updateNewAge()" />
        <div class="hint" id="new-age-hint"></div>
      </div>

      <div class="field">
        <label>角色</label>
        <select id="new-role">
          <option value="secondary">次要成員（有自己的保單）</option>
          <option value="beneficiary_only">僅受益人（不列入保單彙總）</option>
        </select>
      </div>

      <div class="field">
        <label>住家地址 <span style="font-size: 20px;color:#aaa">（非必填）</span></label>
        <input type="text" id="new-address" placeholder="如：台北市中正區"
          style="width:100%;padding:9px 12px;font-size: 28px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit" />
        <div style="font-size: 22px;color:#aaa;margin-top:3px">填入後可在保單彙總查詢附近醫院病房費</div>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="closeAddMember()">取消</button>
        <button class="btn-primary" id="add-member-btn" onclick="addMember()" disabled>新增成員</button>
      </div>
    </div>
  </div>

  <!-- 編輯成員 Modal -->
  <div class="modal-overlay" id="edit-person-modal" onclick="handleEditOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        編輯個人資料
        <button class="modal-close" onclick="closeEditPerson()">×</button>
      </div>

      <div class="field">
        <label>姓名</label>
        <input type="text" id="edit-name" placeholder="姓名" />
      </div>

      <div class="field">
        <label>出生日期</label>
        <input type="date" id="edit-birth" oninput="updateEditAge()" />
        <div class="hint" id="edit-age-hint"></div>
      </div>

      <div class="field">
        <label>分析日</label>
        <input type="date" id="edit-analysis" oninput="updateEditAnalysis()" />
        <div class="hint" id="edit-analysis-hint"></div>
      </div>

      <div class="field">
        <label>住家地址</label>
        <input type="text" id="edit-address" placeholder="如：台北市中正區重慶南路1段" style="width:100%;padding:9px 12px;font-size: 28px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit" />
        <div style="font-size: 22px;color:#aaa;margin-top:3px">填入縣市+區/鄉鎮，用於保單彙總查詢附近醫院病房費</div>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="closeEditPerson()">取消</button>
        <button class="btn-primary" onclick="saveEditPerson()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // ── 設定 ─────────────────────────────────────────────────
    // GAS_URL 已移至 nav.js 統一管理

    let currentUser   = null;
    let familyData    = null;
    let familyFileName = null;
    let personDataMap = {};      // personId → personData
    let selectedPersonId = null;
    let _navDataReceived = false;

    // ── 效能優化：不再自己重複呼叫一次 readFamilyBundle，
    //    改成直接「借用」nav.js 已經抓好的資料（nav.js 也已經改用
    //    readFamilyBundle，一次連家庭+成員資料都拿到了）。
    //    這樣同一個頁面就不會出現「nav.js 抓一次、頁面自己又抓一次」
    //    這種重複請求的情況。
    function _handleNavReady(detail) {
      if (_navDataReceived) return;
      _navDataReceived = true;
      
      // 資料回來了，立刻關閉輪播計時器
      if (typeof familyLoadingTimer !== 'undefined') clearInterval(familyLoadingTimer);

      if (!detail || !detail.familyData) {
        document.getElementById("loading-view").innerHTML =
          '<div style="color:#e74c3c">載入失敗，請重新整理頁面</div>';
        return; // 這個 return 現在是正確的，因為它在 function 裡面
      } // <--- 只留這一個關閉括號！

      // 以下這些程式碼現在才會正確地包含在 function 內
      familyData    = detail.familyData;
      personDataMap = detail.personsData || {};

      const activeMembers   = (familyData.members || []).filter(m => m.role !== "beneficiary_only");
      const missingMembers  = activeMembers.filter(m => !personDataMap[m.personId]);

      if (missingMembers.length === 0) {
        renderPage();
        return;
      }

      const savedUser = JSON.parse(localStorage.getItem("nbs_user") || "{}");
      const fetchPromises = missingMembers.map(m => {
        return callGAS("readFile", {
          email: savedUser.email,
          fileType: "persons",
          fileName: m.name + "_" + m.personId + ".json",
        }).then(pr => {
          if (pr.status === "ok") personDataMap[m.personId] = pr.content;
        }).catch(e => console.error("讀取 " + m.name + " 失敗", e));
      });

      Promise.all(fetchPromises).then(renderPage).catch(e => {
        document.getElementById("loading-view").innerHTML =
          '<div style="color:#e74c3c">載入失敗：' + e.message + '</div>';
      });
    }

    window.addEventListener("nbs_nav_ready", function(e) { _handleNavReady(e.detail); });

    // ── 動態載入文字設定 ──
    const familyLoadingMessages = [
      "保單資料庫安全連線中...",
      "正在載入家庭成員清單...",
      "精算各項保障額度與明細...",
      "即將為您呈現專屬報告..."
    ];
    let familyMsgIndex = 0;
    const familyLoadingTimer = setInterval(() => {
      familyMsgIndex = (familyMsgIndex + 1) % familyLoadingMessages.length;
      const textEl = document.getElementById("family-loading-text");
      if (textEl) textEl.textContent = familyLoadingMessages[familyMsgIndex];
    }, 1500);
    
    // ── 初始化 ────────────────────────────────────────────────
    window.onload = function() {
      // 驗證登入
      const saved = localStorage.getItem("nbs_user");
      if (!saved) { window.location.href = "index.html"; return; }
      currentUser = JSON.parse(saved);

      // 取得家庭檔名
      familyFileName = localStorage.getItem("nbs_current_family");
      if (!familyFileName) { window.location.href = "main.html"; return; }

      // 保護：理論上 nav.js 一定會觸發 nbs_nav_ready，
      // 但萬一發生意外狀況，等待時間拉長到 20 秒
      // （nav.js 現在失敗會自動重試一次，最壞情況下單次嘗試+重試
      //  可能要 15~20 秒，逾時門檻要跟著放寬，避免明明還在重試
      //  卻被誤判成逾時）。
      setTimeout(function() {
        if (!_navDataReceived) {
          document.getElementById("loading-view").innerHTML =
            '<div style="color:#e74c3c">載入逾時，請重新整理頁面</div>';
        }
      }, 20000);
    };

    // ── 渲染頁面 ──────────────────────────────────────────────
    function renderPage() {
      document.getElementById("loading-view").style.display = "none";
      document.getElementById("main-content").style.display = "block";

      // Header
      document.getElementById("family-title").textContent = familyData.familyName;
      // 分析日已由 nav.js 在側欄顯示，header 不重複顯示

      // 成員列
      renderMembers();

      // 預設選主要成員
      const primary = familyData.members.find(m => m.role === "primary");
      if (primary) selectMember(primary.personId);
    }

    // ── 渲染成員列 ────────────────────────────────────────────
    // ── 成員卡片點擊：第一次選中，已選中再點 → 開編輯 ──
    function memberCardClick(el) {
      var pid = el.getAttribute('data-pid');
      if (selectedPersonId === pid) {
        openEditPerson();  // 已選中的成員再點一次 → 開編輯
      } else {
        selectMember(pid); // 第一次點 → 選中
      }
    }

        function renderMembers() {
      const row = document.getElementById("members-row");
      const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
      const benefMembers  = familyData.members.filter(m => m.role === "beneficiary_only");

      row.innerHTML = activeMembers.map(m => {
        const person = personDataMap[m.personId];
        const age = person ? calcInsAge(person.profile.birthDate, person.profile.analysisDate) : null;
        const rc = m.role === "primary" ? "role-primary" : "role-secondary";
        // 主要成員顯示「本人」，次要成員優先顯示 relation（配偶/子女…），否則顯示「次要」
        const rl = m.role === "primary" ? "本人" : (m.relation || "次要");
        return `
          <div class="member-card ${selectedPersonId === m.personId ? 'active' : ''}"
               data-pid="${m.personId}"
               onclick="memberCardClick(this)">
            ${selectedPersonId === m.personId ? '<div class="member-edit-hint">✏️ 點選編輯</div>' : ''}
            <div class="member-name">${m.name}</div>
            <div class="member-age">${age !== null ? age + '歲' : '—'}</div>
            <span class="role-badge ${rc}">${rl}</span>
          </div>`;
      }).join("") + `
        <button class="add-member-btn" onclick="openAddMember()">
          <span style="font-size: 24px">＋</span>
          <span style="font-size: 15px">新增</span>
        </button>`;

      // 受益人名單
      const benefRow = document.getElementById("benef-row");
      if (benefMembers.length > 0) {
        benefRow.style.display = "flex";
        benefRow.innerHTML = `<span style="font-size: 22px;color:#aaa;">受益人名單：</span>` +
          benefMembers.map(m => `<span class="benef-tag">${m.name}</span>`).join("");
      } else {
        benefRow.style.display = "none";
      }
    }

    // ── 選擇成員 ──────────────────────────────────────────────
    function selectMember(personId) {
      selectedPersonId = personId;
      const member = familyData.members.find(m => m.personId === personId);
      const person = personDataMap[personId];

      // 更新成員卡片樣式
      document.querySelectorAll(".member-card").forEach(c => c.classList.remove("active"));
      const cards = document.querySelectorAll(".member-card");
      const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
      const idx = activeMembers.findIndex(m => m.personId === personId);
      if (cards[idx]) cards[idx].classList.add("active");

      // 更新資料卡
      document.getElementById("card-name").textContent = member ? member.name : "—";

      if (person) {
        const age = calcInsAge(person.profile.birthDate, person.profile.analysisDate);
        const ageBadge = document.getElementById("card-age-badge");
        if (age !== null) {
          ageBadge.textContent = "保險年齡 " + age + " 歲";
          ageBadge.style.display = "inline";
        } else {
          ageBadge.style.display = "none";
        }
        document.getElementById("card-birth").textContent = toRoc(person.profile.birthDate) || "—";
        document.getElementById("card-analysis").textContent = toRoc(person.profile.analysisDate) || "—";
      } else {
        document.getElementById("card-age-badge").style.display = "none";
        document.getElementById("card-birth").textContent = "—";
        document.getElementById("card-analysis").textContent = "—";
      }

      // 模組提示
      document.getElementById("module-hint").textContent =
        "目前：" + (member ? member.name : "");
    }

    // ── 新增成員 ──────────────────────────────────────────────
    function openAddMember() {
      document.getElementById("add-member-modal").classList.add("active");
      document.getElementById("new-name").value = "";
      document.getElementById("new-birth").value = "";
      document.getElementById("new-age-hint").textContent = "";
      document.getElementById("add-member-btn").disabled = true;
    }

    function closeAddMember() {
      document.getElementById("add-member-modal").classList.remove("active");
    }

    function updateAddBtn() {
      const name = document.getElementById("new-name").value.trim();
      document.getElementById("add-member-btn").disabled = !name;
    }

    function updateNewAge() {
      const birth = document.getElementById("new-birth").value;
      const hint = document.getElementById("new-age-hint");
      if (!birth) { hint.textContent = ""; return; }
      hint.textContent = "保險年齡：" + calcInsAge(birth, familyData.analysisDate) + " 歲";
    }

    async function addMember() {
      const name     = document.getElementById("new-name").value.trim();
      const relation = document.getElementById("new-relation").value;
      const birth    = document.getElementById("new-birth").value;
      const role     = document.getElementById("new-role").value;
      const address  = (document.getElementById("new-address")||{}).value||"";
      if (!name) return;

      const btn = document.getElementById("add-member-btn");
      btn.disabled = true;
      btn.textContent = "新增中…";

      const personId = "p_" + Date.now();

      // 建立個人 JSON
      const personData = {
        version: "3.0.0",
        personId,
        agentId: currentUser.email,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        profile: {
          name,
          birthDate: birth || null,
          analysisDate: familyData.analysisDate,
          address: address || null,
          note: "",
        },
        policies: [],
        coverage: {},
        savings: [],
        beneficiaryTemplates: [],
        medicalSummary: {},
        settings: { savingsDisplayYears: 20, notes: "" },
      };

      try {
        // 儲存個人 JSON（僅非受益人才建立）
        if (role !== "beneficiary_only") {
          await callGAS("saveFile", {
            email: currentUser.email,
            fileType: "persons",
            fileId: personId,
            fileName: name + "_" + personId + ".json",
            content: personData,
          });
          personDataMap[personId] = personData;
        }

        // 更新家庭 JSON
        familyData.members.push({ personId, name, role, relation });
        familyData.updatedAt = new Date().toISOString();

        await callGAS("saveFile", {
          email: currentUser.email,
          fileType: "families",
          fileId: familyData.familyId,
          fileName: familyFileName,
          content: familyData,
        });

        closeAddMember();
        
        // 終極修復：徹底清除 nav.js 隱藏的深層快取 (Deep Cache)
        const keepUser = localStorage.getItem("nbs_user");
        const keepFam = localStorage.getItem("nbs_current_family");
        localStorage.clear();    // 炸掉所有長效快取
        sessionStorage.clear();  // 炸掉所有短效快取
        // 還原必要的登入與家庭指標
        if (keepUser) localStorage.setItem("nbs_user", keepUser);
        if (keepFam) localStorage.setItem("nbs_current_family", keepFam);
        
        window.location.reload(true); // true 代表強制忽略瀏覽器 HTTP 快取

      } catch(e) {
        alert("新增失敗：" + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "新增成員";
      }
    }

    // ── 編輯個人資料 ──────────────────────────────────────────
    function openEditPerson() {
      const person = personDataMap[selectedPersonId];
      if (!person) return;
      document.getElementById("edit-name").value = person.profile.name || "";
      document.getElementById("edit-birth").value = person.profile.birthDate || "";
      document.getElementById("edit-analysis").value = person.profile.analysisDate || "";
      document.getElementById("edit-address").value = person.profile.address || "";
      updateEditAge();
      updateEditAnalysis();
      document.getElementById("edit-person-modal").classList.add("active");
    }

    function closeEditPerson() {
      document.getElementById("edit-person-modal").classList.remove("active");
    }

    function updateEditAge() {
      const birth = document.getElementById("edit-birth").value;
      const analysis = document.getElementById("edit-analysis").value;
      const hint = document.getElementById("edit-age-hint");
      if (!birth) { hint.textContent = ""; return; }
      hint.textContent = "保險年齡：" + calcInsAge(birth, analysis || new Date().toISOString().slice(0,10)) + " 歲";
    }

    function updateEditAnalysis() {
      const val = document.getElementById("edit-analysis").value;
      const hint = document.getElementById("edit-analysis-hint");
      if (!val) { hint.textContent = ""; return; }
      const d = new Date(val);
      hint.textContent = "民國 " + (d.getFullYear()-1911) + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日";
    }

    async function saveEditPerson() {
      const person = personDataMap[selectedPersonId];
      if (!person) return;

      const newName     = document.getElementById("edit-name").value.trim();
      const newBirth    = document.getElementById("edit-birth").value;
      const newAnalysis = document.getElementById("edit-analysis").value;
      const newAddress  = document.getElementById("edit-address").value.trim();

      person.profile.name         = newName || person.profile.name;
      person.profile.birthDate    = newBirth || null;
      person.profile.analysisDate = newAnalysis;
      person.profile.address      = newAddress || null;
      person.updatedAt = new Date().toISOString();

      try {
        await callGAS("saveFile", {
          email: currentUser.email,
          fileType: "persons",
          fileId: selectedPersonId,
          fileName: person.profile.name + "_" + selectedPersonId + ".json",
          content: person,
        });

        // 同步更新家庭成員名稱
        const member = familyData.members.find(m => m.personId === selectedPersonId);
        if (member && newName) {
          member.name = newName;
          familyData.updatedAt = new Date().toISOString();
          await callGAS("saveFile", {
            email: currentUser.email,
            fileType: "families",
            fileId: familyData.familyId,
            fileName: familyFileName,
            content: familyData,
          });
        }

        closeEditPerson();
        
        // 終極修復：徹底清除 nav.js 隱藏的深層快取 (Deep Cache)
        const keepUser = localStorage.getItem("nbs_user");
        const keepFam = localStorage.getItem("nbs_current_family");
        localStorage.clear();    // 炸掉所有長效快取
        sessionStorage.clear();  // 炸掉所有短效快取
        // 還原必要的登入與家庭指標
        if (keepUser) localStorage.setItem("nbs_user", keepUser);
        if (keepFam) localStorage.setItem("nbs_current_family", keepFam);
        
        window.location.reload(true); // true 代表強制忽略瀏覽器 HTTP 快取

      } catch(e) {
        alert("儲存失敗：" + e.message);
      }
    }

    // ── 功能模組跳轉 ──────────────────────────────────────────
    function goModule(module) {
      localStorage.setItem("nbs_current_person", selectedPersonId);
      const pages = {
        policy:      "policy.html",
        coverage:    "coverage.html",
        savings:     "savings.html",
        summary:     "summary.html",
        beneficiary: "beneficiary.html",
        export:      "export.html",
        hospital:    "hospital.html",
        visit:       "visit.html",
      };
      if (pages[module]) {
        window.location.href = pages[module];
      } else {
        alert("模組「" + module + "」建置中…");
      }
    }

    // ── 返回 ──────────────────────────────────────────────────
    function goBack() {
      window.location.href = "main.html";
    }

    // ── Modal overlay click ───────────────────────────────────
    function handleOverlayClick(e) {
      if (e.target === document.getElementById("add-member-modal")) closeAddMember();
    }
    function handleEditOverlayClick(e) {
      if (e.target === document.getElementById("edit-person-modal")) closeEditPerson();
    }

    // ── 工具函式 ──────────────────────────────────────────────
    function toRoc(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      if (isNaN(d)) return "—";
      return (d.getFullYear()-1911) + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
    }

    function calcInsAge(birthDate, analysisDate) {
      if (!birthDate) return null;
      const b = new Date(birthDate);
      const a = new Date(analysisDate || new Date());
      let years = a.getFullYear() - b.getFullYear();
      const months = (a - new Date(b.getFullYear()+years, b.getMonth(), b.getDate())) / (1000*60*60*24*30.4375);
      if (months >= 6) years++;
      return years;
    }

function callGAS(action, params) {
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === 'function') {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error('nav.js 未載入'));
}
  
// ── NBS 導覽 ──────────────────────────────────────────────
NBS_NAV.onMemberChange = function(pid) {
  selectedPersonId = pid;
  renderMemberCard();
};
NBS_NAV.init({ page: "family" });
</script>
