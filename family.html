<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS 雲端保單體檢 - 家庭詳細</title>

  <script>
    // 加上 window 層級旗標：這段清快取邏輯的本意是「每次真正整頁載入
    // family.html 時，清掉舊快取但保留登入/家庭指標」。但在 SPA shell
    // 底下，這支 <script> 可能在同一個瀏覽器分頁裡被反覆重新執行
    // （例如每次點側欄「家庭保單首頁」），如果沒有防護，會變成每次都
    // 把剛建立好的資料快取（包含其他頁面依賴的 sessionStorage 內容）
    // 整個清空重來，導致其他頁面抓不到資料。
    //
    // 用 window.__nbsFamilyCacheCleared 當一次性旗標：只要瀏覽器分頁
    // 沒有真正重新整理過（window 物件還是同一個），這段邏輯就只會執行
    // 一次。如果使用者真的透過 main.html 切換到不同家庭（會觸發真正
    // 整頁重新載入，window 物件整個重置），旗標會自動消失，清快取邏輯
    // 會照常再執行一次——跟原本設計的意圖一致，只是不會在 SPA 裡被
    // 同一支頁面反覆掛載時重複觸發。
    if (!window.__nbsFamilyCacheCleared) {
      window.__nbsFamilyCacheCleared = true;
      (function(){
        // 清除舊快取，但保留登入資訊與 token，避免重新觸發 OAuth 授權
        const keepUser    = localStorage.getItem("nbs_user");
        const keepFam     = localStorage.getItem("nbs_current_family");
        const keepPerson  = localStorage.getItem("nbs_current_person");
        const keepToken   = localStorage.getItem("nbs_access_token");
        const keepExpiry  = localStorage.getItem("nbs_token_expiry");
        localStorage.clear();
        sessionStorage.clear();
        if (keepUser)   localStorage.setItem("nbs_user",           keepUser);
        if (keepFam)    localStorage.setItem("nbs_current_family",  keepFam);
        if (keepPerson) localStorage.setItem("nbs_current_person",  keepPerson);
        if (keepToken)  localStorage.setItem("nbs_access_token",    keepToken);
        if (keepExpiry) localStorage.setItem("nbs_token_expiry",    keepExpiry);
      })();
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg,#EEF4FF 0%,#F5F0FF 50%,#EFF9F4 100%);
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn-unused {
      background: none;
      border: none;
      font-size: 40px;
      color: #999;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .header-title { font-size: 30px; font-weight: 500; flex: 1; }

    .header-date { font-size: 22px; color: #bbb; }

    /* ── 主內容 ── */
    .main {
      padding: 8px 20px 12px;
      width: 100%;
      max-width: none;
    }

/* 針對手機版自動微調邊距，保持原本的緊湊感 */
@media (max-width: 768px) {
  .main { padding: 16px; }
}

    /* ── 區塊標題 ── */
    .section-label {
      font-size: 16px;
      font-weight: 600;
      color: #9CA3AF;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    /* ── 成員切換列 ── */
    .members-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .member-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 12px;
      border: 1px solid rgba(120,140,255,.12);
      border-radius: 13px;
      cursor: pointer;
      background: rgba(255,255,255,.75);
      min-width: 74px;
      transition: all .15s;
      box-shadow: 0 2px 8px rgba(100,120,255,.05);
      position: relative;
    }

    .member-card.active {
      border: 2px solid #7C3AED;
      background: rgba(255,255,255,.95);
      box-shadow: 0 4px 16px rgba(124,58,237,.18);
    }

    .member-menu-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(120,140,255,.18);
      color: #9CA3AF;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      /* 原本的刪除鈕只有 hover 時才會出現，觸控裝置沒有 hover 這個
         狀態、根本點不到——這裡改成一直顯示（只是顏色淡一點），手機
         上才找得到這個入口。 */
    }
    .member-menu-btn:hover { background: #fff; color: #374151; border-color: rgba(124,58,237,.3); }

    .member-menu {
      display: none;
      position: absolute;
      top: 28px;
      right: 4px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
      padding: 6px;
      min-width: 168px;
      z-index: 60;
      text-align: left;
    }
    .member-menu.open { display: block; }
    .member-menu-opt {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 9px;
      font-size: 14px; font-weight: 600; color: #374151;
      white-space: nowrap; cursor: pointer;
    }
    .member-menu-opt:hover { background: #f5f5ff; }
    .member-menu-opt.danger { color: #b91c1c; }
    .member-menu-opt.danger:hover { background: #fef2f2; }

    .member-card:hover:not(.active) {
      background: rgba(255,255,255,.92);
      border-color: rgba(124,58,237,.20);
      transform: translateY(-1px);
    }

    .member-avatar { display: none; } /* 已移除，只顯示名字 */

    .member-edit-hint {
      font-size: 11px;
      color: #7C3AED;
      background: rgba(124,58,237,.08);
      border-radius: 4px;
      padding: 1px 5px;
      margin-bottom: 2px;
      pointer-events: none;
    }

    .member-edit-btn {
      position: absolute;
      top: 5px; right: 5px;
      font-size: 13px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 6px;
      padding: 2px 5px;
      cursor: pointer;
      line-height: 1;
      color: #7C3AED;
    }
    .member-edit-btn:hover { background: #fff; }

    .member-name { font-size: 20px; font-weight: 700; color: #111827; }
    .member-age  { font-size: 15px; color: #9CA3AF; }

    .role-badge {
      font-size: 15px;
      padding: 1px 6px;
      border-radius: 99px;
    }

    .role-primary   { background: linear-gradient(90deg,#EEF4FF,#EDE9FF); color: #4F46E5; border: 1px solid rgba(79,70,229,.15); }
    .role-secondary { background: #E1F5EE; color: #085041; }
    .role-benef     { background: #FAEEDA; color: #633806; }

    /* 新增成員按鈕 */
    .add-member-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 12px;
      border: 1px dashed #ddd;
      border-radius: 10px;
      cursor: pointer;
      min-width: 74px;
      color: #bbb;
      background: transparent;
      font-family: inherit;
    }

    .add-member-btn:hover { background: #fafafa; }

    /* 受益人名單 */
    .benef-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: #fafafa;
      border-radius: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .benef-tag {
      font-size: 24px;
      padding: 2px 8px;
      background: #FAEEDA;
      color: #633806;
      border-radius: 99px;
    }

    /* ── 選中成員資料卡 ── */
    .person-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .person-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f7f7f5;
      border-bottom: 1px solid #e8e8e8;
    }

    .person-card-header .left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ins-age-badge {
      font-size: 22px;
      padding: 2px 8px;
      background: #E6F1FB;
      color: #0C447C;
      border-radius: 99px;
    }

    .edit-btn {
      font-size: 24px;
      padding: 3px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      color: #666;
    }

    .edit-btn:hover { background: #f0f0f0; }

    .person-card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .info-cell {
      padding: 10px 14px;
      border-right: 1px solid #f0f0f0;
    }

    .info-cell:last-child { border-right: none; }
    .info-label { font-size: 22px; color: #aaa; margin-bottom: 2px; }
    .info-value { font-size: 26px; font-weight: 500; }

    /* ── 功能模組 ── */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .module-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(120,140,255,.10);
      border-radius: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      box-shadow: 0 2px 8px rgba(100,120,255,.04);
      width: 100%;
    }

    .module-btn:hover {
      background: rgba(255,255,255,.96);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(100,120,255,.12);
      border-color: rgba(124,58,237,.20);
    }
    .module-btn:active { transform: translateY(0); }

    .module-icon { font-size: 30px; }
    .module-label { font-size: 18px; font-weight: 600; color: #374151; }

    /* ── 新增成員 Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45); backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 44px;
      color: #999;
      cursor: pointer;
      line-height: 1;
    }

    .field { margin-bottom: 14px; }

    /* ── 共用「從清單選一個」彈窗 ──
       用來取代 window.prompt() 那種要手動打字輸入的選單（例如選要合併
       到哪個家庭、選新本人）。原生 prompt 對話框的內文幾乎沒辦法選取
       複製、還要求打字打到一字不差，家庭一多、名字一長就很容易打錯，
       改成直接點選清單項目。 */
    .picker-option {
      padding: 14px 16px;
      border: 1.5px solid #eee;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      color: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: #fff;
    }
    .picker-option:hover, .picker-option:active {
      background: #f5f5ff;
      border-color: #c7d2fe;
    }
    .picker-option .sub {
      font-size: 13px;
      color: #9CA3AF;
      font-weight: 400;
    }

    .field label {
      display: block;
      font-size: 24px;
      color: #666;
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      font-size: 28px;
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      outline: none;
      font-family: inherit;
      background: #fff;
    }

    .field input:focus, .field select:focus { border-color: #378ADD; }
    .field .hint { font-size: 22px; color: #0C447C; margin-top: 3px; }

    /* 民國年/月/日這種窄輸入框，不要吃 .field input 給一般全寬欄位用的
       28px 大字＋9px/12px 內距——字體太大、內距太寬，塞進 56~70px 的
       窄框裡，3 碼年份／2 碼月日會被切掉、顯示不完整。這裡用專屬
       class 蓋掉字體/內距/寬度，年跟月日各自留一點餘裕。 */
    .roc-date-input {
      width: 64px !important;
      font-size: 20px !important;
      padding: 6px 4px !important;
      text-align: center;
    }
    .roc-date-input.roc-mmdd {
      width: 52px !important;
    }

    .btn-row { display: flex; gap: 8px; margin-top: 20px; }

    .btn-primary {
      flex: 2;
      padding: 10px;
      background: #378ADD;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 28px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary:disabled { background: #ccc; cursor: default; }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: transparent;
      color: #666;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 26px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── 儲存狀態 ── */
    .save-hint {
      font-size: 22px;
      color: #ccc;
      text-align: center;
      padding: 8px 0 4px;
    }

    /* ── 載入 ── */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #e0e0e0;
      border-top-color: #378ADD;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    /* nav.js 側欄整合 */
    @media (min-width: 768px) {
      body { padding-left: 220px !important; }
    }
    @media (max-width: 767px) {
      body { padding-top: 50px !important; padding-bottom: 66px !important; }
    }
  </style>
  <script src="nav.js"></script>
</head>
<body>

  <!-- Header（分析日已在 nav 顯示，返回按鈕改由 nav 負責，此處僅顯示家庭名稱）-->
  <div class="header">
    <div class="header-title" id="family-title" style="padding-left:4px">載入中…</div>
  </div>

  <!-- 主內容 -->
  <div class="main" id="main-content" style="display:none">

    <!-- 家庭成員切換列 -->
    <div class="section-label">家庭成員</div>
    <div class="members-row" id="members-row"></div>

    <!-- 僅受益人名單 -->
    <div id="benef-row" style="display:none" class="benef-row"></div>

    <!-- 選中成員資料卡已移除：編輯入口整合至成員卡片上方 -->
    <!-- 保留隱藏元素供 JS 讀取（selectMember 仍會設定這些值）-->
    <span id="card-name" style="display:none">—</span>
    <!-- card-age-badge 已停用 -->
    <div id="card-birth" style="display:none"></div>
    <div id="card-analysis" style="display:none"></div>
    <div id="person-card" style="display:none"></div>

    <!-- 功能模組 -->
    <div class="section-label">
      功能模組　<span id="module-hint" style="font-weight:400; color:#bbb;"></span>
    </div>
    <div class="modules-grid">
      <button class="module-btn" onclick="goModule('policy')">
        <span class="module-icon">📋</span>
        <span class="module-label">保險繳費</span>
      </button>
      <button class="module-btn" onclick="goModule('beneficiary')">
        <span class="module-icon">👥</span>
        <span class="module-label">受益人</span>
      </button>
      <button class="module-btn" onclick="goModule('coverage')">
        <span class="module-icon">🛡️</span>
        <span class="module-label">保障清單</span>
      </button>
      <button class="module-btn" onclick="goModule('summary')">
        <span class="module-icon">📊</span>
        <span class="module-label">保單彙總</span>
      </button>
      <button class="module-btn" onclick="goModule('savings')">
        <span class="module-icon">🐷</span>
        <span class="module-label">儲蓄險</span>
      </button>
      <button class="module-btn" onclick="goModule('export')">
        <span class="module-icon">🖼️</span>
        <span class="module-label">匯出圖片</span>
      </button>
      <button class="module-btn" onclick="goModule('hospital')">
        <span class="module-icon">🏥</span>
        <span class="module-label">醫院病房</span>
      </button>
      <button class="module-btn" onclick="goModule('visit')">
        <span class="module-icon">📝</span>
        <span class="module-label">訪談紀錄</span>
      </button>
    </div>

    <div class="save-hint" style="color:#9CA3AF;font-size: 22px;text-align:center;padding:14px 0 4px;letter-spacing:.02em">☁️ 資料自動儲存至 Google Drive</div>

  </div>

  <!-- 載入中 -->
  <div id="loading-view" style="text-align:center; padding:60px 20px; color:#bbb; font-size: 26px;">
    <span class="spinner"></span> <span id="family-loading-text">保單資料庫安全連線中...</span>
  </div>

  <!-- 新增成員 Modal -->
  <div class="modal-overlay" id="add-member-modal" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        新增家庭成員
        <button class="modal-close" onclick="closeAddMember()">×</button>
      </div>

      <div class="field">
        <label>姓名 <span style="color:#e74c3c">*</span></label>
        <input type="text" id="new-name" placeholder="請輸入姓名" oninput="updateAddBtn()" />
      </div>

      <div class="field">
        <label>與主要成員的關係</label>
        <select id="new-relation">
          <option>配偶</option>
          <option>子女</option>
          <option>父母</option>
          <option>祖父母</option>
          <option>兄弟姊妹</option>
          <option>其他</option>
        </select>
      </div>

      <div class="field">
        <label>出生日期（民國）</label>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="number" id="new-birth-y" placeholder="年" min="1" max="200" class="roc-date-input" oninput="onNewBirthRocChange()" />年
          <input type="number" id="new-birth-m" placeholder="月" min="1" max="12" class="roc-date-input roc-mmdd" oninput="onNewBirthRocChange()" />月
          <input type="number" id="new-birth-d" placeholder="日" min="1" max="31" class="roc-date-input roc-mmdd" oninput="onNewBirthRocChange()" />日
        </div>
        <input type="hidden" id="new-birth" />
        <div class="hint" id="new-age-hint"></div>
      </div>

      <div class="field">
        <label>性別</label>
        <select id="new-gender">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
        <div class="hint" style="font-size:12px;color:#999;margin-top:3px">用於平均餘命試算，之後也會用於家系圖</div>
      </div>

      <div class="field">
        <label>身分證字號（選填）</label>
        <input type="text" id="new-id-number" placeholder="沒有也沒關係，之後隨時可以補填" maxlength="10" style="text-transform:uppercase" />
        <div class="hint" style="font-size:12px;color:#999;margin-top:3px">用於之後批次匯入保單資料時比對客戶身分，現在沒有可以先跳過</div>
      </div>

      <div class="field">
        <label>角色</label>
        <select id="new-role">
          <option value="secondary">次要成員（有自己的保單）</option>
          <option value="beneficiary_only">僅受益人（不列入保單彙總）</option>
        </select>
      </div>

      <div class="field">
        <label>住家地址 <span style="font-size: 20px;color:#aaa">（非必填）</span></label>
        <input type="text" id="new-address" placeholder="如：台北市中正區"
          style="width:100%;padding:9px 12px;font-size: 28px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit" />
        <div style="font-size: 22px;color:#aaa;margin-top:3px">填入後可在保單彙總查詢附近醫院病房費</div>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="closeAddMember()">取消</button>
        <button class="btn-primary" id="add-member-btn" onclick="addMember()" disabled>新增成員</button>
      </div>
    </div>
  </div>

  <!-- 編輯成員 Modal -->
  <div class="modal-overlay" id="edit-person-modal" onclick="handleEditOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        編輯個人資料
        <button class="modal-close" onclick="closeEditPerson()">×</button>
      </div>

      <div class="field">
        <label>姓名</label>
        <input type="text" id="edit-name" placeholder="姓名" />
      </div>

      <div class="field" id="edit-relation-field">
        <label>與主要成員的關係</label>
        <select id="edit-relation">
          <option value="本人">本人</option>
          <option value="配偶">配偶</option>
          <option value="子女">子女</option>
          <option value="父母">父母</option>
          <option value="祖父母">祖父母</option>
          <option value="兄弟姊妹">兄弟姊妹</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="field">
        <label>出生日期（民國）</label>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="number" id="edit-birth-y" placeholder="年" min="1" max="200" class="roc-date-input" oninput="onEditBirthRocChange()" />年
          <input type="number" id="edit-birth-m" placeholder="月" min="1" max="12" class="roc-date-input roc-mmdd" oninput="onEditBirthRocChange()" />月
          <input type="number" id="edit-birth-d" placeholder="日" min="1" max="31" class="roc-date-input roc-mmdd" oninput="onEditBirthRocChange()" />日
        </div>
        <input type="hidden" id="edit-birth" />
        <div class="hint" id="edit-age-hint"></div>
      </div>

      <div class="field">
        <label>性別</label>
        <select id="edit-gender">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
        <div class="hint" style="font-size:12px;color:#999;margin-top:3px">用於平均餘命試算，之後也會用於家系圖</div>
      </div>

      <div class="field">
        <label>身分證字號（選填）</label>
        <input type="text" id="edit-id-number" placeholder="沒有也沒關係，之後隨時可以補填" maxlength="10" style="text-transform:uppercase" />
        <div class="hint" style="font-size:12px;color:#999;margin-top:3px">用於之後批次匯入保單資料時比對客戶身分，現在沒有可以先跳過</div>
      </div>

      <div class="field">
        <label>分析日（民國）</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="edit-analysis-y" placeholder="年" min="1" max="200" class="roc-date-input" oninput="onEditAnalysisRocChange()" />年
          <input type="number" id="edit-analysis-m" placeholder="月" min="1" max="12" class="roc-date-input roc-mmdd" oninput="onEditAnalysisRocChange()" />月
          <input type="number" id="edit-analysis-d" placeholder="日" min="1" max="31" class="roc-date-input roc-mmdd" oninput="onEditAnalysisRocChange()" />日
        </div>
        <input type="hidden" id="edit-analysis" />
      </div>

      <div class="field">
        <label>住家地址</label>
        <input type="text" id="edit-address" placeholder="如：台北市中正區重慶南路1段" style="width:100%;padding:9px 12px;font-size: 28px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit" />
        <div style="font-size: 22px;color:#aaa;margin-top:3px">填入縣市+區/鄉鎮，用於保單彙總查詢附近醫院病房費</div>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="closeEditPerson()">取消</button>
        <button class="btn-primary" onclick="saveEditPerson()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 共用「從清單選一個」彈窗，取代 window.prompt() -->
  <div class="modal-overlay" id="picker-modal" onclick="handlePickerOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        <span id="picker-modal-title">請選擇</span>
        <button class="modal-close" onclick="closePicker(null)">&times;</button>
      </div>
      <div id="picker-modal-list"></div>
    </div>
  </div>

  <script>
    // ── 設定 ─────────────────────────────────────────────────
    // GAS_URL 已移至 nav.js 統一管理

    var currentUser   = null;
    var familyData    = null;
    var familyFileName = null;
    var personDataMap = {};      // personId → personData
    var selectedPersonId = null;
    var _navDataReceived = false;

    // ── 效能優化：不再自己重複呼叫一次 readFamilyBundle，
    //    改成直接「借用」nav.js 已經抓好的資料（nav.js 也已經改用
    //    readFamilyBundle，一次連家庭+成員資料都拿到了）。
    //    這樣同一個頁面就不會出現「nav.js 抓一次、頁面自己又抓一次」
    //    這種重複請求的情況。
    function _handleNavReady(detail) {
      if (_navDataReceived) return;
      _navDataReceived = true;
      
      // 資料回來了，立刻關閉輪播計時器
      if (typeof familyLoadingTimer !== 'undefined') clearInterval(familyLoadingTimer);

      if (!detail || !detail.familyData) {
        document.getElementById("loading-view").innerHTML =
          '<div style="color:#e74c3c">載入失敗，請重新整理頁面</div>';
        return; // 這個 return 現在是正確的，因為它在 function 裡面
      } // <--- 只留這一個關閉括號！

      // 以下這些程式碼現在才會正確地包含在 function 內
      familyData    = detail.familyData;
      personDataMap = detail.personsData || {};

      const activeMembers   = (familyData.members || []).filter(m => m.role !== "beneficiary_only");
      const missingMembers  = activeMembers.filter(m => !personDataMap[m.personId]);

      if (missingMembers.length === 0) {
        renderPage();
        return;
      }

      const savedUser = JSON.parse(localStorage.getItem("nbs_user") || "{}");
      const fetchPromises = missingMembers.map(m => {
        return callGAS("readFile", {
          email: savedUser.email,
          fileType: "persons",
          fileName: m.name + "_" + m.personId + ".json",
        }).then(pr => {
          if (pr.status === "ok") personDataMap[m.personId] = pr.content;
        }).catch(e => console.error("讀取 " + m.name + " 失敗", e));
      });

      Promise.all(fetchPromises).then(renderPage).catch(e => {
        document.getElementById("loading-view").innerHTML =
          '<div style="color:#e74c3c">載入失敗：' + e.message + '</div>';
      });
    }

    window.addEventListener("nbs_nav_ready", function(e) { _handleNavReady(e.detail); });

    // ── 動態載入文字設定 ──
    var familyLoadingMessages = [
      "保單資料庫安全連線中...",
      "正在載入家庭成員清單...",
      "精算各項保障額度與明細...",
      "即將為您呈現專屬報告..."
    ];
    var familyMsgIndex = 0;
    var familyLoadingTimer = setInterval(() => {
      familyMsgIndex = (familyMsgIndex + 1) % familyLoadingMessages.length;
      const textEl = document.getElementById("family-loading-text");
      if (textEl) textEl.textContent = familyLoadingMessages[familyMsgIndex];
    }, 1500);
    
    // ── 初始化 ────────────────────────────────────────────────
    // 原本用 window.onload = function(){...}，但瀏覽器的 load 事件
    // 只會在「整份文件真正載入」時觸發一次；在 SPA shell 底下，這支
    // script 是被 router 在 shell 早就 load 完成後才重新執行，
    // window.onload 這時候再指定新的處理函式也不會被呼叫到——等於
    // 這一整段登入驗證、家庭檔名檢查、20 秒逾時保護，在 SPA 模式下
    // 會被靜默略過。改成立即執行的函式：因為這段 <script> 本來就在
    // body 尾端、DOM 已經解析完成才會執行到這裡，不論是「獨立整頁
    // 開啟」或「SPA 重新執行」，效果都跟原本一致，不會有任何行為差異。
    (function() {
      // 驗證登入
      const saved = localStorage.getItem("nbs_user");
      if (!saved) { window.location.href = "index.html"; return; }
      currentUser = JSON.parse(saved);

      // 取得家庭檔名
      familyFileName = localStorage.getItem("nbs_current_family");
      if (!familyFileName) { window.location.href = "main.html"; return; }

      // 保護：理論上 nav.js 一定會觸發 nbs_nav_ready，
      // 但萬一發生意外狀況，等待時間拉長到 20 秒
      // （nav.js 現在失敗會自動重試一次，最壞情況下單次嘗試+重試
      //  可能要 15~20 秒，逾時門檻要跟著放寬，避免明明還在重試
      //  卻被誤判成逾時）。
      setTimeout(function() {
        if (!_navDataReceived) {
          document.getElementById("loading-view").innerHTML =
            '<div style="color:#e74c3c">載入逾時，請重新整理頁面</div>';
        }
      }, 20000);
    })();

    // ── 渲染頁面 ──────────────────────────────────────────────
    function renderPage() {
      // 防呆：如果是「在這個家庭詳情頁裡刪除自己」，刪除完成後 nav.js
      // 會重新廣播一次頁面資料，這次 familyData 會是空的（家庭已經被
      // 刪掉了）。這時候不要嘗試渲染，安靜地跳過就好，實際畫面已經在
      // 準備導回 main.html 了，不需要再畫一次注定會出錯的內容。
      if (!familyData) return;

      document.getElementById("loading-view").style.display = "none";
      document.getElementById("main-content").style.display = "block";

      // Header
      document.getElementById("family-title").textContent = familyData.familyName;
      // 分析日已由 nav.js 在側欄顯示，header 不重複顯示

      // 成員列
      renderMembers();

      // 預設選主要成員
      const primary = familyData.members.find(m => m.role === "primary");
      if (primary) selectMember(primary.personId);
    }

    // ── 渲染成員列 ────────────────────────────────────────────
    // ── 成員卡片點擊：第一次選中，已選中再點 → 開編輯 ──
    function memberCardClick(el) {
      var pid = el.getAttribute('data-pid');
      if (selectedPersonId === pid) {
        openEditPerson();  // 已選中的成員再點一次 → 開編輯
      } else {
        selectMember(pid); // 第一次點 → 選中
      }
    }

        function renderMembers() {
      const row = document.getElementById("members-row");
      const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
      const benefMembers  = familyData.members.filter(m => m.role === "beneficiary_only");

      row.innerHTML = activeMembers.map(m => {
        const person = personDataMap[m.personId];
        const age = person ? calcInsAge(person.profile.birthDate, person.profile.analysisDate) : null;
        const rc = m.role === "primary" ? "role-primary" : "role-secondary";
        // 主要成員顯示「本人」，次要成員優先顯示 relation（配偶/子女…），否則顯示「次要」
        const rl = m.role === "primary" ? "本人" : (m.relation || "次要");
        const escName = m.name.replace(/'/g, "\\'");
        return `
          <div class="member-card ${selectedPersonId === m.personId ? 'active' : ''}"
               data-pid="${m.personId}"
               onclick="memberCardClick(this)">
            ${selectedPersonId === m.personId ? '<div class="member-edit-hint">✏️ 點選編輯</div>' : ''}
            <div class="member-menu-btn" title="更多操作" onclick="event.stopPropagation();toggleMemberMenu(event,'${m.personId}')">⋯</div>
            <div class="member-menu" id="member-menu-${m.personId}">
              <div class="member-menu-opt" onclick="event.stopPropagation();closeAllMemberMenus();promptSplitMember('${m.personId}','${escName}')">🏠 移出、獨立成家</div>
              <div class="member-menu-opt" onclick="event.stopPropagation();closeAllMemberMenus();promptMergeMember('${m.personId}','${escName}')">🔀 合併到其他家庭</div>
              <div class="member-menu-opt danger" onclick="event.stopPropagation();closeAllMemberMenus();promptDeleteMember('${m.personId}','${escName}')">🗑️ 刪除這位成員</div>
            </div>
            <div class="member-name">${m.name}</div>
            <div class="member-age">${age !== null ? age + '歲' : '—'}</div>
            <span class="role-badge ${rc}">${rl}</span>
          </div>`;
      }).join("") + `
        <button class="add-member-btn" onclick="openAddMember()">
          <span style="font-size: 24px">＋</span>
          <span style="font-size: 15px">新增</span>
        </button>`;

      // 受益人名單
      const benefRow = document.getElementById("benef-row");
      if (benefMembers.length > 0) {
        benefRow.style.display = "flex";
        benefRow.innerHTML = `<span style="font-size: 22px;color:#aaa;">受益人名單：</span>` +
          benefMembers.map(m => `<span class="benef-tag">${m.name}</span>`).join("");
      } else {
        benefRow.style.display = "none";
      }
    }

    // ── 刪除單一成員 ──────────────────────────────────────────
    // 跟刪除整個家庭比照同一套「輸入姓名確認」的安全機制，畢竟會連同
    // 這個人名下所有保單資料一起刪掉，一樣無法復原。
    async function promptDeleteMember(personId, name) {
      const member = familyData.members.find(m => m.personId === personId);
      if (!member) return;
      const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
      if (activeMembers.length <= 1) {
        alert("這是這個家庭目前唯一的成員，沒辦法在這裡刪除。如果整個家庭都不需要了，請回列表頁使用「刪除整個檔案」。");
        return;
      }
      const warnExtra = member.role === "primary"
        ? "\n\n⚠️ 這是「本人」（主要成員），刪除後這個家庭會沒有主要成員，建議先確認要不要改指定其他成員為本人。"
        : "";
      if (!window.confirm("確定要刪除「" + name + "」這位成員嗎？" + warnExtra + "\n\n這會一併刪除這個人名下所有的保單資料，此動作無法復原。")) return;
      const typed = window.prompt("最後確認：請完整輸入「" + name + "」以永久刪除：");
      if (typed === null) return;
      if (typed.trim() !== name) { alert("輸入的內容不符，已取消刪除，資料仍然保留。"); return; }

      try {
        // 刪除這個人的個人資料檔案（保單、保障內容等都在裡面）
        await callGAS("deleteFile", {
          email: currentUser.email,
          fileType: "persons",
          fileName: name + "_" + personId + ".json",
        });
        // 家庭成員名單移除這個人，重新存檔
        familyData.members = familyData.members.filter(m => m.personId !== personId);
        familyData.updatedAt = new Date().toISOString();
        await callGAS("saveFile", {
          email: currentUser.email,
          fileType: "families",
          fileId: familyData.familyId,
          fileName: familyFileName,
          content: familyData,
        });
        delete personDataMap[personId];
        if (selectedPersonId === personId) {
          const remaining = familyData.members.find(m => m.role !== "beneficiary_only");
          selectedPersonId = remaining ? remaining.personId : null;
        }
        renderMembers();
        if (selectedPersonId) selectMember(selectedPersonId);
        if (window.NBS_NAV && typeof NBS_NAV.invalidateBundleCache === 'function') {
          NBS_NAV.invalidateBundleCache();
        }
      } catch (e) {
        alert("刪除失敗：" + e.message);
      }
    }


    // ── 成員卡片右上角的「⋯」小選單 ──────────────────────────
    function toggleMemberMenu(evt, personId) {
      evt.stopPropagation();
      const menu = document.getElementById("member-menu-" + personId);
      if (!menu) return;
      const isOpen = menu.classList.contains("open");
      closeAllMemberMenus();
      if (!isOpen) menu.classList.add("open");
    }
    function closeAllMemberMenus() {
      document.querySelectorAll(".member-menu.open").forEach(m => m.classList.remove("open"));
    }
    window.addEventListener("click", closeAllMemberMenus);

    // ── 共用「從清單選一個」彈窗 ──────────────────────────────
    // 用法：const value = await pickFromList("標題", [{label, sub, value}]);
    // 使用者點了某一項 → resolve 該項的 value；按取消/叉叉/點背景 → resolve null。
    var _pickerResolve = null;
    var _pickerOptions = null;
    function pickFromList(title, options) {
      return new Promise(function(resolve) {
        _pickerResolve = resolve;
        _pickerOptions = options;
        document.getElementById("picker-modal-title").textContent = title;
        document.getElementById("picker-modal-list").innerHTML = options.map(function(o, i) {
          return '<div class="picker-option" onclick="closePicker(' + i + ')">' +
            '<span>' + o.label + '</span>' +
            (o.sub ? '<span class="sub">' + o.sub + '</span>' : '') +
            '</div>';
        }).join("");
        document.getElementById("picker-modal").classList.add("active");
      });
    }
    function closePicker(indexOrNull) {
      document.getElementById("picker-modal").classList.remove("active");
      var resolve = _pickerResolve;
      var options = _pickerOptions;
      _pickerResolve = null;
      _pickerOptions = null;
      if (!resolve) return;
      if (indexOrNull === null || indexOrNull === undefined) resolve(null);
      else resolve(options[indexOrNull].value);
    }
    function handlePickerOverlayClick(evt) {
      if (evt.target.id === "picker-modal") closePicker(null);
    }

    // ── 移出、獨立成家 ────────────────────────────────────────
    // 用途：批次匯入沒被判斷成同一家庭、或家庭成員離婚／子女成年
    // 搬出去，需要把這個人從目前家庭拆出去、自己成立一個新家庭。
    //
    // 資料結構上這件事很單純：person.json 完全沒有「屬於哪個家庭」
    // 這個欄位，家庭只是靠 family.json 的 members 清單去指向 personId，
    // 所以只需要改兩份 family.json（原家庭移除、新家庭建立），完全
    // 不需要動這個人自己的保單/保障資料。
    async function promptSplitMember(personId, name) {
      const member = familyData.members.find(m => m.personId === personId);
      if (!member) return;
      const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
      if (activeMembers.length <= 1) {
        alert("這是這個家庭目前唯一的成員，沒有其他人留在原家庭，不需要拆分。");
        return;
      }

      // 如果被移出的人是「本人」，原家庭一定要有人接手，不然「本人」
      // 判斷邏輯（家庭總覽、保障彙總都靠這個欄位）會整個壞掉。
      let newPrimaryId = null;
      if (member.role === "primary") {
        const others = activeMembers.filter(m => m.personId !== personId);
        const picked = await pickFromList(
          "「" + name + "」是本人，移出後原家庭要指定新的本人：",
          others.map(m => ({ label: m.name, sub: m.relation || "", value: m.personId }))
        );
        if (picked === null) return;
        newPrimaryId = picked;
      }

      if (!window.confirm("確定要把「" + name + "」移出這個家庭、獨立成立一個新的家庭嗎？\n\n這個人名下的保單與保障資料不會受影響，只是換一個家庭歸戶。")) return;

      try {
        // 1) 原家庭：移除這個人，視情況指定新本人
        familyData.members = familyData.members.filter(m => m.personId !== personId);
        if (newPrimaryId) {
          const np = familyData.members.find(m => m.personId === newPrimaryId);
          if (np) { np.role = "primary"; np.relation = "本人"; }
        }
        familyData.updatedAt = new Date().toISOString();
        await callGAS("saveFile", {
          email: currentUser.email, fileType: "families",
          fileId: familyData.familyId, fileName: familyFileName, content: familyData,
        });

        // 2) 建立新家庭，這個人是新家庭的本人
        const newFamilyId = "f_" + Date.now();
        const newFamilyName = name + "家";
        const newFamilyData = {
          version: "3.0.0",
          familyId: newFamilyId,
          familyName: newFamilyName,
          agentId: currentUser.email,
          analysisDate: familyData.analysisDate,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          members: [{ personId: personId, name: name, role: "primary", relation: "本人" }],
          sharedBeneficiary: [],
        };
        await callGAS("saveFile", {
          email: currentUser.email, fileType: "families",
          fileId: newFamilyId, fileName: newFamilyName + "_" + newFamilyId + ".json",
          content: newFamilyData,
        });

        delete personDataMap[personId];
        if (selectedPersonId === personId) {
          const remaining = familyData.members.find(m => m.role !== "beneficiary_only");
          selectedPersonId = remaining ? remaining.personId : null;
        }
        renderMembers();
        if (selectedPersonId) selectMember(selectedPersonId);
        if (window.NBS_NAV && typeof NBS_NAV.invalidateBundleCache === 'function') NBS_NAV.invalidateBundleCache();
        alert("已將「" + name + "」移到新家庭「" + newFamilyName + "」，回家庭列表就找得到，可以自行修改家庭名稱。");
      } catch (e) {
        alert("移出失敗：" + e.message + "\n\n請重新整理頁面確認實際結果，避免重複操作造成資料不一致。");

    // ── 合併到其他家庭 ────────────────────────────────────────
    // 用途：批次匯入時沒被自動判斷成同一家庭（例如結婚後、要保人跟
    // 被保人姓名對不起來），或原本各自建檔的兩個人結婚了，要合併成
    // 一戶。
    async function promptMergeMember(personId, name) {
      const member = familyData.members.find(m => m.personId === personId);
      if (!member) return;
      const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
      // 只剩這一人也可以合併——合併完原家庭會變空殼，直接一併刪掉
      // 那個空殼檔案就好（下面存檔那一步會處理），不需要因此擋下操作。

      // 1) 抓可以選的家庭清單（排除自己這個家庭）
      let list;
      try {
        const res = await callGAS("listFamilies", { email: currentUser.email });
        list = (res.families || []).filter(f => f.fileName !== familyFileName);
      } catch (e) { alert("讀取家庭清單失敗：" + e.message); return; }
      if (!list.length) { alert("目前沒有其他家庭可以合併過去。"); return; }

      const targetFileName = await pickFromList(
        "把「" + name + "」合併到哪個家庭？",
        list.map(f => ({ label: f.familyName, sub: (f.memberCount || 0) + " 位成員", value: f.fileName }))
      );
      if (targetFileName === null) return;
      const target = list.find(f => f.fileName === targetFileName);
      if (!target) return;

      const relation = await pickFromList(
        "「" + name + "」跟「" + target.familyName + "」本人的關係是？",
        ["配偶","子女","父母","祖父母","兄弟姊妹","其他"].map(r => ({ label: r, value: r }))
      );
      if (relation === null) return;

      // 如果被合併走的人是原家庭的本人，且原家庭合併後還有其他人留下，
      // 要先指定新本人；如果這人本來就是家庭裡唯一一人，合併後原家庭
      // 直接變空殼、一起刪掉即可，不需要指定新本人。
      const others = activeMembers.filter(m => m.personId !== personId);
      let newPrimaryId = null;
      const willBecomeEmpty = others.length === 0;
      if (member.role === "primary" && !willBecomeEmpty) {
        const picked = await pickFromList(
          "「" + name + "」是本人，合併出去後原家庭要指定新的本人：",
          others.map(m => ({ label: m.name, sub: m.relation || "", value: m.personId }))
        );
        if (picked === null) return;
        newPrimaryId = picked;
      }

      const confirmMsg = willBecomeEmpty
        ? "確定要把「" + name + "」合併到「" + target.familyName + "」，關係設為「" + relation.trim() + "」嗎？\n\n原本的「" + familyData.familyName + "」合併後會變成空的家庭，將一併自動刪除。"
        : "確定要把「" + name + "」合併到「" + target.familyName + "」，關係設為「" + relation.trim() + "」嗎？";
      if (!window.confirm(confirmMsg)) return;

      try {
        // 2) 先讀目標家庭「當下最新」的資料，不要用列表頁可能過期的
        //    快取內容去覆蓋，避免把別人剛好也在編輯的東西蓋掉。
        const bundle = await callGAS("readFamilyBundle", {
          email: currentUser.email, fileType: "families", fileName: target.fileName
        });
        if (!bundle || bundle.status !== "ok" || !bundle.family) {
          alert("讀取目標家庭資料失敗，已取消，原家庭資料沒有被更動。");
          return;
        }
        const targetFamily = bundle.family;

        // 3) 原家庭：移除這個人，視情況指定新本人
        familyData.members = familyData.members.filter(m => m.personId !== personId);
        if (newPrimaryId) {
          const np = familyData.members.find(m => m.personId === newPrimaryId);
          if (np) { np.role = "primary"; np.relation = "本人"; }
        }
        familyData.updatedAt = new Date().toISOString();
        if (willBecomeEmpty) {
          // 原家庭已經沒有任何成員了，是個空殼，直接刪掉這份家庭檔案，
          // 不要留著一筆空的家庭在列表裡。
          await callGAS("deleteFile", {
            email: currentUser.email, fileType: "families", fileName: familyFileName,
          });
        } else {
          await callGAS("saveFile", {
            email: currentUser.email, fileType: "families",
            fileId: familyData.familyId, fileName: familyFileName, content: familyData,
          });
        }

        // 4) 目標家庭：加進這個人
        targetFamily.members.push({ personId: personId, name: name, role: "family", relation: relation.trim() });
        targetFamily.updatedAt = new Date().toISOString();
        await callGAS("saveFile", {
          email: currentUser.email, fileType: "families",
          fileId: targetFamily.familyId, fileName: target.fileName, content: targetFamily,
        });

        if (window.NBS_NAV && typeof NBS_NAV.invalidateBundleCache === 'function') NBS_NAV.invalidateBundleCache();

        if (willBecomeEmpty) {
          // 這個家庭已經整個併走、檔案也刪了，這個頁面沒有東西可以留著看，
          // 直接導回家庭列表。
          alert("已將「" + name + "」合併到「" + target.familyName + "」，原本的「" + familyData.familyName + "」已一併移除。");
          if (window.NBS_NAV && typeof NBS_NAV.navigate === 'function') {
            NBS_NAV.navigate("main.html", { skipPush: true });
          } else {
            window.location.href = "main.html";
          }
          return;
        }

        delete personDataMap[personId];
        if (selectedPersonId === personId) {
          const remaining = familyData.members.find(m => m.role !== "beneficiary_only");
          selectedPersonId = remaining ? remaining.personId : null;
        }
        renderMembers();
        if (selectedPersonId) selectMember(selectedPersonId);
        alert("已將「" + name + "」合併到「" + target.familyName + "」。");
      } catch (e) {
        alert("合併失敗：" + e.message + "\n\n請重新整理頁面確認實際結果，避免重複操作造成資料不一致。");
      }
    }

    // ── 工具函式 ──────────────────────────────────────────────
    function toRoc(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      if (isNaN(d)) return "—";
      return (d.getFullYear()-1911) + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
    }

    // ── 民國年/月/日 ↔ 西元 ISO 日期字串（YYYY-MM-DD）互轉 ──
    // 內部儲存與所有計算（保險年齡、星座、生命靈數等）都還是用西元 ISO，
    // 只有輸入介面改成民國年，減少業務員自己心算換算的麻煩。
    function rocToIso(rocYear, month, day) {
      rocYear = parseInt(rocYear, 10);
      month   = parseInt(month, 10);
      day     = parseInt(day, 10);
      if (!rocYear || !month || !day) return "";
      const adYear = rocYear + 1911;
      const mm = String(month).padStart(2, "0");
      const dd = String(day).padStart(2, "0");
      return adYear + "-" + mm + "-" + dd;
    }

    function isoToRocParts(iso) {
      if (!iso) return { y: "", m: "", d: "" };
      const d = new Date(iso);
      if (isNaN(d)) return { y: "", m: "", d: "" };
      return { y: d.getFullYear() - 1911, m: d.getMonth() + 1, d: d.getDate() };
    }

    // 民國年/月/日三格輸入的自動跳格：月/日固定 2 碼，打滿就自動跳下一格；
    // 年因為可能是 2 碼（例如民國 53 年）也可能是 3 碼（例如民國 115
    // 年），打滿 3 碼才自動跳，2 碼的情況維持原本手動按 Tab／點擊切換，
    // 這是刻意的取捨，不是漏做。
    function wireRocAutoAdvance(yId, mId, dId) {
      const yEl = document.getElementById(yId);
      const mEl = document.getElementById(mId);
      const dEl = document.getElementById(dId);
      if (yEl && mEl) yEl.addEventListener("input", function(){
        if (this.value.replace(/\D/g,"").length >= 3) mEl.focus();
      });
      if (mEl && dEl) mEl.addEventListener("input", function(){
        if (this.value.replace(/\D/g,"").length >= 2) dEl.focus();
      });
    }
    wireRocAutoAdvance("new-birth-y", "new-birth-m", "new-birth-d");
    wireRocAutoAdvance("edit-birth-y", "edit-birth-m", "edit-birth-d");
    wireRocAutoAdvance("edit-analysis-y", "edit-analysis-m", "edit-analysis-d");

    function onNewBirthRocChange() {
      const y = document.getElementById("new-birth-y").value;
      const m = document.getElementById("new-birth-m").value;
      const d = document.getElementById("new-birth-d").value;
      document.getElementById("new-birth").value = rocToIso(y, m, d);
      updateNewAge();
    }

    function onEditBirthRocChange() {
      const y = document.getElementById("edit-birth-y").value;
      const m = document.getElementById("edit-birth-m").value;
      const d = document.getElementById("edit-birth-d").value;
      document.getElementById("edit-birth").value = rocToIso(y, m, d);
      updateEditAge();
    }

    function calcInsAge(birthDate, analysisDate) {
      if (!birthDate) return null;
      const b = new Date(birthDate);
      const a = new Date(analysisDate || new Date());
      let years = a.getFullYear() - b.getFullYear();
      const months = (a - new Date(b.getFullYear()+years, b.getMonth(), b.getDate())) / (1000*60*60*24*30.4375);
      if (months >= 6) years++;
      return years;
    }

function callGAS(action, params) {
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === 'function') {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error('nav.js 未載入'));
}

  selectMember(pid);
};
