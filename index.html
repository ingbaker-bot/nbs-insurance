<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBS 雲端保單體檢</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:16px;padding:40px 36px;max-width:400px;width:100%;box-shadow:0 2px 20px rgba(0,0,0,.08);text-align:center}
    .logo{font-size:40px;margin-bottom:12px}
    .title{font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
    .subtitle{font-size:13px;color:#999;margin-bottom:32px}
    .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 20px;background:#fff;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-weight:500;color:#333;cursor:pointer;transition:background .15s;margin-bottom:16px;font-family:inherit;text-decoration:none}
    .google-btn:hover{background:#f7f7f5;border-color:#bbb}
    .google-btn img{width:20px;height:20px}
    .apply-link{font-size:13px;color:#378ADD;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit}
    .status-box{display:none;margin-top:16px;padding:12px 16px;border-radius:8px;font-size:13px;text-align:left;line-height:1.6}
    .info{background:#E6F1FB;color:#0C447C;border:1px solid #A8CEF0}
    .success{background:#EAF3DE;color:#27500A;border:1px solid #A8D5B5}
    .warning{background:#FAEEDA;color:#633806;border:1px solid #EF9F27}
    .error{background:#FCEBEB;color:#791F1F;border:1px solid #F0A8BF}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid #e0e0e0;border-top-color:#378ADD;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .apply-form{display:none;text-align:left;margin-top:20px}
    .form-title{font-size:15px;font-weight:600;margin-bottom:16px;color:#1a1a1a}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:#666;margin-bottom:4px}
    .field input,.field select{width:100%;padding:9px 12px;font-size:14px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit;background:#fff}
    .field input:focus,.field select:focus{border-color:#378ADD}
    .btn-primary{width:100%;padding:11px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
    .btn-primary:disabled{background:#ccc;cursor:default}
    .btn-secondary{width:100%;padding:10px;background:transparent;color:#666;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;cursor:pointer;margin-top:8px;font-family:inherit}
    .waiting-box{display:none;text-align:center;padding:20px 0}
    .footer{margin-top:24px;font-size:11px;color:#ccc}
    .divider{font-size:12px;color:#aaa;margin-bottom:12px}
    .load-wrap{padding:10px 0;display:none}
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="card">
  <div class="logo">🛡️</div>
  <div class="title">NBS 雲端保單體檢</div>
  <div class="subtitle">富邦人壽保險顧問專用系統</div>

  <!-- 登入畫面 -->
  <div id="view-login">
    <div class="load-wrap" id="load-wrap">
      <span class="spinner"></span><span style="font-size:14px;color:#666">驗證中，請稍候…</span>
    </div>
    <a class="google-btn" id="login-btn" href="#">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G"/>
      使用 Google 帳號登入
    </a>
    <div class="divider">──── 還沒有帳號？ ────</div>
    <button class="apply-link" id="apply-link-btn">申請使用帳號</button>
  </div>

  <!-- 等待審核 -->
  <div class="waiting-box" id="view-waiting">
    <div style="font-size:40px;margin-bottom:12px">⏳</div>
    <div style="font-size:16px;font-weight:500;margin-bottom:8px">帳號審核中</div>
    <div style="font-size:13px;color:#888;line-height:1.7" id="waiting-desc">您的申請已送出，請等待管理員審核。</div>
    <button class="btn-secondary" style="margin-top:16px" id="back-from-wait">返回登入</button>
  </div>

  <!-- 申請表單 -->
  <div class="apply-form" id="view-apply">
    <div class="form-title">申請使用帳號</div>
    <div class="field">
      <label>姓名 <span style="color:#e74c3c">*</span></label>
      <input type="text" id="apply-name" placeholder="請輸入真實姓名"/>
    </div>
    <div class="field">
      <label>Google 帳號 Email <span style="color:#e74c3c">*</span></label>
      <input type="email" id="apply-email" placeholder="將用來登入系統的 Google 帳號"/>
    </div>
    <div class="field">
      <label>業務員編號 <span style="color:#e74c3c">*</span></label>
      <input type="text" id="apply-agentno" placeholder="請輸入業務員編號"/>
    </div>
    <div class="field">
      <label>所屬保險公司 <span style="color:#e74c3c">*</span></label>
      <select id="apply-company">
        <option value="">請選擇</option>
        <option>富邦人壽</option><option>國泰人壽</option><option>南山人壽</option>
        <option>新光人壽</option><option>中國人壽</option><option>台灣人壽</option>
        <option>三商美邦人壽</option><option>遠雄人壽</option><option>全球人壽</option>
        <option>保誠人壽</option><option>宏泰人壽</option><option>第一金人壽</option>
        <option>合作金庫人壽</option><option>臺銀人壽</option><option>元大人壽</option>
        <option>康健人壽</option><option>安聯人壽</option><option>友邦人壽</option>
        <option>法國巴黎人壽</option><option>宏利人壽</option><option value="其他">其他</option>
      </select>
    </div>
    <div class="status-box" id="apply-status"></div>
    <button class="btn-primary" id="apply-btn">送出申請</button>
    <button class="btn-secondary" id="back-from-apply">返回登入</button>
  </div>

  <div class="status-box" id="login-status"></div>
</div>

<div class="footer">NBS 雲端保單體檢 v1.0 · 資料存放於您的 Google 雲端硬碟</div>

<script>
var GAS = "https://script.google.com/macros/s/AKfycbwzDwyZy09189eOJOs-zEwkZOml2_pJOq15nYGtHF2Kyrtv6ag5VY-I2M8sDyrt0iPdZQ/exec";
var CLIENT_ID = "283591037159-ilcpl2sq7jopkdbp92ldbjti6dm7bhd5.apps.googleusercontent.com";
var REDIRECT = location.origin + location.pathname;

// ── 按鈕綁定（同步）─────────────────────────────────────
document.getElementById("apply-link-btn").onclick = function(){ showApply(); };
document.getElementById("back-from-wait").onclick  = function(){ showLogin(); };
document.getElementById("back-from-apply").onclick = function(){ showLogin(); };
document.getElementById("apply-btn").onclick       = doApply;

// ── 頁面載入 ─────────────────────────────────────────────
window.onload = function() {
  // implicit flow 把參數放在 hash (#) 後面，需要用 hash 讀取
  var hashParams = new URLSearchParams(window.location.hash.replace(/^#/,""));
  var searchParams = new URLSearchParams(window.location.search);
  var token = hashParams.get("id_token");
  var code  = searchParams.get("code");
  var err   = hashParams.get("error") || searchParams.get("error");

  if (err) {
    clearUrl();
    showLogin();
    showStatus("login-status","warning","登入已取消");
    return;
  }

  if (token) {
    // implicit flow：直接解析 id_token，同時取得 Drive access_token
    clearUrl();
    var info = parseJwt(token);
    // 讀取 Drive access_token（在 hash 中的 access_token 欄位）
    var accessToken = hashParams.get("access_token");
    var expiresIn = hashParams.get("expires_in");
    if (accessToken) {
      localStorage.setItem("nbs_token", accessToken);
      localStorage.setItem("nbs_token_expiry", String(Date.now() + (parseInt(expiresIn)||3600)*1000));
    }
    if (info && info.email) {
      saveAndCheck(info.email, info.name||"", info.picture||"");
    } else {
      showLogin();
      showStatus("login-status","error","登入失敗，請重試");
    }
    return;
  }

  if (code) {
    // authorization code flow：呼叫 GAS 換取使用者資訊
    clearUrl();
    showLoading();
    gas("exchangeCode", {code: code, redirect_uri: REDIRECT}).then(function(r){
      if (r.status==="ok" && r.email) {
        saveAndCheck(r.email, r.name||"", r.picture||"");
      } else {
        showLogin();
        showStatus("login-status","error","登入失敗，請重試");
      }
    }).catch(function(){
      showLogin();
      showStatus("login-status","error","連線失敗，請重試");
    });
    return;
  }

  // 檢查已儲存的登入資訊
  var saved = localStorage.getItem("nbs_user");
  if (saved) {
    try {
      var u = JSON.parse(saved);
      showLoading();
      checkAndGo(u.email);
      return;
    } catch(e) {
      localStorage.removeItem("nbs_user");
    }
  }

  // 設定登入按鈕 - 使用 implicit flow（不需要後端）
  document.getElementById("login-btn").href = buildLoginUrl();
  showLogin();
};

// ── 建立 OAuth URL（implicit flow，直接回傳 id_token）───
function buildLoginUrl() {
  var p = new URLSearchParams({
    client_id:     CLIENT_ID,
    redirect_uri:  REDIRECT,
    response_type: "token id_token",           // 同時取 Drive token 和 id_token
    scope:         "openid email profile https://www.googleapis.com/auth/drive.file",
    nonce:         Math.random().toString(36).slice(2),
    prompt:        "select_account",
    include_granted_scopes: "true",
  });
  return "https://accounts.google.com/o/oauth2/v2/auth?" + p.toString();
}

// ── 解析 JWT ─────────────────────────────────────────────
function parseJwt(token) {
  try {
    var b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(atob(b64).split("").map(function(c){
      return "%" + ("00"+c.charCodeAt(0).toString(16)).slice(-2);
    }).join("")));
  } catch(e) { return null; }
}

// ── 儲存使用者資訊並驗證 ─────────────────────────────────
function saveAndCheck(email, name, picture) {
  showLoading();
  localStorage.setItem("nbs_user", JSON.stringify({email:email, name:name, picture:picture}));
  checkAndGo(email);
}

function checkAndGo(email) {
  gas("checkAuth", {email: email}).then(function(r){
    if (r.authorized) {
      var u = JSON.parse(localStorage.getItem("nbs_user")||"{}");
      u.agentNo   = r.agentNo;
      u.agentName = r.name;
      u.company   = r.company;
      u.isAdmin   = r.isAdmin||false;
      localStorage.setItem("nbs_user", JSON.stringify(u));
      showStatus("login-status","success","✓ 驗證成功，正在進入系統…");
      setTimeout(function(){
        // 確認有 Drive token，沒有的話先去授權
        var driveToken = localStorage.getItem("nbs_token");
        var driveExpiry = localStorage.getItem("nbs_token_expiry");
        if (!driveToken || !driveExpiry || Date.now() >= parseInt(driveExpiry)) {
          // 重新觸發登入流程（這次會帶 drive.file scope）
          window.location.href = buildLoginUrl();
        } else {
          window.location.href = "main.html";
        }
      }, 800);
    } else {
      showLogin();
      if (r.status==="申請中") {
        document.getElementById("view-login").style.display = "none";
        document.getElementById("view-waiting").style.display = "block";
        document.getElementById("waiting-desc").innerHTML =
          "您的申請審核中，請等待管理員審核。<br/>審核通過後會發送通知至 <strong>"+email+"</strong>";
      } else if (r.status==="not_found") {
        showStatus("login-status","warning","此帳號尚未申請，請點下方「申請使用帳號」");
      } else {
        showStatus("login-status","error", r.message||"帳號未核准");
      }
    }
  }).catch(function(){
    showLogin();
    showStatus("login-status","error","連線失敗，請檢查網路後重試");
  });
}

// ── 申請帳號 ─────────────────────────────────────────────
function doApply() {
  var name    = document.getElementById("apply-name").value.trim();
  var email   = document.getElementById("apply-email").value.trim();
  var agentNo = document.getElementById("apply-agentno").value.trim();
  var company = document.getElementById("apply-company").value;
  if (!name||!email||!agentNo||!company) {
    showStatus("apply-status","error","請填寫所有必填欄位"); return;
  }
  var btn = document.getElementById("apply-btn");
  btn.disabled=true; btn.textContent="送出中…";
  gas("apply",{name:name,email:email,agentNo:agentNo,company:company}).then(function(r){
    btn.disabled=false; btn.textContent="送出申請";
    if(r.status==="ok")         showStatus("apply-status","success","✓ 申請成功！管理員審核後會發送通知至 "+email);
    else if(r.status==="already_approved") showStatus("apply-status","info","此帳號已核准，請直接登入");
    else if(r.status==="already_applied")  showStatus("apply-status","warning","此帳號已申請過，請等待審核");
    else showStatus("apply-status","error",r.message||"申請失敗，請重試");
  }).catch(function(){
    btn.disabled=false; btn.textContent="送出申請";
    showStatus("apply-status","error","連線失敗，請重試");
  });
}

// ── 畫面切換 ─────────────────────────────────────────────
function showLogin() {
  document.getElementById("view-login").style.display    = "block";
  document.getElementById("view-waiting").style.display  = "none";
  document.getElementById("view-apply").style.display    = "none";
  document.getElementById("login-status").style.display  = "none";
  document.getElementById("load-wrap").style.display     = "none";
  document.getElementById("login-btn").style.display     = "flex";
  // 更新登入按鈕的 OAuth URL
  document.getElementById("login-btn").href = buildLoginUrl();
}

function showLoading() {
  document.getElementById("load-wrap").style.display  = "block";
  document.getElementById("login-btn").style.display  = "none";
}

function showApply() {
  document.getElementById("view-login").style.display  = "none";
  document.getElementById("view-apply").style.display  = "block";
}

function showStatus(id, type, msg) {
  var el=document.getElementById(id);
  if(!el) return;
  el.className="status-box "+type;
  el.textContent=msg;
  el.style.display="block";
}

function clearUrl() {
  // 清除 search 和 hash 兩種參數
  window.history.replaceState({},"",location.pathname);
}

// ── GAS ──────────────────────────────────────────────────
function gas(action, params) {
  var url = new URL(GAS);
  url.searchParams.set("action", action);
  Object.entries(params||{}).forEach(function(kv){
    var k=kv[0], v=kv[1];
    if(typeof v==="object") url.searchParams.set(k, encodeURIComponent(JSON.stringify(v)));
    else if(v!==null&&v!==undefined) url.searchParams.set(k, v);
  });
  return fetch(url.toString()).then(function(r){ return r.json(); });
}
</script>
</body>
</html>
