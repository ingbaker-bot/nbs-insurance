<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBS 雲端保單體檢</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px;
      background:linear-gradient(160deg,#EEF4FF 0%,#F5F0FF 50%,#EFF9F4 100%);
    }

    /* ── 卡片 ── */
    .card{
      background:#fff;
      border-radius:20px;
      padding:40px 36px;
      max-width:400px;width:100%;
      box-shadow:0 8px 40px rgba(80,100,255,.10), 0 2px 8px rgba(0,0,0,.06);
      text-align:center;
      border:1px solid rgba(120,140,255,.12);
    }

    /* ── Logo ── */
    .logo-wrap{
      width:100%;
      margin:0 auto 20px;
      display:flex;align-items:center;justify-content:center;
    }
    .logo-wrap img{
      width:100%;max-width:280px;
      height:auto;object-fit:contain;
    }

    .title{font-size:22px;font-weight:800;color:#111827;margin-bottom:4px;letter-spacing:-.4px}
    .subtitle{font-size:12px;color:#9CA3AF;margin-bottom:28px;letter-spacing:.04em}

    /* ── 主登入按鈕（漸層）── */
    .google-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:13px 20px;
      background:linear-gradient(90deg,#3B82F6,#7C3AED);
      border:none;border-radius:12px;
      font-size:14px;font-weight:600;color:#fff;
      cursor:pointer;transition:opacity .15s,transform .1s;
      margin-bottom:14px;font-family:inherit;text-decoration:none;
    }
    .google-btn:hover{opacity:.9;transform:translateY(-1px)}
    .google-btn:active{transform:translateY(0);opacity:1}
    .google-btn .g-icon{
      width:20px;height:20px;border-radius:4px;
      background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .google-btn .g-icon img{width:14px;height:14px}

    /* ── 分隔線 ── */
    .divider{
      display:flex;align-items:center;gap:10px;
      font-size:12px;color:#D1D5DB;margin:4px 0 14px;
    }
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#F3F4F6}

    /* ── 申請連結 ── */
    .apply-link{
      font-size:13px;color:#6B7280;
      cursor:pointer;background:none;border:none;font-family:inherit;
      display:block;width:100%;
    }
    .apply-link span{color:#3B82F6;font-weight:600;border-bottom:1.5px solid #BFDBFE}
    .apply-link:hover span{color:#2563EB}

    /* ── 狀態框 ── */
    .status-box{
      display:none;margin-top:14px;
      padding:11px 14px;border-radius:10px;font-size:13px;text-align:left;line-height:1.6;
    }
    .info   {background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE}
    .success{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}
    .warning{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
    .error  {background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}

    /* ── spinner ── */
    .spinner{
      display:inline-block;width:18px;height:18px;
      border:2px solid #E5E7EB;border-top-color:#3B82F6;
      border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:6px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .load-wrap{padding:10px 0;display:none}

    /* ── 等待審核 ── */
    .waiting-box{display:none;text-align:center;padding:12px 0}
    .wait-icon{
      width:56px;height:56px;border-radius:16px;
      background:linear-gradient(135deg,#FFFBEB,#FEF3C7);
      border:1px solid #FDE68A;
      margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:26px;
    }
    .wait-title{font-size:16px;font-weight:700;color:#111827;margin-bottom:6px}
    .wait-desc{font-size:13px;color:#6B7280;line-height:1.7}

    /* ── 申請表單 ── */
    .apply-form{display:none;text-align:left;margin-top:4px}
    .form-title{font-size:15px;font-weight:700;margin-bottom:18px;color:#111827}
    .field{margin-bottom:13px}
    .field label{
      display:block;font-size:11px;font-weight:600;
      color:#6B7280;margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase;
    }
    .field input,.field select{
      width:100%;padding:10px 12px;font-size:14px;
      border:1.5px solid #E5E7EB;border-radius:10px;
      outline:none;font-family:inherit;background:#FAFAFA;
      transition:border-color .15s,background .15s;color:#111827;
    }
    .field input:focus,.field select:focus{
      border-color:#3B82F6;background:#fff;
      box-shadow:0 0 0 3px rgba(59,130,246,.1);
    }
    .field input::placeholder{color:#9CA3AF}

    /* ── 按鈕 ── */
    .btn-primary{
      width:100%;padding:12px;
      background:linear-gradient(90deg,#3B82F6,#7C3AED);
      color:#fff;border:none;border-radius:10px;
      font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
      transition:opacity .15s;
    }
    .btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.5;cursor:default}
    .btn-secondary{
      width:100%;padding:11px;
      background:transparent;color:#6B7280;
      border:1.5px solid #E5E7EB;border-radius:10px;
      font-size:13px;cursor:pointer;margin-top:8px;font-family:inherit;
      transition:border-color .15s,color .15s;
    }
    .btn-secondary:hover{border-color:#9CA3AF;color:#374151}

    /* ── footer ── */
    .footer{margin-top:20px;font-size:11px;color:#9CA3AF;text-align:center;line-height:1.6}
    .footer a{color:#6B7280}

    /* ── 裝飾圓圈 ── */
    body::before{
      content:'';position:fixed;top:-120px;right:-80px;
      width:340px;height:340px;border-radius:50%;
      background:radial-gradient(circle,rgba(124,58,237,.10) 0%,transparent 70%);
      pointer-events:none;
    }
    body::after{
      content:'';position:fixed;bottom:-100px;left:-60px;
      width:280px;height:280px;border-radius:50%;
      background:radial-gradient(circle,rgba(59,130,246,.09) 0%,transparent 70%);
      pointer-events:none;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="logo-wrap">
    <img src="https://i.ibb.co/FkVkNhhd/NBS-4F3.jpg" alt="NBS Logo"
         onerror="this.style.display='none';this.parentNode.innerHTML='<span style=&quot;font-size:48px&quot;>🛡️</span>'"/>
  </div>
  <div class="title">NBS 雲端保單體檢</div>
  <div class="subtitle">保險顧問專用系統</div>

  <!-- 登入畫面 -->
  <div id="view-login">
    <div class="load-wrap" id="load-wrap">
      <span class="spinner"></span><span style="font-size:14px;color:#6B7280">驗證中，請稍候…</span>
    </div>
    <a class="google-btn" id="login-btn" href="#">
      <span class="g-icon">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G"/>
      </span>
      使用 Google 帳號登入
    </a>
    <div class="divider">還沒有帳號</div>
    <button class="apply-link" id="apply-link-btn">申請使用帳號 <span>立即申請 →</span></button>
  </div>

  <!-- 等待審核 -->
  <div class="waiting-box" id="view-waiting">
    <div class="wait-icon">⏳</div>
    <div class="wait-title">帳號審核中</div>
    <div class="wait-desc" id="waiting-desc">您的申請已送出，請等待管理員審核。</div>
    <button class="btn-secondary" style="margin-top:16px" id="back-from-wait">返回登入</button>
  </div>

  <!-- 申請表單 -->
  <div class="apply-form" id="view-apply">
    <div class="form-title">申請使用帳號</div>
    <div class="field">
      <label>姓名 <span style="color:#EF4444">*</span></label>
      <input type="text" id="apply-name" placeholder="請輸入真實姓名"/>
    </div>
    <div class="field">
      <label>Google 帳號 Email <span style="color:#EF4444">*</span></label>
      <input type="email" id="apply-email" placeholder="將用來登入系統的 Google 帳號"/>
    </div>
    <div class="field">
      <label>業務員編號 <span style="color:#EF4444">*</span></label>
      <input type="text" id="apply-agentno" placeholder="請輸入業務員編號"/>
    </div>
    <div class="field">
      <label>所屬保險公司 <span style="color:#EF4444">*</span></label>
      <select id="apply-company">
        <option value="">請選擇</option>
        <option>富邦人壽</option><option>國泰人壽</option><option>南山人壽</option>
        <option>新光人壽</option><option>中國人壽</option><option>台灣人壽</option>
        <option>三商美邦人壽</option><option>遠雄人壽</option><option>全球人壽</option>
        <option>保誠人壽</option><option>宏泰人壽</option><option>第一金人壽</option>
        <option>合作金庫人壽</option><option>臺銀人壽</option><option>元大人壽</option>
        <option>康健人壽</option><option>安聯人壽</option><option>友邦人壽</option>
        <option>法國巴黎人壽</option><option>宏利人壽</option><option value="其他">其他</option>
      </select>
    </div>
    <div class="status-box" id="apply-status"></div>
    <button class="btn-primary" id="apply-btn">送出申請</button>
    <button class="btn-secondary" id="back-from-apply">返回</button>
  </div>

  <div class="status-box" id="login-status"></div>
</div>

<div class="footer">
  NBS 雲端保單體檢 v1.0<br>
  資料安全存放於您的 Google 雲端硬碟
</div>

<!-- 靜默授權用隱藏 iframe -->
<iframe id="silent-iframe" style="display:none" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

<script>
var GAS       = "https://script.google.com/macros/s/AKfycbwzDwyZy09189eOJOs-zEwkZOml2_pJOq15nYGtHF2Kyrtv6ag5VY-I2M8sDyrt0iPdZQ/exec";
var CLIENT_ID = "283591037159-ilcpl2sq7jopkdbp92ldbjti6dm7bhd5.apps.googleusercontent.com";
var REDIRECT  = location.origin + location.pathname;
var TOKEN_MARGIN = 5 * 60 * 1000;

document.getElementById("apply-link-btn").onclick = function(){ showApply(); };
document.getElementById("back-from-wait").onclick  = function(){ showLogin(); };
document.getElementById("back-from-apply").onclick = function(){ showLogin(); };
document.getElementById("apply-btn").onclick       = doApply;

window.onload = function() {
  var hashParams   = new URLSearchParams(window.location.hash.replace(/^#/,""));
  var searchParams = new URLSearchParams(window.location.search);
  var idToken      = hashParams.get("id_token");
  var isSilent     = hashParams.get("state") === "silent";
  var err          = hashParams.get("error") || searchParams.get("error");

  if (err) {
    clearUrl();
    if (isSilent) { showLogin(); }
    else { showLogin(); showStatus("login-status","warning","登入已取消"); }
    return;
  }

  if (idToken) {
    clearUrl();
    var info = parseJwt(idToken);
    if (info && info.email) {
      if (isSilent) {
        // 靜默更新也要順便把新的到期時間存回去，不然下次整頁載入時
        // 還是讀到舊的 tokenExpiry，會被誤判成快過期，多跑一次不必要的
        // 靜默驗證（不影響使用者體感，但沒必要每次都轉一輪 iframe）。
        try {
          var su = JSON.parse(localStorage.getItem("nbs_user")||"{}");
          su.tokenExpiry = info.exp ? info.exp*1000 : (Date.now()+55*60*1000);
          localStorage.setItem("nbs_user", JSON.stringify(su));
        } catch(e) {}
        goMain();
      } else { saveAndCheck(info.email, info.name||"", info.picture||"", info.exp); }
    } else {
      showLogin();
      showStatus("login-status","error","登入失敗，請重試");
    }
    return;
  }

  var saved = localStorage.getItem("nbs_user");
  if (saved) {
    try {
      var u = JSON.parse(saved);
      var now = Date.now();
      // tokenExpiry 存在 nbs_user 裡（saveAndCheck 存進去的，單位是毫秒）。
      // 舊資料/沒登入過 Google id_token 流程的情況下可能沒有這個欄位，
      // 用 (u.tokenExpiry || 0) 防呆，沒有就當作已過期，走靜默重新驗證。
      if ((u.tokenExpiry || 0) - now > TOKEN_MARGIN) {
        goMain(); return;
      } else {
        showLoading();
        trySilentAuth(u.email); return;
      }
    } catch(e) { localStorage.removeItem("nbs_user"); }
  }

  document.getElementById("login-btn").href = buildLoginUrl("", false);
  showLogin();
};

function buildLoginUrl(hint, silent) {
  var p = new URLSearchParams({
    client_id:     CLIENT_ID,
    redirect_uri:  REDIRECT,
    response_type: "id_token",
    scope:         "openid email profile",
    nonce:         Math.random().toString(36).slice(2),
    prompt:        silent ? "none" : "select_account",
    state:         silent ? "silent" : "normal",
  });
  if (hint) p.set("login_hint", hint);
  return "https://accounts.google.com/o/oauth2/v2/auth?" + p.toString();
}

function trySilentAuth(email) {
  var iframe = document.getElementById("silent-iframe");
  var url    = buildLoginUrl(email, true);
  var done   = false;
  iframe.onload = function() {
    if (done) return;
    try {
      var hash = iframe.contentWindow.location.hash;
      if (!hash) return;
      done = true;
      window.location.hash = hash;
      window.location.reload();
    } catch(e) {
      if (!done) {
        done = true;
        showLogin();
        showStatus("login-status","info","請重新登入以繼續使用");
      }
    }
  };
  setTimeout(function() {
    if (!done) {
      done = true;
      showLogin();
      showStatus("login-status","info","請重新登入以繼續使用");
    }
  }, 8000);
  iframe.src = url;
}

function parseJwt(token) {
  try {
    var b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(atob(b64).split("").map(function(c){
      return "%" + ("00"+c.charCodeAt(0).toString(16)).slice(-2);
    }).join("")));
  } catch(e) { return null; }
}

function saveAndCheck(email, name, picture, exp) {
  showLoading();
  // exp 是 JWT 標準的到期時間欄位，單位是「秒」，這裡轉成毫秒存起來，
  // 之後回到 index.html 才有真正的依據判斷 session 還有沒有效，
  // 不會再因為讀到一個從沒賦值過的變數而把登入資料誤刪。
  var tokenExpiryMs = exp ? exp * 1000 : (Date.now() + 55 * 60 * 1000); // 沒有 exp 就保守估 55 分鐘
  localStorage.setItem("nbs_user", JSON.stringify({email:email, name:name, picture:picture, tokenExpiry:tokenExpiryMs}));
  checkAndGo(email);
}

function checkAndGo(email) {
  gas("checkAuth", {email: email}).then(function(r){
    if (r.authorized) {
      var u = JSON.parse(localStorage.getItem("nbs_user")||"{}");
      u.agentNo   = r.agentNo;
      u.agentName = r.name;
      u.company   = r.company;
      u.isAdmin   = r.isAdmin||false;
      localStorage.setItem("nbs_user", JSON.stringify(u));
      showStatus("login-status","success","✓ 驗證成功，正在進入系統…");
      setTimeout(function(){
        localStorage.removeItem("nbs_current_family");
        localStorage.removeItem("nbs_current_family_name");
        goMain();
      }, 800);
    } else {
      showLogin();
      if (r.status==="申請中") {
        document.getElementById("view-login").style.display = "none";
        document.getElementById("view-waiting").style.display = "block";
        document.getElementById("waiting-desc").innerHTML =
          "您的申請審核中，請等待管理員審核。<br/>審核通過後會發送通知至 <strong>"+email+"</strong>";
      } else if (r.status==="not_found") {
        showStatus("login-status","warning","此帳號尚未申請，請點下方「申請使用帳號」");
      } else {
        showStatus("login-status","error", r.message||"帳號未核准");
      }
    }
  }).catch(function(){
    showLogin();
    showStatus("login-status","error","連線失敗，請檢查網路後重試");
  });
}

function goMain() { window.location.href = "main.html"; }

function doApply() {
  var name    = document.getElementById("apply-name").value.trim();
  var email   = document.getElementById("apply-email").value.trim();
  var agentNo = document.getElementById("apply-agentno").value.trim();
  var company = document.getElementById("apply-company").value;
  if (!name||!email||!agentNo||!company) {
    showStatus("apply-status","error","請填寫所有必填欄位"); return;
  }
  var btn = document.getElementById("apply-btn");
  btn.disabled=true; btn.textContent="送出中…";
  gas("apply",{name:name,email:email,agentNo:agentNo,company:company}).then(function(r){
    btn.disabled=false; btn.textContent="送出申請";
    if(r.status==="ok")                  showStatus("apply-status","success","✓ 申請成功！管理員審核後會發送通知至 "+email);
    else if(r.status==="already_approved") showStatus("apply-status","info","此帳號已核准，請直接登入");
    else if(r.status==="already_applied")  showStatus("apply-status","warning","此帳號已申請過，請等待審核");
    else showStatus("apply-status","error",r.message||"申請失敗，請重試");
  }).catch(function(){
    btn.disabled=false; btn.textContent="送出申請";
    showStatus("apply-status","error","連線失敗，請重試");
  });
}

function showLogin() {
  document.getElementById("view-login").style.display    = "block";
  document.getElementById("view-waiting").style.display  = "none";
  document.getElementById("view-apply").style.display    = "none";
  document.getElementById("login-status").style.display  = "none";
  document.getElementById("load-wrap").style.display     = "none";
  document.getElementById("login-btn").style.display     = "flex";
  document.getElementById("login-btn").href = buildLoginUrl("", false);
}
function showLoading() {
  document.getElementById("load-wrap").style.display = "block";
  document.getElementById("login-btn").style.display = "none";
}
function showApply() {
  document.getElementById("view-login").style.display = "none";
  document.getElementById("view-apply").style.display = "block";
}
function showStatus(id, type, msg) {
  var el = document.getElementById(id);
  if (!el) return;
  el.className = "status-box " + type;
  el.textContent = msg;
  el.style.display = "block";
}
function clearUrl() { window.history.replaceState({}, "", location.pathname); }

function gas(action, params) {
  return fetch(GAS, {
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify(Object.assign({action:action}, params||{}))
  }).then(function(r){ return r.json(); });
}
</script>
</body>
</html>
