<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS 雲端保單體檢 - 主畫面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #666;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #E6F1FB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      color: #0C447C;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logout-btn {
      font-size: 12px;
      color: #999;
      cursor: pointer;
      background: none;
      border: 1px solid #eee;
      border-radius: 5px;
      padding: 3px 8px;
      font-family: inherit;
    }

    .logout-btn:hover { background: #f5f5f5; }

    /* ── 主內容 ── */
    .main { padding: 16px; max-width: 520px; margin: 0 auto; }

    /* ── 搜尋欄 ── */
    .search-bar {
      position: relative;
      margin-bottom: 14px;
    }

    .search-bar input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      font-size: 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      background: #fff;
      font-family: inherit;
    }

    .search-bar input:focus { border-color: #378ADD; }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      font-size: 16px;
      pointer-events: none;
    }

    /* ── 區塊標題 ── */
    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: #999;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    /* ── 家庭卡片 ── */
    .family-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.12s;
    }

    .family-card:hover { background: #fafafa; }

    .family-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #E6F1FB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      color: #0C447C;
      flex-shrink: 0;
    }

    .family-info { flex: 1; }
    .family-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .family-meta { font-size: 12px; color: #999; }

    .chevron { color: #ccc; font-size: 16px; }

    /* ── 新增按鈕 ── */
    .add-btn {
      width: 100%;
      padding: 11px;
      background: #378ADD;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .add-btn:hover { background: #2970c0; }

    /* ── 空狀態 ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #bbb;
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state .text { font-size: 13px; line-height: 1.7; }

    /* ── 載入中 ── */
    .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: #bbb;
      font-size: 13px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #e0e0e0;
      border-top-color: #378ADD;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 新增家庭 Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: #999;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    /* 步驟指示 */
    .steps {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .step-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
    }

    .step-dot.active { background: #378ADD; color: #fff; }
    .step-dot.done   { background: #EAF3DE; color: #27500A; }
    .step-dot.inactive { background: #f0f0f0; color: #aaa; }
    .step-line { flex: 1; height: 1px; background: #e8e8e8; }

    /* 表單 */
    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      outline: none;
      font-family: inherit;
      background: #fff;
    }

    .field input:focus, .field select:focus { border-color: #378ADD; }

    .field .hint {
      font-size: 11px;
      color: #0C447C;
      margin-top: 3px;
    }

    /* 按鈕 */
    .btn-row { display: flex; gap: 8px; margin-top: 20px; }

    .btn-primary {
      flex: 2;
      padding: 10px;
      background: #378ADD;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary:disabled { background: #ccc; cursor: default; }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: transparent;
      color: #666;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    /* 保險年齡提示 */
    .age-hint {
      font-size: 11px;
      color: #0C447C;
      margin-top: 3px;
      min-height: 16px;
    }

    /* 管理員標籤 */
    .admin-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      background: #EEEDFE;
      color: #3C3489;
      font-weight: 500;
    }

    /* 狀態訊息 */
    .status-msg {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }

    .status-msg.error   { background: #FCEBEB; color: #791F1F; }
    .status-msg.success { background: #EAF3DE; color: #27500A; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      🛡️ NBS 雲端保單體檢
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">載入中</span>
        <span id="admin-badge" class="admin-badge" style="display:none">管理員</span>
      </div>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 主內容 -->
  <div class="main">

    <!-- 搜尋 -->
    <div class="search-bar" style="margin-top:16px;">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜尋家庭名稱…" oninput="filterFamilies()" />
    </div>

    <!-- 家庭列表 -->
    <div class="section-label" id="list-label">家庭列表</div>
    <div id="family-list">
      <div class="loading-state">
        <span class="spinner"></span>載入中…
      </div>
    </div>

    <!-- 新增按鈕 -->
    <button class="add-btn" onclick="openCreateModal()">＋ 新增家庭</button>

  </div>

  <!-- 新增家庭 Modal -->
  <div class="modal-overlay" id="create-modal" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        新增家庭
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>

      <!-- 步驟指示 -->
      <div class="steps">
        <div class="step-dot" id="step1-dot">1</div>
        <div class="step-line"></div>
        <div class="step-dot inactive" id="step2-dot">2</div>
      </div>

      <!-- 步驟一：主要成員 -->
      <div id="step1-form">
        <div style="font-size:14px; font-weight:500; margin-bottom:4px;">主要成員資料</div>
        <div style="font-size:12px; color:#999; margin-bottom:16px;">請先建立這個家庭的主要被保險人資料</div>

        <div class="field">
          <label>姓名 <span style="color:#e74c3c">*</span></label>
          <input type="text" id="primary-name" placeholder="請輸入主要成員姓名" oninput="updateFamilyNameHint()" />
        </div>

        <div class="field">
          <label>出生日期</label>
          <input type="date" id="primary-birth" oninput="calcAge()" />
          <div class="age-hint" id="age-hint"></div>
        </div>

        <div class="field">
          <label>分析日</label>
          <input type="date" id="analysis-date" />
          <div class="hint" id="analysis-roc"></div>
        </div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn-primary" id="step1-next" onclick="goStep2()" disabled>下一步：設定家庭名稱</button>
        </div>
      </div>

      <!-- 步驟二：家庭名稱 -->
      <div id="step2-form" style="display:none;">
        <div style="font-size:14px; font-weight:500; margin-bottom:4px;">家庭名稱</div>
        <div style="font-size:12px; color:#999; margin-bottom:16px;">為這個家庭設定一個名稱</div>

        <!-- 主要成員預覽 -->
        <div style="display:flex; align-items:center; gap:10px; padding:10px 14px; background:#E6F1FB; border-radius:10px; margin-bottom:16px;">
          <div style="width:36px; height:36px; border-radius:50%; background:#378ADD; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; color:#fff;" id="preview-avatar">?</div>
          <div>
            <div style="font-weight:500; font-size:14px;" id="preview-name">—</div>
            <div style="font-size:12px; color:#0C447C;" id="preview-age">—</div>
          </div>
        </div>

        <div class="field">
          <label>家庭名稱 <span style="color:#e74c3c">*</span></label>
          <input type="text" id="family-name-input" placeholder="如：王家、王小明家…" />
          <div class="hint" style="color:#aaa; font-size:11px; margin-top:3px;">預設為「XXX家」，可自行修改</div>
        </div>

        <div class="status-msg" id="create-status"></div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="goStep1()">上一步</button>
          <button class="btn-primary" id="create-btn" onclick="createFamily()">建立家庭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── 設定 ─────────────────────────────────────────────────
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

    let currentUser = null;
    let allFamilies = [];

    // ── 初始化 ────────────────────────────────────────────────
    window.onload = function() {
      // 取得登入資訊
      const saved = localStorage.getItem("nbs_user");
      if (!saved) {
        window.location.href = "index.html";
        return;
      }

      currentUser = JSON.parse(saved);

      // 更新 Header
      const nameEl = document.getElementById("user-name");
      const avatarEl = document.getElementById("user-avatar");
      const adminBadge = document.getElementById("admin-badge");

      nameEl.textContent = currentUser.agentName || currentUser.name || currentUser.email;

      if (currentUser.picture) {
        avatarEl.innerHTML = `<img src="${currentUser.picture}" alt="avatar" />`;
      } else {
        const n = currentUser.agentName || currentUser.name || "?";
        avatarEl.textContent = n[0];
      }

      if (currentUser.isAdmin) {
        adminBadge.style.display = "inline";
      }

      // 設定分析日預設為今天
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("analysis-date").value = today;
      updateAnalysisRoc();

      // 載入家庭列表
      loadFamilies();
    };

    // ── 載入家庭列表 ──────────────────────────────────────────
    function loadFamilies() {
      document.getElementById("family-list").innerHTML =
        '<div class="loading-state"><span class="spinner"></span>載入中…</div>';

      callGAS("listFamilies", { email: currentUser.email })
        .then(result => {
          allFamilies = result.families || [];
          renderFamilies(allFamilies);
        })
        .catch(err => {
          document.getElementById("family-list").innerHTML =
            '<div class="empty-state"><div class="text">載入失敗，請重新整理頁面</div></div>';
        });
    }

    // ── 渲染家庭列表 ──────────────────────────────────────────
    function renderFamilies(families) {
      const listEl = document.getElementById("family-list");
      const labelEl = document.getElementById("list-label");

      labelEl.textContent = `家庭列表　${families.length} 個家庭`;

      if (families.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">👨‍👩‍👧</div>
            <div class="text">還沒有家庭資料<br/>點下方「新增家庭」開始建立</div>
          </div>`;
        return;
      }

      listEl.innerHTML = families.map(f => `
        <div class="family-card" onclick="openFamily('${f.fileName}', '${f.familyName}')">
          <div class="family-avatar">${f.familyName[0] || "?"}</div>
          <div class="family-info">
            <div class="family-name">${f.familyName}</div>
            <div class="family-meta">${f.memberCount || (f.members && f.members.length) || 0} 位成員　·　分析日 ${toRoc(f.analysisDate)}</div>
          </div>
          <div class="chevron">›</div>
        </div>
      `).join("");
    }

    // ── 搜尋篩選 ─────────────────────────────────────────────
    function filterFamilies() {
      const q = document.getElementById("search-input").value.trim();
      if (!q) {
        renderFamilies(allFamilies);
        return;
      }
      const filtered = allFamilies.filter(f => f.familyName.includes(q));
      renderFamilies(filtered);
    }

    // ── 開啟家庭（暫時 alert，之後跳到 family.html）─────────
    function openFamily(fileName, familyName) {
      localStorage.setItem("nbs_current_family", fileName);
      localStorage.setItem("nbs_current_family_name", familyName);
      window.location.href = "family.html";
    }

    // ── 新增家庭 Modal ────────────────────────────────────────
    function openCreateModal() {
      document.getElementById("create-modal").classList.add("active");
      goStep1();
    }

    function closeModal() {
      document.getElementById("create-modal").classList.remove("active");
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById("create-modal")) closeModal();
    }

    function goStep1() {
      document.getElementById("step1-form").style.display = "block";
      document.getElementById("step2-form").style.display = "none";
      document.getElementById("step1-dot").className = "step-dot active";
      document.getElementById("step2-dot").className = "step-dot inactive";
    }

    function goStep2() {
      const name = document.getElementById("primary-name").value.trim();
      if (!name) return;

      // 更新步驟指示
      document.getElementById("step1-dot").className = "step-dot done";
      document.getElementById("step1-dot").textContent = "✓";
      document.getElementById("step2-dot").className = "step-dot active";

      // 更新預覽
      document.getElementById("preview-avatar").textContent = name[0];
      document.getElementById("preview-name").textContent = name;

      const birth = document.getElementById("primary-birth").value;
      const analysis = document.getElementById("analysis-date").value;
      const age = calcInsAge(birth, analysis);
      document.getElementById("preview-age").textContent =
        birth ? `保險年齡 ${age} 歲　主要成員` : "主要成員";

      // 預設家庭名稱
      const familyInput = document.getElementById("family-name-input");
      if (!familyInput.value) familyInput.value = name + "家";

      document.getElementById("step1-form").style.display = "none";
      document.getElementById("step2-form").style.display = "block";
    }

    // ── 建立家庭 ─────────────────────────────────────────────
    function createFamily() {
      const primaryName  = document.getElementById("primary-name").value.trim();
      const birthDate    = document.getElementById("primary-birth").value;
      const analysisDate = document.getElementById("analysis-date").value;
      const familyName   = document.getElementById("family-name-input").value.trim();

      if (!familyName) {
        showCreateStatus("error", "請填寫家庭名稱");
        return;
      }

      const btn = document.getElementById("create-btn");
      btn.disabled = true;
      btn.textContent = "建立中…";

      const familyId = "f_" + Date.now();
      const personId = "p_" + Date.now();

      const personData = {
        version: "3.0.0",
        personId: personId,
        agentId: currentUser.email,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        profile: {
          name: primaryName,
          birthDate: birthDate || null,
          analysisDate: analysisDate,
          note: "",
        },
        policies: [],
        coverage: {},
        savings: [],
        beneficiaryTemplates: [],
        medicalSummary: {},
        settings: { savingsDisplayYears: 20, notes: "" },
      };

      const familyData = {
        version: "3.0.0",
        familyId: familyId,
        familyName: familyName,
        agentId: currentUser.email,
        analysisDate: analysisDate,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        members: [
          { personId: personId, name: primaryName, role: "primary", relation: "本人" }
        ],
        sharedBeneficiary: [],
      };

      // 先儲存個人 JSON，再儲存家庭 JSON
      callGAS("saveFile", {
        email: currentUser.email,
        fileType: "person",
        fileId: personId,
        fileName: primaryName + "_" + personId + ".json",
        content: personData,
      })
      .then(() => callGAS("saveFile", {
        email: currentUser.email,
        fileType: "family",
        fileId: familyId,
        fileName: familyName + "_" + familyId + ".json",
        content: familyData,
      }))
      .then(result => {
        btn.disabled = false;
        btn.textContent = "建立家庭";
        closeModal();
        loadFamilies(); // 重新載入列表
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = "建立家庭";
        showCreateStatus("error", "建立失敗，請重試");
      });
    }

    function showCreateStatus(type, msg) {
      const el = document.getElementById("create-status");
      el.className = "status-msg " + type;
      el.textContent = msg;
      el.style.display = "block";
    }

    // ── 姓名輸入時更新按鈕狀態 ───────────────────────────────
    function updateFamilyNameHint() {
      const name = document.getElementById("primary-name").value.trim();
      document.getElementById("step1-next").disabled = !name;
    }

    // ── 保險年齡計算 ──────────────────────────────────────────
    function calcAge() {
      const birth = document.getElementById("primary-birth").value;
      const analysis = document.getElementById("analysis-date").value;
      const hintEl = document.getElementById("age-hint");
      if (!birth) { hintEl.textContent = ""; return; }
      const age = calcInsAge(birth, analysis || new Date().toISOString().slice(0,10));
      hintEl.textContent = "保險年齡：" + age + " 歲";
    }

    function calcInsAge(birthDate, analysisDate) {
      if (!birthDate) return "—";
      const b = new Date(birthDate);
      const a = new Date(analysisDate || new Date());
      let years = a.getFullYear() - b.getFullYear();
      const months = (a - new Date(b.getFullYear() + years, b.getMonth(), b.getDate())) / (1000*60*60*24*30.4375);
      if (months >= 6) years++;
      return years;
    }

    // ── 分析日民國年顯示 ──────────────────────────────────────
    function updateAnalysisRoc() {
      const val = document.getElementById("analysis-date").value;
      if (!val) return;
      const d = new Date(val);
      document.getElementById("analysis-roc").textContent =
        "民國 " + (d.getFullYear()-1911) + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("analysis-date");
      if (el) el.addEventListener("change", updateAnalysisRoc);
    });

    // ── 民國年轉換 ────────────────────────────────────────────
    function toRoc(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      if (isNaN(d)) return "—";
      return (d.getFullYear()-1911) + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
    }

    // ── 登出 ──────────────────────────────────────────────────
    function logout() {
      localStorage.removeItem("nbs_user");
      window.location.href = "index.html";
    }

    // ── 呼叫 GAS API ─────────────────────────────────────────
    function callGAS(action, params) {
  if (action === "saveFile") {
    return fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action, ...params }),
    }).then(r => r.json());
  }
  
      const url = new URL(GAS_URL);
      url.searchParams.set("action", action);
      Object.entries(params || {}).forEach(([k, v]) => {
        if (typeof v === "object") {
          url.searchParams.set(k, encodeURIComponent(JSON.stringify(v)));
        } else if (v !== null && v !== undefined) {
          url.searchParams.set(k, v);
        }
      });
      return fetch(url.toString())
        .then(res => res.json());
    }
  </script>
