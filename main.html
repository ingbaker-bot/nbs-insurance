<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS 雲端保單體檢 - 主畫面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: linear-gradient(160deg, #EEF4FF 0%, #F5F0FF 50%, #EFF9F4 100%);
      min-height: 100vh;
      color: #111827;
    }

    body::before {
      content: '';
      position: fixed; top: -120px; right: -80px;
      width: 340px; height: 340px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,.09) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; bottom: -100px; left: -60px;
      width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,.08) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .header {
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(120,140,255,.13);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    .header-title {
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #6B7280;
    }

    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #7C3AED);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(124,58,237,.25);
      flex-shrink: 0;
    }

    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .logout-btn {
      font-size: 12px; color: #9CA3AF; cursor: pointer;
      background: none; border: 1.5px solid #E5E7EB;
      border-radius: 7px; padding: 4px 10px; font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .logout-btn:hover { border-color: #9CA3AF; color: #374151; }

    .main { padding: 20px 16px; max-width: 540px; margin: 0 auto; position: relative; z-index: 1; }

    .search-bar { position: relative; margin-bottom: 16px; }

    .search-bar input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      font-size: 14px;
      border: 1.5px solid rgba(120,140,255,.18);
      border-radius: 12px; outline: none;
      background: rgba(255,255,255,.80);
      font-family: inherit; color: #111827;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .search-bar input:focus {
      border-color: #3B82F6;
      background: rgba(255,255,255,.95);
      box-shadow: 0 0 0 3px rgba(59,130,246,.10);
    }
    .search-bar input::placeholder { color: #9CA3AF; }

    .search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF; font-size: 16px; pointer-events: none;
    }

    .section-label {
      font-size: 11px; font-weight: 700; color: #9CA3AF;
      letter-spacing: .07em; text-transform: uppercase; margin-bottom: 10px;
    }

    .family-card {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(120,140,255,.12);
      border-radius: 14px; padding: 13px 15px; margin-bottom: 8px;
      cursor: pointer; display: flex; align-items: center; gap: 13px;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 10px rgba(100,120,255,.05);
    }
    .family-card:hover {
      background: rgba(255,255,255,.96);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(100,120,255,.10);
      border-color: rgba(124,58,237,.20);
    }

    .family-avatar {
      width: 42px; height: 42px; border-radius: 13px;
      background: linear-gradient(135deg, #EEF4FF, #EDE9FF);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #6D28D9; flex-shrink: 0;
    }

    .family-info { flex: 1; min-width: 0; }
    .family-name { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 3px; }
    .family-meta { font-size: 12px; color: #9CA3AF; }
    .chevron { color: #D1D5DB; font-size: 18px; flex-shrink: 0; }

    .add-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(90deg, #3B82F6, #7C3AED);
      color: #fff; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; margin-top: 6px;
      transition: opacity .15s, transform .1s;
      box-shadow: 0 4px 16px rgba(100,120,255,.25);
      letter-spacing: .02em;
    }
    .add-btn:hover { opacity: .92; transform: translateY(-1px); }
    .add-btn:active { transform: translateY(0); }

    .empty-state { text-align: center; padding: 48px 20px; color: #9CA3AF; }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state .text { font-size: 13px; line-height: 1.7; }

    .loading-state { text-align: center; padding: 48px 20px; color: #9CA3AF; font-size: 13px; }

    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid #E5E7EB; border-top-color: #3B82F6;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(17,24,39,.45);
      backdrop-filter: blur(4px);
      z-index: 200; align-items: flex-end; justify-content: center; padding: 0;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff; border-radius: 20px 20px 0 0;
      padding: 24px 20px; width: 100%; max-width: 540px;
      max-height: 90vh; overflow-y: auto;
    }

    .modal-title {
      font-size: 16px; font-weight: 700; color: #111827;
      margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;
    }

    .modal-close {
      background: #F3F4F6; border: none; font-size: 18px; color: #6B7280;
      cursor: pointer; padding: 0; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; transition: background .15s;
    }
    .modal-close:hover { background: #E5E7EB; color: #374151; }

    .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }

    .step-dot {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .step-dot.active   { background: linear-gradient(135deg,#3B82F6,#7C3AED); color: #fff; }
    .step-dot.done     { background: #D1FAE5; color: #065F46; }
    .step-dot.inactive { background: #F3F4F6; color: #9CA3AF; }
    .step-line { flex: 1; height: 1px; background: #E5E7EB; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; color: #6B7280;
      margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase;
    }
    .field input, .field select {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      outline: none; font-family: inherit; background: #FAFAFA; color: #111827;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .field input:focus, .field select:focus {
      border-color: #3B82F6; background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,.10);
    }
    .field input::placeholder { color: #9CA3AF; }
    .field .hint { font-size: 11px; color: #3B82F6; margin-top: 3px; }

    .btn-row { display: flex; gap: 8px; margin-top: 20px; }
    .btn-primary {
      flex: 2; padding: 11px;
      background: linear-gradient(90deg, #3B82F6, #7C3AED);
      color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .btn-secondary {
      flex: 1; padding: 11px; background: transparent; color: #6B7280;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      font-size: 13px; cursor: pointer; font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .btn-secondary:hover { border-color: #9CA3AF; color: #374151; }

    .age-hint { font-size: 11px; color: #3B82F6; margin-top: 3px; min-height: 16px; }

    .admin-badge {
      font-size: 10px; padding: 2px 8px; border-radius: 99px;
      background: linear-gradient(90deg, #EEF4FF, #F3EEFF);
      color: #6D28D9; font-weight: 700;
      border: 1px solid rgba(109,40,217,.15);
    }

    .status-msg {
      font-size: 12px; padding: 9px 12px; border-radius: 8px;
      margin-top: 8px; display: none;
    }
    .status-msg.error   { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
    .status-msg.success { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }
  </style>
  <script src="nav.js"></script>
</head>
<body>

    <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img class="header-logo"
           src="https://i.ibb.co/FkVkNhhd/NBS-4F3.jpg"
           alt="NBS Logo"
           onerror="this.style.display='none'"/>
      <span class="header-title">NBS 雲端保單體檢</span>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">載入中</span>
        <span id="admin-badge" class="admin-badge" style="display:none">管理員</span>
      </div>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 主內容 -->
  <div class="main">

    <!-- 搜尋 -->
    <div class="search-bar" style="margin-top:16px;">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜尋家庭名稱…" oninput="filterFamilies()" />
    </div>

    <!-- 新增按鈕（移到搜尋下方）-->
    <button class="add-btn" onclick="openCreateModal()" style="margin-bottom:16px;">＋ 新增家庭</button>

    <!-- 家庭列表 -->
    <div class="section-label" id="list-label">家庭列表</div>
    <div id="family-list">
      <div class="loading-state" id="loading-view">
        <span class="spinner"></span> 
        <span id="loading-text">保單體檢資料連線中，請稍候...</span>
      </div>
    </div>

  </div>

  <!-- 新增家庭 Modal -->
  <div class="modal-overlay" id="create-modal" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        新增家庭
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>

      <!-- 步驟指示 -->
      <div class="steps">
        <div class="step-dot" id="step1-dot">1</div>
        <div class="step-line"></div>
        <div class="step-dot inactive" id="step2-dot">2</div>
      </div>

      <!-- 步驟一：主要成員 -->
      <div id="step1-form">
        <div style="font-size:14px; font-weight:500; margin-bottom:4px;">主要成員資料</div>
        <div style="font-size:12px; color:#999; margin-bottom:16px;">請先建立這個家庭的主要被保險人資料</div>

        <div class="field">
          <label>姓名 <span style="color:#e74c3c">*</span></label>
          <input type="text" id="primary-name" placeholder="請輸入主要成員姓名" oninput="updateFamilyNameHint()" />
        </div>

        <div class="field">
          <label>出生日期</label>
          <input type="date" id="primary-birth" oninput="calcAge()" />
          <div class="age-hint" id="age-hint"></div>
        </div>

        <div class="field">
          <label>分析日</label>
          <input type="date" id="analysis-date" />
          <div class="hint" id="analysis-roc"></div>
        </div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn-primary" id="step1-next" onclick="goStep2()" disabled>下一步：設定家庭名稱</button>
        </div>
      </div>

      <!-- 步驟二：家庭名稱 -->
      <div id="step2-form" style="display:none;">
        <div style="font-size:14px; font-weight:500; margin-bottom:4px;">家庭名稱</div>
        <div style="font-size:12px; color:#999; margin-bottom:16px;">為這個家庭設定一個名稱</div>

        <!-- 主要成員預覽 -->
        <div style="display:flex; align-items:center; gap:10px; padding:10px 14px; background:#E6F1FB; border-radius:10px; margin-bottom:16px;">
          <div style="width:36px; height:36px; border-radius:50%; background:#378ADD; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; color:#fff;" id="preview-avatar">?</div>
          <div>
            <div style="font-weight:500; font-size:14px;" id="preview-name">—</div>
            <div style="font-size:12px; color:#0C447C;" id="preview-age">—</div>
          </div>
        </div>

        <div class="field">
          <label>家庭名稱 <span style="color:#e74c3c">*</span></label>
          <input type="text" id="family-name-input" placeholder="如：王家、王小明家…" />
          <div class="hint" style="color:#aaa; font-size:11px; margin-top:3px;">預設為「XXX家」，可自行修改</div>
        </div>

        <div class="status-msg" id="create-status"></div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="goStep1()">上一步</button>
          <button class="btn-primary" id="create-btn" onclick="createFamily()">建立家庭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── 設定 ─────────────────────────────────────────────────
    const AUTH_GAS_URL = "https://script.google.com/macros/s/AKfycbwzDwyZy09189eOJOs-zEwkZOml2_pJOq15nYGtHF2Kyrtv6ag5VY-I2M8sDyrt0iPdZQ/exec"; // 僅身份驗證用

    let currentUser = null;
    let allFamilies = [];
    // ── 新增：動態載入文字設定 ──
    let loadingTimer = null;
    const loadingMessages = [
      "保單資料庫安全連線中...",
      "正在彙整各險種保障明細...",
      "保障缺口運算即將完成，請稍候..."
    ];
    
    // ── 初始化 ────────────────────────────────────────────────
    window.onload = function() {
      const saved = localStorage.getItem("nbs_user");
      if (!saved) { window.location.href = "index.html"; return; }
      currentUser = JSON.parse(saved);

      const nameEl = document.getElementById("user-name");
      const avatarEl = document.getElementById("user-avatar");
      const adminBadge = document.getElementById("admin-badge");
      nameEl.textContent = currentUser.agentName || currentUser.name || currentUser.email;

      if (currentUser.picture) {
        avatarEl.innerHTML = `<img src="${currentUser.picture}" alt="avatar" />`;
      } else {
        avatarEl.textContent = nameEl.textContent[0];
      }
      if (currentUser.isAdmin) adminBadge.style.display = "inline";

      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("analysis-date").value = today;
      updateAnalysisRoc();

      // ── 新增：檢查是否有直連網址，沒有就補抓 ──
      const shellUrl = localStorage.getItem("nbs_shell_url");
      if (!shellUrl && !currentUser.isAdmin) {
        callGAS("checkAuth", { email: currentUser.email }).then(res => {
          if (res.shellUrl) localStorage.setItem("nbs_shell_url", res.shellUrl);
          loadFamilies();
        }).catch(() => loadFamilies());
      } else {
        loadFamilies();
      }
    };

    // ── 載入家庭列表 ──────────────────────────────────────────
    const FAMILIES_CACHE_KEY = "nbs_families_list";
    const FAMILIES_CACHE_TTL = 10 * 60 * 1000; // 10 分鐘

    function getFamiliesCache() {
      try {
        const raw = sessionStorage.getItem(FAMILIES_CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.ts || !obj.data) return null;
        if (Date.now() - obj.ts > FAMILIES_CACHE_TTL) { sessionStorage.removeItem(FAMILIES_CACHE_KEY); return null; }
        return obj.data;
      } catch(e) { return null; }
    }
    function setFamiliesCache(data) {
      try { sessionStorage.setItem(FAMILIES_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
    }
    function invalidateFamiliesCache() {
      try { sessionStorage.removeItem(FAMILIES_CACHE_KEY); } catch(e) {}
    }

    function loadFamilies(forceRefresh) {
      // 先查快取，有就立即顯示（< 50ms）
      if (!forceRefresh) {
        const cached = getFamiliesCache();
        if (cached) {
          allFamilies = cached;
          renderFamilies(allFamilies, false);
          // 背景靜默更新，不影響畫面
          setTimeout(function() {
            callGAS("listFamilies", {})
              .then(result => {
                const fresh = result.families || [];
                setFamiliesCache(fresh);
                allFamilies = fresh;
                renderFamilies(allFamilies, false); // 靜默更新列表
              }).catch(() => {});
          }, 300);
          return;
        }
      }

      // 快取未命中：正常流程，啟動「有溫度的動態載入」
      document.getElementById("family-list").innerHTML =
        '<div class="loading-state"><span class="spinner"></span><span id="loading-text">保單資料庫安全連線中...</span></div>';

      // 啟動文字輪播計時器 (每 1.5 秒換一句)
      let msgIndex = 0;
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = setInterval(() => {
        msgIndex = (msgIndex + 1) % loadingMessages.length;
        const textEl = document.getElementById("loading-text");
        if (textEl) textEl.textContent = loadingMessages[msgIndex];
      }, 1500);

      // 發送請求給 GAS
      callGAS("listFamilies", {})
        .then(result => {
          clearInterval(loadingTimer); // 資料回來了，關閉計時器
          allFamilies = result.families || [];
          setFamiliesCache(allFamilies);
          renderFamilies(allFamilies, false);
        })
        .catch(err => {
          clearInterval(loadingTimer); // 發生錯誤，關閉計時器
          console.error("loadFamilies error", err);
          document.getElementById("family-list").innerHTML =
            '<div class="empty-state"><div class="text">載入失敗，請重新整理頁面</div></div>';
        });
    }

    // ── 渲染家庭列表 ──────────────────────────────────────────
    function renderFamilies(families, isSearch) {
      const listEl  = document.getElementById("family-list");
      const labelEl = document.getElementById("list-label");

      if (families.length === 0) {
        labelEl.textContent = isSearch ? "找不到符合的家庭" : "家庭列表";
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">👨‍👩‍👧</div>
            <div class="text">${isSearch ? "沒有符合「" + document.getElementById("search-input").value + "」的家庭" : "還沒有家庭資料<br/>點上方「新增家庭」開始建立"}</div>
          </div>`;
        return;
      }

      // 搜尋時顯示全部結果；非搜尋時隨機取最多 10 筆
      let display = families;
      if (!isSearch && families.length > 10) {
        // Fisher-Yates shuffle 取前 10 筆（每次載入順序都不同）
        const shuffled = families.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        display = shuffled.slice(0, 10);
        labelEl.textContent = `家庭列表　共 ${families.length} 個（隨機顯示 10 個，搜尋可找全部）`;
      } else {
        labelEl.textContent = `家庭列表　${families.length} 個家庭`;
      }

      listEl.innerHTML = display.map(f => `
        <div class="family-card" onclick="openFamily('${f.fileName}', '${f.familyName}')">
          <div class="family-avatar">${f.familyName[0] || "?"}</div>
          <div class="family-info">
            <div class="family-name">${f.familyName}</div>
            <div class="family-meta">${f.memberCount || (f.members && f.members.length) || 0} 位成員　·　分析日 ${toRoc(f.analysisDate)}</div>
          </div>
          <div class="chevron">›</div>
        </div>
      `).join("");
    }

    // ── 搜尋篩選 ─────────────────────────────────────────────
    function filterFamilies() {
      const q = document.getElementById("search-input").value.trim();
      if (!q) {
        renderFamilies(allFamilies, false);  // 無搜尋：隨機 10 筆
        return;
      }
      const filtered = allFamilies.filter(f => f.familyName.includes(q));
      renderFamilies(filtered, true);         // 搜尋中：顯示全部結果
    }

    // ── 開啟家庭：導向 SPA shell（自動落地到家庭總覽），
    // 讓選完家庭之後的整個操作流程都在 shell.html 底下進行，
    // 側欄不會每次切換頁面都重新載入 ─────────────────────
    function openFamily(fileName, familyName) {
      localStorage.setItem("nbs_current_family", fileName);
      localStorage.setItem("nbs_current_family_name", familyName);
      window.location.href = "shell.html";
    }

    // ── 新增家庭 Modal ────────────────────────────────────────
    function openCreateModal() {
      document.getElementById("create-modal").classList.add("active");
      goStep1();
    }

    function closeModal() {
      document.getElementById("create-modal").classList.remove("active");
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById("create-modal")) closeModal();
    }

    function goStep1() {
      document.getElementById("step1-form").style.display = "block";
      document.getElementById("step2-form").style.display = "none";
      document.getElementById("step1-dot").className = "step-dot active";
      document.getElementById("step2-dot").className = "step-dot inactive";
    }

    function goStep2() {
      const name = document.getElementById("primary-name").value.trim();
      if (!name) return;

      // 更新步驟指示
      document.getElementById("step1-dot").className = "step-dot done";
      document.getElementById("step1-dot").textContent = "✓";
      document.getElementById("step2-dot").className = "step-dot active";

      // 更新預覽
      document.getElementById("preview-avatar").textContent = name[0];
      document.getElementById("preview-name").textContent = name;

      const birth = document.getElementById("primary-birth").value;
      const analysis = document.getElementById("analysis-date").value;
      const age = calcInsAge(birth, analysis);
      document.getElementById("preview-age").textContent =
        birth ? `保險年齡 ${age} 歲　主要成員` : "主要成員";

      // 預設家庭名稱
      const familyInput = document.getElementById("family-name-input");
      if (!familyInput.value) familyInput.value = name + "家";

      document.getElementById("step1-form").style.display = "none";
      document.getElementById("step2-form").style.display = "block";
    }

    // ── 建立家庭 ─────────────────────────────────────────────
    function createFamily() {
      const primaryName  = document.getElementById("primary-name").value.trim();
      const birthDate    = document.getElementById("primary-birth").value;
      const analysisDate = document.getElementById("analysis-date").value;
      const familyName   = document.getElementById("family-name-input").value.trim();

      if (!familyName) {
        showCreateStatus("error", "請填寫家庭名稱");
        return;
      }

      const btn = document.getElementById("create-btn");
      btn.disabled = true;
      btn.textContent = "建立中…";

      const familyId = "f_" + Date.now();
      const personId = "p_" + Date.now();

      const personData = {
        version: "3.0.0",
        personId: personId,
        agentId: currentUser.email,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        profile: {
          name: primaryName,
          birthDate: birthDate || null,
          analysisDate: analysisDate,
          note: "",
        },
        policies: [],
        coverage: {},
        savings: [],
        beneficiaryTemplates: [],
        medicalSummary: {},
        settings: { savingsDisplayYears: 20, notes: "" },
      };

      const familyData = {
        version: "3.0.0",
        familyId: familyId,
        familyName: familyName,
        agentId: currentUser.email,
        analysisDate: analysisDate,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        members: [
          { personId: personId, name: primaryName, role: "primary", relation: "本人" }
        ],
        sharedBeneficiary: [],
      };

      // 先儲存個人 JSON，再儲存家庭 JSON
      callGAS("saveFile", { fileType: "persons", fileName: primaryName + "_" + personId + ".json", content: personData })
      .then(() => callGAS("saveFile", { fileType: "families", fileName: familyName + "_" + familyId + ".json", content: familyData }))
      .then(result => {
        btn.disabled = false;
        btn.textContent = "建立家庭";
        closeModal();
        invalidateFamiliesCache();
        loadFamilies(true); // 清快取後強制重新載入，確保列表最新
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = "建立家庭";
        showCreateStatus("error", "建立失敗，請重試");
      });
    }

    function showCreateStatus(type, msg) {
      const el = document.getElementById("create-status");
      el.className = "status-msg " + type;
      el.textContent = msg;
      el.style.display = "block";
    }

    // ── 姓名輸入時更新按鈕狀態 ───────────────────────────────
    function updateFamilyNameHint() {
      const name = document.getElementById("primary-name").value.trim();
      document.getElementById("step1-next").disabled = !name;
    }

    // ── 保險年齡計算 ──────────────────────────────────────────
    function calcAge() {
      const birth = document.getElementById("primary-birth").value;
      const analysis = document.getElementById("analysis-date").value;
      const hintEl = document.getElementById("age-hint");
      if (!birth) { hintEl.textContent = ""; return; }
      const age = calcInsAge(birth, analysis || new Date().toISOString().slice(0,10));
      hintEl.textContent = "保險年齡：" + age + " 歲";
    }

    function calcInsAge(birthDate, analysisDate) {
      if (!birthDate) return "—";
      const b = new Date(birthDate);
      const a = new Date(analysisDate || new Date());
      let years = a.getFullYear() - b.getFullYear();
      const months = (a - new Date(b.getFullYear() + years, b.getMonth(), b.getDate())) / (1000*60*60*24*30.4375);
      if (months >= 6) years++;
      return years;
    }

    // ── 分析日民國年顯示 ──────────────────────────────────────
    function updateAnalysisRoc() {
      const val = document.getElementById("analysis-date").value;
      if (!val) return;
      const d = new Date(val);
      document.getElementById("analysis-roc").textContent =
        "民國 " + (d.getFullYear()-1911) + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("analysis-date");
      if (el) el.addEventListener("change", updateAnalysisRoc);
    });

    // ── 民國年轉換 ────────────────────────────────────────────
    function toRoc(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      if (isNaN(d)) return "—";
      return (d.getFullYear()-1911) + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
    }

    // ── 登出 ──────────────────────────────────────────────────
    function logout() {
      localStorage.removeItem("nbs_user");
      window.location.href = "index.html";
    }

    // ── 呼叫 GAS（統一透過 nav.js）─────────────────────────
    function callGAS(action, params) {
      if (window.NBS_NAV && typeof NBS_NAV.callGAS === "function") {
        return NBS_NAV.callGAS(action, params);
      }
      
      // ── 新增：判斷走 API 1 還是走直連 ──
      let targetUrl = AUTH_GAS_URL;
      const shellUrl = localStorage.getItem("nbs_shell_url");
      const isAuthAction = (action === 'checkAuth' || action === 'registerShell' || action === 'apply');
      
      // 非驗證動作 + 非管理員 + 擁有直連網址，就直接打給 Shell！
      if (!isAuthAction && (!currentUser || !currentUser.isAdmin) && shellUrl) {
        targetUrl = shellUrl;
      }

      return fetch(targetUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(Object.assign({ action: action, email: currentUser ? currentUser.email : "" }, params || {})),
      }).then(r => r.json());
    }
  </script>

</body>
</html>
