<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS 雲端保單體檢 - 主畫面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: linear-gradient(160deg, #EEF4FF 0%, #F5F0FF 50%, #EFF9F4 100%);
      min-height: 100vh;
      color: #111827;
    }

    body::before {
      content: '';
      position: fixed; top: -120px; right: -80px;
      width: 340px; height: 340px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,.09) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; bottom: -100px; left: -60px;
      width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,.08) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .header {
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(120,140,255,.13);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;    /* 讓子元素的 text-overflow:ellipsis 在 flex 容器裡真的生效 */
      flex-shrink: 1;
    }

    .header-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #6B7280;
      min-width: 0;
    }

    #user-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }

    /* 窄螢幕（手機直向，約 iPhone SE ~ 一般手機寬度）：Logo＋標題＋頭像＋
       姓名＋管理員 Badge＋登出全部擠在一行本來就容易爆版，這裡縮小間距
       跟字體、姓名欄位進一步限制寬度，登出按鈕改成更小的圖示化樣式，
       避免整排被擠到換行或橫向溢出。不隱藏管理員 Badge——那是 JS 依權
       限動態控制顯示與否的，CSS 這裡只負責在「本來就該顯示」的前提下
       讓它不要撐爆版面。 */
    @media (max-width: 380px) {
      .header { padding: 8px 12px; gap: 6px; }
      .header-left { gap: 6px; }
      .header-logo { height: 26px; }
      .header-title { font-size: 12.5px; }
      .header-right { gap: 6px; }
      .user-badge { gap: 4px; font-size: 11px; }
      #user-name { max-width: 56px; }
      .admin-badge { font-size: 10px !important; padding: 1px 6px !important; }
      .logout-btn { font-size: 0; padding: 6px 8px; }
      .logout-btn::before { content: "⎋"; font-size: 14px; }
    }

    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #7C3AED);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(124,58,237,.25);
      flex-shrink: 0;
    }

    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .logout-btn {
      font-size: 12px; color: #9CA3AF; cursor: pointer;
      background: none; border: 1.5px solid #E5E7EB;
      border-radius: 7px; padding: 4px 10px; font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .logout-btn:hover { border-color: #9CA3AF; color: #374151; }

    .main { padding: 20px 16px; max-width: 540px; margin: 0 auto; position: relative; z-index: 1; }

    .search-bar { position: relative; margin-bottom: 16px; }

    .search-bar input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      font-size: 14px;
      border: 1.5px solid rgba(120,140,255,.18);
      border-radius: 12px; outline: none;
      background: rgba(255,255,255,.80);
      font-family: inherit; color: #111827;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .search-bar input:focus {
      border-color: #3B82F6;
      background: rgba(255,255,255,.95);
      box-shadow: 0 0 0 3px rgba(59,130,246,.10);
    }
    .search-bar input::placeholder { color: #9CA3AF; }

    .search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF; font-size: 16px; pointer-events: none;
    }

    .section-label {
      font-size: 11px; font-weight: 700; color: #9CA3AF;
      letter-spacing: .07em; text-transform: uppercase; margin-bottom: 10px;
    }

    .family-card {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(120,140,255,.12);
      border-radius: 14px; padding: 13px 15px; margin-bottom: 8px;
      cursor: pointer; display: flex; align-items: center; gap: 13px;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 10px rgba(100,120,255,.05);
    }
    .family-card:hover {
      background: rgba(255,255,255,.96);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(100,120,255,.10);
      border-color: rgba(124,58,237,.20);
    }

    .family-avatar {
      width: 42px; height: 42px; border-radius: 13px;
      background: linear-gradient(135deg, #EEF4FF, #EDE9FF);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #6D28D9; flex-shrink: 0;
    }

    .family-info { flex: 1; min-width: 0; }
    .family-name { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 3px; }
    .family-meta { font-size: 12px; color: #9CA3AF; }
    .chevron { color: #D1D5DB; font-size: 18px; flex-shrink: 0; }

    .version-badge { font-size: 11px; font-weight: 700; color: #6366f1; background: #eef2ff; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
    .version-picker { position: relative; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #4f46e5; background: #eef2ff; padding: 6px 10px; border-radius: 99px; flex-shrink: 0; cursor: pointer; }
    .version-picker .chevron { font-size: 12px; color: #4f46e5; transition: transform .15s; }
    .version-picker.open .chevron { transform: rotate(180deg); }
    .version-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; min-width: 160px; z-index: 50; }
    .version-picker.open .version-menu { display: block; }
    .version-opt { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: #374151; white-space: nowrap; cursor: pointer; }
    .version-opt:hover { background: #f5f5ff; }
    .more-actions { position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .more-actions-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #9CA3AF; font-size: 20px; font-weight: 700; cursor: pointer; }
    .more-actions-btn:hover { background: #f3f4f6; color: #374151; }
    .more-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; min-width: 160px; z-index: 51; }
    .more-actions.open .more-menu { display: block; }
    .more-opt { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: #b91c1c; white-space: nowrap; cursor: pointer; }
    .more-opt:hover { background: #fef2f2; }
    .version-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .action-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .add-btn {
      flex: 1;
      min-width: 0;
      padding: 12px 8px;
      background: linear-gradient(90deg, #3B82F6, #7C3AED);
      color: #fff; border: none; border-radius: 12px;
      font-size: 13.5px; font-weight: 700; cursor: pointer;
      font-family: inherit;
      transition: opacity .15s, transform .1s;
      box-shadow: 0 4px 16px rgba(100,120,255,.25);
      letter-spacing: .02em;
      white-space: normal;      /* 鎖定狀態文字比較長，允許換行，不要被硬切掉 */
      line-height: 1.35;
      min-height: 44px;         /* 換行後也維持一致的觸控高度 */
    }
    .add-btn.secondary {
      background: #fff; color: #4338ca; border: 1.5px solid #c7d2fe;
      box-shadow: 0 2px 8px rgba(0,0,0,.03);
    }
    .add-btn:hover { opacity: .92; transform: translateY(-1px); }
    .add-btn:active { transform: translateY(0); }

    .empty-state { text-align: center; padding: 48px 20px; color: #9CA3AF; }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state .text { font-size: 13px; line-height: 1.7; }

    .loading-state { text-align: center; padding: 48px 20px; color: #9CA3AF; font-size: 13px; }

    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid #E5E7EB; border-top-color: #3B82F6;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 骨架屏：先渲染幾張跟真實家庭卡片同樣尺寸的灰色區塊，帶脈衝動畫，
       取代單純的轉圈圈——資料還沒回來，畫面看起來已經「有東西在」，
       感知載入速度會比空白+spinner快很多，網路稍有延遲時也不會讓畫
       面突然跳動。 */
    .skeleton-card {
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(120,140,255,.10);
      border-radius: 14px; padding: 13px 15px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 13px;
    }
    .skeleton-block {
      background: linear-gradient(90deg, #EEF0F4 25%, #F7F8FA 37%, #EEF0F4 63%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
      border-radius: 8px;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    /* 載入提示文字——之前改骨架屏時，順手把這段字縮成 12px 塞到骨架
       屏下面的小角落，變得很不顯眼。這裡改回醒目、置中的樣式，跟原本
       的體驗一致，骨架屏留著當背景視覺（有東西在動的感覺），文字才是
       真正要讓使用者看到、安心等待的重點。 */
    .loading-caption {
      text-align: center;
      padding: 18px 20px 16px;
      color: #4B5563;
      font-size: 14px;
      font-weight: 600;
    }


    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(17,24,39,.45);
      backdrop-filter: blur(4px);
      z-index: 200; align-items: flex-end; justify-content: center; padding: 0;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff; border-radius: 20px 20px 0 0;
      padding: 24px 20px; width: 100%; max-width: 540px;
      max-height: 90vh; overflow-y: auto;
    }

    .modal-title {
      font-size: 16px; font-weight: 700; color: #111827;
      margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;
    }

    .modal-close {
      background: #F3F4F6; border: none; font-size: 18px; color: #6B7280;
      cursor: pointer; padding: 0; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; transition: background .15s;
    }
    .modal-close:hover { background: #E5E7EB; color: #374151; }

    .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }

    .step-dot {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .step-dot.active   { background: linear-gradient(135deg,#3B82F6,#7C3AED); color: #fff; }
    .step-dot.done     { background: #D1FAE5; color: #065F46; }
    .step-dot.inactive { background: #F3F4F6; color: #9CA3AF; }
    .step-line { flex: 1; height: 1px; background: #E5E7EB; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; color: #6B7280;
      margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase;
    }
    .field input, .field select {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      outline: none; font-family: inherit; background: #FAFAFA; color: #111827;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .field input:focus, .field select:focus {
      border-color: #3B82F6; background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,.10);
    }
    .field input::placeholder { color: #9CA3AF; }
    .field .hint { font-size: 11px; color: #3B82F6; margin-top: 3px; }

    .btn-row { display: flex; gap: 8px; margin-top: 20px; }
    .btn-primary {
      flex: 2; padding: 11px;
      background: linear-gradient(90deg, #3B82F6, #7C3AED);
      color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .btn-secondary {
      flex: 1; padding: 11px; background: transparent; color: #6B7280;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      font-size: 13px; cursor: pointer; font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .btn-secondary:hover { border-color: #9CA3AF; color: #374151; }

    .age-hint { font-size: 11px; color: #3B82F6; margin-top: 3px; min-height: 16px; }

    .admin-badge {
      font-size: 10px; padding: 2px 8px; border-radius: 99px;
      background: linear-gradient(90deg, #EEF4FF, #F3EEFF);
      color: #6D28D9; font-weight: 700;
      border: 1px solid rgba(109,40,217,.15);
    }

    .status-msg {
      font-size: 12px; padding: 9px 12px; border-radius: 8px;
      margin-top: 8px; display: none;
    }
    .status-msg.error   { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
    .status-msg.success { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }
  </style>
  <script src="nav.js"></script>
</head>
<body>

    <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img class="header-logo"
           src="https://i.ibb.co/FkVkNhhd/NBS-4F3.jpg"
           alt="NBS Logo"
           onerror="this.style.display='none'"/>
      <span class="header-title">NBS 雲端保單體檢</span>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">載入中</span>
        <span id="admin-badge" class="admin-badge" style="display:none">管理員</span>
      </div>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 主內容 -->
  <div class="main">

    <!-- 搜尋 -->
    <div class="search-bar" style="margin-top:16px;">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜尋家庭名稱或成員姓名…" oninput="filterFamilies()" />
    </div>

    <!-- 新增按鈕（移到搜尋下方）-->
    <div class="action-group">
      <button class="add-btn" onclick="openCreateModal()">＋ 新增家庭</button>
      <button class="add-btn secondary" id="import-btn" onclick="goImportPage()">📥 批次匯入</button>
    </div>

    <!-- 家庭列表 -->
    <div class="section-label" id="list-label">家庭列表</div>
    <div id="family-list">
      <div id="loading-view">
        <div class="loading-caption"><span class="spinner"></span> <span id="loading-text-static">保單體檢資料連線中，請稍候...</span></div>
        <div class="skeleton-card">
          <div class="skeleton-block" style="width:42px;height:42px;border-radius:13px;flex-shrink:0;"></div>
          <div style="flex:1;min-width:0;">
            <div class="skeleton-block" style="width:40%;height:14px;margin-bottom:8px;"></div>
            <div class="skeleton-block" style="width:65%;height:11px;"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-block" style="width:42px;height:42px;border-radius:13px;flex-shrink:0;"></div>
          <div style="flex:1;min-width:0;">
            <div class="skeleton-block" style="width:55%;height:14px;margin-bottom:8px;"></div>
            <div class="skeleton-block" style="width:35%;height:11px;"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-block" style="width:42px;height:42px;border-radius:13px;flex-shrink:0;"></div>
          <div style="flex:1;min-width:0;">
            <div class="skeleton-block" style="width:45%;height:14px;margin-bottom:8px;"></div>
            <div class="skeleton-block" style="width:50%;height:11px;"></div>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:16px;padding:8px 10px;border-radius:8px;background:rgba(120,140,255,.05);border:1px solid rgba(120,140,255,.10);font-size:10px;color:#9CA3AF;line-height:1.6;letter-spacing:.01em">
      本報告為保障檢視參考，實際理賠項目與條件以各保險公司正式契約條款為準。
    </div>

  </div>

  <!-- 新增家庭 Modal -->
  <div class="modal-overlay" id="create-modal" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        新增家庭
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>

      <!-- 步驟指示 -->
      <div class="steps">
        <div class="step-dot" id="step1-dot">1</div>
        <div class="step-line"></div>
        <div class="step-dot inactive" id="step2-dot">2</div>
      </div>

      <!-- 步驟一：主要成員 -->
      <div id="step1-form">
        <div style="font-size:14px; font-weight:500; margin-bottom:4px;">主要成員資料</div>
        <div style="font-size:12px; color:#999; margin-bottom:16px;">請先建立這個家庭的主要被保險人資料</div>

        <div class="field">
          <label>姓名 <span style="color:#e74c3c">*</span></label>
          <input type="text" id="primary-name" placeholder="請輸入主要成員姓名" oninput="updateFamilyNameHint()" />
        </div>

        <div class="field">
          <label>出生日期（民國）</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" id="primary-birth-y" placeholder="年" min="1" max="200" style="width:70px" oninput="onPrimaryBirthRocChange()" />年
            <input type="number" id="primary-birth-m" placeholder="月" min="1" max="12" style="width:56px" oninput="onPrimaryBirthRocChange()" />月
            <input type="number" id="primary-birth-d" placeholder="日" min="1" max="31" style="width:56px" oninput="onPrimaryBirthRocChange()" />日
          </div>
          <input type="hidden" id="primary-birth" />
          <div class="age-hint" id="age-hint"></div>
        </div>

        <div class="field">
          <label>性別</label>
          <select id="primary-gender">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
          <div class="hint" style="font-size:12px;color:#999;margin-top:3px">用於平均餘命試算，之後也會用於家系圖</div>
        </div>

        <div class="field">
          <label>身分證字號（選填）</label>
          <input type="text" id="primary-id-number" placeholder="沒有也沒關係，之後隨時可以補填" maxlength="10" style="text-transform:uppercase" />
          <div class="hint" style="font-size:12px;color:#999;margin-top:3px">用於之後批次匯入保單資料時比對客戶身分，現在沒有可以先跳過</div>
        </div>

        <div class="field">
          <label>分析日（民國）</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" id="analysis-date-y" placeholder="年" min="1" max="200" style="width:70px" oninput="onAnalysisDateRocChange()" />年
            <input type="number" id="analysis-date-m" placeholder="月" min="1" max="12" style="width:56px" oninput="onAnalysisDateRocChange()" />月
            <input type="number" id="analysis-date-d" placeholder="日" min="1" max="31" style="width:56px" oninput="onAnalysisDateRocChange()" />日
          </div>
          <input type="hidden" id="analysis-date" />
        </div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn-primary" id="step1-next" onclick="goStep2()" disabled>下一步：設定家庭名稱</button>
        </div>
      </div>

      <!-- 步驟二：家庭名稱 -->
      <div id="step2-form" style="display:none;">
        <div style="font-size:14px; font-weight:500; margin-bottom:4px;">家庭名稱</div>
        <div style="font-size:12px; color:#999; margin-bottom:16px;">為這個家庭設定一個名稱</div>

        <!-- 主要成員預覽 -->
        <div style="display:flex; align-items:center; gap:10px; padding:10px 14px; background:#E6F1FB; border-radius:10px; margin-bottom:16px;">
          <div style="width:36px; height:36px; border-radius:50%; background:#378ADD; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; color:#fff;" id="preview-avatar">?</div>
          <div>
            <div style="font-weight:500; font-size:14px;" id="preview-name">—</div>
            <div style="font-size:12px; color:#0C447C;" id="preview-age">—</div>
          </div>
        </div>

        <div class="field">
          <label>家庭名稱 <span style="color:#e74c3c">*</span></label>
          <input type="text" id="family-name-input" placeholder="如：王家、王小明家…" />
          <div class="hint" style="color:#aaa; font-size:11px; margin-top:3px;">預設為「XXX家」，可自行修改</div>
        </div>

        <div class="status-msg" id="create-status"></div>

        <div class="btn-row">
          <button class="btn-secondary" onclick="goStep1()">上一步</button>
          <button class="btn-primary" id="create-btn" onclick="createFamily()">建立家庭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── 設定 ─────────────────────────────────────────────────
    const AUTH_GAS_URL = "https://script.google.com/macros/s/AKfycbwzDwyZy09189eOJOs-zEwkZOml2_pJOq15nYGtHF2Kyrtv6ag5VY-I2M8sDyrt0iPdZQ/exec"; // 僅身份驗證用

    let currentUser = null;
    let allFamilies = [];
    // ── 新增：動態載入文字設定 ──
    let loadingTimer = null;
    const loadingMessages = [
      "保單資料庫安全連線中...",
      "正在彙整各險種保障明細...",
      "保障缺口運算即將完成，請稍候..."
    ];
    
    // ── 初始化 ────────────────────────────────────────────────
    window.onload = function() {
      const saved = localStorage.getItem("nbs_user");
      if (!saved) { window.location.href = "index.html"; return; }
      currentUser = JSON.parse(saved);
      updateImportButtonLockUI_();

      const nameEl = document.getElementById("user-name");
      const avatarEl = document.getElementById("user-avatar");
      const adminBadge = document.getElementById("admin-badge");
      nameEl.textContent = currentUser.agentName || currentUser.name || currentUser.email;

      if (currentUser.picture) {
        avatarEl.innerHTML = `<img src="${currentUser.picture}" alt="avatar" />`;
      } else {
        avatarEl.textContent = nameEl.textContent[0];
      }
      if (currentUser.isAdmin) adminBadge.style.display = "inline";

      const today = new Date().toISOString().slice(0, 10);
      const todayRoc = isoToRocParts(today);
      document.getElementById("analysis-date").value = today;
      document.getElementById("analysis-date-y").value = todayRoc.y;
      document.getElementById("analysis-date-m").value = todayRoc.m;
      document.getElementById("analysis-date-d").value = todayRoc.d;

      // ── 新增：檢查是否有直連網址，沒有就補抓；順便刷新會員等級 ──
      const shellUrl = localStorage.getItem("nbs_shell_url");
      if (!shellUrl && !currentUser.isAdmin) {
        callGAS("checkAuth", { email: currentUser.email }).then(res => {
          if (res.shellUrl) localStorage.setItem("nbs_shell_url", res.shellUrl);
          if (res.tier) {
            currentUser.tier = res.tier;
            localStorage.setItem("nbs_user", JSON.stringify(currentUser));
          }
          loadFamilies();
        }).catch(() => loadFamilies());
      } else {
        loadFamilies();
      }
    };

    // ── 載入家庭列表 ──────────────────────────────────────────
    const FAMILIES_CACHE_KEY = "nbs_families_list";
    const FAMILIES_CACHE_TTL = 10 * 60 * 1000; // 10 分鐘

    function getFamiliesCache() {
      try {
        const raw = sessionStorage.getItem(FAMILIES_CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.ts || !obj.data) return null;
        if (Date.now() - obj.ts > FAMILIES_CACHE_TTL) { sessionStorage.removeItem(FAMILIES_CACHE_KEY); return null; }
        return obj.data;
      } catch(e) { return null; }
    }
    function setFamiliesCache(data) {
      try { sessionStorage.setItem(FAMILIES_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
    }
    function invalidateFamiliesCache() {
      try { sessionStorage.removeItem(FAMILIES_CACHE_KEY); } catch(e) {}
    }

    function loadFamilies(forceRefresh) {
      // 先查快取，有就立即顯示（< 50ms）
      if (!forceRefresh) {
        const cached = getFamiliesCache();
        if (cached) {
          allFamilies = cached;
          renderFamilies(allFamilies, false);
          // 背景靜默更新，不影響畫面
          setTimeout(function() {
            callGAS("listFamilies", {})
              .then(result => {
                const fresh = result.families || [];
                setFamiliesCache(fresh);
                allFamilies = fresh;
                renderFamilies(allFamilies, false); // 靜默更新列表
              }).catch(() => {});
          }, 300);
          return;
        }
      }

      // 快取未命中：正常流程，啟動「有溫度的動態載入」
      // 骨架屏取代原本單純的 spinner——資料還沒回來，畫面看起來已經
      // 「有東西在」，比空白畫面+轉圈圈的感知載入速度快很多；下面保留
      // 原本的文字輪播當作說明文案，兩者搭配使用。
      document.getElementById("family-list").innerHTML =
        '<div class="loading-caption"><span class="spinner"></span> <span id="loading-text">保單資料庫安全連線中...</span></div>' +
        '<div class="skeleton-card"><div class="skeleton-block" style="width:42px;height:42px;border-radius:13px;flex-shrink:0;"></div><div style="flex:1;min-width:0;"><div class="skeleton-block" style="width:40%;height:14px;margin-bottom:8px;"></div><div class="skeleton-block" style="width:65%;height:11px;"></div></div></div>' +
        '<div class="skeleton-card"><div class="skeleton-block" style="width:42px;height:42px;border-radius:13px;flex-shrink:0;"></div><div style="flex:1;min-width:0;"><div class="skeleton-block" style="width:55%;height:14px;margin-bottom:8px;"></div><div class="skeleton-block" style="width:35%;height:11px;"></div></div></div>' +
        '<div class="skeleton-card"><div class="skeleton-block" style="width:42px;height:42px;border-radius:13px;flex-shrink:0;"></div><div style="flex:1;min-width:0;"><div class="skeleton-block" style="width:45%;height:14px;margin-bottom:8px;"></div><div class="skeleton-block" style="width:50%;height:11px;"></div></div></div>';

      // 啟動文字輪播計時器 (每 1.5 秒換一句)
      let msgIndex = 0;
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = setInterval(() => {
        msgIndex = (msgIndex + 1) % loadingMessages.length;
        const textEl = document.getElementById("loading-text");
        if (textEl) textEl.textContent = loadingMessages[msgIndex];
      }, 1500);

      // 發送請求給 GAS
      callGAS("listFamilies", {})
        .then(result => {
          clearInterval(loadingTimer); // 資料回來了，關閉計時器
          allFamilies = result.families || [];
          setFamiliesCache(allFamilies);
          renderFamilies(allFamilies, false);
        })
        .catch(err => {
          clearInterval(loadingTimer); // 發生錯誤，關閉計時器
          console.error("loadFamilies error", err);
          document.getElementById("family-list").innerHTML =
            '<div class="empty-state"><div class="text">載入失敗，請重新整理頁面</div></div>';
        });
    }

    // ── 渲染家庭列表 ──────────────────────────────────────────
    // ── 家庭分組：同一個家庭（現況/草案/歷史現況）合併成一張卡片 ──
    // 向下相容：舊資料沒有 familyGroupId/role 欄位時，
    // 用 familyId 當群組 key、預設 role="current"，行為等同以前
    // 「一個檔案一張卡片」，不會因為這次改版而壞掉。
    function groupFamilies(families) {
      var groups = {}, order = [];
      families.forEach(function(f){
        var gid = f.familyGroupId || f.familyId || f.fileName;
        if (!groups[gid]) { groups[gid] = { groupId: gid, versions: [] }; order.push(gid); }
        groups[gid].versions.push(Object.assign({}, f, { role: f.role || "current" }));
      });
      return order.map(function(gid){
        var g = groups[gid];
        // 每組排序：現況優先，草案其次（依建立時間新到舊），歷史現況最後
        var roleOrder = { current: 0, draft: 1, archived: 2 };
        g.versions.sort(function(a,b){
          var ra = roleOrder[a.role] !== undefined ? roleOrder[a.role] : 1;
          var rb = roleOrder[b.role] !== undefined ? roleOrder[b.role] : 1;
          if (ra !== rb) return ra - rb;
          return (b.updatedAt||"").localeCompare(a.updatedAt||"");
        });
        g.primary = g.versions.find(function(v){ return v.role === "current"; }) || g.versions[0];
        return g;
      });
    }

    function renderFamilies(families, isSearch) {
      const listEl  = document.getElementById("family-list");
      const labelEl = document.getElementById("list-label");

      // 用「完整」家庭數量（不是下面隨機顯示截斷後的 10 筆）判斷要不要
      // 鎖住新增家庭按鈕，這跟下面「超過 10 個隨機顯示 10 個」是兩件
      //完全不同的事，不要搞混。
      if (!isSearch) updateCreateButtonLockUI_(families.length);

      if (families.length === 0) {
        labelEl.textContent = isSearch ? "找不到符合的家庭" : "家庭列表";
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">👨‍👩‍👧</div>
            <div class="text">${isSearch ? "沒有符合「" + document.getElementById("search-input").value + "」的家庭" : "還沒有家庭資料<br/>點上方「新增家庭」開始建立"}</div>
          </div>`;
        return;
      }

      // 搜尋時顯示全部結果；非搜尋時隨機取最多 10 筆
      let display = families;
      if (!isSearch && families.length > 10) {
        // Fisher-Yates shuffle 取前 10 筆（每次載入順序都不同）
        const shuffled = families.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        display = shuffled.slice(0, 10);
        labelEl.textContent = `家庭列表　共 ${families.length} 個（隨機顯示 10 個，搜尋可找全部）`;
      } else {
        labelEl.textContent = `家庭列表　${families.length} 個家庭`;
      }

      const groups = groupFamilies(display);
      const roleLabel = { current: "現況", draft: "草案", archived: "歷史現況" };
      const roleColor = { current: "#10b981", draft: "#f59e0b", archived: "#9ca3af" };

      listEl.innerHTML = groups.map(g => {
        const f = g.primary;
        const hasMultiple = g.versions.length > 1;
        const versionOptionsHtml = g.versions.map(v =>
          `<div class="version-opt" onclick="event.stopPropagation();openFamily('${v.fileName}','${v.familyName}')">
             <span class="version-dot" style="background:${roleColor[v.role]}"></span>
             <span>${roleLabel[v.role] || v.role}${v.draftLabel ? '：'+v.draftLabel : ''}</span>
           </div>`
        ).join("");

        return `
        <div class="family-card" onclick="openFamily('${f.fileName}', '${f.familyName}')">
          <div class="family-avatar">${f.familyName[0] || "?"}</div>
          <div class="family-info">
            <div class="family-name">${f.familyName}${hasMultiple ? ` <span class="version-badge">${g.versions.length} 個版本</span>` : ""}</div>
            <div class="family-meta">${f.memberCount || (f.members && f.members.length) || 0} 位成員　·　分析日 ${toRoc(f.analysisDate)}</div>
          </div>
          <div class="more-actions" onclick="event.stopPropagation();toggleMoreMenu(this)">
            <div class="more-actions-btn">⋯</div>
            <div class="more-menu">
              <div class="more-opt" onclick="event.stopPropagation();promptDeleteEntireFamily('${g.groupId}','${f.familyName.replace(/'/g, "\\'")}')">
                🗑️ 刪除整個檔案
              </div>
            </div>
          </div>
          ${hasMultiple
            ? `<div class="version-picker" onclick="event.stopPropagation();toggleVersionMenu(this)">
                 <span class="version-picker-label">${roleLabel[f.role]}</span>
                 <span class="chevron">▾</span>
                 <div class="version-menu">${versionOptionsHtml}</div>
               </div>`
            : `<div class="chevron">›</div>`}
        </div>
      `;
      }).join("");
    }

    // 版本選單開合（點別的地方自動關閉）
    function toggleVersionMenu(el) {
      document.querySelectorAll(".version-picker.open").forEach(function(o){ if(o!==el) o.classList.remove("open"); });
      el.classList.toggle("open");
    }
    document.addEventListener("click", function(){
      document.querySelectorAll(".version-picker.open").forEach(function(o){ o.classList.remove("open"); });
      document.querySelectorAll(".more-actions.open").forEach(function(o){ o.classList.remove("open"); });
    });

    // 「⋯」更多操作選單開合
    function toggleMoreMenu(el) {
      document.querySelectorAll(".more-actions.open").forEach(function(o){ if(o!==el) o.classList.remove("open"); });
      document.querySelectorAll(".version-picker.open").forEach(function(o){ o.classList.remove("open"); });
      el.classList.toggle("open");
    }

    // 刪除整個檔案（涵蓋這個家庭的所有版本：現況／草案／歷史現況，
    // 以及底下所有成員的個人保單檔案）。跟 nav.js 裡「版本管理」的
    // 同名功能共用同一套後端邏輯，這裡是給家庭列表頁單獨使用的版本，
    // 差別在於這裡不用重新呼叫 listFamilies，直接用畫面上已經抓好的
    // allFamilies 找出同一組的所有版本即可。
    function promptDeleteEntireFamily(groupId, familyName) {
      // 家庭名稱本身是空的／損毀的（例如建立過程中出錯，存成一筆看不到
      // 名稱的殘留資料），這種情況沒辦法要求使用者「完整打出家庭名稱」
      // 來確認，不然會永遠卡住刪不掉。改成打固定的英文字「DELETE」代替。
      var isBroken = !familyName || !familyName.trim();
      var confirmPhrase = isBroken ? "DELETE" : familyName;
      var displayName = isBroken ? "（沒有名稱的異常資料）" : familyName;

      if (!window.confirm(
        "確定要刪除「"+displayName+"」這整個檔案嗎？\n\n" +
        "這會刪除所有版本（現況／草案／歷史現況）與底下所有成員的保單資料，此動作無法復原。"
      )) return;
      var promptMsg = isBroken
        ? "最後確認：這筆資料沒有名稱，請輸入英文「DELETE」以永久刪除："
        : "最後確認：請完整輸入家庭名稱「"+familyName+"」以永久刪除：";
      var typed = window.prompt(promptMsg);
      if (typed === null) return; // 使用者取消
      if (typed.trim() !== confirmPhrase) {
        alert("輸入的內容不符，已取消刪除，資料仍然保留。");
        return;
      }

      var siblings = allFamilies.filter(function(f){
        return (f.familyGroupId || f.familyId) === groupId;
      });
      if (!siblings.length) { alert("找不到這個家庭的檔案，可能已經被刪除過了。"); return; }

      if (window.NBS_NAV && NBS_NAV._showBusyOverlay) NBS_NAV._showBusyOverlay("刪除中，請稍候...");

      // ⚠️ 這裡刻意「一個一個依序」呼叫，不要用 Promise.all 一次全部平行
      // 打出去——原因有兩個：
      // 1. 後端刪除家庭檔案時，會順手同步更新一份「家庭索引」小檔案
      //    （讀出來、改一筆、存回去）。如果好幾個版本的刪除同時平行
      //    執行，每個都各自讀了「舊版」索引再各自寫回去，最後只有
      //    最後一個寫入的會生效，其他刪除動作對索引做的更新會被蓋掉、
      //    憑空消失，導致索引裡殘留已經刪除的家庭。依序執行，每一筆
      //    刪除完整做完（含索引更新）才開始下一筆，就不會互相干擾。
      // 2. 一次打太多平行請求，也比較容易讓 GAS／Drive 那邊塞車、
      //    甚至間歇性失敗（就是主控台那些 404 紅字的來源）。
      (async function () {
        try {
          var personFileNameSet = {};
          for (var i = 0; i < siblings.length; i++) {
            var f = siblings[i];
            try {
              var rf = await callGAS("readFile", { fileType: "families", fileName: f.fileName });
              if (rf && rf.status === "ok" && rf.content && rf.content.members) {
                rf.content.members.filter(function(m){ return m.role !== "beneficiary_only"; }).forEach(function(m){
                  var nm = m.name || "member";
                  personFileNameSet[nm + "_" + m.personId + ".json"] = true;
                });
              }
            } catch (e) { /* 讀不到就算了，還是繼續刪除這個檔案本身 */ }
          }

          for (var j = 0; j < siblings.length; j++) {
            try { await callGAS("deleteFile", { fileType: "families", fileName: siblings[j].fileName }); }
            catch (e) { /* 單一版本刪除失敗不中斷，繼續刪其他版本跟成員 */ }
          }
          var personFileNames = Object.keys(personFileNameSet);
          for (var k = 0; k < personFileNames.length; k++) {
            try { await callGAS("deleteFile", { fileType: "persons", fileName: personFileNames[k] }); }
            catch (e) { /* 同上，不中斷 */ }
          }

          if (window.NBS_NAV && NBS_NAV._hideBusyOverlay) NBS_NAV._hideBusyOverlay();
          alert("「"+familyName+"」已永久刪除。");
          allFamilies = allFamilies.filter(function(f){ return (f.familyGroupId || f.familyId) !== groupId; });
          setFamiliesCache(allFamilies);
          renderFamilies(allFamilies, false);
        } catch (err) {
          if (window.NBS_NAV && NBS_NAV._hideBusyOverlay) NBS_NAV._hideBusyOverlay();
          alert("刪除失敗（可能是後端尚未支援刪除功能）："+(err.message||err));
        }
      })();
    }

    // ── 搜尋篩選 ─────────────────────────────────────────────
    function filterFamilies() {
      const q = document.getElementById("search-input").value.trim();
      if (!q) {
        renderFamilies(allFamilies, false);  // 無搜尋：隨機 10 筆
        return;
      }
      // 同時比對家庭名稱跟成員姓名，之前只比對家庭名稱，只要搜尋內容
      // 剛好不在家庭名稱裡（例如成員本人的名字），不管是中文還是英數字
      // 都會找不到，看起來就像「數字/英文搜不到」。
      const qLower = q.toLowerCase();
      const filtered = allFamilies.filter(f =>
        f.familyName.toLowerCase().includes(qLower) ||
        (f.memberNames || []).some(n => n.toLowerCase().includes(qLower))
      );
      renderFamilies(filtered, true);         // 搜尋中：顯示全部結果
    }

    // ── 開啟家庭：導向 SPA shell（自動落地到家庭總覽），
    // 讓選完家庭之後的整個操作流程都在 shell.html 底下進行，
    // 側欄不會每次切換頁面都重新載入 ─────────────────────
    function openFamily(fileName, familyName) {
      localStorage.setItem("nbs_current_family", fileName);
      localStorage.setItem("nbs_current_family_name", familyName);
      window.location.href = "shell.html";
    }

    // ── 新增家庭 Modal ────────────────────────────────────────
    // 一般會員達到家庭數量上限時，「＋ 新增家庭」按鈕看得到但點不開，
    // 真正的擋法在後端（Shell 的 createFamilyChecked），這裡只是提早
    // 在前端給使用者比較好的體驗。
    function isEliteUser_() {
      return !!(currentUser && (currentUser.isAdmin || currentUser.tier === "菁英"));
    }

    // 批次匯入保單是菁英會員專屬功能，跟 AI 辨識保單一樣：看得到但點不開，
    // 點下去跳提醒，不會真的進到匯入頁面。
    function updateImportButtonLockUI_() {
      const btn = document.getElementById("import-btn");
      if (!btn) return;
      const locked = !isEliteUser_();
      btn.dataset.locked = locked ? "1" : "0";
      btn.style.opacity = locked ? "0.55" : "";
      btn.style.cursor = locked ? "not-allowed" : "";
      btn.innerHTML = locked ? "🔒 批次匯入（菁英專屬）" : "📥 批次匯入";
    }

    function goImportPage() {
      if (!isEliteUser_()) { showEliteOnlyNotice_(); return; }
      window.location.href = "import.html";
    }

    function showEliteOnlyNotice_() {
      let el = document.getElementById("elite-only-notice");
      if (!el) {
        el = document.createElement("div");
        el.id = "elite-only-notice";
        el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);"+
          "background:#1a1a1a;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;"+
          "z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw";
        el.innerHTML = '<span>🔒 批次匯入保單是菁英會員專屬功能，請聯繫管理員升級</span>'+
          '<button onclick="document.getElementById(\'elite-only-notice\').remove()" '+
          'style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer">關閉</button>';
        document.body.appendChild(el);
      }
      clearTimeout(window._eliteNoticeTimer);
      window._eliteNoticeTimer = setTimeout(function(){
        const cur = document.getElementById("elite-only-notice");
        if (cur) cur.remove();
      }, 3000);
    }

    function updateCreateButtonLockUI_(totalCount) {
      const btn = document.querySelector(".add-btn");
      if (!btn) return;
      const locked = !isEliteUser_() && totalCount >= 10;
      btn.dataset.locked = locked ? "1" : "0";
      btn.style.opacity = locked ? "0.55" : "";
      btn.style.cursor = locked ? "not-allowed" : "";
      btn.textContent = locked ? "🔒 已達上限" : "＋ 新增家庭";
    }

    function showFamilyLimitNotice_() {
      let el = document.getElementById("family-limit-notice");
      if (!el) {
        el = document.createElement("div");
        el.id = "family-limit-notice";
        el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);"+
          "background:#1a1a1a;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;"+
          "z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw";
        el.innerHTML = '<span>🔒 已達一般會員上限（10 個家庭），請聯繫管理員升級菁英會員</span>'+
          '<button onclick="document.getElementById(\'family-limit-notice\').remove()" '+
          'style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer">關閉</button>';
        document.body.appendChild(el);
      }
      clearTimeout(window._familyLimitTimer);
      window._familyLimitTimer = setTimeout(function(){
        const cur = document.getElementById("family-limit-notice");
        if (cur) cur.remove();
      }, 3000);
    }

    function openCreateModal() {
      const btn = document.querySelector(".add-btn");
      if (btn && btn.dataset.locked === "1") { showFamilyLimitNotice_(); return; }
      document.getElementById("create-modal").classList.add("active");
      goStep1();
    }

    function closeModal() {
      document.getElementById("create-modal").classList.remove("active");
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById("create-modal")) closeModal();
    }

    function goStep1() {
      document.getElementById("step1-form").style.display = "block";
      document.getElementById("step2-form").style.display = "none";
      document.getElementById("step1-dot").className = "step-dot active";
      document.getElementById("step2-dot").className = "step-dot inactive";
    }

    function goStep2() {
      const name = document.getElementById("primary-name").value.trim();
      if (!name) return;

      // 更新步驟指示
      document.getElementById("step1-dot").className = "step-dot done";
      document.getElementById("step1-dot").textContent = "✓";
      document.getElementById("step2-dot").className = "step-dot active";

      // 更新預覽
      document.getElementById("preview-avatar").textContent = name[0];
      document.getElementById("preview-name").textContent = name;

      const birth = document.getElementById("primary-birth").value;
      const analysis = document.getElementById("analysis-date").value;
      const age = calcInsAge(birth, analysis);
      document.getElementById("preview-age").textContent =
        birth ? `保險年齡 ${age} 歲　主要成員` : "主要成員";

      // 預設家庭名稱
      const familyInput = document.getElementById("family-name-input");
      if (!familyInput.value) familyInput.value = name + "家";

      document.getElementById("step1-form").style.display = "none";
      document.getElementById("step2-form").style.display = "block";
    }

    // ── 建立家庭 ─────────────────────────────────────────────
    function createFamily() {
      const primaryName  = document.getElementById("primary-name").value.trim();
      const birthDate    = document.getElementById("primary-birth").value;
      const gender       = document.getElementById("primary-gender").value;
      const idNumber     = document.getElementById("primary-id-number").value.trim().toUpperCase();
      const analysisDate = document.getElementById("analysis-date").value;
      const familyName   = document.getElementById("family-name-input").value.trim();

      if (!familyName) {
        showCreateStatus("error", "請填寫家庭名稱");
        return;
      }

      const btn = document.getElementById("create-btn");
      btn.disabled = true;
      btn.textContent = "驗證中…";
      // 這個動作會先經過 API1 查會員等級/家庭數量上限，比一般存檔多繞一站，
      // 如果超過 2 秒還沒回應，把文字換成更明確的說法，避免使用者覺得
      // 畫面卡住、以為系統當掉。
      const slowHint = setTimeout(() => { btn.textContent = "確認中，請稍候…"; }, 2000);

      const familyId = "f_" + Date.now();
      const personId = "p_" + Date.now();

      const personData = {
        version: "3.0.0",
        personId: personId,
        agentId: currentUser.email,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        profile: {
          name: primaryName,
          birthDate: birthDate || null,
          gender: gender || "male",
          idNumber: idNumber || null, // 選填，之後匯入保單資料時用來比對客戶身分
          analysisDate: analysisDate,
          note: "",
        },
        policies: [],
        coverage: {},
        savings: [],
        beneficiaryTemplates: [],
        medicalSummary: {},
        settings: { savingsDisplayYears: 20, notes: "" },
      };

      const familyData = {
        version: "3.0.0",
        familyId: familyId,
        familyName: familyName,
        agentId: currentUser.email,
        analysisDate: analysisDate,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        members: [
          { personId: personId, name: primaryName, role: "primary", relation: "本人" }
        ],
        sharedBeneficiary: [],
      };

      // 改用專屬的 createFamily 動作（一次送出 person + family 兩份資料），
      // 讓 API1 有機會先檢查會員等級跟家庭數量上限，不再是共用的 saveFile。
      callGAS("createFamily", {
        personFileName: primaryName + "_" + personId + ".json",
        personContent: personData,
        familyFileName: familyName + "_" + familyId + ".json",
        familyContent: familyData,
      })
      .then(result => {
        clearTimeout(slowHint);
        if (result && result.code === "family_limit") {
          btn.disabled = false;
          btn.textContent = "建立家庭";
          showCreateStatus("error", result.message || "已達目前方案的家庭數量上限，請聯繫管理員升級");
          return;
        }
        btn.disabled = false;
        btn.textContent = "建立家庭";
        closeModal();
        invalidateFamiliesCache();
        loadFamilies(true); // 清快取後強制重新載入，確保列表最新
      })
      .catch(err => {
        clearTimeout(slowHint);
        btn.disabled = false;
        btn.textContent = "建立家庭";
        showCreateStatus("error", "建立失敗，請重試");
      });
    }

    function showCreateStatus(type, msg) {
      const el = document.getElementById("create-status");
      el.className = "status-msg " + type;
      el.textContent = msg;
      el.style.display = "block";
    }

    // ── 姓名輸入時更新按鈕狀態 ───────────────────────────────
    function updateFamilyNameHint() {
      const name = document.getElementById("primary-name").value.trim();
      document.getElementById("step1-next").disabled = !name;
    }

    // ── 保險年齡計算 ──────────────────────────────────────────
    function calcAge() {
      const birth = document.getElementById("primary-birth").value;
      const analysis = document.getElementById("analysis-date").value;
      const hintEl = document.getElementById("age-hint");
      if (!birth) { hintEl.textContent = ""; return; }
      const age = calcInsAge(birth, analysis || new Date().toISOString().slice(0,10));
      hintEl.textContent = "保險年齡：" + age + " 歲";
    }

    function calcInsAge(birthDate, analysisDate) {
      if (!birthDate) return "—";
      const b = new Date(birthDate);
      const a = new Date(analysisDate || new Date());
      let years = a.getFullYear() - b.getFullYear();
      const months = (a - new Date(b.getFullYear() + years, b.getMonth(), b.getDate())) / (1000*60*60*24*30.4375);
      if (months >= 6) years++;
      return years;
    }

    // ── 民國年/月/日輸入 ↔ 西元 ISO 字串轉換 ──────────────────
    function rocToIso(rocYear, month, day) {
      rocYear = parseInt(rocYear, 10);
      month   = parseInt(month, 10);
      day     = parseInt(day, 10);
      if (!rocYear || !month || !day) return "";
      const adYear = rocYear + 1911;
      const mm = String(month).padStart(2, "0");
      const dd = String(day).padStart(2, "0");
      return adYear + "-" + mm + "-" + dd;
    }

    function isoToRocParts(iso) {
      if (!iso) return { y: "", m: "", d: "" };
      const d = new Date(iso);
      if (isNaN(d)) return { y: "", m: "", d: "" };
      return { y: d.getFullYear() - 1911, m: d.getMonth() + 1, d: d.getDate() };
    }

    function onPrimaryBirthRocChange() {
      const y = document.getElementById("primary-birth-y").value;
      const m = document.getElementById("primary-birth-m").value;
      const d = document.getElementById("primary-birth-d").value;
      document.getElementById("primary-birth").value = rocToIso(y, m, d);
      calcAge();
    }

    function onAnalysisDateRocChange() {
      const y = document.getElementById("analysis-date-y").value;
      const m = document.getElementById("analysis-date-m").value;
      const d = document.getElementById("analysis-date-d").value;
      document.getElementById("analysis-date").value = rocToIso(y, m, d);
      calcAge();
    }

    // 民國年/月/日三格輸入的自動跳格：月/日固定 2 碼，打滿就自動跳下
    // 一格；年因為可能是 2 碼（例如民國 53 年）也可能是 3 碼（例如民國
    // 115 年），打滿 3 碼才自動跳，2 碼的情況維持原本手動按 Tab／點擊
    // 切換，這是刻意的取捨，不是漏做。
    function wireRocAutoAdvance(yId, mId, dId) {
      const yEl = document.getElementById(yId);
      const mEl = document.getElementById(mId);
      const dEl = document.getElementById(dId);
      if (yEl && mEl) yEl.addEventListener("input", function(){
        if (this.value.replace(/\D/g,"").length >= 3) mEl.focus();
      });
      if (mEl && dEl) mEl.addEventListener("input", function(){
        if (this.value.replace(/\D/g,"").length >= 2) dEl.focus();
      });
    }
    wireRocAutoAdvance("primary-birth-y", "primary-birth-m", "primary-birth-d");
    wireRocAutoAdvance("analysis-date-y", "analysis-date-m", "analysis-date-d");

    // ── 民國年轉換 ────────────────────────────────────────────
    function toRoc(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      if (isNaN(d)) return "—";
      return (d.getFullYear()-1911) + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
    }

    // ── 登出 ──────────────────────────────────────────────────
    function logout() {
      // 這裡不能只清 nbs_user——nbs_shell_url 是「上一個帳號」的專屬
      // Shell 網址，如果沒清掉，下一個登入的帳號會誤用這個舊網址去打
      // 資料，抓回上一個帳號的家庭清單（真實發生過的資料外洩案例）。
      // 保險起見，跟帳號/家庭/個人資料快取有關的 key 全部清乾淨。
      localStorage.removeItem("nbs_user");
      localStorage.removeItem("nbs_shell_url");
      localStorage.removeItem("nbs_current_family");
      localStorage.removeItem("nbs_current_family_name");
      localStorage.removeItem("nbs_agent_watermark_name");
      localStorage.removeItem("nbs_agent_watermark_company");
      localStorage.removeItem("nbs_agent_watermark_contact");
      sessionStorage.clear(); // nbs_person_<id> 這類個人資料快取也一併清掉
      window.location.href = "index.html";
    }

    // ── 呼叫 GAS（統一透過 nav.js）─────────────────────────
    function callGAS(action, params) {
      if (window.NBS_NAV && typeof NBS_NAV.callGAS === "function") {
        return NBS_NAV.callGAS(action, params);
      }
      
      // ── 新增：判斷走 API 1 還是走直連 ──
      let targetUrl = AUTH_GAS_URL;
      const shellUrl = localStorage.getItem("nbs_shell_url");
      // createFamily 要強制走 API1，讓它有機會先檢查會員等級／家庭數量
      // 上限，不能像其他存檔動作一樣被直連繞過去。
      const isAuthAction = (action === 'checkAuth' || action === 'registerShell' || action === 'apply' || action === 'createFamily');
      
      // 非驗證動作 + 非管理員 + 擁有直連網址，就直接打給 Shell！
      if (!isAuthAction && (!currentUser || !currentUser.isAdmin) && shellUrl) {
        targetUrl = shellUrl;
      }

      return fetch(targetUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(Object.assign({ action: action, email: currentUser ? currentUser.email : "" }, params || {})),
      }).then(r => r.json());
    }
  </script>
