<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 保險繳費輸入</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* Header */
    .header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn { background:none; border:none; font-size: 26px; color:#999; cursor:pointer; padding:0; line-height:1; }
    .header-title { font-size: 18px; font-weight:500; flex:1; }
    .header-sub { font-size: 14px; color:#bbb; }

    /* 成員 Tab */
    .member-tabs {
      display: flex;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      overflow-x: auto;
      padding: 0 16px;
    }
    .member-tab {
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      color: #888;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .member-tab.active {
      border-bottom-color: #378ADD;
      color: #378ADD;
      font-weight: 500;
    }
    .tab-count {
      font-size: 14px;
      padding: 0 5px;
      border-radius: 99px;
      background: #f0f0f0;
      color: #aaa;
    }
    .member-tab.active .tab-count {
      background: #E6F1FB;
      color: #0C447C;
    }

    /* 主內容 */
    .main { 
  padding: 16px 24px; /* 電腦版左右留白稍微加大，視覺更舒適 */
  max-width: 1200px;  /* 將原本的 560px 放大，讓大螢幕可以滿版展開 */
  margin: 0 auto;
  width: 100%;        /* 確保絕對不會超出手機螢幕邊界 */
}

/* 針對手機版自動微調邊距，保持原本的緊湊感 */
@media (max-width: 768px) {
  .main { padding: 16px; }
}

    /* 統計卡片 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 14px; color: #999; margin-bottom: 2px; }
    .stat-value { font-size: 19px; font-weight: 500; }

    /* 保單群組 */
    .policy-group {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: #f7f7f5;
      border-bottom: 1px solid #e8e8e8;
      flex-wrap: wrap;
    }
    .policy-no-badge {
      font-size: 14px;
      font-weight: 500;
      background: #E6F1FB;
      color: #0C447C;
      padding: 2px 8px;
      border-radius: 99px;
      font-family: monospace;
    }
    .group-company { font-size: 16px; font-weight: 500; }
    .group-member-badge {
      font-size: 14px;
      padding: 1px 7px;
      background: #EAF3DE;
      color: #27500A;
      border-radius: 99px;
    }
    .group-total { font-size: 14px; color: #999; margin-left: auto; }

    /* 保單列 */
    .policy-row {
      display: flex;
      align-items: center;
      gap: 0;
      border-top: 1px solid rgba(120,140,255,.08);
      cursor: pointer;
      transition: background .15s;
      padding: 10px 0;
    }
    .policy-row:hover { background: rgba(59,130,246,.03); }

    .pr-cell { padding: 0 8px; font-size: 17px; overflow: hidden; flex-shrink: 0; }
    .pr-badge-cell  { width: 56px; text-align: center; }
    .pr-cat-cell    { width: 92px; }
    .pr-name-cell   { flex: 1; min-width: 0; padding: 0 10px; }
    .pr-insured-cell { width: 108px; text-align: right; }
    /* pr-fx-cell 已整合進名稱欄，不再獨立使用 */
    .pr-amount-cell { width: 160px; text-align: right; }
    .pr-status-cell { width: 96px; text-align: center; }
    .pr-chevron     { width: 20px; text-align: center; color: #D1D5DB; font-size: 19px; }

    .cat-badge {
      font-size: 14px;
      padding: 2px 7px;
      border-radius: 99px;
      white-space: nowrap;
      display: inline-block;
    }
    .cat-壽險保障      { background:#E6F1FB; color:#0C447C; }
    .cat-醫療保障      { background:#E1F5EE; color:#085041; }
    .cat-意外險        { background:#FAEEDA; color:#633806; }
    .cat-重大疾病險    { background:#EEEDFE; color:#3C3489; }
    .cat-重大傷病險    { background:#EEEDFE; color:#3C3489; }
    .cat-特定傷病險    { background:#EEEDFE; color:#3C3489; }
    .cat-儲蓄險        { background:#FBEAF0; color:#72243E; }
    .cat-年金險        { background:#FCEBEB; color:#791F1F; }
    .cat-投資型保險    { background:#f0f0f0; color:#555; }

    .status-badge {
      font-size: 14px;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
      text-align: center;
      display: inline-block;
    }
    .status-有效    { background:#EAF3DE; color:#27500A; }
    .status-停效    { background:#FCEBEB; color:#791F1F; }
    .status-減額繳清 { background:#FAEEDA; color:#633806; }
    .status-繳費期滿 { background:#E6F1FB; color:#0C447C; } /* 藍色：完成階段任務 */
    .status-自動墊繳 { background:#FFF4E5; color:#D84315; } /* 橘色：需特別提醒與注意 */
    .status-展期     { background:#EEEDFE; color:#3C3489; } /* 紫色：契約結構變更 */
    .status-緩繳     { background:#FFF4E5; color:#D84315; } /* 橘色：需特別提醒與注意 */

    .pr-amount { font-size: 17px; font-weight: 600; text-align: right; color: #111827; }
    .pr-chevron { color: #ccc; font-size: 19px; text-align: center; }

    /* 新增附約 */
    .add-rider-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-top: 1px solid #f0f0f0;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      background: transparent;
      width: 100%;
      border: none;
      border-top: 1px solid #f0f0f0;
      font-family: inherit;
      text-align: left;
    }
    .add-rider-btn:hover { background: #fafafa; }

    /* 新增主約按鈕 */
    .add-main-btn {
      width: 100%;
      padding: 11px;
      background: #378ADD;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
    }
    .add-main-btn:hover { background: #2970c0; }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: #bbb;
      font-size: 16px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-close { background:none; border:none; font-size: 26px; color:#999; cursor:pointer; line-height:1; }

    /* 表單 */
    .field { margin-bottom: 13px; }
    .field label { display:block; font-size: 14px; color:#666; margin-bottom:3px; }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      font-size: 17px;
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      outline: none;
      font-family: inherit;
      background: #fff;
    }
    .field input:focus, .field select:focus { border-color: #378ADD; }
    .field .hint { font-size: 14px; color: #0C447C; margin-top: 3px; }
    .field .dim  { font-size: 14px; color: #aaa; margin-top: 3px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* 被保人選擇 */
    .member-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .member-sel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .member-sel-item.active {
      border-color: #378ADD;
      background: #E6F1FB;
    }
    .member-sel-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: #666;
    }
    .member-sel-item.active .member-sel-avatar {
      background: #378ADD;
      color: #fff;
    }
    .member-sel-name { font-size: 16px; font-weight: 500; }
    .member-sel-rel  { font-size: 14px; color: #aaa; }

    /* 年繳台幣顯示 */
    .twd-display {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #E6F1FB;
      border-radius: 8px;
      margin-bottom: 13px;
    }
    .twd-label { font-size: 14px; color: #378ADD; }
    .twd-value { font-size: 22px; font-weight: 500; color: #0C447C; flex: 1; }
    .twd-calc  { font-size: 14px; color: #378ADD; }

    /* 按鈕列 */
    .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    .btn-primary {
      flex: 2; padding: 10px;
      background: #378ADD; color: #fff;
      border: none; border-radius: 8px;
      font-size: 17px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary:disabled { background: #ccc; cursor: default; }
    .btn-secondary {
      flex: 1; padding: 10px;
      background: transparent; color: #666;
      border: 1px solid #e0e0e0; border-radius: 8px;
      font-size: 16px; cursor: pointer; font-family: inherit;
    }
    .btn-danger {
      padding: 10px 14px;
      background: transparent; color: #e74c3c;
      border: 1px solid #fcc; border-radius: 8px;
      font-size: 14px; cursor: pointer; font-family: inherit;
    }

    /* spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #e0e0e0;
      border-top-color: #378ADD;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 搜尋框 */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap input {
      width: 100%;
      padding: 8px 10px 8px 32px;
      font-size: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      background: #fff;
      font-family: inherit;
    }
    .search-wrap input:focus { border-color: #378ADD; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #bbb; pointer-events: none; }

    /* 附約區塊預設隱藏 */
    .rider-row { display: none; background: #f9f9f9; padding-left: 30px; border-top: 1px solid #eee; }
    /* 展開按鈕樣式 */
    .expand-icon { font-size: 17px; color: #378ADD; cursor: pointer; transition: transform 0.2s; }
    .expand-icon.open { transform: rotate(90deg); }
  </style>
  <script src="nav.js"></script>
<!-- 這裡引入 PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</script>
  
</head>
<body>
<div style="display:none" id="header-sub"></div>


<!-- 成員 Tab -->
<!-- 主內容 -->
<div class="member-tabs" id="member-tabs"></div>
<div class="main">
  <div id="loading" style="text-align:center;padding:40px;color:#bbb;font-size: 16px"><span class="spinner"></span> 載入中…</div>
  <div id="content" style="display:none">
  <div class="stats-row" id="stats-row"></div>
  <div id="policy-list"></div>
  <button class="add-main-btn" onclick="openForm('new', null, null)">＋ 新增主約保單</button>
  </div><!-- /content -->
</div><!-- /main wrapper -->

<!-- 表單 Modal -->
<div class="modal-overlay" id="form-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="form-title">新增保單</span>
      <button class="modal-close" onclick="closeForm()">×</button>
    </div>
  <!-- 🌟 新增：AI 解析輸入區塊 -->
    <div class="field" style="background: #F3F8FF; padding: 12px; border-radius: 8px; border: 1px dashed #378ADD; margin-bottom: 16px;">
  <label style="color: #0C447C; font-weight: 500;">🤖 AI 智慧解析 (支援 PDF 上傳)</label>
  
  <!-- 本機檔案上傳按鈕 -->
  <input type="file" id="pdf-upload" accept="application/pdf" style="margin-bottom: 8px;" />
  
  <button type="button" id="ai-parse-btn" onclick="handlePDFUpload()" 
          style="width: 100%; padding: 8px; background: #378ADD; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer;">
    ✨ 上傳並自動分析填表
  </button>
  <div id="ai-parse-msg" style="font-size: 13px; color: #e74c3c; margin-top: 6px; display: none;"></div>
</div>
    
    <!-- 被保人 -->
    <div class="field">
      <label>被保險人</label>
      <div class="member-selector" id="member-selector"></div>
    </div>

    <!-- 保單號碼 + 類別 -->
    <div class="grid-3">
      <div class="field">
        <label>保單號碼 <span style="color:#e74c3c">*</span></label>
        <input type="text" id="f-policyno" placeholder="如 L123456789" />
      </div>
    <div class="field">
        <label>類別 <span style="color:#e74c3c">*</span></label>
        <select id="f-cat">
          <option value="">請選擇</option>
          <option>壽險保障</option>
          <option>醫療保障</option>
          <option>意外險</option>
          <option>重大疾病險</option>
          <option>重大傷病險</option>
          <option>特定傷病險</option>
          <option>儲蓄險</option>
          <option>年金險</option>
          <option>投資型保險</option>
        </select>
     </div>
      <div class="field">
      <label>保險公司 <span style="color:#e74c3c">*</span></label>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="f-company-search" placeholder="輸入關鍵字搜尋…"
               oninput="filterCompany(this.value)" onfocus="showCompanyList()" />
      </div>
      <div id="company-list" style="display:none; max-height:140px; overflow-y:auto; border:1px solid #e0e0e0; border-radius:7px; background:#fff; margin-top:-4px;"></div>
      <input type="hidden" id="f-company" />
    </div>
    </div>

    <!-- 要保人 + 保單狀態 -->
    <div class="grid-3">
      <div class="field">
        <label>要保人</label>
        <select id="f-owner">
          <!-- 動態填入：由 buildOwnerOptions() 產生 -->
        </select>
      </div>
      <div class="field">
        <label>保單屬性</label>
        <select id="f-ismain">
          <option value="true">主約</option>
          <option value="false">附約</option>
        </select>
      </div>
      <div class="field">
  	<label>保單狀態</label>
  	<select id="f-status">
    	  <option value="有效">有效</option>
    	  <option value="繳費期滿">繳費期滿</option>
    	  <option value="自動墊繳">自動墊繳</option>
    	  <option value="展期">展期</option>
    	  <option value="緩繳">緩繳</option>
    	  <option value="停效">停效</option>
    	  <option value="減額繳清">減額繳清</option>
  	</select>
      </div>
    </div>

<!-- 保險項目名稱 + 保單狀態 -->
    <div class="grid-2">
    <div class="field" style="position: relative;">
      <label>保險項目名稱</label>
      <!-- 加入 autocomplete="off" 防止瀏覽器原生的歷史紀錄干擾，並綁定 oninput 觸發過濾 -->
      <input type="text" id="f-item" placeholder="如：AD&D意外身故及殘廢保險附約" 
             oninput="filterFubonProducts(this.value)" 
             onfocus="filterFubonProducts(this.value)" autocomplete="off" />
      <!-- 動態商品選單容器 (預設隱藏) -->
      <div id="product-list" style="display:none; position: absolute; left:0; right:0; max-height:200px; overflow-y:auto; border:1px solid #e0e0e0; border-radius:7px; background:#fff; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 4px;"></div>
    </div>
    <div class="field">
      <label>繳費方式</label>
      <select id="f-paymode">
        <option>月繳</option>
        <option>季繳</option>
        <option>半年繳</option>
        <option selected>年繳</option>
        <option>躉繳</option>
      </select>
    </div>
 </div>
      
    <!-- 保險金額 -->
    <div class="field">
      <label>保險金額／計畫</label>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <input type="text" id="f-amount" placeholder="如 300 / 高額型4 / 計劃3" style="flex:1;padding:8px 10px;font-size: 17px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit" />
        <select id="f-amount-unit" onchange="toggleAmountCustom()" style="width:90px;padding:8px 8px;font-size: 16px;border:1px solid #e0e0e0;border-radius:7px;outline:none;font-family:inherit;background:#fff">
          <option value="萬元">萬元</option>
          <option value="元">元</option>
          <option value="計劃">計劃</option>
          <option value="型">型</option>
          <option value="份">份</option>
          <option value="custom">自訂…</option>
        </select>
      </div>
      <input type="text" id="f-amount-unit-custom" placeholder="請輸入單位名稱" style="display:none;margin-top:6px;width:100%;padding:8px 10px;font-size: 16px;border:1px solid #378ADD;border-radius:7px;outline:none;font-family:inherit" />
    </div>

    <!-- 起始日 + 繳費期滿日 + 保障期滿日 -->
    <div class="grid-3">
      <div class="field">
        <label>保單起始日</label>
        <input type="text" id="f-start" placeholder="如 1100516" oninput="parseDate('f-start','f-start-hint')" />
        <div class="hint" id="f-start-hint"></div>
      </div>
      <div class="field">
        <label>繳費期滿日</label>
        <input type="text" id="f-payend" placeholder="如 1300516" oninput="parseDate('f-payend','f-payend-hint')" />
        <div class="hint" id="f-payend-hint"></div>
      </div>
      <div class="field">
        <label>保障期滿日</label>
        <input type="text" id="f-covend" placeholder="終身可留空" oninput="parseDate('f-covend','f-covend-hint')" />
        <div class="hint" id="f-covend-hint"></div>
      </div>
    </div>

    <!-- 幣別 + 保費 + 匯率 -->
    <div class="grid-3">
      <div class="field">
        <label>幣別</label>
        <select id="f-currency" onchange="toggleFx()">
          <option>TWD</option>
          <option>USD</option>
          <option>AUD</option>
          <option>JPY</option>
          <option>EUR</option>
          <option>GBP</option>
        </select>
      </div>
      <div class="field">
        <label id="premium-label">年繳保費（TWD）</label>
        <input type="number" id="f-premium" placeholder="如 32000" oninput="calcTWD()" />
      </div>
      <div class="field" id="fx-field">
        <label>匯率</label>
        <input type="number" id="f-rate" placeholder="—" oninput="calcTWD()" />
      </div>
    </div>

    <!-- 年繳台幣自動換算 -->
    <div class="twd-display" id="twd-display" style="display:none">
      <span class="twd-label">年繳台幣</span>
      <span class="twd-value" id="twd-value">—</span>
      <span class="twd-calc" id="twd-calc"></span>
    </div>

    <!-- 驗證提示 -->
    <div id="form-error" style="font-size: 14px; color:#e74c3c; margin-bottom:8px; display:none;"></div>

    <!-- 按鈕 -->
    <div class="btn-row">
      <button class="btn-danger" id="delete-btn" style="display:none" onclick="deletePolicy()">刪除</button>
      <button class="btn-secondary" onclick="closeForm()">取消</button>
      <button class="btn-primary" id="save-btn" onclick="savePolicy()">儲存</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

const COMPANIES = [
  "富邦人壽","國泰人壽","南山人壽","新光人壽","中國人壽","台灣人壽",
  "三商美邦人壽","遠雄人壽","全球人壽","保誠人壽","宏泰人壽","第一金人壽",
  "合作金庫人壽","臺銀人壽","元大人壽","康健人壽","安聯人壽","友邦人壽",
  "法國巴黎人壽","宏利人壽","skyway人壽",
];

let currentUser   = null;
let familyData    = null;
let familyFileName = null;
let personDataMap  = {};
let currentTab     = "all";  // "all" or personId
let editingPolicy  = null;   // null=新增, object=編輯中的保單
let editingPersonId = null;
// ── 新增：富邦商品庫專用快取變數 ──
let cachedFubonProducts = []; 
let isFubonProductsLoading = false;
  
// ── 初始化 ────────────────────────────────────────────────
window.addEventListener("nbs_nav_ready", async function(e) {
  currentUser       = e.detail.user;  // 賦值給全域變數
  familyData        = e.detail.familyData;
  currentPersonId   = e.detail.currentPersonId;
  familyFileName    = e.detail.familyFileName;

  if (!currentUser) {
    document.getElementById("loading").innerHTML = "載入失敗：請重新登入";
    return;
  }
  if (!familyData) {
    // 家庭資料尚未建立，顯示空白頁面
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    return;
  }

  try {
    // 效能優化：nav.js 現在已經用 readFamilyBundle 把家庭+成員資料
    // 一起抓好了，這裡優先直接借用 e.detail.personsData，不再自己
    // 重複對每個成員各打一次 readFile。只有「缺資料」的成員才補抓
    // （例如 nav.js 走到舊版降級邏輯時的保護）。
    const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
    personDataMap = Object.assign({}, e.detail.personsData || {});

    const missingMembers = activeMembers.filter(m => !personDataMap[m.personId]);
    if (missingMembers.length) {
      const fetchPromises = missingMembers.map(m => {
        return callGAS("readFile", {
          email: currentUser.email,
          fileType: "persons",
          fileName: m.name + "_" + m.personId + ".json"
        }).then(pr => {
          if (pr.status === "ok" && pr.content) personDataMap[m.personId] = pr.content;
        }).catch(err => console.error("讀取 " + m.name + " 失敗", err));
      });
      await Promise.all(fetchPromises);
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    renderTabs();
    renderPolicies();
  } catch(err) {
    console.error("policy.html init error", err);
    document.getElementById("loading").innerHTML = "載入失敗：" + err.message;
  }
});

// ── 成員 Tab ──────────────────────────────────────────────
function renderTabs() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  const allCount = members.reduce((s, m) => s + (personDataMap[m.personId]?.policies?.length || 0), 0);

  let html = `<div class="member-tab ${currentTab==='all'?'active':''}" onclick="switchTab('all')">
    全家 <span class="tab-count">${allCount}</span></div>`;

  members.forEach(m => {
    const count = personDataMap[m.personId]?.policies?.length || 0;
    html += `<div class="member-tab ${currentTab===m.personId?'active':''}" onclick="switchTab('${m.personId}')">
      ${m.name} <span class="tab-count">${count}</span></div>`;
  });

  document.getElementById("member-tabs").innerHTML = html;
}

function switchTab(tab) {
  currentTab = tab;
  renderTabs();
  renderPolicies();
}

// ── 渲染保單列表 ──────────────────────────────────────────
// ── 新增：附約摺疊切換函數 ──────────────────────────────────────────
function toggleRiders(safeId) {
  const container = document.getElementById("riders-" + safeId);
  const icon = document.getElementById("icon-" + safeId);
  if (container.style.display === "none") {
    container.style.display = "block";
    if (icon) icon.style.transform = "rotate(90deg)";
  } else {
    container.style.display = "none";
    if (icon) icon.style.transform = "rotate(0deg)";
  }
}

// ── 替換：重新渲染保單列表 ──────────────────────────────────────────
// ── 替換：重新渲染保單列表 (加入主/附約數量統計) ──────────────────────────
function renderPolicies() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");

  // 1. 蒐集要顯示的保單
  let allPolicies = [];
  members.forEach(m => {
    const policies = personDataMap[m.personId]?.policies || [];
    policies.forEach(p => allPolicies.push({ ...p, _memberId: m.personId, _memberName: m.name }));
  });

  const filtered = currentTab === "all" ? allPolicies : allPolicies.filter(p => p._memberId === currentTab);

  if (filtered.length === 0) {
    document.getElementById("stats-row").innerHTML = `
      <div class="stat-card"><div class="stat-label">${currentTab==='all'?'全家保單':'本人保單'}</div><div class="stat-value">0 筆</div></div>
      <div class="stat-card"><div class="stat-label">年繳總保費</div><div class="stat-value">NT$ 0</div></div>
      <div class="stat-card"><div class="stat-label">月均保費</div><div class="stat-value">0</div></div>`;
    document.getElementById("policy-list").innerHTML =
      '<div class="empty-state">尚無保單，點下方「新增主約保單」開始輸入</div>';
    return;
  }

  // 2. 依保單號碼分組 (提早執行，以便計算主附約數量)
  const groups = {};
  filtered.forEach(p => {
    const key = p.policyNo || p.id;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  // 3. 計算統計數據：群組數=主約數，剩餘=附約數
  const mainCount = Object.keys(groups).length;
  const riderCount = filtered.length - mainCount;
  const totalTWD = filtered.filter(p => p.status === "有效")
  .reduce((s, p) => {
    // 強制轉為數字，如果轉不了就視為 0
    const val = Number(p.premiumTWD) || 0; 
    return s + val;
  }, 0);

  // 4. 渲染統計卡片 (修改筆數顯示方式)
  document.getElementById("stats-row").innerHTML = `
    <div class="stat-card">
      <div class="stat-label">${currentTab==='all'?'全家保單':'本人保單'}</div>
      <div class="stat-value" style="font-size: 17px; color:#0C447C;">${mainCount}主 / ${riderCount}附</div>
    </div>
    <div class="stat-card"><div class="stat-label">年繳總保費</div><div class="stat-value">NT$ ${(totalTWD/10000).toFixed(1)}萬</div></div>
    <div class="stat-card"><div class="stat-label">月均保費</div><div class="stat-value">${Math.round(totalTWD/12).toLocaleString()}</div></div>`;

  // 5. 渲染保單列表 (維持主附約摺疊邏輯)
  let html = "";
  Object.entries(groups).forEach(([policyNo, rows]) => {
    const groupTotal = rows.reduce((s,p) => s+(p.premiumTWD||0), 0);
    const member = familyData.members.find(m => m.personId === rows[0]._memberId);

    // 判斷主約與附約
    let mainPol = rows.find(p => p.isMain === true);
    if (!mainPol) mainPol = rows[0]; // 向下相容舊資料
    const riders = rows.filter(p => p !== mainPol);

    // 產生安全 ID 用於 DOM 操作
    const safeId = policyNo.replace(/[^a-zA-Z0-9]/g, '') + "_" + Math.random().toString(36).substr(2, 5);

    // 渲染群組標題 (點擊可展開/收合附約)
    html += `<div class="policy-group">
      <div class="group-header" onclick="toggleRiders('${safeId}')" style="cursor:pointer; display:flex; align-items:center;">
        <span class="expand-icon" id="icon-${safeId}" style="margin-right:8px; font-size: 14px; transition:transform 0.2s; color:#999;">▶</span>
        <span class="policy-no-badge">${policyNo}</span>
        <span class="group-company" style="margin-left:8px;">${rows[0].company||'—'}</span>
        ${currentTab==='all' && member ? `<span class="group-member-badge" style="margin-left:8px;">${member.name}</span>` : ''}
        <span class="group-total">年繳 NT${groupTotal.toLocaleString()}</span>
      </div>`;

    // 單列渲染輔助函數
    const renderRow = (p, isMainNode) => {
      const catClass = "cat-" + (p.category||"");
      const statusClass = "status-" + (p.status||"有效");
      const isFx = p.currency && p.currency !== "TWD";
      const badge = isMainNode
        ? `<span style="font-size: 14px;font-weight:700;color:#fff;background:linear-gradient(90deg,#3B82F6,#7C3AED);padding:2px 6px;border-radius:5px;white-space:nowrap">主約</span>`
        : `<span style="font-size: 14px;font-weight:600;color:#6B7280;background:#F3F4F6;padding:2px 6px;border-radius:5px;white-space:nowrap">附約</span>`;

      // 保額（獨立欄位，右對齊，跟保費/狀態欄一致風格）
      const insuredStr = p.insuredAmount
        ? `<span style="color:#3B82F6;font-size: 15px;font-weight:500;white-space:nowrap">${p.insuredAmount} ${p.insuredAmountUnit||'萬元'}</span>`
        : '<span style="color:#D1D5DB">—</span>';

      const fxCell = '';

      return `<div class="policy-row" onclick="event.stopPropagation(); openForm('edit','${p._memberId}','${p.id}')">
        <div class="pr-cell pr-badge-cell">${badge}</div>
        <div class="pr-cell pr-cat-cell"><span class="cat-badge ${catClass}">${p.category||'—'}</span></div>
        <div class="pr-cell pr-name-cell" style="display:flex;align-items:center;min-width:0">
          <span style="font-size: 17px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.itemName||'—'}</span>
        </div>
        <div class="pr-cell pr-insured-cell">${insuredStr}</div>
        <div class="pr-cell pr-amount-cell" style="text-align:right;line-height:1.25">
          ${isFx
            ? `<div class="pr-amount">NT$${(p.premiumTWD||0).toLocaleString()}</div><div style="font-size:12px;color:#9CA3AF;font-weight:400">(${(p.premiumOrig||0).toLocaleString()} ${p.currency})</div>`
            : `<div class="pr-amount">${(p.premiumTWD||0).toLocaleString()}</div>`
          }
        </div>
        <div class="pr-cell pr-status-cell"><span class="status-badge ${statusClass}">${p.status||'有效'}</span></div>
        <div class="pr-chevron">›</div>
      </div>`;
    };

    // 渲染主約
    html += renderRow(mainPol, true);

    // 渲染附約區塊
    html += `<div class="riders-container" id="riders-${safeId}" style="display:block; background:#fafafa; border-top:1px solid #f0f0f0;">`;
    // 箭頭預設向下
    setTimeout(function(){ var ic=document.getElementById("icon-"+safeId); if(ic) ic.style.transform="rotate(90deg)"; }, 0);
    riders.forEach(r => {
      html += renderRow(r, false);
    });
    html += `<button class="add-rider-btn" onclick="event.stopPropagation(); openForm('rider','${rows[0]._memberId}','${policyNo}')"
      style="background:#EBF4FF; color:#378ADD; border:1.5px dashed #378ADD; font-weight:500; padding:10px;">
      ＋ 新增附約（保單號碼：${policyNo}）</button>`;
    html += `</div></div>`;
  });

  document.getElementById("policy-list").innerHTML = html;
}// ── 表單開啟 ─────────────────────────────────────────────
// ── 要保人選單：從家庭成員動態建立 ──────────────────────────
function buildOwnerOptions(selectedName) {
  const sel = document.getElementById("f-owner");
  if (!sel) return;
  // 收集所有成員（含受益人身份的人，要保人不限）
  const members = familyData ? familyData.members : [];
  let html = "";
  members.forEach(m => {
    const relation = m.relation || m.role || "";
    const label    = m.name + (relation ? "（" + relation + "）" : "");
    const selected = (m.name === selectedName) ? " selected" : "";
    html += `<option value="${m.name}"${selected}>${label}</option>`;
  });
  // 若 selectedName 不在成員名單（舊資料），加一個保留選項
  if (selectedName && !members.find(m => m.name === selectedName)) {
    html = `<option value="${selectedName}" selected>${selectedName}（舊資料）</option>` + html;
  }
  sel.innerHTML = html;
}

function openForm(mode, memberId, policyIdOrNo) {
  editingPolicy = null;
  editingPersonId = memberId || (currentTab !== "all" ? currentTab : (familyData && familyData.members ? familyData.members.find(m=>m.role==="primary")?.personId : null));

  // 重置表單
  ["f-policyno","f-item","f-start","f-payend","f-covend","f-premium","f-rate"].forEach(id => {
    document.getElementById(id).value = "";
  });
  ["f-start-hint","f-payend-hint","f-covend-hint"].forEach(id => {
    document.getElementById(id).textContent = "";
  });
  document.getElementById("f-cat").value = "";
  document.getElementById("f-company-search").value = "";
  document.getElementById("f-company").value = "";
  // 要保人：預設為當前被保險人
  const currentMember = familyData && familyData.members.find(m => m.personId === memberId);
  buildOwnerOptions(currentMember ? currentMember.name : "");
  document.getElementById("f-status").value = "有效";
  document.getElementById("f-paymode").value = "年繳";
  document.getElementById("f-currency").value = "TWD";
  document.getElementById("f-amount").value = "";
  document.getElementById("f-amount-unit").value = "萬元";
  document.getElementById("f-amount-unit-custom").style.display = "none";
  document.getElementById("f-amount-unit-custom").value = "";
  document.getElementById("twd-display").style.display = "none";
  document.getElementById("form-error").style.display = "none";
  document.getElementById("delete-btn").style.display = "none";
  document.getElementById("company-list").style.display = "none";
  document.getElementById("f-ismain").value = "true";
  toggleFx();

  // 渲染被保人選擇
  renderMemberSelector(editingPersonId);

  if (mode === "edit") {
    // 找到要編輯的保單
    const person = personDataMap[memberId];
    const policy = person?.policies?.find(p => p.id === policyIdOrNo);
    if (!policy) return;

    editingPolicy = policy;
    document.getElementById("form-title").textContent = "編輯保單";
    document.getElementById("delete-btn").style.display = "block";

    document.getElementById("f-policyno").value  = policy.policyNo || "";
    document.getElementById("f-cat").value       = policy.category || "";
    document.getElementById("f-company-search").value = policy.company || "";
    document.getElementById("f-company").value   = policy.company || "";
    buildOwnerOptions(policy.owner || "");
    document.getElementById("f-status").value    = policy.status || "有效";
    document.getElementById("f-item").value      = policy.itemName || "";
    document.getElementById("f-amount").value = policy.insuredAmount || "";
    document.getElementById("f-ismain").value = (policy.isMain !== false) ? "true" : "false";
    var savedUnit = policy.insuredAmountUnit || "萬元";
    var unitOptions = ["萬元","元","計劃","型","份"];
    var unitSel = document.getElementById("f-amount-unit");
    var customEl = document.getElementById("f-amount-unit-custom");
    if (unitOptions.includes(savedUnit)) {
      unitSel.value = savedUnit;
      customEl.style.display = "none";
    } else {
      unitSel.value = "custom";
      customEl.value = savedUnit;
      customEl.style.display = "block";
    }
    document.getElementById("f-start").value     = policy.startDateRaw || "";
    document.getElementById("f-payend").value    = policy.payEndRaw || "";
    document.getElementById("f-covend").value    = policy.covEndRaw || "";
    document.getElementById("f-paymode").value   = policy.payMode || "年繳";
    document.getElementById("f-currency").value  = policy.currency || "TWD";
    document.getElementById("f-premium").value   = policy.premiumOrig || "";
    document.getElementById("f-rate").value      = policy.exchangeRate || "";

    if (policy.startDateRaw)  parseDate("f-start","f-start-hint");
    if (policy.payEndRaw)     parseDate("f-payend","f-payend-hint");
    if (policy.covEndRaw)     parseDate("f-covend","f-covend-hint");
    toggleFx();
    calcTWD();

  } else if (mode === "rider") {
    document.getElementById("form-title").textContent = "新增附約（保單號碼：" + policyIdOrNo + "）";
    document.getElementById("f-policyno").value = policyIdOrNo;
    document.getElementById("f-ismain").value = "false";

    // 自動帶入主約的保險公司
    const riderPerson = personDataMap[editingPersonId];
    const masterPols = (riderPerson?.policies || []).filter(p => p.policyNo === policyIdOrNo);
    if (masterPols.length > 0) {
      const masterCompany = masterPols[0].company || "";
      document.getElementById("f-company-search").value = masterCompany;
      document.getElementById("f-company").value = masterCompany;
    }
  } else {
    document.getElementById("form-title").textContent = "新增主約保單";
  }

  document.getElementById("form-modal").classList.add("active");
}

function closeForm() {
  document.getElementById("form-modal").classList.remove("active");
  document.getElementById("company-list").style.display = "none";
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("form-modal")) closeForm();
}

// ── 被保人選擇渲染 ────────────────────────────────────────
function renderMemberSelector(selectedId) {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  const html = members.map(m => `
    <div class="member-sel-item ${editingPersonId === m.personId ? 'active' : ''}"
         onclick="selectFormMember('${m.personId}')">
      <div class="member-sel-avatar">${m.name[0]}</div>
      <div>
        <div class="member-sel-name">${m.name}</div>
        <div class="member-sel-rel">${m.relation || ''}</div>
      </div>
    </div>`).join("");
  document.getElementById("member-selector").innerHTML = html;
}

function selectFormMember(personId) {
  editingPersonId = personId;
  renderMemberSelector(personId);
}

// ── 保險公司搜尋 ──────────────────────────────────────────
function showCompanyList() {
  filterCompany(document.getElementById("f-company-search").value);
}

function filterCompany(q) {
  const filtered = q ? COMPANIES.filter(c => c.includes(q)) : COMPANIES;
  const list = document.getElementById("company-list");
  list.style.display = "block";
  list.innerHTML = filtered.map(c =>
    `<div onclick="pickCompany('${c}')" style="padding:8px 12px;font-size: 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;"
     onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background=''">${c}</div>`
  ).join("") || `<div style="padding:8px 12px;font-size: 14px;color:#aaa">找不到結果</div>`;
}

function pickCompany(name) {
  document.getElementById("f-company-search").value = name;
  document.getElementById("f-company").value = name;
  document.getElementById("company-list").style.display = "none";
  
  // 【新增邏輯】如果是富邦人壽，啟動背景預載入
  if (name === "富邦人壽") {
    // 每次點選都檢查，如果快取是空的才載入，避免重複呼叫 API
    if (cachedFubonProducts.length === 0) {
      preloadFubonProducts();
    }
  }
}
  
// ═══════════════════════════════════════════════════════
//  富邦人壽商品庫：預載入與模糊搜尋邏輯
// ═══════════════════════════════════════════════════════

// 1. 預載入函式 (向 API1 請求資料)
async function preloadFubonProducts() {
  if (isFubonProductsLoading) return;
  isFubonProductsLoading = true;
  
  const itemInput = document.getElementById("f-item");
  itemInput.placeholder = "商品庫載入中，請稍候...";
  
  try {
    // 呼叫 API1，action 指定為 getFubonProducts
    const response = await callGAS("getFubonProducts", {});
    
    if (response && response.status === "ok" && response.data) {
      cachedFubonProducts = response.data;
      itemInput.placeholder = "輸入關鍵字搜尋，如：樂溢 或 XTY";
    } else {
      console.warn("載入富邦商品失敗或回傳格式不符", response);
      itemInput.placeholder = "載入失敗，請直接輸入商品全名";
    }
  } catch (err) {
    console.error("API 請求錯誤", err);
    itemInput.placeholder = "請直接輸入商品全名";
  } finally {
    isFubonProductsLoading = false;
  }
}

// 2. 當使用者在保險項目名稱輸入文字時觸發 (記憶體高速檢索)
function filterFubonProducts(q) {
  const company = document.getElementById("f-company").value || document.getElementById("f-company-search").value.trim();
  const list = document.getElementById("product-list");
  
  // 限制條件：只有選取「富邦人壽」且有輸入文字時才作動
  if (company !== "富邦人壽" || !q.trim()) {
    list.style.display = "none";
    return;
  }

  // 防呆：如果打字太快，資料還在下載
  if (isFubonProductsLoading) {
    list.innerHTML = `<div style="padding:10px 12px; font-size: 14px; color:#378ADD; text-align:left;">商品庫正在下載中，請稍候幾秒...</div>`;
    list.style.display = "block";
    return;
  }

  // 防呆：如果下載失敗或還沒開始下載
  if (cachedFubonProducts.length === 0) {
     return; // 靜默返回，讓使用者自己打字
  }

  // 將輸入的關鍵字依空格拆分 (例如輸入 "安泰 LPL")
  const keywords = q.toLowerCase().split(/\s+/).filter(k => k.length > 0);
  
  // 從本地快取陣列中過濾 (毫秒級運算)
  const filtered = cachedFubonProducts.filter(product => {
    const productNameLower = product.toLowerCase();
    // 必須符合每一個拆分後的關鍵字 (AND 邏輯)
    return keywords.every(kw => productNameLower.includes(kw));
  });

  // 渲染下拉選單
  if (filtered.length > 0) {
    list.style.display = "block";
    list.innerHTML = filtered.map(prod => `
      <div onclick="pickFubonProduct('${prod}')" 
           style="padding:10px 12px; font-size: 16px; cursor:pointer; border-bottom:1px solid #f5f5f5; text-align:left;"
           onmouseover="this.style.background='#f5f5f5'" 
           onmouseout="this.style.background=''">
        ${prod}
      </div>
    `).join("");
  } else {
    list.innerHTML = `<div style="padding:10px 12px; font-size: 14px; color:#aaa; text-align:left;">找不到相關商品，請檢查關鍵字或手動輸入</div>`;
    list.style.display = "block";
  }
}

// ── 日期快速解析 ──────────────────────────────────────────
function parseDate(inputId, hintId) {
  const val = document.getElementById(inputId).value.replace(/\D/g,"");
  const hint = document.getElementById(hintId);
  if (!val) { hint.textContent = ""; return; }
  if (val.length === 7) {
    const y=parseInt(val.slice(0,3)), m=parseInt(val.slice(3,5)), d=parseInt(val.slice(5,7));
    if (m>=1&&m<=12&&d>=1&&d<=31) { hint.textContent = y+"年"+m+"月"+d+"日"; return; }
  }
  if (val.length === 6) {
    const y=parseInt(val.slice(0,2)), m=parseInt(val.slice(2,4)), d=parseInt(val.slice(4,6));
    if (m>=1&&m<=12&&d>=1&&d<=31) { hint.textContent = y+"年"+m+"月"+d+"日"; return; }
  }
  hint.textContent = "";
}

// 日期字串轉西元
function rocToWestern(raw) {
  if (!raw) return null;
  const d = raw.replace(/\D/g,"");
  if (d.length === 7) return (parseInt(d.slice(0,3))+1911) + "-" + d.slice(3,5) + "-" + d.slice(5,7);
  if (d.length === 6) return (parseInt(d.slice(0,2))+1911) + "-" + d.slice(2,4) + "-" + d.slice(4,6);
  return null;
}

// ── 年繳台幣換算 ──────────────────────────────────────────
function calcTWD() {
  const currency = document.getElementById("f-currency").value;
  const premium  = parseFloat(document.getElementById("f-premium").value) || 0;
  const rate     = parseFloat(document.getElementById("f-rate").value) || 0;
  const display  = document.getElementById("twd-display");
  const valEl    = document.getElementById("twd-value");
  const calcEl   = document.getElementById("twd-calc");

  if (!premium) { display.style.display = "none"; return; }
  display.style.display = "flex";

  if (currency === "TWD") {
    valEl.textContent = "NT$ " + premium.toLocaleString();
    calcEl.textContent = "";
  } else {
    if (!rate) { valEl.textContent = "請填入匯率"; calcEl.textContent = ""; return; }
    const twd = Math.round(premium * rate);
    valEl.textContent = "NT$ " + twd.toLocaleString();
    calcEl.textContent = premium.toLocaleString() + " " + currency + " × " + rate;
  }
}

// ── 儲存保單 ─────────────────────────────────────────────
async function savePolicy() {
  const policyNo = document.getElementById("f-policyno").value.trim();
  const cat      = document.getElementById("f-cat").value;
  const company  = document.getElementById("f-company").value || document.getElementById("f-company-search").value.trim();
  const item     = document.getElementById("f-item").value.trim();

  const _currency = document.getElementById("f-currency").value;
  const _rate     = parseFloat(document.getElementById("f-rate").value) || 0;
  if (!policyNo || !cat || !company) {
    const err = document.getElementById("form-error");
    err.textContent = "請填寫保單號碼、類別、保險公司";
    err.style.display = "block";
    return;
  }
  // 外幣保單：匯率必填，避免台幣換算為 0 或錯誤值
  if (_currency !== "TWD" && !_rate) {
    const err = document.getElementById("form-error");
    err.textContent = "外幣保單請填寫匯率（如 USD 填 31.5），否則台幣年繳無法正確計算";
    err.style.display = "block";
    document.getElementById("f-rate").focus();
    return;
  }

  document.getElementById("form-error").style.display = "none";
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "儲存中…";

  const currency = document.getElementById("f-currency").value;
  const premium  = parseFloat(document.getElementById("f-premium").value) || 0;
  const rate     = parseFloat(document.getElementById("f-rate").value) || null;
  const premiumTWD = currency === "TWD" ? premium : (rate ? Math.round(premium * rate) : 0);

  const startRaw  = document.getElementById("f-start").value.trim();
  const payEndRaw = document.getElementById("f-payend").value.trim();
  const covEndRaw = document.getElementById("f-covend").value.trim();

  const policy = {
    id:          editingPolicy ? editingPolicy.id : "pol_" + Date.now(),
    isMain:      document.getElementById("f-ismain").value === "true",
    policyNo,
    category:    cat,
    company,
    owner:       document.getElementById("f-owner").value,
    itemName:    item,
    insuredAmount:     document.getElementById("f-amount").value.trim() || null,
    insuredAmountUnit: (function(){
      var u = document.getElementById("f-amount-unit").value;
      if (u === "custom") return document.getElementById("f-amount-unit-custom").value.trim() || "萬元";
      return u;
    })(),
    startDateRaw:  startRaw,
    payEndRaw,
    covEndRaw,
    startDate:   rocToWestern(startRaw),
    payEndDate:  rocToWestern(payEndRaw),
    covEndDate:  rocToWestern(covEndRaw),
    payMode:     document.getElementById("f-paymode").value,
    currency,
    exchangeRate: rate,
    premiumOrig: Number(premium) || 0, 
    premiumTWD:  Number(premiumTWD) || 0,
    status:      document.getElementById("f-status").value,
    updatedAt:   new Date().toISOString(),
  };

  try {
    const person = personDataMap[editingPersonId];
    if (!person) throw new Error("找不到被保人資料");

    if (editingPolicy) {
      // 編輯：替換
      const idx = person.policies.findIndex(p => p.id === editingPolicy.id);
      if (idx >= 0) person.policies[idx] = policy;
      else person.policies.push(policy);
    } else {
      // 新增
      person.policies.push(policy);
    }

    person.updatedAt = new Date().toISOString();

    const member = familyData.members.find(m => m.personId === editingPersonId);
    const saveResult = await callGAS("saveFile", {
      email: currentUser.email,
      fileType: "persons",
      fileId: editingPersonId,
      fileName: member.name + "_" + editingPersonId + ".json",
      content: person,
    });

    // ── 明確檢查回傳值，GAS 回傳 error 時要報錯 ──
    if (!saveResult || saveResult.status === "error") {
      throw new Error(
        (saveResult && saveResult.message) ||
        "Google Drive 寫入失敗，請確認網路連線後再試"
      );
    }

    // 確實寫入成功後才清快取與關閉表單
    if (window.NBS_NAV && typeof NBS_NAV.invalidateBundleCache === 'function') {
      NBS_NAV.invalidateBundleCache();
    } else {
      const _fn = localStorage.getItem('nbs_current_family');
      if (_fn) sessionStorage.removeItem('nbs_bundle_' + _fn);
    }

    closeForm();
    renderTabs();
    renderPolicies();

    // 若是新增主約，詢問是否繼續新增附約
    if (!editingPolicy && policy.isMain) {
      const savedPolicyNo = policy.policyNo;
      const savedMemberId = editingPersonId;
      setTimeout(function() {
        if (confirm("主約已儲存！\n\n是否立即在「" + savedPolicyNo + "」下新增附約？")) {
          openForm("rider", savedMemberId, savedPolicyNo);
        }
      }, 150);
    }

  } catch(e) {
    const errEl = document.getElementById("form-error");
    errEl.textContent = "⚠️ " + (e.message || "儲存失敗，請重試");
    errEl.style.display = "block";
    errEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    console.error("[savePolicy]", e);
  } finally {
    btn.disabled = false;
    btn.textContent = "儲存";
  }
}

//  AI 文字解析與自動填表邏輯

async function analyzePolicyText() {
  const rawText = document.getElementById("ai-raw-text").value.trim();
  const msgEl = document.getElementById("ai-parse-msg");
  const btn = document.getElementById("ai-parse-btn");

  if (!rawText) {
    msgEl.textContent = "請先貼上保單文字！";
    msgEl.style.display = "block";
    return;
  }

  // UI 狀態：處理中
  msgEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "⏳ AI 正在深度解析中，請稍候...";
  btn.style.background = "#ccc";

  try {
    // 呼叫 API1 進行解析
    const response = await callGAS("parsePolicyText", { text: rawText });

    if (response && response.status === "ok" && response.data) {
      const data = response.data;
      
      // 成功後，開始自動填入下方表單
      if (data.policyNo) document.getElementById("f-policyno").value = data.policyNo;
      if (data.company) {
        document.getElementById("f-company").value = data.company;
        document.getElementById("f-company-search").value = data.company;
      }
      if (data.itemName) document.getElementById("f-item").value = data.itemName;
      if (data.category) document.getElementById("f-cat").value = data.category;
      if (data.amount) document.getElementById("f-amount").value = data.amount;
      if (data.payMode) document.getElementById("f-paymode").value = data.payMode;
      if (data.status) document.getElementById("f-status").value = data.status;

      // UX 優化：變更按鈕顏色提示成功
      btn.textContent = "✅ 分析完成！請檢查下方欄位";
      btn.style.background = "#27AE8F";
      
      // 3秒後恢復按鈕原狀
      setTimeout(() => {
        btn.textContent = "✨ 執行分析並自動填表";
        btn.style.background = "#378ADD";
        btn.disabled = false;
      }, 3000);

    } else {
      throw new Error(response.message || "解析回傳格式異常");
    }
  } catch (err) {
    console.error("AI 分析失敗", err);
    msgEl.textContent = "❌ 解析失敗：" + err.message;
    msgEl.style.display = "block";
    btn.textContent = "✨ 重新執行分析";
    btn.style.background = "#378ADD";
    btn.disabled = false;
  }
}

function toRoc(dateStr) {
  if (!dateStr) return "—";
  const d = new Date(dateStr);
  if (isNaN(d)) return "—";
  return (d.getFullYear()-1911)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}

function goBack() { window.location.href = "family.html"; }

function callGAS(action, params) {
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === 'function') {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error('nav.js 未載入'));
}

// ═══════════════════════════════════════════════════════
//  PDF 上傳、萃取文字、並自動呼叫 API1 AI 解析
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  未來 PDF 終極版：支援多檔案疊加、主附約整批合併、自動存檔
// ═══════════════════════════════════════════════════════
async function handlePDFUpload() {
  const fileInput = document.getElementById('pdf-upload');
  const msgEl = document.getElementById("ai-parse-msg");
  const btn = document.getElementById("ai-parse-btn");

  const file = fileInput.files[0];
  btn.disabled = true;
  msgEl.style.display = "none";

  try {
    let aiResponse;

    // --- 【新增：判斷並執行解析】 ---
    if (file.type.startsWith("image/")) {
      btn.textContent = "🖼️ 正在處理影像...";
      // 轉為 Base64
      const base64Data = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });
      // 呼叫 API1 新增的圖片解析端點
      aiResponse = await callGAS("parsePolicyImage", { image: base64Data });
    } else {
      btn.textContent = "📄 正在本機萃取 PDF 文字...";
      // 原有的 PDF 解析
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
      let fullText = "";
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        fullText += textContent.items.map(item => item.str).join(" ") + "\n";
      }
      aiResponse = await callGAS("parsePolicyText", { text: fullText });
    }
    // --- 【結束】 ---

    btn.textContent = "🤖 文字萃取成功！正在呼叫 AI 進行多檔欄位縫合...";
    
    // 2. 呼叫 API1 進行智慧陣列解析 (使用新版 Schema 映射 Prompt)
    const response = await callGAS("parsePolicyText", { text: fullText });
    console.log("PDF 萃取出的純文字：", fullText);
    console.log("AI 回傳的原始 JSON：", response);
    
    if (!response || response.status !== "ok" || !response.data) {
      throw new Error(response.message || "AI 解析回傳異常或格式不符");
    }

    // 🌟 3. 核心智慧疊加邏輯 (Upsert)
    const aiPolicies = response.data; // 這是 AI 回傳的保單/附約陣列
    const person = personDataMap[editingPersonId || currentPersonId];
    if (!person) throw new Error("找不到目前被保險人資料空間");
    if (!person.policies) person.policies = [];

    let updateCount = 0;
    let insertCount = 0;

    // ... 在 handlePDFUpload 的 aiPolicies.forEach 迴圈中 ...

    aiPolicies.forEach(aiPol => {
      const existingIdx = person.policies.findIndex(p => 
        p.policyNo === aiPol.policyNo && p.itemName === aiPol.itemName
      );

      if (existingIdx >= 0) {
        // A. 找到重複資料：進行欄位智慧融合 (Merge)
        const oldPol = person.policies[existingIdx];
        // --- ⬇️ 這裡加入受益人格式轉換 ---
    if (aiPol.beneficiary) {
        if (aiPol.beneficiary.death && Array.isArray(aiPol.beneficiary.death)) {
            // 將陣列轉為 benef.html 可讀的格式
            const deathText = aiPol.beneficiary.death
                .map(b => `${b.rank ? b.rank+'：' : ''}${b.name}(${b.relation})`)
                .join('\n');
            oldPol.beneficiaryDeathText = deathText; // 直接更新到舊物件
        }
        // 若有生存金或滿期金，也比照辦理...
    }
        const mergedCoverage = Object.assign({}, oldPol.coverage || {}, aiPol.coverage || {});
        
        person.policies[existingIdx] = {
          ...oldPol,
          id: oldPol.id, 
          isMain: aiPol.isMain !== null ? aiPol.isMain : oldPol.isMain,
          category: aiPol.category || oldPol.category,
          amount: aiPol.amount || oldPol.amount,
          // 👇 新增這行：處理單位
          insuredAmountUnit: aiPol.amountUnit || oldPol.insuredAmountUnit || "萬元", 
          payMode: aiPol.payMode || oldPol.payMode,
          status: aiPol.status || oldPol.status,
          startDateRaw: aiPol.startDate || oldPol.startDateRaw,
          payEndRaw: aiPol.payEndDate || oldPol.payEndRaw,
          covEndRaw: aiPol.covEndDate || oldPol.covEndRaw,
          premiumOrig: aiPol.premium !== null ? aiPol.premium : oldPol.premiumOrig,
          premiumTWD: aiPol.premium !== null ? aiPol.premium : oldPol.premiumTWD,
          beneficiaryDeathText: aiPol.beneficiaryDeathText || oldPol.beneficiaryDeathText,
          beneficiaryLiveText: aiPol.beneficiaryLiveText || oldPol.beneficiaryLiveText,
          beneficiaryMaturityText: aiPol.beneficiaryMaturityText || oldPol.beneficiaryMaturityText,
          coverage: mergedCoverage,
          updatedAt: new Date().toISOString()
        };
        updateCount++;
      } else {
        // B. 沒找到資料：建立全新識別碼並存入 (Insert)
        person.policies.push({
          id: "pol_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
          isMain: aiPol.isMain,
          policyNo: aiPol.policyNo,
          company: aiPol.company || "富邦人壽",
          itemName: aiPol.itemName,
          category: aiPol.category,
          insuredAmount: aiPol.amount,
          // 👇 新增這行：處理單位
          insuredAmountUnit: aiPol.amountUnit || "萬元", 
          payMode: aiPol.payMode || "年繳",
          status: aiPol.status || "有效",
          startDateRaw: aiPol.startDate,
          payEndRaw: aiPol.payEndDate,
          covEndRaw: aiPol.covEndDate,
          premiumOrig: aiPol.premium,
          premiumTWD: aiPol.premium || 0,
          currency: "TWD",
          coverage: aiPol.coverage || {},
          updatedAt: new Date().toISOString()
        });
        insertCount++;
      }
    });

    // 4. 自動落地存檔至雲端 Drive
    btn.textContent = "💾 疊加成功！正在自動同步至雲端硬碟...";
    person.updatedAt = new Date().toISOString();
    
    const member = familyData.members.find(m => m.personId === (editingPersonId || currentPersonId));
    const saveResult = await callGAS("saveFile", {
      email: currentUser.email,
      fileType: "persons",
      fileId: (editingPersonId || currentPersonId),
      fileName: member.name + "_" + (editingPersonId || currentPersonId) + ".json",
      content: person,
    });

    if (!saveResult || saveResult.status === "error") throw new Error("雲端硬碟寫入失敗");

    // 5. 成功後清除快取、關閉 Modal 並重新渲染主頁面
    if (window.NBS_NAV && typeof NBS_NAV.invalidateBundleCache === 'function') {
      NBS_NAV.invalidateBundleCache();
    }
    
    btn.textContent = `✅ 存檔成功！新增 ${insertCount} 筆 / 更新 ${updateCount} 筆`;
    btn.style.background = "#27AE8F";
    
    setTimeout(() => {
      closeForm();
      renderTabs();
      renderPolicies();
      // 還原按鈕
      btn.textContent = "✨ 上傳並自動分析填表";
      btn.style.background = "#378ADD";
      btn.disabled = false;
    }, 1500);

  } catch (error) {
    console.error("解析流程錯誤：", error);
    msgEl.textContent = "❌ 處理失敗：" + error.message;
    msgEl.style.display = "block";
    btn.textContent = "✨ 重新上傳並自動分析";
    btn.style.background = "#378ADD";
    btn.disabled = false;
  }
}

// 支援兩種事件：nav.js 自行載入 或 family.html 先載入後通知
window.addEventListener("nbs_family_loaded", function(e) {
  if (typeof familyData !== "undefined" && familyData) return; // 已初始化
  var u = JSON.parse(localStorage.getItem("nbs_user") || "{}");
  window.dispatchEvent(new CustomEvent("nbs_nav_ready", {
    detail: {
      user:            u,
      familyData:      e.detail.familyData,
      currentPersonId: e.detail.familyData && e.detail.familyData.members &&
                       e.detail.familyData.members[0] && e.detail.familyData.members[0].personId,
      familyFileName:  e.detail.familyFileName
    }
  }));
});
NBS_NAV.init({ page: "policy" });
</script>
