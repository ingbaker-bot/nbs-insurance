<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>批次匯入保單 — NBS 雲端保單體檢</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;margin:0;padding:20px 16px 80px}
  .wrap{max-width:900px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .back{color:#666;text-decoration:none;font-size:14px}
  h1{font-size:20px;margin:0}
  .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .hint{font-size:13px;color:#888;line-height:1.7;margin-top:6px}
  .btn{padding:11px 20px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
  .btn-primary{background:#4338ca;color:#fff}
  .btn-primary:disabled{background:#c7c7d0;cursor:not-allowed}
  .btn-secondary{background:#f0f0f0;color:#444}
  input[type=file]{width:100%;padding:10px;border:1.5px dashed #cbd5e1;border-radius:9px;background:#fafafa}
  input[type=text]{width:100%;padding:8px 10px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:13px;font-family:inherit}
  .status-box{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px;line-height:1.6}
  .info{background:#E6F1FB;color:#0C447C}
  .warn{background:#FAEEDA;color:#633806}
  .error{background:#FCEBEB;color:#791F1F}

  .group-card{border:1.5px solid #e5e5e0;border-radius:12px;margin-bottom:14px;overflow:hidden}
  .group-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .group-head.new{background:#EAF3DE}
  .group-head.matched{background:#E6F1FB}
  .group-title{font-size:15px;font-weight:700}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin-left:6px}
  .tag-new{background:#27500A;color:#fff}
  .tag-matched{background:#0C447C;color:#fff}
  .member-list{padding:10px 18px;font-size:13px;color:#444;line-height:2}
  .member-list .rel{color:#999;font-size:12px}
  .policy-row{padding:8px 18px;border-top:1px solid #f0f0f0;font-size:13px}

  .field-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;margin:2px 4px 2px 0}

  .field-unmapped{background:#FAEEDA;color:#8A5A00}
  .agent-row{padding:10px 18px;background:#fafafa;display:flex;align-items:center;gap:8px;font-size:13px}

  .commit-status{font-size:12px}
  .conflict-row{padding:6px 18px;background:#FCEBEB;color:#791F1F;font-size:12px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a class="back" href="main.html">‹ 返回</a>
    <h1>📥 批次匯入保單</h1>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:8px">第一步：上傳保單資料 JSON</div>
    <input type="file" id="file-input" accept="application/json" />
    <div class="hint">
      支援富邦保單匯出的 JSON 格式。這個階段只會解析、分組、比對，<b>不會寫入任何資料</b>——
      確認分組跟給付項目對照結果都正確後，才會進到下一階段真正儲存。
    </div>
    <div style="margin-top:14px">
      <label style="font-size:13px;color:#555;display:block;margin-bottom:6px">這批資料要記錄成哪位業務員的？</label>
      <input type="text" id="agent-name-input" placeholder="例如：李丞敏" />
    </div>
    <div id="upload-status"></div>
    <button class="btn btn-primary" id="parse-btn" style="margin-top:14px" onclick="parseFile()" disabled>開始解析</button>
  </div>

  <div id="result-summary"></div>
  <div id="commit-all-bar"></div>
  <div id="result-groups"></div>
</div>

<script src="nav.js"></script>
<script>
var currentUser = null;
var parsedGroups = [];   // 分組後的結果
var existingFamilies = []; // 目前登入帳號既有的家庭索引

// ── 給付項目對照字典 ────────────────────────────────────
// 只放「已經確認過」的規則，沒把握的項目一律不猜、標記成「無法歸類」
// 讓業務員自己在預覽畫面複核，不會自動用備註文字猜頻率。
//
// 改用「引號內的核心名稱」當比對依據，不是整段文字完全比對——原始
// 資料裡，同一個核心給付名稱後面常常接不同的說明文字（例如「最高給付
// 天數為90天」「(每次傷害以一次為限)」），如果用整段文字完全比對，
// 只要說明文字稍微不同就比對不到。但有些核心名稱本身會重複出現、
// 靠後面的說明文字才能分辨是哪一種（例如「住院醫療保險金」有分
// 1~30日跟31日起兩種），這種情況額外用 dayRuleFn 檢查完整文字判斷。
var BENEFIT_MAPPING = {
  // 日額型住院（PHIB 這類保單常見）
  "住院醫療保險金": { dayRuleFn:function(full){
      if (/1[~～]30日/.test(full)) return "daily_room_1_30";
      if (/第?31日起/.test(full)) return "daily_room_31";
      return null;
    }},
  "住院日數1－30日": {key:"daily_room_1_30"},
  "住院日數31日起":  {key:"daily_room_31"},
  "加護病房保險金":  {key:"daily_icu"},
  "加護病房醫療保險金": { dayRuleFn:function(full, cat){ return cat==="意外險" ? "acc_icu" : "daily_icu"; }},
  "出院療養保險金":  {key:"daily_discharge"},
  "出院後療養保險金": {key:"daily_discharge"},
  "住院前後門診給付保險金": {key:"daily_opd"},
  "住院前後門診保險金":     {key:"daily_opd"},
  "急診保險金":      {key:"daily_er"},
  "緊急醫療轉送保險金": {key:"daily_transport"},
  "老年住院關懷保險金": {key:"daily_senior"},
  "燒燙傷中心醫療保險金": {key:"daily_burn"},
  "住院手術療養保險金":   {key:"surg_nurse"},
  "抗排斥藥物醫療保險金": {key:"daily_antirej"},
  "重大疾病保險金":       {key:"ci_major_lump"},

  // 意外險（AHI 這類保單）
  "傷害住院醫療保險金": {key:"acc_hosp"},
  "完全失能生活扶助保險金": {key:"dis_lump_illness", altKey:"dis_lump_accident"}, // 疾病/意外要看保單類型判斷
  "完全失能或最高失能等級": {key:"dis_lump_accident"},
  "特定事故保險金":         {key:"acc_special"},
  "重大燒燙傷":             {key:"acc_burn"},
  "意外傷害醫療保險金":     {key:"acc_opd"},

  // 手術醫療（PSI 這類保單）
  "手術醫療保險金":     {key:"surg_hosp"},
  "住院手術醫療保險金": {key:"surg_hosp"},
  "門診手術醫療保險金": { dayRuleFn:function(full, cat){ return cat==="意外險" ? null : "surg_opd"; }}, // 意外險的這個項目目前沒有對應欄位
  "特定處置項目保險金": {key:"surg_special"},

  // 住院醫療（實支實付，HSR 這類保單）
  "每日病房費用":       {key:"hosp_room"},
  "住院手術費用":       {key:"hosp_surgery"},
  "住院醫療費用":       {key:"hosp_misc"},

  // 癌症醫療（PCA 這類保單）
  // 「第1~90日」跟「第91日起」金額通常不同，但 coverage.html 的
  // can_hosp 只有一個欄位、沒有日額分段，兩個都對應同一個欄位會讓
  // 後寫入的直接覆蓋前一個、悄悄漏掉一筆金額。這裡只對應「第1~90日」
  // 這組（通常是主要參考金額），「第91日起」留在無法歸類、進備註，
  // 不會憑空消失，業務員可以自己決定要不要另外處理。
  "罹患癌症保險金":     {key:"can_first"},
  "繳費期間內確診":     {key:"can_first"},
  "第1~90日住院醫療":   {key:"can_hosp"},
  "癌症出院療養保險金": {key:"can_discharge"},
  "癌症手術醫療保險金": {key:"can_surgery"},
  "癌症門診醫療保險金": {key:"can_opd"},
  "癌症放射線治療保險金": {key:"can_radiation"},
  "癌症化學治療保險金":   {key:"can_chemo"},
  "癌症身故保險金":       {key:"can_death"},
};

// 給付項目文字常常帶括號備註，而且括號可能是巢狀的（例如「（接受住院手術
// 等級倍數為十倍（含）以上者）」），單純用一次 regex 去括號會漏掉外層；
// 這裡改成反覆去除「最內層」括號，直到沒有括號為止，同時把全形/半形
// 空白也一併清掉。
function cleanBenefitLabel_(raw) {
  if (!raw) return "";
  var s = raw.replace(/「|」/g, "");
  var prev;
  do {
    prev = s;
    s = s.replace(/（[^（）]*）/g, "").replace(/\([^()]*\)/g, "");
  } while (s !== prev);
  s = s.replace(/[\s\u3000]/g, ""); // 半形空白 + 全形空白都清掉
  return s.trim();
}

// 抓出「」引號內的核心給付名稱；沒有引號的話，就用清理過後的全文當
// 核心名稱（相容比較單純、沒有附加說明文字的情況）。
function extractCoreLabel_(raw) {
  if (!raw) return "";
  var m = raw.match(/「([^」]*)」/);
  var core = m ? m[1] : raw;
  return cleanBenefitLabel_(core);
}

function lookupBenefitMapping_(rawLabel, policyCategory) {
  var core = extractCoreLabel_(rawLabel);
  var rule = BENEFIT_MAPPING[core];
  if (!rule) return null;

  // dayRuleFn：核心名稱本身會重複出現、要看完整文字（例如日額區間、
  // 保單類別）才能判斷對應到哪個欄位；判斷不出來就回傳 null，一樣
  // 落入「無法歸類」讓業務員自己確認，不會硬猜一個可能錯的欄位。
  if (rule.dayRuleFn) {
    var fullCleaned = cleanBenefitLabel_(rawLabel);
    var key = rule.dayRuleFn(fullCleaned, policyCategory);
    if (!key) return null;
    return { key: key, needsReview: false, rawLabel: rawLabel };
  }

  var key = rule.key;
  var needsReview = false;
  if (rule.altKey) {
    needsReview = true;
    if (policyCategory && policyCategory.indexOf("意外") !== -1) key = rule.altKey;
  }
  return { key: key, needsReview: needsReview, rawLabel: rawLabel };
}

window.onload = function() {
  var saved = localStorage.getItem("nbs_user");
  if (!saved) { window.location.href = "index.html"; return; }
  currentUser = JSON.parse(saved);
  var isElite = !!(currentUser.isAdmin || currentUser.tier === "菁英");
  if (!isElite) {
    alert("批次匯入保單是菁英會員專屬功能，請聯繫管理員升級");
    window.location.href = "main.html";
    return;
  }
  document.getElementById("agent-name-input").value = currentUser.agentName || currentUser.name || "";

  document.getElementById("file-input").addEventListener("change", function(){
    document.getElementById("parse-btn").disabled = !this.files.length;
  });
};

function callGAS(action, params) {
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === "function") {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error("nav.js 未載入"));
}

function showUploadStatus(type, msg) {
  var el = document.getElementById("upload-status");
  el.innerHTML = '<div class="status-box ' + type + '">' + msg + '</div>';
}

// ── 第一步：讀檔＋解析 ──────────────────────────────────
function parseFile() {
  var fileInput = document.getElementById("file-input");
  var file = fileInput.files[0];
  if (!file) return;

  showUploadStatus("info", "讀取檔案中…");
  document.getElementById("parse-btn").disabled = true;

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var policies = data.policies || [];
      if (!policies.length) {
        showUploadStatus("warn", "這份檔案裡沒有讀到任何保單資料，請確認檔案內容。");
        document.getElementById("parse-btn").disabled = false;
        return;
      }
      showUploadStatus("info", "解析中，共 " + policies.length + " 份合約…");
      var normalized = [];
      policies.forEach(function(p){
        normalizeFubonContract_(p).forEach(function(rec){ normalized.push(rec); });
      });
      if (!normalized.length) {
        showUploadStatus("warn", "解析後沒有讀到任何保單項目，請確認檔案內容。");
        document.getElementById("parse-btn").disabled = false;
        return;
      }
      var groups = buildRelationshipGroups_(normalized);
      showUploadStatus("info", "分組完成，共 " + groups.length + " 組客戶，正在比對既有資料…");
      matchAgainstExisting_(groups).then(function(matchedGroups){
        parsedGroups = matchedGroups;
        showUploadStatus("ok", "解析完成：" + normalized.length + " 筆保單、" + groups.length + " 組客戶。請往下檢查分組與給付項目對照結果。");
        document.getElementById("parse-btn").disabled = false;
        renderResults_();
      }).catch(function(err){
        showUploadStatus("error", "比對既有資料時發生錯誤：" + err.message);
        document.getElementById("parse-btn").disabled = false;
      });
    } catch (err) {
      showUploadStatus("error", "這份檔案不是有效的 JSON，或格式跟預期不符：" + err.message);
      document.getElementById("parse-btn").disabled = false;
    }
  };
  reader.readAsText(file, "UTF-8");
}

// 有些商品的「保險項目」欄位，其實是一段原始說明文字（不是真正的商品
// 名稱），特徵是內容裡包含「」這個引號（因為在引用給付項目名稱）——
// 真正的商品名稱不會出現「」。這種項目的 _benefits，其實是屬於它前面
// 那筆「真商品名稱、但 _benefits 是空的」項目，是資料來源本身的錯位，
// 不是我們解析錯誤，這裡先掃過一遍把它們正確併回去。
function looksLikeBenefitTextRow_(itemName) {
  return !!itemName && itemName.indexOf("「") !== -1;
}

function mergeMisplacedBenefits_(items) {
  var merged = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var next = items[i+1];
    if ((!it._benefits || !it._benefits.length) && next && looksLikeBenefitTextRow_(next["保險項目"]) && next._benefits && next._benefits.length) {
      merged.push(Object.assign({}, it, { _benefits: next._benefits }));
      i++; // 跳過被併入的下一筆，不要讓它自己也變成一張假保單
    } else if (!looksLikeBenefitTextRow_(it["保險項目"])) {
      merged.push(it);
    }
    // 如果這筆本身就是「說明文字當名稱」但沒被前一筆合併吃掉（理論上
    // 不該發生，防呆用），就直接捨棄，不要讓它單獨變成一張怪名字的保單。
  }
  return merged;
}

// 有些合約的 sec03（保單基本資料）沒有結構化的 kvPairs，所有資料混在
// 一大段 rawText 純文字裡（又是另一種跟前兩次都不一樣的格式）。這裡
// 從純文字裡，用「找到某個欄位名稱，取它下一行當值」的方式，把要保人
// 資料跟身故受益人資料撈出來，當作 kvPairs 沒有資料時的備援。
// 主約在 sec05（保單項目金額）裡的「保險金額」欄位，實務上遇過跟
// sec03（保單基本資料）文字裡記載的金額對不上（sec05 顯示 0 元，
// sec03 卻正確寫著實際保額）——這是資料來源本身的落差，不是解析
// 邏輯的問題。sec03 這邊比較可靠，這裡額外從 rawText 抓一次當備援，
// 只用在主約（附約的保額本來就是各自獨立的「單位/計畫」，不會出現
// 在這裡）。
function parseMainItemAmountFromRawText_(rawText) {
  if (!rawText) return null;
  var lines = rawText.split("\n").map(function(l){ return l.trim(); });
  var idx = lines.indexOf("保險金額");
  if (idx === -1) return null;
  var raw = lines[idx+1] || "";
  return parseFubonPlanAmount_(raw);
}

function parseRawTextFallback_(rawText) {
  if (!rawText) return {};
  var lines = rawText.split("\n").map(function(l){ return l.trim(); });

  // 「要保人」跟「被保人」兩個區塊的欄位名稱幾乎一樣（姓名/身分證號碼/
  // 生日…），要先用這兩個字出現的位置把文字切開，只在「要保人」那段
  // 範圍內找，才不會誤抓到被保人的資料。
  var applicantIdx = rawText.indexOf("要保人");
  var insuredIdx = rawText.indexOf("被保人");
  var applicantBlock = applicantIdx !== -1 ? rawText.slice(applicantIdx, insuredIdx > applicantIdx ? insuredIdx : rawText.length) : "";
  var applicantLines = applicantBlock.split("\n").map(function(l){ return l.trim(); });

  function findInLines(blockLines, label) {
    var idx = blockLines.indexOf(label);
    if (idx === -1) return "";
    var v = blockLines[idx+1] || "";
    return (v === "---" || v === "----") ? "" : v;
  }

  // 身故受益人資料：標題行是「姓名  關係  人數」，下一行才是實際內容
  // （例如「邱鳳春 等人   配偶   2」），用 tab 分隔。
  var beneficiaryDeathText = "";
  var beneIdx = lines.indexOf("身故受益人資料");
  if (beneIdx !== -1 && lines[beneIdx+1] && lines[beneIdx+1].indexOf("姓名") !== -1) {
    var beneLine = lines[beneIdx+2] || "";
    if (beneLine && beneLine !== "--") beneficiaryDeathText = beneLine.replace(/\t+/g, "　").trim();
  }

  var suggestedAgent = "";
  var svcIdx = lines.indexOf("服務人員資料");
  if (svcIdx !== -1) suggestedAgent = lines[svcIdx+2] || "";

  return {
    applicantIdNumber: findInLines(applicantLines, "身分證號碼"),
    applicantBirth:    findInLines(applicantLines, "生日"),
    applicantPhone:    findInLines(applicantLines, "行動電話") || findInLines(applicantLines, "收費/聯絡電話"),
    applicantEmail:    findInLines(applicantLines, "電子信箱"),
    applicantAddress:  findInLines(applicantLines, "住所/戶籍地址") || findInLines(applicantLines, "收費地址"),
    beneficiaryDeathText: beneficiaryDeathText,
    suggestedAgent: suggestedAgent
  };
}

// 把富邦原始的一筆「合約」（可能包含 1 個主約 + 好幾個附約），拆成
// 系統裡各自獨立的保單記錄——回傳一個陣列，不是單一物件。
function normalizeFubonContract_(p) {
  try {
    var sec03Full = p.sec03_保單基本資料 || {};
    var sec03 = sec03Full.kvPairs || {};
    var applicantName = p.applicant || "";
    var insuredName   = p.insured || "";
    var relationship = sec03[applicantName] || sec03[insuredName] || (applicantName===insuredName ? "本人" : "");

    var applicantIdNumber, applicantBirth, applicantPhone, applicantEmail, applicantAddress, suggestedAgent, beneficiaryDeathText;

    if (Object.keys(sec03).length > 0) {
      // 這份合約有結構化的 kvPairs 可以直接用
      applicantIdNumber = sec03["身分證號碼"] || "";
      applicantBirth    = sec03["生日"] || "";
      applicantPhone    = sec03["行動電話"] || sec03["收費/聯絡電話"] || "";
      applicantEmail    = sec03["電子信箱"] || "";
      applicantAddress  = sec03["住所/戶籍地址"] || sec03["收費地址"] || "";
      suggestedAgent    = sec03["服務人員資料"] || "";
      beneficiaryDeathText = ""; // 目前已知的結構化格式裡還沒遇過含受益人資料的版本
    } else {
      // kvPairs 是空的，退回從 rawText 純文字裡解析
      var fallback = parseRawTextFallback_(sec03Full.rawText || "");
      applicantIdNumber = fallback.applicantIdNumber;
      applicantBirth    = fallback.applicantBirth;
      applicantPhone    = fallback.applicantPhone;
      applicantEmail    = fallback.applicantEmail;
      applicantAddress  = fallback.applicantAddress;
      suggestedAgent    = fallback.suggestedAgent;
      beneficiaryDeathText = fallback.beneficiaryDeathText;
    }

    var rawItems = (p.sec05_保險項目與金額 && p.sec05_保險項目與金額.items) || [];
    var items = mergeMisplacedBenefits_(rawItems);
    // 同一份合約底下，主約＋所有附約一律共用「合約號碼」本身，不要另外
    // 加序號——policy.html 是用完全相同的 policyNo 字串判斷「這幾張是
    // 不是同一組」，再靠 isMain 分辨誰是主約，加了序號反而讓每一項都變
    // 成自己一組，沒辦法正確摺疊顯示。
    //
    // ⚠️ 完整保單號碼＝policyNo＋"-"＋subNo（例如 A103489639-01），不是
    // 只有 policyNo 本身——這剛好也是既有資料本來就在用的號碼格式，
    // 兩邊要一致，比對既有保單、判斷「這張存不存在」才會準。
    var contractPolicyNo = p.policyNo || "";
    if (p.subNo) contractPolicyNo += "-" + p.subNo;

    return items.map(function(it){
      var category = guessCategoryFromProductName_(it["保險項目"] || "");
      var planAmount = parseFubonPlanAmount_(it["保險金額"] || "");
      // 主約的保額優先看 sec03 的 rawText（比較可靠），sec05 自己的數字
      // 當備援（例如 rawText 這次剛好沒有「保險金額」這一行時）。
      if (it._isMainItem) {
        var fromRawText = parseMainItemAmountFromRawText_(sec03Full.rawText || "");
        if (fromRawText && fromRawText.amount) planAmount = fromRawText;
      }
      var benefits = (it._benefits || []).map(function(b){
        return { rawLabel: b["給付項目"] || "", amount: parseFubonAmount_(b["金額"]), unit: b["單位"] || "" };
      });

      return {
        policyNo: contractPolicyNo,
        productCode: it._productCode || "", // 判斷「這個項目是否已存在」用這個，不要用 policyNo（現在是共用的）
        productName: it["保險項目"] || "",
        category: category,
        insuredAmount: planAmount.amount,
        insuredAmountUnit: planAmount.unit,
        isMain: !!it._isMainItem,
        status: it["契約狀態"] || p.status || "",
        payEndDate: it["繳費期滿日"] || "",
        covEndDate: it["保障期滿日"] || "",
        applicant: {
          name: applicantName, idNumber: applicantIdNumber, birthDate: applicantBirth,
          phone: applicantPhone, email: applicantEmail, address: applicantAddress
        },
        insured: { name: insuredName },
        relationship: relationship,
        suggestedAgent: suggestedAgent,
        // 只有主約才附身故受益人資料——附約通常「同主約」，不用各自重複填。
        beneficiaryDeathText: it._isMainItem ? beneficiaryDeathText : "",
        // 有些保單（例如定額手術這種按「單位」計算的商品）給付項目沒有
        // 直接寫具體金額，只有像「單位手術醫療保險金×6」這種公式說明
        // （放在 _notes，不是 _benefits），這種情況沒辦法自動算出正確
        // 數字，把原始說明文字保留下來，讓業務員自己對照保單條款填寫，
        // 不要讓這段資訊憑空消失。
        formulaNotes: (!benefits.length && it._notes && it._notes.length) ? it._notes : [],
        benefits: benefits,
        mappedBenefits: benefits.map(function(b){
          var m = lookupBenefitMapping_(b.rawLabel, category);
          return Object.assign({}, b, m ? { mappedKey: m.key, needsReview: m.needsReview } : { mappedKey: null, needsReview: false });
        })
      };
    });
  } catch (e) {
    console.error("解析合約失敗", e, p);
    return [];
  }
}

function parseFubonAmount_(raw) {
  if (!raw) return 0;
  var n = String(raw).replace(/[^\d.]/g, "");
  return parseFloat(n) || 0;
}

// 「保險金額」這個欄位格式很不一致——有的是純數字加單位（例如
// 「10.18 單位」「20.00單位」），有的數字前面還夾著文字描述（例如
// 「個人型 6 單位」），有的甚至完全沒有數字、只有計畫代號（例如
// 「計劃 B」）。抓「文字裡出現的第一個數字」當保額，其餘文字（扣掉
// 那個數字）當單位；完全沒有數字的，就把整段文字當單位、保額留空，
// 不要憑空生一個假數字出來。
function parseFubonPlanAmount_(raw) {
  if (!raw) return { amount: null, unit: "" };
  // 數字可能帶千分位逗號（例如「200,000.00」），先抓「數字＋逗號」
  // 整段，再把逗號去掉才轉數字，不然遇到逗號就會被切斷，抓成"200"
  // 而不是完整的 200000。
  var m = raw.match(/([\d,]*\d)(\.\d+)?/);
  if (m) {
    var numStr = (m[1] + (m[2]||"")).replace(/,/g, "");
    var amount = parseFloat(numStr);
    var unit = raw.replace(m[0], "").trim() || "單位";
    return { amount: amount, unit: unit };
  }
  return { amount: null, unit: raw.trim() };
}

function guessCategoryFromProductName_(name) {
  if (!name) return "";
  if (name.indexOf("意外") !== -1) return "意外險";
  if (name.indexOf("重大疾病") !== -1) return "重大疾病險";
  if (name.indexOf("癌症") !== -1) return "癌症醫療";
  if (name.indexOf("醫療") !== -1 || name.indexOf("健康") !== -1) return "醫療保障";
  if (name.indexOf("投資型") !== -1 || name.indexOf("變額") !== -1) return "投資型保險";
  if (name.indexOf("年金") !== -1) return "年金險";
  if (name.indexOf("壽險") !== -1 || name.indexOf("終身壽") !== -1) return "壽險保障";
  return "儲蓄險"; // 抓不到明確關鍵字，先歸類成儲蓄險，預覽畫面會標示請人工確認
}

// ── 用「要保人-被保險人關係」把保單分組成客戶／家庭 ─────────
function buildRelationshipGroups_(policies) {
  // 用簡單的 union-find：同一組裡的人只要透過任何一張保單的
  // 要保人/被保險人關係連在一起，就歸成同一組。
  var parent = {};
  function find(x){ if(parent[x]===undefined) parent[x]=x; if(parent[x]!==x) parent[x]=find(parent[x]); return parent[x]; }
  function union(a,b){ var ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }

  var personKey = {}; // name -> key（優先用身分證字號當 key，比姓名可靠）
  function keyOf(name, idNumber) {
    if (idNumber) return "ID:" + idNumber;
    if (personKey[name]) return personKey[name];
    var k = "NAME:" + name;
    personKey[name] = k;
    return k;
  }

  var personInfo = {}; // key -> {name, idNumber, relationship}
  policies.forEach(function(p){
    var appKey = keyOf(p.applicant.name, p.applicant.idNumber);
    var insKey = keyOf(p.insured.name, "");
    if (!personInfo[appKey]) personInfo[appKey] = { name: p.applicant.name, idNumber: p.applicant.idNumber, birthDate: p.applicant.birthDate, phone: p.applicant.phone, email: p.applicant.email, address: p.applicant.address };
    if (!personInfo[insKey]) personInfo[insKey] = { name: p.insured.name, idNumber: "" };
    union(appKey, insKey);
    p._appKey = appKey; p._insKey = insKey;
  });

  var groupsByRoot = {};
  Object.keys(personInfo).forEach(function(k){
    var root = find(k);
    if (!groupsByRoot[root]) groupsByRoot[root] = { members: {}, policies: [] };
    groupsByRoot[root].members[k] = personInfo[k];
  });
  policies.forEach(function(p){
    var root = find(p._appKey);
    groupsByRoot[root].policies.push(p);
  });

  return Object.keys(groupsByRoot).map(function(root){
    var g = groupsByRoot[root];
    var members = Object.keys(g.members).map(function(k){ return Object.assign({key:k}, g.members[k]); });
    // 把「有身分證字號、有出現過關係文字」的人排在前面，方便畫面上第一眼看到主要要保人
    members.sort(function(a,b){ return (b.idNumber?1:0) - (a.idNumber?1:0); });
    return { members: members, policies: g.policies, matched: null };
  });
}

// ── 比對既有客戶：抓目前登入帳號的家庭清單，用身分證字號/姓名比對 ──
function matchAgainstExisting_(groups) {
  return callGAS("listFamilies", {}).then(function(res){
    existingFamilies = (res && res.families) || [];
    // 逐組跟既有家庭比對：只要這組裡任何一個人的身分證字號或姓名，
    // 跟某個既有家庭的成員對得上，整組都算「併入」那個既有家庭
    // （即使組裡有些人是這個家庭裡沒出現過的新面孔）。
    var matchPromises = groups.map(function(g){
      return matchOneGroup_(g);
    });
    return Promise.all(matchPromises);
  });
}

function matchOneGroup_(group) {
  // 目前家庭索引只有成員「姓名」，沒有身分證字號（基於個資最小化原則，
  // 索引檔沒有存這個），先用姓名做初步篩選，抓出「可能是同一家」的
  // 候選家庭，再讀取候選家庭的完整資料比對身分證字號做最終確認。
  //
  // ⚠️ memberNames 這個索引欄位是後來才加的，只有「家庭資料被重新編輯
  // 存檔過一次」才會補上，很久沒動過的舊家庭，索引裡可能還是空的——
  // 只靠 memberNames 比對會找不到，把明明存在的既有客戶誤判成新客戶。
  // 這裡加一個不依賴這個索引欄位的備援：直接看候選人姓名，有沒有
  // 整個出現在家庭名稱裡（例如「楊宗煌」出現在「楊宗煌個人保單」
  // 這個家庭名稱裡），這個欄位從最一開始就存在，不受索引新舊影響。
  var candidateNames = group.members.map(function(m){ return m.name; });
  var candidates = existingFamilies.filter(function(f){
    var byMemberNames = (f.memberNames || []).some(function(n){ return candidateNames.indexOf(n) !== -1; });
    var byFamilyName = candidateNames.some(function(n){ return n && f.familyName && f.familyName.indexOf(n) !== -1; });
    return byMemberNames || byFamilyName;
  });
  if (!candidates.length) {
    group.matched = null;
    return Promise.resolve(group);
  }
  // 讀取候選家庭的完整資料，用身分證字號做最終比對（沒有身分證字號的人退回姓名比對）
  var readPromises = candidates.map(function(f){
    return callGAS("readFamilyBundle", { fileType:"families", fileName: f.fileName }).catch(function(){ return null; });
  });
  return Promise.all(readPromises).then(function(bundles){
    for (var i=0; i<bundles.length; i++) {
      var b = bundles[i];
      if (!b || b.status !== "ok") continue;
      var persons = b.persons || {};
      var matchedByIdOrName = group.members.some(function(m){
        return Object.keys(persons).some(function(pid){
          var prof = persons[pid].profile || {};
          // 身分證字號兩邊都有才比對號碼；只要姓名相同就算比對到，
          // 不再要求「匯入方一定沒有身分證字號」才會退回姓名比對——
          // 既有資料裡這個人本來就可能沒存過身分證字號，用「兩邊都要
          // 有號碼」當條件反而會比對不到。
          if (m.idNumber && prof.idNumber) return m.idNumber === prof.idNumber;
          return prof.name === m.name;
        });
      });
      if (matchedByIdOrName) {
        group.matched = { familyName: candidates[i].familyName, fileName: candidates[i].fileName };
        break;
      }
    }
    return group;
  });
}

// ── 渲染預覽結果 ──────────────────────────────────────────
function renderResults_() {
  var totalPolicies = parsedGroups.reduce(function(s,g){ return s + g.policies.length; }, 0);
  var newCount = parsedGroups.filter(function(g){ return !g.matched; }).length;
  var matchedCount = parsedGroups.length - newCount;

  document.getElementById("result-summary").innerHTML =
    '<div class="card">' +
      '<div style="font-weight:700;margin-bottom:6px">解析結果總覽</div>' +
      '<div style="font-size:13px;color:#555;line-height:1.9">' +
        '共 ' + parsedGroups.length + ' 組客戶（' + totalPolicies + ' 張保單）　' +
        '<span style="color:#27500A;font-weight:700">新客戶 ' + newCount + ' 組</span>　' +
        '<span style="color:#0C447C;font-weight:700">併入既有客戶 ' + matchedCount + ' 組</span>' +
      '</div>' +
      '<div class="hint">確認每組分組與給付項目對照結果都合理之後，可以逐組按「確認寫入」，或用下面「全部確認寫入」一次處理。</div>' +
    '</div>';

  document.getElementById("commit-all-bar").innerHTML =
    '<div class="card" style="display:flex;align-items:center;gap:12px">' +
      '<button class="btn btn-primary" onclick="commitAll_()">全部確認寫入</button>' +
      '<div id="commit-all-status" style="font-size:13px;color:#555"></div>' +
    '</div>';

  var html = parsedGroups.map(function(g, idx){
    return renderGroupCard_(g, idx);
  }).join("");
  document.getElementById("result-groups").innerHTML = html;
}

function renderGroupCard_(g, idx) {
  var isNew = !g.matched;
  var headClass = isNew ? "new" : "matched";
  var tagHtml = isNew
    ? '<span class="tag tag-new">新客戶</span>'
    : '<span class="tag tag-matched">併入既有：' + g.matched.familyName + '</span>';

  var mainMember = g.members[0];
  var memberListHtml = g.members.map(function(m, i){
    var relText = i === 0 ? "主要聯絡人" : (m.relationship || "關係待確認");
    return '<div>' + m.name + (m.idNumber ? '（' + m.idNumber + '）' : '（無身分證字號）') +
      ' <span class="rel">' + relText + '</span></div>';
  }).join("");

  var policiesHtml = g.policies.map(function(p){
    var fieldsHtml = p.mappedBenefits.map(function(b){
      if (b.mappedKey) {
        var cls = b.needsReview ? "field-unmapped" : "field-mapped";
        var label = b.rawLabel + " → " + b.mappedKey + (b.needsReview ? "（請確認疾病/意外）" : "");
        return '<span class="field-tag ' + cls + '">' + label + '</span>';
      }
      return '<span class="field-tag field-unmapped">' + b.rawLabel + ' → 無法歸類，需人工確認</span>';
    }).join("");
    var formulaHtml = (p.formulaNotes && p.formulaNotes.length)
      ? '<div style="margin-top:6px;padding:8px 10px;background:#FCEBEB;border-radius:6px;font-size:12px;color:#791F1F;line-height:1.6">' +
          '⚠️ 這張保單按「單位」計算，原始資料只有公式說明、沒有具體金額，匯入後會整段存進備註，需要自行對照保單條款填寫：<br/>' +
          p.formulaNotes.join('<br/>') +
        '</div>'
      : '';
    return '<div class="policy-row">' +
      '<div class="policy-head"><span>' + p.productName + '（' + p.policyNo + '）</span><span style="color:#888;font-weight:400">' + p.category + '｜' + p.status +
        (p.insuredAmount !== null ? '｜保額 ' + p.insuredAmount + ' ' + p.insuredAmountUnit : (p.insuredAmountUnit ? '｜' + p.insuredAmountUnit : '')) +
      '</span></div>' +
      '<div style="margin-top:6px">' + fieldsHtml + '</div>' +
      formulaHtml +
    '</div>';
  }).join("");

  return '<div class="group-card" id="group-card-' + idx + '">' +
    '<div class="group-head ' + headClass + '">' +
      '<div class="group-title">' + mainMember.name + (g.members.length>1 ? '　等 ' + g.members.length + ' 人' : '') + tagHtml + '</div>' +
    '</div>' +
    '<div class="member-list">' + memberListHtml + '</div>' +
    policiesHtml +
    '<div class="agent-row">這批保單記錄為業務員：<input type="text" value="' + (document.getElementById("agent-name-input").value || "") + '" onchange="parsedGroups[' + idx + '].agentName=this.value" /></div>' +
    '<div class="commit-row">' +
      '<button class="btn-commit" id="commit-btn-' + idx + '" onclick="commitGroup_(' + idx + ')">確認寫入這組</button>' +
      '<span class="commit-status" id="commit-status-' + idx + '"></span>' +
    '</div>' +
  '</div>';
}

// ═══════════════════════════════════════════════════════
//  第二步：實際寫入資料
// ═══════════════════════════════════════════════════════
function todayISO_() {
  return new Date().toISOString().slice(0,10);
}

function buildPersonData_(member, personId, analysisDate) {
  return {
    version: "3.0.0",
    personId: personId,
    agentId: currentUser.email,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    profile: {
      name: member.name,
      birthDate: null, // 匯入資料裡通常只有要保人才有生日，被保險人生日這階段先留空，事後手動補
      gender: "male",
      idNumber: member.idNumber || null,
      analysisDate: analysisDate,
      note: "",
    },
    policies: [],
    coverage: {},
    savings: [],
    beneficiaryTemplates: [],
    medicalSummary: {},
    settings: { savingsDisplayYears: 20, notes: "" },
  };
}

// 把一筆解析後的保單，轉成 person.policies[] 要用的格式，coverage 只
// 塞「已經對照成功」的欄位，「無法歸類」的項目改存進 note 備註，不會
// 憑空消失，方便業務員事後自己補。
function buildPolicyRecord_(p) {
  var coverage = {};
  var unmatchedNotes = [];
  p.mappedBenefits.forEach(function(b){
    if (b.mappedKey) {
      coverage[b.mappedKey] = b.amount;
    } else if (b.rawLabel && b.rawLabel !== "身故") {
      unmatchedNotes.push(b.rawLabel + "：" + b.amount + b.unit);
    }
  });
  if (p.formulaNotes && p.formulaNotes.length) {
    unmatchedNotes.push("（此保單給付按「單位」計算，原始資料只有公式說明、沒有具體金額，請自行對照保單條款填寫）");
    p.formulaNotes.forEach(function(n){ unmatchedNotes.push(n); });
  }
  var result = {
    id: "pol_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    policyNo: p.policyNo,
    productCode: p.productCode,
    isMain: p.isMain,
    itemName: p.productName,
    category: p.category,
    insuredAmount: p.insuredAmount,
    insuredAmountUnit: p.insuredAmountUnit,
    company: "富邦人壽",
    owner: p.applicant.name,
    status: p.status || "有效",
    payEndRaw: p.payEndDate || "",
    coverage: coverage,
    note: unmatchedNotes.length ? ("匯入時無法歸類的給付項目，請人工確認：\n" + unmatchedNotes.join("\n")) : "",
    _importedAt: new Date().toISOString(),
    _sourceAgent: p.agentName || null,
  };
  // 身故受益人資料：只有主約才會帶（附約通常「同主約」，beneficiary.html
  // 本身也是這樣處理的），附約這裡會是空字串，不會多寫這個欄位。
  if (p.beneficiaryDeathText) {
    result.beneficiaryDeathText = p.beneficiaryDeathText;
  }
  return result;
}

function commitGroup_(idx) {
  var g = parsedGroups[idx];
  var btn = document.getElementById("commit-btn-" + idx);
  var status = document.getElementById("commit-status-" + idx);
  btn.disabled = true;
  status.textContent = "寫入中…";
  status.style.color = "#888";

  var task = g.matched ? commitMatchedGroup_(g) : commitNewGroup_(g);
  task.then(function(result){
    if (result.ok) {
      status.textContent = "✓ 已寫入：" + result.message;
      status.style.color = "#27500A";
      btn.textContent = "已完成";
    } else {
      status.textContent = "✗ " + result.message;
      status.style.color = "#791F1F";
      btn.disabled = false;
    }
    return result;
  }).catch(function(err){
    status.textContent = "✗ 寫入失敗：" + err.message;
    status.style.color = "#791F1F";
    btn.disabled = false;
    return { ok:false, message: err.message };
  });
  return task;
}

async function commitAll_() {
  var statusEl = document.getElementById("commit-all-status");
  for (var i=0; i<parsedGroups.length; i++) {
    statusEl.textContent = "處理中… (" + (i+1) + "/" + parsedGroups.length + ")";
    var btn = document.getElementById("commit-btn-" + i);
    if (btn.textContent === "已完成") continue; // 已經處理過的跳過，避免重複建立
    await commitGroup_(i);
  }
  statusEl.textContent = "全部處理完成，請往下逐組確認結果。";
}

// ── 新客戶：建立新家庭 ─────────────────────────────────────
async function commitNewGroup_(g) {
  var analysisDate = todayISO_();
  var mainMember = g.members[0];
  var personIds = {};
  g.members.forEach(function(m, i){ personIds[m.key] = "p_" + (Date.now() + i); });

  var familyId = "f_" + Date.now();
  var familyName = mainMember.name + "家";
  var familyMembers = g.members.map(function(m, i){
    return {
      personId: personIds[m.key],
      name: m.name,
      role: i === 0 ? "primary" : "family",
      relation: i === 0 ? "本人" : (m.relationship || "家人"),
    };
  });

  var mainPersonData = buildPersonData_(mainMember, personIds[mainMember.key], analysisDate);
  g.policies.filter(function(p){ return p._insKey === mainMember.key; }).forEach(function(p){
    mainPersonData.policies.push(buildPolicyRecord_(p));
  });

  var familyData = {
    version: "3.0.0",
    familyId: familyId,
    familyName: familyName,
    agentId: currentUser.email,
    analysisDate: analysisDate,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    members: familyMembers,
    sharedBeneficiary: [],
  };

  var res = await callGAS("createFamily", {
    email: currentUser.email,
    personFileName: mainMember.name + "_" + personIds[mainMember.key] + ".json",
    personContent: mainPersonData,
    familyFileName: familyName + "_" + familyId + ".json",
    familyContent: familyData,
  });

  if (!res || res.status !== "ok") {
    return { ok:false, message: (res && res.message) || "建立家庭失敗" };
  }

  // 其餘成員各自存檔（第一位成員已經在 createFamily 裡寫過了）
  for (var i=1; i<g.members.length; i++) {
    var m = g.members[i];
    var pData = buildPersonData_(m, personIds[m.key], analysisDate);
    g.policies.filter(function(p){ return p._insKey === m.key; }).forEach(function(p){
      pData.policies.push(buildPolicyRecord_(p));
    });
    await callGAS("saveFile", {
      email: currentUser.email, fileType: "persons",
      fileName: m.name + "_" + personIds[m.key] + ".json", content: pData
    });
  }

  return { ok:true, message: "已建立新家庭「" + familyName + "」（" + g.members.length + " 位成員）" };
}

// ── 既有客戶：併入既有家庭 ───────────────────────────────────
async function commitMatchedGroup_(g) {
  var bundle = await callGAS("readFamilyBundle", {
    email: currentUser.email, fileType: "families", fileName: g.matched.fileName
  });
  if (!bundle || bundle.status !== "ok") {
    return { ok:false, message: "讀取既有家庭資料失敗" };
  }
  var family = bundle.family;
  var persons = bundle.persons || {};

  // 建立「姓名/身分證字號 -> personId」的對照，判斷這組裡每個人是不是
  // 家庭裡已經有的成員
  var existingByIdOrName = {};
  Object.keys(persons).forEach(function(pid){
    var prof = persons[pid].profile || {};
    if (prof.idNumber) existingByIdOrName["ID:"+prof.idNumber] = pid;
    existingByIdOrName["NAME:"+prof.name] = pid;
  });

  var conflicts = [];
  var newMembersToAdd = [];
  var updatedPersonIds = {};

  for (var mi=0; mi<g.members.length; mi++) {
    var m = g.members[mi];
    var existingPid = (m.idNumber && existingByIdOrName["ID:"+m.idNumber]) || existingByIdOrName["NAME:"+m.name];
    var targetPerson, targetPersonId;

    if (existingPid) {
      targetPerson = persons[existingPid];
      targetPersonId = existingPid;
    } else {
      // 這個家庭裡沒出現過的新面孔（例如原本只登記爸爸，這次匯入才第一次
      // 出現媽媽），幫他新建一筆 person，並加進 family.members
      targetPersonId = "p_" + Date.now() + "_" + mi;
      targetPerson = buildPersonData_(m, targetPersonId, family.analysisDate || todayISO_());
      newMembersToAdd.push({
        personId: targetPersonId, name: m.name,
        role: "family", relation: m.relationship || "家人"
      });
    }

    // 把這個人名下的保單，逐筆檢查「產品代碼」是否已存在——已存在的先
    // 攔下來不覆蓋，只有全新項目才自動加進去。這裡改用 productCode 而
    // 不是 policyNo，因為同一份合約底下的主約＋所有附約，policyNo 現在
    // 是共用同一個號碼（配合 policy.html 的分組邏輯），不能拿來判斷
    // 「這一項」存不存在。
    var policiesForThisPerson = g.policies.filter(function(p){ return p._insKey === m.key; });
    var existingProductCodes = (targetPerson.policies || []).map(function(pp){ return pp.productCode || pp.policyNo; });
    policiesForThisPerson.forEach(function(p){
      if (existingProductCodes.indexOf(p.productCode) !== -1) {
        conflicts.push(m.name + " 的保單 " + p.policyNo + "（" + p.productName + "）已經存在，本次不覆蓋，請自行到保單清單比對");
      } else {
        targetPerson.policies = targetPerson.policies || [];
        targetPerson.policies.push(buildPolicyRecord_(p));
      }
    });

    targetPerson.updatedAt = new Date().toISOString();
    updatedPersonIds[targetPersonId] = targetPerson;
  }

  // 寫回每一個有異動的 person
  for (var pid in updatedPersonIds) {
    var pdata = updatedPersonIds[pid];
    await callGAS("saveFile", {
      email: currentUser.email, fileType: "persons",
      fileName: pdata.profile.name + "_" + pid + ".json", content: pdata
    });
  }

  // 如果有新面孔要加進家庭成員名單，更新 family 檔案
  if (newMembersToAdd.length) {
    family.members = (family.members || []).concat(newMembersToAdd);
    family.updatedAt = new Date().toISOString();
    await callGAS("saveFile", {
      email: currentUser.email, fileType: "families",
      fileName: g.matched.fileName, content: family
    });
  }

  var msg = "已併入「" + g.matched.familyName + "」";
  if (newMembersToAdd.length) msg += "，新增 " + newMembersToAdd.length + " 位成員";
  if (conflicts.length) msg += "，" + conflicts.length + " 張保單因為已存在而略過（未覆蓋）";
  return { ok:true, message: msg };
}
