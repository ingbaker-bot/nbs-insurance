<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 保單彙總</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:26px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:18px; font-weight:600; flex:1; }
    .header-sub { font-size:14px; color:#bbb; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:14px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .main { 
      padding: 16px 24px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 768px) {
      .main { padding: 16px; }
    }

    .stat-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .stat-card { padding:10px 12px; border-radius:10px; }
    .stat-label { font-size:14px; margin-bottom:2px; }
    .stat-value { font-size:19px; font-weight:600; }

    .section-label { font-size:14px; font-weight:500; color:#999; margin-bottom:8px; letter-spacing:0.05em; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
    .small-btn { font-size:14px; padding:4px 12px; border:1px solid #ddd; border-radius:99px; background:transparent; color:#666; cursor:pointer; font-family:inherit; }

    /* 保單號碼一覽 */
    .policy-group-block { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:16px; }
    .group-header { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#f7f7f5; flex-wrap:wrap; }
    .policy-no-badge { font-family:monospace; font-size:14px; font-weight:500; background:#E6F1FB; color:#0C447C; padding:1px 8px; border-radius:99px; }
    .group-company { font-size:16px; font-weight:500; }
    .group-total { font-size:14px; color:#999; margin-left:auto; }
    .policy-row { display:grid; grid-template-columns:minmax(96px,auto) 1fr minmax(90px,auto) minmax(220px,auto) minmax(70px,auto); align-items:center; gap:8px; padding:9px 14px; border-top:1px solid #f5f5f5; }
    .cat-badge { font-size:14px; padding:2px 8px; border-radius:99px; text-align:center; display:inline-block; }
    .policy-name { font-size:17px; padding-left:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .policy-prem { font-size:17px; font-weight:500; text-align:right; white-space:nowrap; }
    .status-badge { font-size:14px; padding:1px 6px; border-radius:99px; text-align:center; }
    .status-有效 { background:#EAF3DE; color:#27500A; }
    .status-停效 { background:#FCEBEB; color:#791F1F; }

    /* 圓餅圖 */
    .pie-wrap { background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:14px; margin-bottom:16px; }
    .pie-container { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center; }
    .pie-legend { display:flex; flex-direction:column; gap:5px; }
    .pie-legend-item { display:flex; align-items:center; gap:8px; font-size:14px; }
    .pie-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }

    /* 保障加總網格排版 */
    .coverage-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    @media (min-width: 768px) { .coverage-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) {
      .coverage-grid { grid-template-columns: repeat(3, 1fr); align-items: start; }
      .card-日額型住院 { grid-row: span 2; }
      .card-癌症醫療   { grid-row: span 2; }
      .card-失能長照   { grid-column: 2; }
    }

    /* 獨立保障卡片 */
    .coverage-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .cov-group-header { display: flex; align-items: center; padding: 8px 14px; border-bottom: 1px solid #f0f0f0; }
    .cov-group-label { font-size: 17px; font-weight: 600; letter-spacing: 0.05em; }
    .cov-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px dashed #f5f5f5; flex-wrap: wrap; gap: 4px; }
    .cov-item:last-child { border-bottom: none; }
    .cov-item-label { font-size: 16px; color: #444; }
    .cov-item-label.zero { color: #bbb; }
    .cov-value-wrap { text-align: right; }
    .cov-item-value { font-size: 17px; font-weight: 600; font-family: monospace; }
    .cov-unit { font-size: 14px; color: #999; font-weight: normal; font-family: sans-serif; margin-left: 2px; }
    .cov-breakdown { font-size: 14px; color: #aaa; margin-top: 2px; line-height: 1.2; }

    /* 就醫情況 */
    .medical-table { width:100%; border-collapse:collapse; }
    .medical-table th { padding:8px 10px; text-align:center; font-size:14px; font-weight:500; border-bottom:1px solid #e8e8e8; }
    .medical-table th:first-child { text-align:left; padding-left:14px; font-weight:400; color:#888; }
    .medical-table td { padding:8px 10px; text-align:center; }
    .medical-table td:first-child { text-align:left; padding-left:14px; font-weight:500; font-size:16px; color:#555; background:#fafafa; }
    .nhi-badge { display:inline-flex; padding:4px 10px; border-radius:6px; background:#EAF3DE; }
    .nhi-badge span { font-size:14px; font-weight:500; color:#27500A; }
    .medical-input { width:150px; font-size:16px; padding:5px 8px; border:1px solid #e0e0e0; border-radius:5px; outline:none; text-align:right; font-family:inherit; }
    .auto-hint { font-size:14px; color:#aaa; }

    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:flex-end; justify-content:center; }
    .modal-overlay.active { display:flex; }
    .modal { background:#fff; border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:560px; max-height:80vh; overflow-y:auto; }
    .modal-title { font-size:19px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
    .modal-close { background:none; border:none; font-size:26px; color:#999; cursor:pointer; line-height:1; }
    .modal-notice { font-size:14px; color:#5D4037; background:#FFF8E1; padding:8px 12px; border-radius:8px; margin-bottom:14px; line-height:1.6; }
    .type-group-label { font-size:14px; font-weight:500; margin-bottom:6px; }
    .type-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .type-tag { display:flex; align-items:center; gap:4px; padding:5px 12px; border-radius:99px; cursor:pointer; }
    .type-tag-dot { width:9px; height:9px; border-radius:50%; }
    .type-tag-label { font-size:16px; }
    .manual-badge { font-size:14px; color:#F5A623; font-weight:600; margin-left:2px; }

    .loading { text-align:center; padding:40px; color:#bbb; font-size:14px; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#378ADD; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="nav.js"></script>
</head>
<body>

<div class="header-sub" id="header-sub"></div>
<div class="member-tabs" id="member-tabs"></div>
<div class="main">
  <div id="loading" class="loading"><span class="spinner"></span> 載入中…</div>
  <div id="content" style="display:none"></div>
</div>

<!-- 手動調整 Modal -->
<div class="modal-overlay" id="edit-modal" onclick="handleModalOverlay(event)">
  <div class="modal">
    <div class="modal-title">
      手動調整保障有無
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-notice">
      系統依保單及附約清單自動判斷。若有誤可手動切換，再次點擊恢復自動判斷。<br/>
      橘色「手動」標籤表示已覆蓋自動判斷。
    </div>
    <div id="modal-types"></div>
    <button onclick="closeModal()" style="width:100%;padding:10px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:8px">完成</button>
  </div>
</div>

<script>
    // GAS_URL 已移至 nav.js 統一管理

// ── 輔助加總計算機 ─────────────────────────────────────────
// 保額單位換算成「萬元」。policy.html 的保額單位選項除了「萬元」「元」
// 這兩種可以換算的貨幣單位，還有「計劃/型/份/自訂」這類非金額單位
// （例如投資型保單常用「型」），這些無法換算成金額，回傳 null，
// 呼叫端應該把這種情況當作「金額不明」處理，不要當成 0 或亂算。
// 判斷保單目前是否仍在保障中：只有「停效」才算失去保障，
// 其餘狀態（有效/繳費期滿/自動墊繳/展期/緩繳/減額繳清）都代表保單
// 仍在繼續提供保障，都應該算進保障覆蓋率計算裡。
function isPolicyActive(p) {
  return p.status !== "停效";
}

// 判斷保單是「終身」還是「定期」：讀 coverage.html 裡的
// protect_period_type（歲/年/終身），跟保單的保障截止日/繳費期滿日脫鉤
function lifeAmount(pols, cats, isTerm) {
  var amt = 0;
  pols.forEach(function(p){
    if (cats.indexOf(p.category) === -1) return;
    var pt = (p.coverage && p.coverage.protect_period_type) || "終身";
    var isPolTerm = (pt !== "終身");
    if (isTerm !== isPolTerm) return;
    // 只加總使用者實際填寫的留愛金額(deathBenefit)，不再用保額(insuredAmount)頂替
    amt += getDeathBenefitAmt(p);
  });
  return amt;
}
function lifeRemainYears(pols, cats) {
  var texts = [];
  pols.forEach(function(p){
    if (cats.indexOf(p.category) === -1) return;
    var pt = (p.coverage && p.coverage.protect_period_type) || "終身";
    if (pt === "終身") return;
    var val = p.coverage && p.coverage.protect_period;
    var text = pt === "歲" ? "保障至"+(val||"—")+"歲" : "保障"+(val||"—")+"年";
    if (texts.indexOf(text) === -1) texts.push(text);
  });
  return texts.length ? texts.join("／") : null;
}

// 各分類的保障期間欄位對應（跟 export.html 一致）
var TERM_BADGE_FIELD_MAP = {
  "意外險":              { ageKey:"acc_age" },
  "住院醫療 (實支實付)": { ageKey:"hosp_age" },
  "日額型住院":          { typeKey:"daily_period_type", valKey:"daily_period" },
  "定額手術":            { typeKey:"surg_period_type", valKey:"surg_period" },
  "癌症醫療":            { typeKey:"can_period_type", valKey:"can_period" },
  "失能長照":            { typeKey:"ltc_period_type", valKey:"ltc_period" },
};
function getTermBadge(g, policies) {
  var conf = TERM_BADGE_FIELD_MAP[g.label];
  if (!conf || !g.cats || !g.cats.length) return "";
  var matched = policies.filter(function(p){ return g.cats.indexOf(p.category) !== -1; });
  if (!matched.length) return "";
  var labels = [];
  matched.forEach(function(p){
    var cv = p.coverage || {};
    var text;
    if (conf.ageKey) {
      var v = cv[conf.ageKey];
      text = (!v || v === "終身") ? "終身" : "保障至"+v+"歲";
    } else {
      var t = cv[conf.typeKey] || "終身";
      if (t === "終身") text = "終身";
      else if (t === "歲") text = "保障至"+(cv[conf.valKey]||"—")+"歲";
      else text = "保障"+(cv[conf.valKey]||"—")+"年";
    }
    if (labels.indexOf(text) === -1) labels.push(text);
  });
  return labels.join("／");
}

// 共用 Stat 卡片元件（跟 export.html 一致：資料完整不隱藏，未規劃項目
// 用「缺口」標籤，分組標頭兩行顯示：標題一行、定期/終身標示另一行）
function buildStatGroupCard(g, policies, cov3) {
  var itemsData = g.items.map(function(item){
    var total, isRange=false, minVal=0, maxVal=0, remainNote="";
    if (item.compute) {
      total = item.compute(policies);
      if (item.remain) {
        var ry = item.remain(policies);
        if (ry !== null) remainNote = ' ('+ry+')';
      }
    } else {
      var maxKey = item.keys && item.keys.find(function(k){ return k.endsWith('_max'); });
      var minKey = maxKey ? maxKey.replace('_max','_min') : null;
      minVal = minKey ? sumCov([minKey],policies,cov3) : 0;
      maxVal = maxKey ? sumCov([maxKey],policies,cov3) : 0;
      isRange = !!(maxKey && (minVal>0 || maxVal>0));
      total = isRange ? maxVal : sumCov(item.keys,policies,cov3);
    }
    return { label:item.label, unit:item.unit, total:total, isRange:isRange, minVal:minVal, maxVal:maxVal, remainNote:remainNote };
  });

  var filled = itemsData.filter(function(x){ return x.total>0; });
  var empty  = itemsData.filter(function(x){ return !(x.total>0); });
  var rowsHtml = filled.map(function(x){ return statRowHtml(x, g.color); }).join("")
               + empty.map(function(x){ return statRowHtml(x, g.color); }).join("");

  var termBadge = getTermBadge(g, policies);

  return '<div style="background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px -4px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.04)">'+
    '<div style="padding:12px 14px;background:linear-gradient(135deg,'+g.color+'26,'+g.color+'0A)">'+
      '<div style="display:flex;align-items:center;gap:8px;min-width:0">'+
        '<span style="font-size:20px;line-height:1;flex-shrink:0">'+(g.icon||'')+'</span>'+
        '<span style="font-size:14px;font-weight:800;letter-spacing:.01em;color:'+g.color+';line-height:1.3">'+g.label+'</span>'+
      '</div>'+
      (termBadge ? '<div style="margin-top:5px"><span style="font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#fff;color:'+g.color+';white-space:nowrap">'+termBadge+'</span></div>' : '')+
    '</div>'+
    rowsHtml +
  '</div>';
}
function statRowHtml(x, color) {
  var isFilled = x.total > 0;
  var valueHtml;
  if (!isFilled) {
    valueHtml = '<span style="font-size:12px;font-weight:800;color:#9aa0ac;background:#eef0f3;padding:4px 12px;border-radius:99px;white-space:nowrap">缺口</span>';
  } else if (x.isRange) {
    valueHtml = '<span style="font-size:18px;font-weight:800;color:'+color+';font-variant-numeric:tabular-nums">'+
      x.minVal.toLocaleString()+'<span style="color:#c7c9d1;margin:0 2px;font-weight:400">～</span>'+x.maxVal.toLocaleString()+
      '<span style="font-size:12px;color:#9aa0ac;font-weight:700;margin-left:2px">'+x.unit+'</span></span>';
  } else {
    valueHtml = '<span style="font-size:18px;font-weight:800;color:'+color+';font-variant-numeric:tabular-nums">'+x.total.toLocaleString()+
      '<span style="font-size:12px;color:#9aa0ac;font-weight:700;margin-left:2px">'+x.unit+'</span></span>';
  }
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:'+(isFilled?'11px':'9px')+' 14px;border-top:1px solid #f2f2f4">'+
    '<span style="font-size:12.5px;color:'+(isFilled?"#555":"#aaacb3")+';font-weight:700">'+x.label+(isFilled?x.remainNote:"")+'</span>'+
    valueHtml+
  '</div>';
}

function convertToWan(amount, unit) {
  const n = parseFloat(amount);
  if (isNaN(n)) return null;
  const u = unit || "萬元";
  if (u === "萬元") return n;
  if (u === "元") return n / 10000;
  return null; // 計劃/型/份/自訂等非金額單位，無法換算
}

// 留愛金額：只採用使用者實際輸入的 deathBenefit（單位換算成萬元），
// 不再用保額(insuredAmount)自動頂替，避免把重疾/意外/醫療等「理賠給
// 被保險人本人」性質的保額誤顯示成「留給受益人」的留愛金額。
// 跟 export.html 的 getDeathBenefitAmt 邏輯完全一致，確保平時在
// summary 檢視的數字，跟最後 export 匯出的報告數字一致。
function getDeathBenefitAmt(p) {
  if (p.deathBenefit !== undefined && p.deathBenefit !== null && p.deathBenefit !== "") {
    const w = convertToWan(p.deathBenefit, p.deathBenefitUnit || '萬元');
    if (w === null) return 0;
    // 外幣保單：留愛金額填的是保單原幣金額（跟保費同一套邏輯），要用這張
    // 保單的匯率換算成台幣，不然外幣保單的留愛金額會被誤當成台幣數字。
    const rate = (p.currency && p.currency !== "TWD" && parseFloat(p.exchangeRate)) ? parseFloat(p.exchangeRate) : 1;
    return Math.round(w * rate * 10) / 10; // 四捨五入到小數點第一位，避免顯示到第4位被截斷
  }
  return 0;
}

function sumCov(keys, policies, coverage) {
  let total = 0;
  policies.forEach(p => {
    keys.forEach(k => {
      if (p.coverage && typeof p.coverage[k] === "number") {
        total += p.coverage[k];
      }
    });
  });
  // 相容舊格式
  if (total === 0 && coverage) {
      policies.forEach(p => {
          keys.forEach(k => {
              if (coverage[p.id + "_" + k] && typeof coverage[p.id + "_" + k] === "number") {
                  total += coverage[p.id + "_" + k];
              }
          });
      });
  }
  return total;
}

// ── 保障群組與細項定義 (全新規劃) ─────────────────────────────────────────
var GAP_GROUPS = [
  { key:"family", label:"家庭責任", color:"#1565C0", items:[
    { key:"life_permanent", label:"終身壽險",    unit:"萬元",   color:"#1565C0" },
    { key:"life_term",      label:"定期壽險",    unit:"萬元",   color:"#1E88E5" },
    { key:"investment",     label:"投資型保險",  unit:"萬元",   color:"#7B1FA2" },
    { key:"savings",        label:"儲蓄險",      unit:"萬元",   color:"#E91E8C" },
    { key:"ci_death",       label:"重大/特傷/重疾", unit:"萬元", color:"#C0392B" },
    { key:"acc_death_amt",  label:"意外身故",     unit:"萬元",   color:"#F5A623" },
  ]},
  { key:"before", label:"評估確診", color:"#E53935", items:[
    { key:"ci_major",         label:"重大疾病",   unit:"萬元",   color:"#E53935" },
    { key:"ci_catastrophic",  label:"重大傷病",   unit:"萬元",   color:"#EC7063" },
    { key:"ci_specific",      label:"特定傷病",   unit:"萬元",   color:"#CB4335" },
    { key:"cancer",           label:"初次罹患癌症", unit:"萬元", color:"#C62828" },
  ]},
  { key:"during", label:"積極修復", color:"#FF8F00", items:[
    { key:"hosp_real_room",  label:"實支病房費",        unit:"元/日",  color:"#E65100" },
    { key:"hosp_daily",      label:"住院日額+出院",      unit:"元/日",  color:"#F57C00" },
    { key:"surgery",         label:"手術險(最高)",      unit:"",       color:"#FF9800", isBool:true },
    { key:"cancer_hosp",     label:"癌症病房(含出院)",  unit:"元/日",  color:"#FFB300" },
    { key:"cancer_surgery",  label:"癌症手術",          unit:"萬元/次",color:"#E64A19" },
    { key:"acc_medical",     label:"意外醫療",          unit:"萬/次",  color:"#FFC107" },
    { key:"acc_hosp",        label:"意外住院",          unit:"元/日",  color:"#FFE082" },
  ]},
  { key:"after", label:"康復療養", color:"#2E7D32", items:[
    { key:"ltc_disable",         label:"失能一次金",      unit:"萬元",    color:"#1B5E20" },
    { key:"ltc_support",         label:"失能扶助",        unit:"萬元/月", color:"#2E7D32" },

// 投資型／儲蓄險不再比對金額，改用「有無填寫領回設定或留愛金額」來判斷
// 顏色狀態（有／部分有／沒有），這裡存放目前這位成員的領回設定資料，
// 在 renderContent() 裡從 person.savings 讀進來。
var savingsArr     = [];

// 核心運算引擎：精準抓取資料庫數字
function getItemCurrent(key, policies, coverage, covOverrides) {
  const map = GAP_KEY_MAP[key];
  if(!map) return 0;

  // ⚠️ 這裡原本有一段「手動覆蓋就直接回傳 0/1」的短路邏輯，已經移除。
  // getItemCurrent 專門負責算「真實金額」，手動調整（有／沒有）只應該
  // 影響 getItemStatus 判斷出來的狀態（✅/❌、圖示顏色），不該讓這裡回傳
  // 假的 0 或 1——不然只要曾經手動調整過一次，之後不管保單資料填了多少
  // 錢，這裡永遠都只會顯示 0 或 1，跟「投資型保險 1萬元」這種明顯錯誤
  // 的數字就是這樣來的。

  if(["waiver"].includes(key)) {
    if(key==="waiver")     return sumCov(["ltc_waiver"], policies, coverage) > 0 ? 1 : 0;
    return 0;
  }

  // 家庭責任區塊：終身壽險/定期壽險/投資型保險/儲蓄險/重大類/意外險，
  // 這些保單通常都附帶身故(留愛)給付，只加總使用者實際填寫的
  // 留愛金額(deathBenefit)，不再用保額(insuredAmount)頂替，也不再
  // 用「有/無」布林值顯示投資型與儲蓄險，改成跟其他項目一致的實際金額。
  if (["life_permanent", "life_term", "investment", "savings", "ci_death", "acc_death_amt"].includes(key)) {
      let amt = 0;
      const wantTerm = (key === "life_term");
      const catMap = {
          "life_permanent": ["壽險保障"],
          "life_term": ["壽險保障"],
          "investment": ["投資型保險"],
          "savings": ["儲蓄險","年金險"],
          "ci_death": ["重大疾病險","重大傷病險","特定傷病險"],
          "acc_death_amt": ["意外險"]
      };
      const matchedPolicies = policies.filter(p => catMap[key].includes(p.category));
      matchedPolicies.forEach(p => {
         // 只有壽險需要區分定期或終身，其餘直接全額加總
         if (key === "life_permanent" || key === "life_term") {
             const pt = (p.coverage && p.coverage.protect_period_type) || "終身";
             const isPolTerm = (pt !== "終身");
             if (isPolTerm !== wantTerm) return;
         }
         amt += getDeathBenefitAmt(p);
      });
      return amt;
  }

  if (["ci_major","ci_catastrophic","ci_specific"].includes(key)) {
      // 這幾個「一次金」欄位在 coverage.html 是不分類別、任何保單的「重大」
      // 分頁都能填（例如終身醫療險本身就附帶重大疾病一次給付），所以
      // 加總時不應該再限定「類別」剛好等於重大疾病險／重大傷病險／
      // 特定傷病險，只要保單有填這個欄位金額就該算進去，不管保單本身
      // 被歸在哪個類別。
      let amt = sumCov(map.keys, policies, coverage);
      if (amt === 0) {
        // 完全沒有任何保單填過這個一次金欄位，才退回用保單保額頂替
        // （相容還沒細分填寫的舊保單）。這個 fallback 才需要限定類別，
        // 因為「保額」代表保單本身的保障金額，只有真的歸類在這個重大
        // 疾病類別的保單，用保額去頂替才有意義。
        const matchedPolicies = policies.filter(p => map.cats.includes(p.category));
        matchedPolicies.forEach(p => {
           const w = convertToWan(p.insuredAmount, p.insuredAmountUnit);
           if (w !== null) amt += w;
        });
      }
      // 移除舊有「找不到金額就硬回傳 1」的假數字保底邏輯
      return amt;
  }

  // 這些 key 是明細欄位，沒有填就應該是 0，不應該用保額填充
  const NO_FALLBACK_KEYS = [
    "acc_medical", "acc_hosp", "hosp_real_room", "hosp_daily",
    "surgery", "cancer_hosp", "cancer_surgery", "ltc_disable", "ltc_support",
    "ltc_support_yr", "ltc_care", "cancer_death_hospice"
  ];
  if (NO_FALLBACK_KEYS.includes(key)) {
    return sumCov(map.keys, policies, coverage);
  }

  let amt = sumCov(map.keys, policies, coverage);

  const matchedPolicies = policies.filter(p => map.cats.includes(p.category));
  if (amt === 0 && matchedPolicies.length > 0) {
      matchedPolicies.forEach(p => {
          const w = convertToWan(p.insuredAmount, p.insuredAmountUnit);
          if (w !== null) amt += w;
      });
      // 移除舊有「找不到金額就硬回傳 1」的假數字保底邏輯
  }

  return amt;
}

// ── 投資型／儲蓄險的「有／部分有／沒有」三態判斷 ─────────────
// 不比金額，只看：這張保單有沒有被填過任何看得出「已經規劃」的資料
// ──留愛金額(deathBenefit)，或是 savings.html 填過的領回設定金額。
function savingsEntryHasAmount(s) {
  if (!s) return false;
  var tk = s.type || "1";
  if (tk === "6") { // 逐年領回明細
    return Array.isArray(s.yearlyAmts) && s.yearlyAmts.some(function(r){ return parseFloat(r.amt) > 0; });
  }
  var da = parseFloat(s.duringAmt) || 0;
  var aa = parseFloat(s.afterAmt)  || 0;
  return da > 0 || aa > 0;
}
function getSavingsPieStatus(key, policies, covOverrides) {
  const manualKey = currentPersonId + "_" + key;
  if (covOverrides && covOverrides[manualKey] !== undefined) {
    const on = !!covOverrides[manualKey];
    return { status: on ? "ok" : "gap", current: on?1:0, target:null, pct: on?1:0 };
  }
  const cats = key === "investment" ? ["投資型保險"] : ["儲蓄險","年金險"];
  const matched = policies.filter(p => cats.includes(p.category));
  if (!matched.length) return { status:"gap", current:0, target:null, pct:0 };
  const hasList = matched.map(function(p){
    const db = parseFloat(p.deathBenefit);
    if (!isNaN(db) && db > 0) return true;
    const s = savingsArr.find(function(sv){ return sv.policyId === p.id; });
    return savingsEntryHasAmount(s);
  });
  if (hasList.every(Boolean)) return { status:"ok", current:1, target:null, pct:1 };
  return { status:"insufficient", current:0.5, target:null, pct:0.5 }; // 保單存在，但資料還沒填完整＝部分有
}

function getItemStatus(key, policies, coverage, targets, covOverrides) {
  const item = GAP_GROUPS.flatMap(g=>g.items).find(i=>i.key===key);
  // current 一律用 getItemCurrent 算出來的「真實金額」，不管有沒有手動
  // 覆蓋——手動調整只該影響下面的「狀態」判斷（✅/❌/圖示顏色），不該讓
  // 金額本身被蓋成假的 0 或 1（之前這裡投資型/儲蓄險會整個跳過金額計算，
  // 只要之前手動調整過一次，就會被鎖死顯示「1萬元」這種假數字）。
  const current = getItemCurrent(key, policies, coverage, covOverrides);
  const manualKey = currentPersonId + "_" + key;
  if (covOverrides && covOverrides[manualKey] !== undefined) {
    const on = !!covOverrides[manualKey];
    return { status: on ? "ok" : "gap", current, target:null, pct: on?1:0 };
  }
  if (key === "investment" || key === "savings") {
    // 沒有手動覆蓋時，狀態（有／部分有／沒有）維持原本這套判斷邏輯，
    // 但金額一律用真實計算結果，不要再回傳 getSavingsPieStatus 自己
    // 算的假 0/1/0.5。
    const pieStatus = getSavingsPieStatus(key, policies, null);
    return { status: pieStatus.status, current, target:null, pct: pieStatus.pct };
  }
  const target  = targets[key];
  const isBool  = item?.isBool;
  if(!current) return {status:"gap", current:0, target, pct:0};
  if(!target||isBool) return {status:"ok", current, target:null, pct:1};
  if(current>=target) return {status:"ok", current, target, pct:1};
  return {status:"insufficient", current, target, pct:current/target};
}

async function initPage(detail) {
  currentUser       = detail.user;
  familyData        = detail.familyData;
  currentPersonId   = detail.currentPersonId;
  familyFileName    = detail.familyFileName;

  if (!currentUser || !familyData) {
    document.getElementById("loading").innerHTML = "載入失敗：請重新登入";
    return;
  }

  try {
    const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
    
    const fetchPromises = activeMembers.map(m => {
      const cacheKey = "nbs_person_" + m.personId;
      // 修正：改成「優先向 Drive 要最新資料，讀取成功一律覆蓋快取」，
      // 只有讀取失敗（離線、網路異常）時才退回使用舊快取墊著。
      // 原本是「快取存在就永遠相信、不會發現資料已經被別的頁面改過」，
      // 導致刪除/修改保單後，這頁還是一直顯示舊資料。
      return callGAS("readFile", {
        email: currentUser.email,
        fileType: "persons",
        fileName: m.name + "_" + m.personId + ".json"
      }).then(pr => {
        if (pr.status === "ok") {
          personDataMap[m.personId] = pr.content;
          sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
        } else {
          const cachedData = sessionStorage.getItem(cacheKey);
          if (cachedData) personDataMap[m.personId] = JSON.parse(cachedData);
        }
      }).catch(err => {
        console.error("讀取 " + m.name + " 失敗，改用舊快取墊著", err);
        const cachedData = sessionStorage.getItem(cacheKey);
        if (cachedData) personDataMap[m.personId] = JSON.parse(cachedData);
      });
    });

    await Promise.all(fetchPromises);

    // 把每個人存檔裡的手動調整結果（person.covOverrides）還原進執行期的 overrides，
    // 這樣重新整理頁面、或 export.html 讀到同一份保單資料時，都能看到一樣的手動調整。
    activeMembers.forEach(m => {
      const p = personDataMap[m.personId];
      if (p && p.covOverrides) {
        Object.entries(p.covOverrides).forEach(([gapKey, val]) => {
          overrides[m.personId + "_" + gapKey] = val;
        });
      }
    });

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    renderTabs();
    renderContent();
  } catch(err) {
    console.error("summary.html init error", err);
    document.getElementById("loading").innerHTML = "載入失敗：" + err.message;
  }
}

function getInsAge(pid) {
  const p=personDataMap[pid];
  if(!p) return null;
  const b=new Date(p.profile.birthDate), a=new Date(p.profile.analysisDate||new Date());
  let y=a.getFullYear()-b.getFullYear();
  const mo=(a-new Date(b.getFullYear()+y,b.getMonth(),b.getDate()))/(1000*60*60*24*30.4375);
  if(mo>=6)y++;
  return y;
}

// ── 「延長保障」型醫療附約的過渡期／接續後判斷 ──────────────
// coverage.html 對「延長保障」的定義（見該檔案註解）：舊保單有效期間
// 這張附約只給付日額（hosp_ext_daily，「現在（過渡期）」），等舊保單
// 到了 hosp_age 這個年齡之後，才接續改成實支實付（hosp_ext_room／
// hosp_ext_surgery／hosp_ext_misc，「未來（接續後）」）——這兩組數字
// 在任何一個時間點上只會有一組是真的在生效，不是兩組同時都算數。
//
// 之前的加總邏輯（hosp_real_room／hosp_daily／surgery 這幾組 GAP_KEY_MAP）
// 是把 hosp_room 和 hosp_ext_room 無條件加在一起、hosp_daily 和
// hosp_ext_daily 也無條件加在一起，等於兩個互斥的狀態同時被算成生效，
// 導致金額被灌水。這裡在加總「之前」，先依被保險人目前的實際年齡跟
// hosp_age 比較，把還沒生效的那一組欄位歸零，之後所有既有的加總邏輯
// 完全不用改，因為它們本來就已經把 hosp_room+hosp_ext_room／
// daily_room_1_30+hosp_ext_daily 放在一起加總，只要有一邊被歸零，
// 結果自然就對了。
function resolveExtendedHospCoverage_(policies, currentAge) {
  return policies.map(function(p) {
    var cov = p.coverage;
    if (!cov || cov.hosp_type !== "延長保障") return p;
    var hospAge = cov.hosp_age;
    var reachedTransition = (typeof hospAge === "number") && (currentAge != null) && (currentAge >= hospAge);
    var newCov = Object.assign({}, cov);
    if (reachedTransition) {
      // 已經到轉換年齡：現在是「未來（接續後）」階段，實支實付才算數，
      // 過渡期的日額歸零（避免舊資料裡這個欄位還留著值）。
      newCov.hosp_ext_daily = 0;
    } else {
      // 還沒到轉換年齡（或轉換年齡是「終身」/沒填，保守當作永遠沒轉
      // 換）：現在是「現在（過渡期）」階段，只有日額算數，接續後的
      // 實支實付還沒開始生效，全部歸零，不能提前算進去。
      newCov.hosp_ext_room = 0;
      newCov.hosp_ext_surgery = 0;
      newCov.hosp_ext_misc = 0;
    }
    return Object.assign({}, p, { coverage: newCov });
  });
}

// ── 甜甜圈圖分類：把個別細項合併成大類別，扇形不再逐項化（跟 export.html
// 的 DONUT_CATEGORIES_EX 對齊），圖例仍保留逐項明細，不受影響。 ──
var DONUT_CATEGORIES = [
  { key:"life_permanent", label:"終身壽險",     subKeys:["life_permanent"] },
  { key:"life_term",      label:"定期壽險",     subKeys:["life_term"] },
  { key:"investment",     label:"投資型保險",   subKeys:["investment"] },
  { key:"savings",        label:"儲蓄險",       subKeys:["savings"] },
  { key:"acc",            label:"意外險",       subKeys:["acc_death_amt","acc_medical","acc_hosp"] },
  { key:"ci",             label:"重疾/特傷/重大", subKeys:["ci_major","ci_catastrophic","ci_specific","ci_death"] },
  { key:"cancer",         label:"癌症險",       subKeys:["cancer","cancer_hosp","cancer_surgery","cancer_death_hospice"] },
  { key:"hosp_real_room", label:"住院醫療",     subKeys:["hosp_real_room"] },
  { key:"hosp_daily",     label:"住院日額",     subKeys:["hosp_daily"] },
  { key:"surgery",        label:"手術醫療",     subKeys:["surgery"] },
  { key:"ltc",            label:"失能/長照",    subKeys:["ltc_disable","ltc_support","ltc_support_yr","ltc_care"] },
  { key:"waiver",         label:"豁免",         subKeys:["waiver"] },
];

// 合併類別的三態判斷：全部子項目都有 → full(有)；全部都沒有 → none(沒有)；
// 部分子項目有部分沒有 → partial(部分有)。投資型／儲蓄險走專屬的三態判斷。
function getDonutCategoryStatus(cat, active, coverage, targets, covOverrides) {
  if (cat.key === "investment" || cat.key === "savings") {
    const s = getSavingsPieStatus(cat.key, active, covOverrides);
    const statusMap = { gap:"none", insufficient:"partial", ok:"full" };
    return { status: statusMap[s.status], pct: s.pct };
  }
  const n = cat.subKeys.length;
  let presentCount = 0;
  cat.subKeys.forEach(function(k){
    const current = getItemCurrent(k, active, coverage, covOverrides);
    if (current > 0) presentCount++;
  });
  const status = presentCount===0 ? "none" : (presentCount===n ? "full" : "partial");
  return { status: status, pct: n ? presentCount/n : 0 };
}

// ── 環形圓餅圖與圖例 ────────────────────────────────────────────
function buildDonutChart(active, coverage, targets, covOverrides) {
  const chartCats = DONUT_CATEGORIES;              // 扇形改用合併後的大類別
  const n = chartCats.length;

  const cx=220, cy=150, OR=100, IR=28;
  const gapA=0.03, sliceA=(Math.PI*2-n*gapA)/n;

  let angle=-Math.PI/2;
  let paths="";
  let labels="";

  function renderLegend(g) {
    let legendHtml;
    if (g.key === "family") {
      // 壽險留愛合計：終身壽險＋定期壽險＋投資型＋儲蓄險，這幾種都是
      // 「帶壽險身故(留愛金額)給付」的保單；意外身故已經在下面明細列表
      // 單獨呈現過，這裡不重複計入。
      const lifeDeathTotal = ["life_permanent","life_term","investment","savings"]
        .reduce((sum,k) => sum + getItemCurrent(k, active, coverage, covOverrides), 0);
      legendHtml = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;border-bottom:1px solid ${g.color}30;padding-bottom:8px">
        <div style="font-size:17px;font-weight:500;color:${g.color};flex-shrink:0">${g.label}</div>
        <div style="background:${g.color}18;border-radius:10px;padding:6px 14px;flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0">
          <span style="font-size:13px;color:${g.color};white-space:nowrap">壽險留愛合計</span>
          <span style="font-size:20px;font-weight:500;color:${g.color};white-space:nowrap">${lifeDeathTotal.toLocaleString()}<span style="font-size:13px;margin-left:2px">萬元</span></span>
        </div>
      </div>`;
    } else {
      legendHtml = `<div style="font-size:17px;font-weight:500;color:${g.color};margin-bottom:8px;border-bottom:1px solid ${g.color}30;padding-bottom:4px">${g.label}</div>`;
    }
    
    g.items.forEach(item => {
      const {status, pct, current, target} = getItemStatus(item.key, active, coverage, targets, covOverrides);
      const icon = status==="gap"?"❌":status==="insufficient"?"⚠️":"✅";
      const dotColor = status==="gap"?"#e0e0e0":item.color;

      let amtHtml = "";
      if (item.isBool) {
        amtHtml = current > 0 ? `<span style="color:#555;font-size:14px">有</span>` : `<span style="color:#bbb;font-size:14px">無</span>`;
      } else {
        if (current > 0 || target > 0) {
          let displayVal = current > 0 ? current.toLocaleString() : "0";
          if (target > 0) displayVal += ` / ${target.toLocaleString()}`;
          
          amtHtml = `<span style="color:${current>0?'#0C447C':'#888'};font-family:monospace;font-weight:600;font-size:16px">${displayVal}<span style="font-size:14px;color:#888;margin-left:3px;font-family:sans-serif">${item.unit}</span></span>`;
        } else {
          amtHtml = `<span style="color:#bbb;font-size:14px">0</span>`;
        }
      }

      legendHtml += `<div style="display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:5px">
        <div style="width:10px;height:10px;border-radius:2px;background:${dotColor};flex-shrink:0"></div>
        <span style="color:${status==="gap"?"#bbb":"#444"};flex:1;white-space:nowrap">${item.label}</span>
        ${amtHtml}
        <span style="margin-left:4px">${icon}</span>
      </div>`;
    });
    return legendHtml;
  }

  const legendFamily = renderLegend(GAP_GROUPS[0]);
  const legendBefore = renderLegend(GAP_GROUPS[1]);
  const legendDuring = renderLegend(GAP_GROUPS[2]);
  const legendAfter  = renderLegend(GAP_GROUPS[3]);

  // 顏色＝狀態，不再＝類別（跟 export.html 對齊）：已規劃=藍色漸層／
  // 部分有=橘色漸層／缺口=灰色，類別的識別改由外圍拉線標籤文字負責。
  const STATUS_COLOR = { full:"url(#donutGradFull)", partial:"url(#donutGradPartial)", none:"#E2E8F0" };
  const DONUT_DEFS = '<defs>' +
    '<radialGradient id="donutGradFull" cx="30%" cy="20%" r="75%">' +
      '<stop offset="0%" stop-color="#7dd3fc"/>' +
      '<stop offset="55%" stop-color="#0ea5e9"/>' +
      '<stop offset="100%" stop-color="#0369a1"/>' +
    '</radialGradient>' +
    '<radialGradient id="donutGradPartial" cx="30%" cy="20%" r="75%">' +
      '<stop offset="0%" stop-color="#fcd34d"/>' +
      '<stop offset="55%" stop-color="#f59e0b"/>' +
      '<stop offset="100%" stop-color="#b45309"/>' +
    '</radialGradient>' +
  '</defs>';

  chartCats.forEach(item => {
    const {status,pct} = getDonutCategoryStatus(item, active, coverage, targets, covOverrides);
    const sColor = STATUS_COLOR[status];
    const start = angle+gapA/2;
    const end   = angle+gapA/2+sliceA;
    const filledEnd = start + sliceA*pct;
    const midA  = start + sliceA/2; 
    angle += sliceA+gapA;

    const px=(r,a)=>cx+r*Math.cos(a), py=(r,a)=>cy+r*Math.sin(a);
    const donut=(a1,a2,lg,r1,r2)=>`M${px(r1,a1)},${py(r1,a1)} A${r1},${r1} 0 ${lg} 1 ${px(r1,a2)},${py(r1,a2)} L${px(r2,a2)},${py(r2,a2)} A${r2},${r2} 0 ${lg} 0 ${px(r2,a1)},${py(r2,a1)} Z`;

    paths += `<path d="${donut(start,end,sliceA>Math.PI?1:0,OR,IR)}" fill="#E2E8F0"/>`;
    if(pct>0.01) paths += `<path d="${donut(start,filledEnd,sliceA*pct>Math.PI?1:0,OR,IR)}" fill="${sColor}"/>`;
    if(status==="partial" && pct<0.99) {
      const gapSize=sliceA*(1-pct);
      paths += `<path d="${donut(filledEnd,end,gapSize>Math.PI?1:0,OR,IR)}" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.45"/>`;
    }

    const isRight = Math.cos(midA) >= 0; 
    const x0 = px(OR, midA), y0 = py(OR, midA); 
    const x1 = px(OR + 14, midA), y1 = py(OR + 14, midA); 
    const x2 = x1 + (isRight ? 18 : -18), y2 = y1; 

    const textAnchor = isRight ? "start" : "end";
    const textX = x2 + (isRight ? 4 : -4);
    const textColor = status === "none" ? "#94a3b8" : "#555";
    const dotColor = status === "full" ? "#0ea5e9" : status === "partial" ? "#f59e0b" : "#94a3b8";
    const fw = status === "full" ? "600" : "500";
    const prefix = status === "partial" ? "◐ " : "";

    labels += `
      <polyline points="${x0},${y0} ${x1},${y1} ${x2},${y2}" fill="none" stroke="${dotColor}60" stroke-width="1.2"/>
      <circle cx="${x0}" cy="${y0}" r="2" fill="${dotColor}"/>
      <text x="${textX}" y="${y2+4}" text-anchor="${textAnchor}" style="font-size:13px;fill:${textColor};font-weight:${fw};letter-spacing:0.03em">${prefix}${item.label}</text>
    `;
  });

  const okN  = chartCats.filter(item=>getDonutCategoryStatus(item,active,coverage,targets,covOverrides).status==="full").length;
  const gapN = chartCats.filter(item=>getDonutCategoryStatus(item,active,coverage,targets,covOverrides).status==="none").length;
  const insN = chartCats.filter(item=>getDonutCategoryStatus(item,active,coverage,targets,covOverrides).status==="partial").length;

  return `<div style="display:flex;flex-direction:column;width:100%">
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;padding:0">
      <svg viewBox="0 0 440 300" style="width:100%; max-width:480px; flex-shrink:0;">
        ${DONUT_DEFS}
        ${paths}
        ${labels}
      </svg>
      <div style="min-width:170px;background:#fafafa;padding:12px 16px;border-radius:10px;border:1px solid #f0f0f0">
        ${legendFamily}
      </div>
    </div>
    
    <div style="border-top:1px dashed #e8e8e8;padding-top:20px">
      <!-- 箭頭指標列 -->
      <div style="display:flex;align-items:stretch;margin-bottom:16px;font-size:17px;font-weight:600;letter-spacing:0.05em;height:46px">
        <!-- 醫療前期 -->
        <div style="
          flex:1;
          display:flex;align-items:center;justify-content:center;
          background:#4CAF86;
          color:#fff;
          position:relative;
          clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
          padding-right:14px;
        ">醫療前期</div>
        <!-- 醫療中期 -->
        <div style="
          flex:1.4;
          display:flex;align-items:center;justify-content:center;
          background:#378ADD;
          color:#fff;
          position:relative;
          clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
          margin-left:-1px;
          padding: 0 14px;
        ">醫療中期</div>
        <!-- 醫療後期 -->
        <div style="
          flex:1;
          display:flex;align-items:center;justify-content:center;
          background:#E87BAD;
          color:#fff;
          position:relative;
          clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%);
          margin-left:-1px;
          padding-left:14px;
        ">醫療後期</div>
      </div>
      <!-- 圖例內容 -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:16px">
        <div>${legendBefore}</div>
        <div>${legendDuring}</div>
        <div>${legendAfter}</div>
      </div>
    </div>
  </div>`;
}

// ── 缺口／不足分析 ────────────────────────────────────────
function buildGapAnalysis(active, coverage, targets, covOverrides) {
  const allItems = GAP_GROUPS.flatMap(g=>g.items);
  const gaps = [], insufficients = [], boolPartials = [];
  allItems.forEach(item => {
    const s = getItemStatus(item.key, active, coverage, targets, covOverrides);
    if (item.key === "investment" || item.key === "savings") {
      // 這兩項只看有／部分有／沒有，不套用金額目標比對邏輯，
      // 「部分有」另外分流，避免跟下面的數字型不足清單混在一起。
      if (s.status === "gap") gaps.push({item, ...s});
      if (s.status === "insufficient") boolPartials.push({item, ...s});
      return;
    }
    if(s.status==="gap") gaps.push({item, ...s});
    if(s.status==="insufficient") insufficients.push({item, ...s});
  });

  let html = "";

  if (boolPartials.length) {
    html += `<div style="font-size:17px;font-weight:500;color:#B7791F;margin-bottom:8px">⚠ 部分規劃（保單已存在，但資料尚未填寫完整）</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">`;
    boolPartials.forEach(({item}) => {
      html += `<span style="padding:4px 12px;background:#FAEEDA;border:1px solid #EF9F27;border-radius:99px;font-size:14px;color:#633806">${item.label}</span>`;
    });
    html += `</div>`;
  }

  if(insufficients.length) {
    html += `<div style="font-size:17px;font-weight:500;color:#F5A623;margin-bottom:8px">⚠ 規劃不足</div>`;
    insufficients.forEach(({item,current,target,pct}) => {
      html += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;flex-wrap:wrap;gap:4px">
          <span style="font-size:16px;color:#555">${item.label}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span style="font-size:17px;color:#555;font-weight:500">${current.toLocaleString()}${item.unit}</span>
            <span style="font-size:14px;color:#aaa">/ 目標 ${target?.toLocaleString()}${item.unit}</span>
          </div>
        </div>
        <div style="height:7px;background:#f0f0f0;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${Math.round(pct*100)}%;background:${item.color};border-radius:99px"></div>
        </div>
        <div style="font-size:14px;color:#E74C3C;margin-top:3px">尚不足 ${(target-current).toLocaleString()}${item.unit}（${Math.round(pct*100)}% 達成）</div>
      </div>`;
    });
  }

  if(gaps.length) {
    html += `<div style="font-size:17px;font-weight:500;color:#E74C3C;margin-bottom:8px;margin-top:${insufficients.length?12:0}px">❌ 尚未規劃</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`;
    gaps.forEach(({item}) => {
      html += `<span style="padding:4px 12px;background:#FCEBEB;border:1px solid #F0A8BF;border-radius:99px;font-size:14px;color:#791F1F">${item.label}</span>`;
    });
    html += `</div><div style="font-size:14px;color:#aaa">💡 可與保戶討論是否有需要規劃</div>`;
  }

  if(!insufficients.length && !gaps.length && !boolPartials.length) {
    html += `<div style="font-size:17px;color:#27AE8F;text-align:center;padding:12px 0">🎉 所有已設目標項目均達標！</div>`;
  }

  html += `<button onclick="openTargetModal()" style="width:100%;margin-top:10px;padding:8px;background:transparent;border:1px dashed #ddd;border-radius:8px;font-size:16px;color:#666;cursor:pointer;font-family:inherit">🎯 設定 / 修改目標保額</button>`;
  return html;
}

// ── 目標設定 Modal ────────────────────────────────────────
function openTargetModal() {
  const person = personDataMap[currentPersonId];
  const policies = resolveExtendedHospCoverage_(person?.policies||[], getInsAge(currentPersonId));
  const active = policies.filter(isPolicyActive);

  const coverage = {};
  Object.entries(person?.coverage||{}).forEach(([k,v])=>{
    if(typeof v==="number") coverage[k]=(coverage[k]||0)+v;
    else coverage[k]=v;
  });
  policies.forEach(p => {
    Object.entries(p.coverage||{}).forEach(([k,v]) => {
      if(typeof v === "number") coverage[k] = (coverage[k]||0)+v;
      else coverage[k] = v;
    });
  });

  let bodyHtml = `<div style="font-size:14px;color:#888;background:#f7f7f5;padding:8px 12px;border-radius:8px;margin-bottom:14px;line-height:1.6">
    設定後顯示「不足」；未設定的項目只顯示「有/無（缺口）」，不計算差額。
  </div>`;

  GAP_GROUPS.forEach(g => {
    bodyHtml += `<div style="font-size:17px;font-weight:500;color:${g.color};padding:4px 10px;background:${g.color}15;border-radius:5px;margin-bottom:8px">${g.label}</div>`;
    g.items.filter(item=>!item.isBool).forEach(item => {
      const current = getItemCurrent(item.key, active, coverage, overrides);
      const tval = targets[item.key]||"";
      bodyHtml += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;flex-wrap:wrap;gap:4px">
          <label style="font-size:16px;color:#333">${item.label}</label>
          <span style="font-size:14px;color:#aaa">目前：${current.toLocaleString()||0} ${item.unit}</span>
        </div>
        <div style="display:flex;align-items:center;border:1px solid #e0e0e0;border-radius:7px;overflow:hidden">
          <input type="number" id="target_${item.key}" value="${tval}" placeholder="不設定（只顯示有/無）"
            style="flex:1;padding:10px 12px;font-size:17px;border:none;outline:none;font-family:inherit"/>
          ${item.unit?`<span style="padding:0 10px;font-size:14px;color:#aaa;background:#fafafa;border-left:1px solid #f0f0f0">${item.unit}</span>`:""}
        </div>
      </div>`;
    });
    bodyHtml += `<div style="margin-bottom:14px"></div>`;
  });

  const existing = document.getElementById("target-modal-overlay");
  if(existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.id = "target-modal-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:flex;align-items:flex-end;justify-content:center";
  overlay.innerHTML = `<div style="background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <span style="font-weight:600;font-size:19px">🎯 設定目標保額</span>
      <button onclick="document.getElementById('target-modal-overlay')?.remove()" style="background:none;border:none;font-size:26px;color:#999;cursor:pointer;line-height:1">×</button>
    </div>
    ${bodyHtml}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="document.getElementById('target-modal-overlay')?.remove()"
        style="flex:1;padding:10px;background:transparent;color:#666;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-family:inherit;font-size:16px">取消</button>
      <button onclick="saveTargets()"
        style="flex:2;padding:10px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;font-family:inherit">儲存目標</button>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function saveTargets() {
  GAP_GROUPS.flatMap(g=>g.items.filter(i=>!i.isBool)).forEach(item => {
    const el = document.getElementById("target_"+item.key);
    if(el) {
      const v = parseFloat(el.value);
      if(!isNaN(v) && v > 0) targets[item.key] = v;
      else delete targets[item.key];
    }
  });
  document.getElementById("target-modal-overlay")?.remove();
  renderContent();
}

function openModal() {
  const person  = personDataMap[currentPersonId];
  const policies= resolveExtendedHospCoverage_(person?.policies||[], getInsAge(currentPersonId));
  const coverage= person?.coverage||{};
  const active  = policies.filter(isPolicyActive);
  const covTypes= COVERAGE_TYPES.map(t=>{
    const auto=t.detect(active,coverage);
    // 手動狀態要看「對照表裡對應的 GAP key」有沒有被覆蓋過，
    // 不是看 COVERAGE_TYPES 自己這個 key（兩套命名對不起來）。
    const gapKeys = COVERAGE_TYPE_TO_GAP_KEYS[t.key] || [t.key];
    const overriddenVals = gapKeys.map(gk=>overrides[currentPersonId+"_"+gk]).filter(v=>v!==undefined);
    const isManual = overriddenVals.length>0;
    const manualCovered = isManual ? overriddenVals.some(v=>v===true) : undefined;
    return {...t,covered:isManual?manualCovered:auto,autoDetected:auto,isManual};
  });

  const groups=["壽險","意外","醫療","重大","癌症","長照","財務","其他"];
  let html="";
  groups.forEach(g=>{
    const gTypes=covTypes.filter(t=>t.group===g);
    const gc=GROUP_COLORS[g];
    html+=`<div class="type-group-label" style="color:${gc}">${g}</div><div class="type-tags">`;
    gTypes.forEach(t=>{
      html+=`<div class="type-tag" id="tag_${t.key}" onclick="toggleOverride('${t.key}')"
        style="background:${t.covered?t.color+'18':'#f5f5f5'};border:1.5px ${t.covered?'solid':'dashed'} ${t.covered?t.color:'#ddd'}">
        <div class="type-tag-dot" style="background:${t.covered?t.color:'transparent'};border:${t.covered?'none':'1.5px solid #ccc'}"></div>
        <span class="type-tag-label" style="color:${t.covered?'#333':'#bbb'};font-weight:${t.covered?500:400}">${t.label}</span>
        ${t.isManual?'<span class="manual-badge">手動</span>':''}
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById("modal-types").innerHTML=html;
  document.getElementById("edit-modal").classList.add("active");
}

function toggleOverride(key) {
  const person=personDataMap[currentPersonId];
  const active=(person?.policies||[]).filter(isPolicyActive);
  const cov=person?.coverage||{};
  const t=COVERAGE_TYPES.find(x=>x.key===key);
  const auto=t?t.detect(active,cov):false;

  // 這個 Modal 切換的類別，實際要對應到圓餅圖/圖例/缺口分析會讀的哪幾個 GAP key
  const gapKeys = COVERAGE_TYPE_TO_GAP_KEYS[key] || [key];
  const isCurrentlyManual = gapKeys.some(gk => overrides[currentPersonId+"_"+gk] !== undefined);

  if (!isCurrentlyManual) {
    // 從自動判斷切成手動：把底下對應的每個 GAP key 都設成「跟自動判斷相反」
    gapKeys.forEach(gk => { overrides[currentPersonId+"_"+gk] = !auto; });
  } else {
    // 已經是手動狀態，再點一次 → 恢復自動判斷，清掉底下每個 GAP key 的手動覆蓋
    gapKeys.forEach(gk => { delete overrides[currentPersonId+"_"+gk]; });
  }
  openModal();
  renderContent(); // 立即重繪圓餅圖／圖例／缺口分析，不用等關閉 Modal 才更新
  saveOverridesForCurrentPerson(); // 存回雲端，export.html 才讀得到這次的手動調整
}

// 把目前這位成員的手動調整（overrides 裡屬於他的那些 key）整理出來，
// 存進 person.covOverrides，再存檔到 Drive。跟保單資料存在同一個檔案裡，
// export.html 讀 person 資料時就會一併讀到，不用另外開一支存檔流程。
function saveOverridesForCurrentPerson() {
  const person = personDataMap[currentPersonId];
  if (!person) return;
  const prefix = currentPersonId + "_";
  const covOverrides = {};
  Object.keys(overrides).forEach(k => {
    if (k.indexOf(prefix) === 0) covOverrides[k.slice(prefix.length)] = overrides[k];
  });
  person.covOverrides = covOverrides;

  const member = (familyData.members || []).find(m => m.personId === currentPersonId);
  if (!member) return;
  callGAS("saveFile", {
    email: currentUser.email,
    fileType: "persons",
    fileName: member.name + "_" + currentPersonId + ".json",
    content: person
  }).catch(err => console.error("手動調整存檔失敗：", err));
}
function closeModal() { document.getElementById("edit-modal").classList.remove("active"); renderContent(); }
function handleModalOverlay(e) { if(e.target===document.getElementById("edit-modal")) closeModal(); }

function goBack() { window.location.href="family.html"; }

function callGAS(action, params) {
  // 統一路由到 nav.js 的 NBS_NAV.callGAS（直連 Drive API，含 OAuth token）
  if (window.NBS_NAV && typeof NBS_NAV.callGAS === 'function') {
    return NBS_NAV.callGAS(action, params);
  }
  return Promise.reject(new Error('nav.js 未載入，請重新整理頁面'));
}

NBS_NAV.onMemberChange = function(pid) {
  currentPersonId = pid;
  if (typeof renderContent  === "function") renderContent();
};
NBS_NAV.init({ page: "summary" });

</script>
