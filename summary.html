<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 保單彙總</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }
    .header-sub { font-size:11px; color:#bbb; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .main { 
  padding: 16px 24px; /* 電腦版左右留白稍微加大，視覺更舒適 */
  max-width: 1200px;  /* 將原本的 560px 放大，讓大螢幕可以滿版展開 */
  margin: 0 auto;
  width: 100%;        /* 確保絕對不會超出手機螢幕邊界 */
}

/* 針對手機版自動微調邊距，保持原本的緊湊感 */
@media (max-width: 768px) {
  .main { padding: 16px; }
}

    .stat-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .stat-card { padding:10px 12px; border-radius:10px; }
    .stat-label { font-size:11px; margin-bottom:2px; }
    .stat-value { font-size:18px; font-weight:500; }

    .section-label { font-size:11px; font-weight:500; color:#999; margin-bottom:8px; letter-spacing:0.05em; display:flex; align-items:center; justify-content:space-between; }
    .small-btn { font-size:11px; padding:2px 10px; border:1px solid #ddd; border-radius:99px; background:transparent; color:#666; cursor:pointer; font-family:inherit; }

    /* 保單號碼一覽 */
    .policy-group-block { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:16px; }
    .group-header { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#f7f7f5; flex-wrap:wrap; }
    .policy-no-badge { font-family:monospace; font-size:12px; font-weight:500; background:#E6F1FB; color:#0C447C; padding:1px 8px; border-radius:99px; }
    .group-company { font-size:13px; font-weight:500; }
    .group-total { font-size:12px; color:#999; margin-left:auto; }
    .policy-row { display:grid; grid-template-columns:90px 1fr 80px 56px; align-items:center; padding:7px 14px; border-top:1px solid #f5f5f5; }
    .cat-badge { font-size:11px; padding:2px 6px; border-radius:99px; text-align:center; display:inline-block; }
    .policy-name { font-size:13px; padding-left:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .policy-prem { font-size:12px; font-weight:500; text-align:right; }
    .status-badge { font-size:10px; padding:1px 5px; border-radius:99px; text-align:center; }
    .status-有效 { background:#EAF3DE; color:#27500A; }
    .status-停效 { background:#FCEBEB; color:#791F1F; }

    /* 圓餅圖 */
    .pie-wrap { background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:14px; margin-bottom:16px; }
    .pie-container { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center; }
    .pie-legend { display:flex; flex-direction:column; gap:5px; }
    .pie-legend-item { display:flex; align-items:center; gap:8px; font-size:12px; }
    .pie-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }

    /* 保障加總 */
    /* 保障加總 (全新網格排版) */
    .coverage-grid {
      display: grid;
      grid-template-columns: 1fr; /* 手機預設 1 欄 */
      gap: 16px;
      margin-bottom: 24px;
    }
    /* 平板螢幕 (大於 768px) 變 2 欄 */
    @media (min-width: 768px) {
      .coverage-grid { grid-template-columns: repeat(2, 1fr); }
    }
    /* 電腦螢幕 (大於 1024px) 變 3 欄，並讓卡片各自獨立高度 */
    @media (min-width: 1024px) {
      .coverage-grid { grid-template-columns: repeat(3, 1fr); align-items: start; }
    }

    /* 獨立保障卡片 */
    .coverage-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .cov-group-header {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    .cov-group-label { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
    
    /* 細項列 (仿 Excel 虛線分隔) */
    .cov-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      border-bottom: 1px dashed #f5f5f5;
    }
    .cov-item:last-child { border-bottom: none; }
    .cov-item-label { font-size: 12px; color: #444; }
    .cov-item-label.zero { color: #bbb; }
    
    /* 數值與明細 */
    .cov-value-wrap { text-align: right; }
    .cov-item-value { font-size: 14px; font-weight: 600; font-family: monospace; }
    .cov-unit { font-size: 10px; color: #999; font-weight: normal; font-family: sans-serif; margin-left: 2px; }
    .cov-breakdown { font-size: 10px; color: #aaa; margin-top: 2px; line-height: 1.2; }

    /* 就醫情況 */
    .medical-table { width:100%; border-collapse:collapse; }
    .medical-table th { padding:8px 10px; text-align:center; font-size:12px; font-weight:500; border-bottom:1px solid #e8e8e8; }
    .medical-table th:first-child { text-align:left; padding-left:14px; font-weight:400; color:#888; }
    .medical-table td { padding:8px 10px; text-align:center; }
    .medical-table td:first-child { text-align:left; padding-left:14px; font-weight:500; font-size:13px; color:#555; background:#fafafa; }
    .nhi-badge { display:inline-flex; padding:4px 10px; border-radius:6px; background:#EAF3DE; }
    .nhi-badge span { font-size:12px; font-weight:500; color:#27500A; }
    .medical-input { width:88px; font-size:13px; padding:4px 6px; border:1px solid #e0e0e0; border-radius:5px; outline:none; text-align:right; font-family:inherit; }
    .auto-hint { font-size:9px; color:#aaa; }

    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:flex-end; justify-content:center; }
    .modal-overlay.active { display:flex; }
    .modal { background:#fff; border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:560px; max-height:80vh; overflow-y:auto; }
    .modal-title { font-size:15px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
    .modal-close { background:none; border:none; font-size:22px; color:#999; cursor:pointer; line-height:1; }
    .modal-notice { font-size:11px; color:#5D4037; background:#FFF8E1; padding:8px 12px; border-radius:8px; margin-bottom:14px; line-height:1.6; }
    .type-group-label { font-size:11px; font-weight:500; margin-bottom:6px; }
    .type-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .type-tag { display:flex; align-items:center; gap:4px; padding:5px 12px; border-radius:99px; cursor:pointer; }
    .type-tag-dot { width:9px; height:9px; border-radius:50%; }
    .type-tag-label { font-size:12px; }
    .manual-badge { font-size:8px; color:#F5A623; font-weight:600; margin-left:2px; }

    .loading { text-align:center; padding:40px; color:#bbb; font-size:13px; }
    
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#378ADD; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <script src="nav.js"></script>
</head>
<body>

  <div class="header-sub" id="header-sub"></div>
<div class="member-tabs" id="member-tabs"></div>
<div class="main">
  <div id="loading" class="loading"><span class="spinner"></span> 載入中…</div>
  <div id="content" style="display:none"></div>
</div>

<!-- 手動調整 Modal -->
<div class="modal-overlay" id="edit-modal" onclick="handleModalOverlay(event)">
  <div class="modal">
    <div class="modal-title">
      手動調整保障有無
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-notice">
      系統依保單及附約清單自動判斷。若有誤可手動切換，再次點擊恢復自動判斷。<br/>
      橘色「手動」標籤表示已覆蓋自動判斷。
    </div>
    <div id="modal-types"></div>
    <button onclick="closeModal()" style="width:100%;padding:10px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:8px">完成</button>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

const COVERAGE_TYPES = [
  { key:"life",       label:"壽險保障", group:"壽險", color:"#4A90D9", detect:(p,c)=>p.some(x=>x.category==="壽險保障") },
  { key:"acc_death",  label:"意外身故", group:"意外", color:"#F5A623", detect:(p,c)=>p.some(x=>x.category==="意外險") },
  { key:"acc_medical",label:"意外醫療", group:"意外", color:"#F08C00", detect:(p,c)=>Object.keys(c).some(k=>k.includes("acc_opd")) },
  { key:"acc_hosp",   label:"意外住院", group:"意外", color:"#D97706", detect:(p,c)=>Object.keys(c).some(k=>k.includes("daily_room"))&&p.some(x=>x.category==="意外險") },
  { key:"hosp_real",  label:"實支實付", group:"醫療", color:"#27AE8F", detect:(p,c)=>Object.keys(c).some(k=>k.includes("hosp_room")) },
  { key:"hosp_daily", label:"住院日額", group:"醫療", color:"#1E8A72", detect:(p,c)=>Object.keys(c).some(k=>k.includes("daily_room")) },
  { key:"hosp_surg",  label:"手術險",   group:"醫療", color:"#166756", detect:(p,c)=>Object.keys(c).some(k=>k.includes("surg_opd")||k.includes("surg_hosp")) },
  { key:"ci",         label:"重大疾病", group:"重大", color:"#9B59B6", detect:(p,c)=>p.some(x=>["重大疾病險","重大傷病險","特定傷病險"].includes(x.category)) },
  { key:"cancer",     label:"癌症險",   group:"癌症", color:"#E74C3C", detect:(p,c)=>Object.keys(c).some(k=>k.includes("can_first")||k.includes("can_hosp")) },
  { key:"ltc",        label:"長照險",   group:"長照", color:"#27500A", detect:(p,c)=>Object.keys(c).some(k=>k.includes("ltc_monthly")||k.includes("ltc_care")) },
  { key:"disable",    label:"失能險",   group:"長照", color:"#5BAD6F", detect:(p,c)=>Object.keys(c).some(k=>k.includes("ltc_dis_amt")||k.includes("ltc_dis_life")) },
  { key:"savings",    label:"儲蓄險",   group:"財務", color:"#E8638A", detect:(p,c)=>p.some(x=>x.category==="儲蓄險") },
  { key:"annuity",    label:"年金險",   group:"財務", color:"#C0392B", detect:(p,c)=>p.some(x=>x.category==="年金險") },
  { key:"investment", label:"投資型",   group:"財務", color:"#95A5A6", detect:(p,c)=>p.some(x=>x.category==="投資型保險") },
];

const GROUP_COLORS = { 壽險:"#4A90D9",意外:"#F5A623",醫療:"#27AE8F",重大:"#9B59B6",癌症:"#E74C3C",長照:"#27500A",財務:"#E8638A" };

const CAT_COLORS = {
  "壽險保障":"#4A90D9","醫療保障":"#27AE8F","意外險":"#F5A623",
  "重大疾病險":"#9B59B6","重大傷病險":"#8E44AD","特定傷病險":"#7D3C98",
  "儲蓄險":"#E8638A","年金險":"#C0392B","投資型保險":"#95A5A6",
};

const COVERAGE_GROUPS = [
  { label:"壽險保障", color:"#4A90D9", items:[
    { label:"壽險保障額度", keys:["life_basic"], unit:"萬元" },
  ]},
  { label:"意外保障", color:"#F5A623", items:[
    { label:"特定事故加倍", keys:["acc_special"], unit:"萬元" },
    { label:"意外門診",     keys:["acc_opd"],    unit:"萬元/次" },
    { label:"意外失能",     keys:["acc_disable"],unit:"萬元" },
    { label:"重大燒燙傷",   keys:["acc_burn"],   unit:"萬元" },
  ]},
  { label:"住院醫療", color:"#27AE8F", items:[
    { label:"病房費（實支）",  keys:["hosp_room"],    unit:"元/日" },
    { label:"手術費（實支）",  keys:["hosp_surgery"], unit:"元/次" },
    { label:"住院日額",        keys:["daily_room"],   unit:"元/日" },
    { label:"出院療養",        keys:["daily_discharge"],unit:"元/日" },
    { label:"門診手術（最高）",keys:["surg_opd_max"], unit:"元" },
    { label:"住院手術（最高）",keys:["surg_hosp_max"],unit:"元" },
  ]},
  { label:"癌症保障", color:"#E74C3C", items:[
    { label:"初次罹癌", keys:["can_first"],  unit:"萬元" },
    { label:"癌症住院", keys:["can_hosp"],   unit:"元/日" },
    { label:"標靶藥物", keys:["can_target"], unit:"萬元" },
    { label:"安寧照護", keys:["can_hospice"],unit:"萬元" },
  ]},
  { label:"失能長照", color:"#27500A", items:[
    { label:"長照每月",   keys:["ltc_monthly"], unit:"萬元/月" },
    { label:"失能一次金", keys:["ltc_dis_amt"], unit:"萬元" },
    { label:"失能扶助金", keys:["ltc_dis_life"],unit:"萬元/月" },
  ]},
];

let currentUser    = null;
let familyData     = null;
let familyFileName = null;
let personDataMap  = {};
let currentPersonId = null;
let overrides      = {}; // pid_key → true/false
let medicalOverrides = {}; // rowkey_colkey → value
let targets        = {}; // itemKey → 目標值

window.addEventListener("nbs_nav_ready", async function(e) {
  currentUser       = e.detail.user;  // 賦值給全域變數
  familyData        = e.detail.familyData;
  currentPersonId   = e.detail.currentPersonId;
  familyFileName    = e.detail.familyFileName;

  if (!currentUser || !familyData) {
    document.getElementById("loading").innerHTML = "載入失敗：請重新登入";
    return;
  }

  try {
    // 載入所有成員個人資料
    // 載入所有成員個人資料 (效能優化：導入本地快取 SessionStorage + 併發請求)
    const activeMembers = familyData.members.filter(m => m.role !== "beneficiary_only");
    
    const fetchPromises = activeMembers.map(m => {
      const cacheKey = "nbs_person_" + m.personId;
      const cachedData = sessionStorage.getItem(cacheKey);

      if (cachedData) {
        // ⚡ 命中快取：0.01 秒瞬間載入，免等待雲端
        personDataMap[m.personId] = JSON.parse(cachedData);
        return Promise.resolve();
      } else {
        // ☁️ 無快取：向 GAS 抓取，拿完後立刻存入快取供下次使用
        return callGAS("readFile", {
          email: currentUser.email,
          fileType: "person",
          fileName: m.name + "_" + m.personId + ".json"
        }).then(pr => {
          if (pr.status === "ok") {
            personDataMap[m.personId] = pr.content;
            sessionStorage.setItem(cacheKey, JSON.stringify(pr.content));
          }
        }).catch(err => console.error("讀取 " + m.name + " 失敗", err));
      }
    });

    // 讓系統同時發出所有尚未快取的請求
    await Promise.all(fetchPromises);
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    renderTabs();
    renderContent();
  } catch(err) {
    console.error("summary.html init error", err);
    document.getElementById("loading").innerHTML = "載入失敗：" + err.message;
  }
});

function renderTabs() {
  const members = familyData.members.filter(m=>m.role!=="beneficiary_only");
  document.getElementById("member-tabs").innerHTML = members.map(m=>`
    <div class="member-tab ${currentPersonId===m.personId?'active':''}" onclick="switchPerson('${m.personId}')">
      ${m.name}${getInsAge(m.personId)!==null?' '+getInsAge(m.personId)+'歲':''}
    </div>`).join("");
}

function getInsAge(pid) {
  const p=personDataMap[pid];
  if(!p) return null;
  const b=new Date(p.profile.birthDate), a=new Date(p.profile.analysisDate||new Date());
  let y=a.getFullYear()-b.getFullYear();
  const mo=(a-new Date(b.getFullYear()+y,b.getMonth(),b.getDate()))/(1000*60*60*24*30.4375);
  if(mo>=6)y++;
  return y;
}

function switchPerson(pid) {
  currentPersonId=pid;
  renderTabs();
  renderContent();
}

function renderContent() {
  document.getElementById("loading").style.display="none";
  document.getElementById("content").style.display="block";
  const person  = personDataMap[currentPersonId];
  const policies= person?.policies||[];
  const active  = policies.filter(p=>p.status==="有效");
  const totalTWD= active.reduce((s,p)=>s+(p.premiumTWD||0),0);

  // 從所有保單彙整 coverage（相容舊格式 person.coverage + 新格式 policy.coverage）
  const coverage = {};
  Object.entries(person?.coverage||{}).forEach(([k,v])=>{
    if(typeof v==="number") coverage[k]=(coverage[k]||0)+v;
    else coverage[k]=v;
  });
  policies.forEach(p => {
    Object.entries(p.coverage||{}).forEach(([k,v]) => {
      if(typeof v === "number") coverage[k] = (coverage[k]||0)+v;
      else coverage[k] = v;
    });
  });

  // 計算 covTypes
  const covTypes = COVERAGE_TYPES.map(t=>{
    const auto = t.detect(active,coverage);
    const manual = overrides[currentPersonId+"_"+t.key];
    return {...t, covered: manual!==undefined?manual:auto, autoDetected:auto, isManual:manual!==undefined};
  });

  let html = "";

  // 頂部摘要
  html += `<div class="stat-row">
    <div class="stat-card" style="background:#E6F1FB">
      <div class="stat-label" style="color:#0C447C">年繳總保費</div>
      <div class="stat-value" style="color:#0C447C">NT$ ${(totalTWD/10000).toFixed(1)}萬</div>
    </div>
    <div class="stat-card" style="background:#EAF3DE">
      <div class="stat-label" style="color:#27500A">月均保費</div>
      <div class="stat-value" style="color:#27500A">NT$ ${Math.round(totalTWD/12).toLocaleString()}</div>
    </div>
  </div>`;

  // 保單號碼一覽
  html += `<div class="section-label">保單號碼一覽</div>`;
  html += `<div class="policy-group-block">`;
  const groups={};
  policies.forEach(p=>{ const k=p.policyNo||p.id; if(!groups[k]) groups[k]=[]; groups[k].push(p); });
  Object.entries(groups).forEach(([no,rows],gi)=>{
    const groupTotal=rows.reduce((s,p)=>s+(p.premiumTWD||0),0);
    html+=`<div style="border-top:${gi>0?'1px solid #f0f0f0':'none'}">
      <div class="group-header">
        <span class="policy-no-badge">${no}</span>
        <span class="group-company">${rows[0].company || '未知'}</span>
        <span class="group-total">年繳 NT$${groupTotal.toLocaleString()}</span>
      </div>`;
    rows.forEach(p=>{
      const cc=CAT_COLORS[p.category]||"#999";
      html+=`<div class="policy-row">
        <span class="cat-badge" style="background:${cc}20;color:${cc}">${p.category}</span>
        <span class="policy-name">${p.itemName||'—'}</span>
        <span class="policy-prem">${(p.premiumTWD||0).toLocaleString()}</span>
        <span class="status-badge status-${p.status||'有效'}">${p.status||'有效'}</span>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;

  // 保障覆蓋率環形圖
  html += `<div class="section-label">保障覆蓋率<button class="small-btn" onclick="openModal()">✏️ 手動調整</button><button class="small-btn" style="margin-left:6px;border-color:#378ADD;color:#378ADD" onclick="openTargetModal()">🎯 設定目標</button></div>`;
  html += `<div class="section-hint" style="display:flex;gap:10px;font-size:11px;color:#888;margin-bottom:8px;flex-wrap:wrap">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#27AE8F;margin-right:3px"></span>已規劃</span>

        </div>

    html += `</div></div>`;

  html += `</div>`;

  // 就醫情況

  html+=`<div style="background:#fff;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;margin-bottom:4px">

      <tbody>`;
  [["opd","門診"],["hosp","住院"]].forEach(([rk,rl],ri)=>{
    html+=`<tr style="border-top:${ri>0?'1px solid #f0f0f0':'none'}">
      <td>${rl}</td>`;
    ["disease","accident","cancer"].forEach(ck=>{
      if(rk==="opd"&&ck==="disease") {
        html+=`<td><div class="nhi-badge"><span>健保</span></div></td>`;
      } else {
        const mk=rk+"_"+ck;

        if(rk==="hosp"&&ck==="accident") { auto=sumCov(["daily_room"],policies,coverage); }
        if(rk==="hosp"&&ck==="cancer")   { auto=sumCov(["can_hosp"],policies,coverage)+sumCov(["daily_room"],policies,coverage); }
        if(rk==="opd"&&ck==="accident")  { auto=sumCov(["acc_opd"],policies,coverage)*10000; }

}

];

// KEY_MAP: GAP item key → coverage 欄位陣列
const GAP_KEY_MAP = {
  life_permanent:  { cats:["壽險保障"],          keys:["life_basic"] },
  life_term:       { cats:["壽險保障"],          keys:["life_term"] },
  investment:      { cats:["投資型保險"],        keys:[] },
  savings:         { cats:["儲蓄險","年金險"],   keys:[] },
  ci_special:      { cats:["重大疾病險","重大傷病險","特定傷病險"], keys:["can_first"] },
  cancer:          { cats:["重大疾病險"],        keys:["can_first","can_hosp"] },
  hosp_medical:    { cats:["醫療保障"],          keys:["hosp_room","daily_room_1_30","hosp_room_1_30"] },
  medical_surgery: { cats:["醫療保障"],          keys:["surg_hosp_max","surg_hosp","daily_room"] },
  accident:        { cats:["意外險"],            keys:["acc_special_max","acc_special","acc_disable_max","acc_disable"] },
  ltc_disable:     { cats:[],                   keys:["ltc_dis_amt"] },
  ltc_support:     { cats:[],                   keys:["ltc_dis_life","acc_support","ltc_support"] },
  ltc_care:        { cats:[],                   keys:["ltc_monthly","ltc_care"] },
  waiver:          { cats:[],                   keys:["ltc_waiver"] },
};

// 讀取某項目的目前合計值（同時支援 category 判斷和 coverage 欄位加總）
function getItemCurrent(key, policies, covOverrides) {
  const map = GAP_KEY_MAP[key];
  if(!map) return 0;

  // 手動覆蓋（overrides）優先
  const pid = currentPersonId;
  const manualKey = pid+"_"+key;
  if(covOverrides && covOverrides[manualKey] !== undefined) {
    return covOverrides[manualKey] ? 1 : 0;
  }

  // boolean 類型：依保單 category 判斷有/無
  if(["investment","savings","waiver"].includes(key)) {
    if(key==="investment") return policies.some(p=>p.category==="投資型保險")?1:0;
    if(key==="savings")    return policies.some(p=>["儲蓄險","年金險"].includes(p.category))?1:0;
    if(key==="waiver")     return policies.some(p=>p.coverage?.ltc_waiver)?1:0;
    return 0;
  }

  // 先看有無符合 category 的保單
  const hasCat = map.cats.length > 0 && policies.some(p=>map.cats.includes(p.category));

  // 再從各保單的 coverage 加總金額
  let total = 0;
  policies.forEach(p => {
    map.keys.forEach(k => {
      const v = p.coverage?.[k];
      if(v && typeof v === "number") total += v;
    });
  });

  // 有 category 但沒有 coverage 金額：回傳 1（表示有規劃但未填金額）
  if(hasCat && total === 0) return 1;
  return total;
}

// 取得單一項目狀態
function getItemStatus(key, policies, targets, covOverrides) {
  const item = GAP_GROUPS.flatMap(g=>g.items).find(i=>i.key===key);
  const current = getItemCurrent(key, policies, covOverrides);
  const target  = targets[key];
  const isBool  = item?.isBool;
  if(!current) return {status:"gap", current:0, target, pct:0};
  if(!target||isBool) return {status:"ok", current, target:null, pct:1};
  if(current>=target) return {status:"ok", current, target, pct:1};
  return {status:"insufficient", current, target, pct:current/target};
}

// ── 環形圓餅圖 ────────────────────────────────────────────
function buildDonutChart(policies, coverage, targets, covOverrides) {
  const allItems = GAP_GROUPS.flatMap(g=>g.items);
  const n = allItems.length;
  
  // 擴大畫布 viewBox (從 240 變為 400)，為外圍指引線與文字保留完美空間
  const cx=200, cy=140, OR=90, IR=48;
  const gapA=0.03, sliceA=(Math.PI*2-n*gapA)/n;

  let angle=-Math.PI/2;
  let paths="";
  let labels=""; // 收集外圍指引線與文字

  // 1. 建立獨立提取單一區塊圖例的工具函式
  function renderLegend(g) {
    let legendHtml = `<div style="font-size:12px;font-weight:500;color:${g.color};margin-bottom:8px;border-bottom:1px solid ${g.color}30;padding-bottom:4px">${g.label}</div>`;
    g.items.forEach(item => {
      const {status,pct} = getItemStatus(item.key, policies, targets, covOverrides);
      const icon = status==="gap"?"❌":status==="insufficient"?"⚠️":"✅";
      const dotColor = status==="gap"?"#e0e0e0":item.color;
      legendHtml += `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:5px">
        <div style="width:10px;height:10px;border-radius:2px;background:${dotColor};flex-shrink:0"></div>
        <span style="color:${status==="gap"?"#bbb":"#444"};flex:1;white-space:nowrap">${item.label}</span>
        <span>${icon}</span>
      </div>`;
    });
    return legendHtml;
  }

  // 2. 分別產生四大區塊的圖例
  const legendFamily = renderLegend(GAP_GROUPS[0]);
  const legendBefore = renderLegend(GAP_GROUPS[1]);
  const legendDuring = renderLegend(GAP_GROUPS[2]);
  const legendAfter  = renderLegend(GAP_GROUPS[3]);

  // 3. 繪製 SVG 扇形與外圍標籤
  allItems.forEach(item => {
    const {status,pct} = getItemStatus(item.key, policies, targets, covOverrides);
    const start = angle+gapA/2;
    const end   = angle+gapA/2+sliceA;
    const filledEnd = start + sliceA*pct;
    const midA  = start + sliceA/2; // 計算此扇形的正中央角度
    angle += sliceA+gapA;

    const px=(r,a)=>cx+r*Math.cos(a), py=(r,a)=>cy+r*Math.sin(a);
    const arc=(r,a1,a2,lg)=>`M${px(r,a1)},${py(r,a1)} A${r},${r} 0 ${lg} 1 ${px(r,a2)},${py(r,a2)}`;
    const donut=(a1,a2,lg,r1,r2)=>`M${px(r1,a1)},${py(r1,a1)} A${r1},${r1} 0 ${lg} 1 ${px(r1,a2)},${py(r1,a2)} L${px(r2,a2)},${py(r2,a2)} A${r2},${r2} 0 ${lg} 0 ${px(r2,a1)},${py(r2,a1)} Z`;

    // 畫底層灰
    paths += `<path d="${donut(start,end,sliceA>Math.PI?1:0,OR,IR)}" fill="#f0f0f0"/>`;
    // 畫已規劃
    if(pct>0.01) paths += `<path d="${donut(start,filledEnd,sliceA*pct>Math.PI?1:0,OR,IR)}" fill="${item.color}"/>`;
    // 畫不足虛線
    if(status==="insufficient" && pct<0.99) {
      const gapSize=sliceA*(1-pct);
      paths += `<path d="${donut(filledEnd,end,gapSize>Math.PI?1:0,OR,IR)}" fill="none" stroke="${item.color}" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.45"/>`;
    }

    // ── 自動計算外圍指引線 (Leader Lines) ──
    const isRight = Math.cos(midA) >= 0; // 判斷在左半邊還是右半邊
    const x0 = px(OR, midA), y0 = py(OR, midA); // 起點在圓餅邊緣
    const x1 = px(OR + 12, midA), y1 = py(OR + 12, midA); // 往外延伸的轉折點
    const x2 = x1 + (isRight ? 15 : -15), y2 = y1; // 水平延伸線

    // 文字屬性
    const textAnchor = isRight ? "start" : "end";
    const textX = x2 + (isRight ? 4 : -4);
    const textColor = status === "gap" ? "#aaa" : "#555";
    const fw = status === "ok" ? "500" : "400";
    const prefix = status === "gap" ? "❌ " : status === "insufficient" ? "⚠️ " : "";

    labels += `
      <polyline points="${x0},${y0} ${x1},${y1} ${x2},${y2}" fill="none" stroke="${item.color}60" stroke-width="1.2"/>
      <circle cx="${x0}" cy="${y0}" r="2" fill="${item.color}"/>
      <text x="${textX}" y="${y2+4}" text-anchor="${textAnchor}" style="font-size:11px;fill:${textColor};font-weight:${fw};letter-spacing:0.03em">${prefix}${item.label}</text>
    `;
  });

  const okN = allItems.filter(item=>getItemStatus(item.key,policies,targets,covOverrides).status==="ok").length;
  const gapN = allItems.filter(item=>getItemStatus(item.key,policies,targets,covOverrides).status==="gap").length;
  const insN = allItems.filter(item=>getItemStatus(item.key,policies,targets,covOverrides).status==="insufficient").length;

  // 4. 全新網格排版輸出 (支援 RWD 自適應縮放)
  return `<div style="display:flex;flex-direction:column;width:100%">
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;padding:0">
      <svg viewBox="0 0 400 280" style="width:100%; max-width:440px; flex-shrink:0;">
        ${paths}
        ${labels}
        <text x="${cx}" y="${cy-14}" text-anchor="middle" style="font-size:11px;fill:#888">✅ 達標</text>
        <text x="${cx}" y="${cy+4}"  text-anchor="middle" style="font-size:24px;font-weight:bold;fill:#333">${okN}</text>
        <text x="${cx}" y="${cy+20}" text-anchor="middle" style="font-size:10px;fill:#E74C3C">❌ 缺口 ${gapN}</text>
        <text x="${cx}" y="${cy+34}" text-anchor="middle" style="font-size:10px;fill:#F5A623">⚠ 不足 ${insN}</text>
      </svg>
      <div style="min-width:170px;background:#fafafa;padding:12px 16px;border-radius:10px;border:1px solid #f0f0f0">
        ${legendFamily}
      </div>
    </div>
    
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:16px;border-top:1px dashed #e8e8e8;padding-top:20px">
      <div>${legendBefore}</div>
      <div>${legendDuring}</div>
      <div>${legendAfter}</div>
    </div>
  </div>`;
}
// ── 缺口／不足分析 ────────────────────────────────────────
function buildGapAnalysis(policies, coverage, targets, covOverrides) {
  const allItems = GAP_GROUPS.flatMap(g=>g.items);
  const gaps = [], insufficients = [];
  allItems.forEach(item => {
    const s = getItemStatus(item.key, policies, targets, covOverrides);
    if(s.status==="gap") gaps.push({item, ...s});
    if(s.status==="insufficient") insufficients.push({item, ...s});
  });

  let html = "";

  // 不足項目
  if(insufficients.length) {
    html += `<div style="font-size:11px;font-weight:500;color:#F5A623;margin-bottom:8px">⚠ 規劃不足</div>`;
    insufficients.forEach(({item,current,target,pct}) => {
      html += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:12px;color:#555">${item.label}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span style="font-size:11px;color:#555;font-weight:500">${current.toLocaleString()}${item.unit}</span>
            <span style="font-size:10px;color:#aaa">/ 目標 ${target?.toLocaleString()}${item.unit}</span>
          </div>
        </div>
        <div style="height:7px;background:#f0f0f0;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${Math.round(pct*100)}%;background:${item.color};border-radius:99px"></div>
        </div>
        <div style="font-size:11px;color:#E74C3C;margin-top:3px">尚不足 ${(target-current).toLocaleString()}${item.unit}（${Math.round(pct*100)}% 達成）</div>
      </div>`;
    });
  }

  // 缺口項目
  if(gaps.length) {
    html += `<div style="font-size:11px;font-weight:500;color:#E74C3C;margin-bottom:8px;margin-top:${insufficients.length?12:0}px">❌ 尚未規劃</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`;
    gaps.forEach(({item}) => {
      html += `<span style="padding:3px 10px;background:#FCEBEB;border:1px solid #F0A8BF;border-radius:99px;font-size:12px;color:#791F1F">${item.label}</span>`;
    });
    html += `</div><div style="font-size:11px;color:#aaa">💡 可與保戶討論是否有需要規劃</div>`;
  }

  if(!insufficients.length && !gaps.length) {
    html += `<div style="font-size:12px;color:#27AE8F;text-align:center;padding:12px 0">🎉 所有已設目標項目均達標！</div>`;
  }

  html += `<button onclick="openTargetModal()" style="width:100%;margin-top:10px;padding:8px;background:transparent;border:1px dashed #ddd;border-radius:8px;font-size:12px;color:#666;cursor:pointer;font-family:inherit">🎯 設定 / 修改目標保額</button>`;
  return html;
}

function buildPieChart(active, covTypes) {
  // 計算各細項保費
  const pieMap={};
  active.forEach(p=>{
    const prem=p.premiumTWD||0, cat=p.category;
    if(cat==="壽險保障") pieMap["life"]=(pieMap["life"]||0)+prem;
    else if(cat==="意外險") {
      const types=["acc_death","acc_medical","acc_hosp"].filter(k=>covTypes.find(t=>t.key===k)?.covered);
      const cnt=types.length||1;
      types.forEach(k=>{ pieMap[k]=(pieMap[k]||0)+Math.round(prem/cnt); });
    }
    else if(cat==="醫療保障") {
      const types=["hosp_real","hosp_daily","hosp_surg"].filter(k=>covTypes.find(t=>t.key===k)?.covered);
      const cnt=types.length||1;
      types.forEach(k=>{ pieMap[k]=(pieMap[k]||0)+Math.round(prem/cnt); });
    }
    else if(["重大疾病險","重大傷病險","特定傷病險"].includes(cat)) {
      const hasCancer=covTypes.find(t=>t.key==="cancer")?.covered;
      if(hasCancer){ const s=Math.round(prem*0.4); pieMap["cancer"]=(pieMap["cancer"]||0)+s; pieMap["ci"]=(pieMap["ci"]||0)+(prem-s); }
      else pieMap["ci"]=(pieMap["ci"]||0)+prem;
    }
    else if(cat==="儲蓄險")     pieMap["savings"]    =(pieMap["savings"]||0)+prem;
    else if(cat==="年金險")     pieMap["annuity"]    =(pieMap["annuity"]||0)+prem;
    else if(cat==="投資型保險") pieMap["investment"] =(pieMap["investment"]||0)+prem;
  });

  const PIE_CATS=[
    {key:"life",label:"壽險保障",color:"#4A90D9"},
    {key:"acc_death",label:"意外身故",color:"#F5A623"},
    {key:"acc_medical",label:"意外醫療",color:"#F08C00"},
    {key:"acc_hosp",label:"意外住院",color:"#D97706"},
    {key:"hosp_real",label:"實支實付",color:"#27AE8F"},
    {key:"hosp_daily",label:"住院日額",color:"#1E8A72"},
    {key:"hosp_surg",label:"手術險",color:"#166756"},
    {key:"ci",label:"重大疾病",color:"#9B59B6"},
    {key:"cancer",label:"癌症險",color:"#E74C3C"},
    {key:"ltc",label:"長照險",color:"#27500A"},
    {key:"disable",label:"失能險",color:"#5BAD6F"},
    {key:"savings",label:"儲蓄險",color:"#E8638A"},
    {key:"annuity",label:"年金險",color:"#C0392B"},
    {key:"investment",label:"投資型",color:"#95A5A6"},
  ];

  const data=PIE_CATS.map(c=>({...c,value:pieMap[c.key]||0})).filter(d=>d.value>0);
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total) return '<div style="padding:20px;color:#bbb;text-align:center">尚無資料</div>';

  const cx=110,cy=110,r=95;
  let cum=-Math.PI/2;
  let paths="";
  data.forEach(d=>{
    const angle=(d.value/total)*Math.PI*2;
    const x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum);
    cum+=angle;
    const x2=cx+r*Math.cos(cum),y2=cy+r*Math.sin(cum);
    const large=angle>Math.PI?1:0;
    paths+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${d.color}" stroke="#fff" stroke-width="2"/>`;
  });

  const legend=data.map(d=>`
    <div class="pie-legend-item">
      <div class="pie-dot" style="background:${d.color}"></div>
      <span style="color:#555;min-width:72px">${d.label}</span>
      <span style="color:#aaa">${Math.round(d.value/total*100)}%</span>
    </div>`).join("");

  return `<div class="pie-container">
    <svg width="220" height="220" style="flex-shrink:0"><g>${paths}</g></svg>
    <div class="pie-legend">${legend}</div>
  </div>`;
}

function sumCov(keys,policies,coverage) {
  let t=0;
  // 新格式：從各保單的 coverage 讀取
  policies.forEach(p=>{
    keys.forEach(k=>{
      const v = p.coverage?.[k];
      if(v && typeof v==="number") t+=v;
    });
  });
  // 相容舊格式：coverage 是 {policyId_key: value} 格式
  if(t===0) {
    policies.forEach(p=>{ keys.forEach(k=>{ const v=coverage[p.id+"_"+k]; if(v) t+=v; }); });
  }
  return t;
}

function openTargetModal() {

  let bodyHtml = `<div style="font-size:11px;color:#888;background:#f7f7f5;padding:8px 12px;border-radius:8px;margin-bottom:14px;line-height:1.6">
    設定後顯示「不足」；未設定的項目只顯示「有/無（缺口）」，不計算差額。
  </div>`;

  GAP_GROUPS.forEach(g => {
    bodyHtml += `<div style="font-size:12px;font-weight:500;color:${g.color};padding:4px 10px;background:${g.color}15;border-radius:5px;margin-bottom:8px">${g.label}</div>`;
    g.items.filter(item=>!item.isBool).forEach(item => {
      const current = getItemCurrent(item.key, active);
      const tval = targets[item.key]||"";
      bodyHtml += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <label style="font-size:13px;color:#333">${item.label}</label>
          <span style="font-size:11px;color:#aaa">目前：${current||0} ${item.unit}</span>
        </div>
        <div style="display:flex;align-items:center;border:1px solid #e0e0e0;border-radius:7px;overflow:hidden">
          <input type="number" id="target_${item.key}" value="${tval}" placeholder="不設定（只顯示有/無）"
            style="flex:1;padding:8px 12px;font-size:13px;border:none;outline:none;font-family:inherit"/>
          ${item.unit?`<span style="padding:0 10px;font-size:11px;color:#aaa;background:#fafafa;border-left:1px solid #f0f0f0">${item.unit}</span>`:""}
        </div>
      </div>`;
    });
    bodyHtml += `<div style="margin-bottom:14px"></div>`;
  });

  // 建立 Modal
  const existing = document.getElementById("target-modal-overlay");
  if(existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.id = "target-modal-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:flex;align-items:flex-end;justify-content:center";
  overlay.innerHTML = `<div style="background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <span style="font-weight:500;font-size:15px">🎯 設定目標保額</span>
      <button onclick="document.getElementById('target-modal-overlay')?.remove()" style="background:none;border:none;font-size:22px;color:#999;cursor:pointer;line-height:1">×</button>
    </div>
    ${bodyHtml}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="document.getElementById('target-modal-overlay')?.remove()"
        style="flex:1;padding:10px;background:transparent;color:#666;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-family:inherit">取消</button>
      <button onclick="saveTargets()"
        style="flex:2;padding:10px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit">儲存目標</button>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function saveTargets() {
  GAP_GROUPS.flatMap(g=>g.items.filter(i=>!i.isBool)).forEach(item => {
    const el = document.getElementById("target_"+item.key);
    if(el) {
      const v = parseFloat(el.value);
      if(!isNaN(v) && v > 0) targets[item.key] = v;
      else delete targets[item.key];
    }
  });
  document.getElementById("target-modal-overlay")?.remove();
  renderContent(); // 重新渲染
}

function openModal() {
  const person  = personDataMap[currentPersonId];
  const policies= person?.policies||[];
  const coverage= person?.coverage||{};
  const active  = policies.filter(p=>p.status==="有效");
  const covTypes= COVERAGE_TYPES.map(t=>{
    const auto=t.detect(active,coverage);
    const manual=overrides[currentPersonId+"_"+t.key];
    return {...t,covered:manual!==undefined?manual:auto,autoDetected:auto,isManual:manual!==undefined};
  });

  const groups=["壽險","意外","醫療","重大","癌症","長照","財務"];
  let html="";
  groups.forEach(g=>{
    const gTypes=covTypes.filter(t=>t.group===g);
    const gc=GROUP_COLORS[g];
    html+=`<div class="type-group-label" style="color:${gc}">${g}</div><div class="type-tags">`;
    gTypes.forEach(t=>{
      html+=`<div class="type-tag" id="tag_${t.key}" onclick="toggleOverride('${t.key}')"
        style="background:${t.covered?t.color+'18':'#f5f5f5'};border:1.5px ${t.covered?'solid':'dashed'} ${t.covered?t.color:'#ddd'}">
        <div class="type-tag-dot" style="background:${t.covered?t.color:'transparent'};border:${t.covered?'none':'1.5px solid #ccc'}"></div>
        <span class="type-tag-label" style="color:${t.covered?'#333':'#bbb'};font-weight:${t.covered?500:400}">${t.label}</span>
        ${t.isManual?'<span class="manual-badge">手動</span>':''}
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById("modal-types").innerHTML=html;
  document.getElementById("edit-modal").classList.add("active");
}

function toggleOverride(key) {
  const fk=currentPersonId+"_"+key;
  const person=personDataMap[currentPersonId];
  const active=(person?.policies||[]).filter(p=>p.status==="有效");
  const coverage=person?.coverage||{};
  const t=COVERAGE_TYPES.find(x=>x.key===key);
  const auto=t.detect(active,coverage);
  const cur=overrides[fk];
  if(cur===undefined) overrides[fk]=!auto;
  else delete overrides[fk];
  // 重新渲染 modal tags
  openModal();
}

function closeModal() { document.getElementById("edit-modal").classList.remove("active"); renderContent(); }
// 手動調整 toggleOverride 後自動重新渲染圓餅圖
const _origToggle = toggleOverride;
function toggleOverride(key) {
  const fk=currentPersonId+"_"+key;
  const person=personDataMap[currentPersonId];
  const active=(person?.policies||[]).filter(p=>p.status==="有效");
  const cov=person?.coverage||{};
  const t=COVERAGE_TYPES.find(x=>x.key===key);
  const auto=t?t.detect(active,cov):false;
  const cur=overrides[fk];
  if(cur===undefined) overrides[fk]=!auto;
  else delete overrides[fk];
  openModal(); // 重新渲染 modal
}
function handleModalOverlay(e) { if(e.target===document.getElementById("edit-modal")) closeModal(); }

function goBack() { window.location.href="family.html"; }

function callGAS(action,params) {
  if (action === "saveFile") {
    return fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action, ...params }),
    }).then(r => r.json());
  }
  
  const url=new URL(GAS_URL);
  url.searchParams.set("action",action);
  Object.entries(params||{}).forEach(([k,v])=>{
    if(typeof v==="object") url.searchParams.set(k,encodeURIComponent(JSON.stringify(v)));
    else if(v!==null&&v!==undefined) url.searchParams.set(k,v);
  });
  return fetch(url.toString()).then(r=>r.json());
}
