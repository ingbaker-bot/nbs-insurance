<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 附約保障清單</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; min-height: 100vh; color: #1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }
    .save-btn { padding:6px 16px; background:#378ADD; color:#fff; border:none; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; }
    .save-btn:disabled { background:#ccc; }

    /* 成員 Tab */
    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .main { padding:16px; max-width:560px; margin:0 auto; }

    /* 群組區塊 */
    .group-block { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:10px; }
    .group-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px; cursor:pointer; user-select:none;
    }
    .group-header-left { display:flex; align-items:center; gap:10px; }
    .group-icon { font-size:18px; }
    .group-title { font-size:14px; font-weight:500; }
    .group-count { font-size:11px; padding:2px 7px; border-radius:99px; background:#f0f0f0; color:#888; }
    .group-chevron { font-size:14px; color:#ccc; transition:transform 0.2s; }
    .group-chevron.open { transform: rotate(90deg); }

    .group-body { padding:12px 14px; border-top:1px solid #f0f0f0; }

    /* 欄位網格 */
    .fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field-full { grid-column: 1 / -1; }

    .field { }
    .field label { display:block; font-size:11px; color:#888; margin-bottom:3px; }

    .input-with-unit { display:flex; align-items:center; border:1px solid #e0e0e0; border-radius:6px; overflow:hidden; background:#fff; }
    .input-with-unit:focus-within { border-color:#378ADD; }
    .input-with-unit input { flex:1; padding:7px 8px; font-size:13px; border:none; outline:none; background:transparent; font-family:inherit; min-width:0; }
    .input-with-unit .unit { padding:0 8px; font-size:11px; color:#aaa; background:#fafafa; border-left:1px solid #f0f0f0; white-space:nowrap; }

    /* 範圍輸入 */
    .range-row { display:flex; align-items:center; gap:6px; }
    .range-row input { flex:1; padding:7px 8px; font-size:13px; border:1px solid #e0e0e0; border-radius:6px; outline:none; font-family:inherit; min-width:0; }
    .range-row input:focus { border-color:#378ADD; }
    .range-sep { font-size:12px; color:#aaa; flex-shrink:0; }
    .range-unit { font-size:11px; color:#aaa; flex-shrink:0; }

    /* 保費豁免 checkbox */
    .checkbox-row { display:flex; align-items:center; gap:8px; padding:7px 0; cursor:pointer; }
    .checkbox-row input[type=checkbox] { width:16px; height:16px; cursor:pointer; accent-color:#378ADD; }
    .checkbox-row span { font-size:13px; color:#555; }

    /* 已填統計 */
    .stats-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .stat-pill { font-size:11px; padding:3px 10px; border-radius:99px; background:#E6F1FB; color:#0C447C; }

    /* 儲存提示 */
    .saved-hint { font-size:11px; color:#27AE8F; text-align:center; padding:4px 0; display:none; }

    /* spinner */
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#378ADD; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .loading { text-align:center; padding:40px; color:#bbb; font-size:13px; }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="goBack()">‹</button>
  <div class="header-title">附約保障清單</div>
  <button class="save-btn" id="save-btn" onclick="saveCoverage()">儲存</button>
</div>

<!-- 成員 Tab -->
<div class="member-tabs" id="member-tabs"></div>

<div class="main">
  <div id="stats-row" class="stats-row"></div>
  <div id="loading" class="loading"><span class="spinner"></span> 載入中…</div>
  <div id="content" style="display:none"></div>
  <div class="saved-hint" id="saved-hint">✓ 已儲存</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

const GROUPS = [
  { key:"accident", label:"意外險", icon:"⚡", color:"#633806", bg:"#FAEEDA", fields:[
    { key:"acc_special",    label:"特定事故加倍給付",    unit:"萬元" },
    { key:"acc_opd",        label:"門診醫療",            unit:"萬元/次" },
    { key:"acc_food",       label:"食物中毒",            unit:"元/次" },
    { key:"acc_fracture",   label:"骨折未住院",          unit:"元" },
    { key:"acc_dislocation",label:"脫臼復位術",          unit:"元" },
    { key:"acc_icu",        label:"加護病房",            unit:"元/日" },
    { key:"acc_burn",       label:"重大燒燙傷",          unit:"萬元" },
    { key:"acc_disable",    label:"意外失能（殘廢）",    unit:"萬元" },
    { key:"acc_work",       label:"意外喪失工作能力",    unit:"萬元/月" },
    { key:"acc_support",    label:"失能扶助",            unit:"萬元/月" },
  ]},
  { key:"hospitalize", label:"住院醫療（實支實付）", icon:"🏥", color:"#085041", bg:"#E1F5EE", fields:[
    { key:"hosp_room",       label:"病房費",              unit:"元/日" },
    { key:"hosp_surgery",    label:"手術費",              unit:"元/次" },
    { key:"hosp_misc",       label:"醫療雜費",            unit:"元/次" },
    { key:"hosp_icu",        label:"加護病房費",          unit:"元/日" },
    { key:"hosp_organ",      label:"重大器官移植",        unit:"萬元" },
    { key:"hosp_limit_per",  label:"每次住院總限額",      unit:"元/次" },
    { key:"hosp_limit_acct", label:"給付限額（帳戶）",   unit:"萬元" },
  ]},
  { key:"daily", label:"日額型住院", icon:"📅", color:"#0C447C", bg:"#E6F1FB", fields:[
    { key:"daily_room",      label:"住院日額病房費",        unit:"元/日" },
    { key:"daily_discharge", label:"出院療養金",            unit:"元/日" },
    { key:"daily_icu",       label:"加護病房",              unit:"元/日" },
    { key:"daily_burn",      label:"燒燙傷中心",            unit:"元/日" },
    { key:"daily_infect",    label:"法定傳染病",            unit:"元/日" },
    { key:"daily_senior",    label:"老年住院關懷",          unit:"元/次" },
    { key:"daily_opd",       label:"住院前後門診（1週）",   unit:"元/次" },
    { key:"daily_er",        label:"住院前急診",            unit:"元/次" },
    { key:"daily_transport", label:"緊急醫療轉送",          unit:"元/次" },
    { key:"daily_device",    label:"特殊醫材購置補助",      unit:"元/次" },
    { key:"daily_major",     label:"罹患重大疾病（1次）",   unit:"元" },
    { key:"daily_antirej",   label:"抗排斥藥物",            unit:"元" },
    { key:"daily_radiation", label:"代替手術癌症放射線",    unit:"元" },
    { key:"daily_limit",     label:"保險給付限制",          unit:"萬元" },
  ]},
  { key:"surgery", label:"定額手術", icon:"🔪", color:"#3C3489", bg:"#EEEDFE", fields:[
    { key:"surg_opd",     label:"門診手術醫療保險金",     unit:"元", type:"range" },
    { key:"surg_special", label:"特定處置項目保險金",     unit:"元", type:"range" },
    { key:"surg_hosp",    label:"住院手術醫療保險金",     unit:"元", type:"range" },
    { key:"surg_nurse",   label:"住院手術療養保險金",     unit:"元" },
    { key:"surg_limit",   label:"保險給付限制",           unit:"萬元" },
  ]},
  { key:"cancer", label:"癌症醫療", icon:"🎗️", color:"#791F1F", bg:"#FCEBEB", fields:[
    { key:"can_low",            label:"低侵襲性／特定癌症",        unit:"元" },
    { key:"can_first",          label:"初次罹患癌症（一次）",      unit:"萬元" },
    { key:"can_hosp",           label:"癌症住院醫療",              unit:"元/日" },
    { key:"can_discharge",      label:"出院療養",                  unit:"元/日" },
    { key:"can_opd",            label:"癌症門診醫療",              unit:"元/次" },
    { key:"can_proton",         label:"癌症質子治療",              unit:"萬元/次" },
    { key:"can_radiation",      label:"放射線治療",                unit:"元/日" },
    { key:"can_gene",           label:"癌症基因檢測",              unit:"萬元" },
    { key:"can_chemo",          label:"化學治療",                  unit:"元/日" },
    { key:"can_target",         label:"標靶藥物治療",              unit:"萬元" },
    { key:"can_davinci",        label:"達文西手術",                unit:"萬元" },
    { key:"can_breast",         label:"義乳重建手術",              unit:"萬元" },
    { key:"can_immune",         label:"自體免疫細胞治療",          unit:"萬元" },
    { key:"can_marrow",         label:"骨髓移植／幹細胞移植",      unit:"萬元" },
    { key:"can_total",          label:"癌症給付總限額",            unit:"萬元" },
    { key:"can_hospice",        label:"安寧照護",                  unit:"萬元" },
    { key:"can_death",          label:"癌症身故",                  unit:"萬元" },
    { key:"can_real_hosp_limit",label:"實支實付住院醫療限額",      unit:"萬元" },
    { key:"can_real_opd_limit", label:"實支實付門診醫療限額",      unit:"萬元" },
  ]},
  { key:"ltc", label:"失能長照", icon:"🤝", color:"#27500A", bg:"#EAF3DE", fields:[
    { key:"ltc_care",    label:"長照／長看關懷保險金",           unit:"萬元" },
    { key:"ltc_monthly", label:"長期照護療養（每月）",           unit:"萬元" },
    { key:"ltc_life",    label:"生活扶助／重大傷病（每月）",     unit:"萬元" },
    { key:"ltc_yr",      label:"特定傷病保險金（每年）",         unit:"萬元/年" },
    { key:"ltc_mo",      label:"特定傷病保險金（每月）",         unit:"萬元/月" },
    { key:"ltc_dis_amt", label:"失能（殘廢）保險金",             unit:"萬元" },
    { key:"ltc_dis_life",label:"失能（殘廢）生活扶助金",         unit:"萬元" },
    { key:"ltc_waiver",  label:"保費豁免",                       unit:"", type:"checkbox" },
  ]},
];

let currentUser    = null;
let familyData     = null;
let familyFileName = null;
let personDataMap  = {};
let currentPersonId = null;
let openGroups     = { accident:true };  // 預設打開意外險
let dirty          = false;

// ── 初始化 ────────────────────────────────────────────────
window.onload = async function() {
  const saved = localStorage.getItem("nbs_user");
  if (!saved) { window.location.href = "index.html"; return; }
  currentUser = JSON.parse(saved);

  familyFileName = localStorage.getItem("nbs_current_family");
  if (!familyFileName) { window.location.href = "main.html"; return; }

  try {
    const fr = await callGAS("readFile", { email: currentUser.email, fileType:"family", fileName: familyFileName });
    familyData = fr.content;

    for (const m of familyData.members.filter(m => m.role !== "beneficiary_only")) {
      const pr = await callGAS("readFile", { email: currentUser.email, fileType:"person", fileName: m.name+"_"+m.personId+".json" });
      if (pr.status === "ok") personDataMap[m.personId] = pr.content;
    }

    // 預設選主要成員或 localStorage 記錄的成員
    const savedPerson = localStorage.getItem("nbs_current_person");
    const primary = familyData.members.find(m => m.role === "primary");
    currentPersonId = savedPerson || primary?.personId;

    renderTabs();
    renderContent();
  } catch(e) {
    document.getElementById("loading").innerHTML = '<div style="color:#e74c3c">載入失敗：'+e.message+'</div>';
  }
};

// ── Tab ───────────────────────────────────────────────────
function renderTabs() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  document.getElementById("member-tabs").innerHTML = members.map(m => `
    <div class="member-tab ${currentPersonId===m.personId?'active':''}" onclick="switchPerson('${m.personId}')">
      ${m.name}
    </div>`).join("");
}

function switchPerson(pid) {
  if (dirty && !confirm("有未儲存的變更，確定要切換？")) return;
  currentPersonId = pid;
  dirty = false;
  renderTabs();
  renderContent();
}

// ── 渲染內容 ──────────────────────────────────────────────
function renderContent() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";

  const person = personDataMap[currentPersonId];
  const coverage = person?.coverage || {};

  // 統計已填項目
  const allFields = GROUPS.flatMap(g => g.fields);
  const filled = allFields.filter(f => {
    if (f.type === "range") return coverage[f.key+"_min"] || coverage[f.key+"_max"];
    if (f.type === "checkbox") return coverage[f.key];
    return coverage[f.key];
  }).length;

  document.getElementById("stats-row").innerHTML = `
    <span class="stat-pill">已填 ${filled} / ${allFields.length} 項</span>`;

  // 渲染群組
  let html = "";
  GROUPS.forEach(g => {
    const filledCount = g.fields.filter(f => {
      if (f.type === "range") return coverage[f.key+"_min"] || coverage[f.key+"_max"];
      if (f.type === "checkbox") return coverage[f.key];
      return coverage[f.key];
    }).length;

    const isOpen = openGroups[g.key];
    html += `
    <div class="group-block">
      <div class="group-header" onclick="toggleGroup('${g.key}')" style="background:${g.bg}">
        <div class="group-header-left">
          <span class="group-icon">${g.icon}</span>
          <span class="group-title" style="color:${g.color}">${g.label}</span>
          <span class="group-count">${filledCount}/${g.fields.length}</span>
        </div>
        <span class="group-chevron ${isOpen?'open':''}">›</span>
      </div>
      ${isOpen ? renderGroupBody(g, coverage) : ""}
    </div>`;
  });

  document.getElementById("content").innerHTML = html;
}

function renderGroupBody(g, coverage) {
  let fieldsHtml = "";
  g.fields.forEach(f => {
    if (f.type === "checkbox") {
      fieldsHtml += `
        <div class="field field-full">
          <label class="checkbox-row" onclick="toggleCheckbox('${f.key}')">
            <input type="checkbox" id="cov_${f.key}" ${coverage[f.key]?"checked":""} onchange="markDirty()" />
            <span>${f.label}</span>
          </label>
        </div>`;
    } else if (f.type === "range") {
      fieldsHtml += `
        <div class="field field-full">
          <label>${f.label}</label>
          <div class="range-row">
            <input type="number" id="cov_${f.key}_min" placeholder="最低" value="${coverage[f.key+"_min"]||""}" oninput="markDirty()" />
            <span class="range-sep">～</span>
            <input type="number" id="cov_${f.key}_max" placeholder="最高" value="${coverage[f.key+"_max"]||""}" oninput="markDirty()" />
            <span class="range-unit">${f.unit}</span>
          </div>
        </div>`;
    } else {
      fieldsHtml += `
        <div class="field">
          <label>${f.label}</label>
          <div class="input-with-unit">
            <input type="number" id="cov_${f.key}" placeholder="—" value="${coverage[f.key]||""}" oninput="markDirty()" />
            <span class="unit">${f.unit}</span>
          </div>
        </div>`;
    }
  });

  return `<div class="group-body"><div class="fields-grid">${fieldsHtml}</div></div>`;
}

function toggleGroup(key) {
  openGroups[key] = !openGroups[key];
  // 收集目前所有值再重渲染
  collectCurrentValues();
  renderContent();
}

function toggleCheckbox(key) {
  markDirty();
}

function markDirty() {
  dirty = true;
}

// ── 收集畫面上的值 ────────────────────────────────────────
function collectCurrentValues() {
  const person = personDataMap[currentPersonId];
  if (!person) return;
  if (!person.coverage) person.coverage = {};

  GROUPS.forEach(g => {
    if (!openGroups[g.key]) return; // 只收集展開的群組
    g.fields.forEach(f => {
      if (f.type === "checkbox") {
        const el = document.getElementById("cov_"+f.key);
        if (el) person.coverage[f.key] = el.checked;
      } else if (f.type === "range") {
        const minEl = document.getElementById("cov_"+f.key+"_min");
        const maxEl = document.getElementById("cov_"+f.key+"_max");
        if (minEl) {
          const v = parseFloat(minEl.value);
          person.coverage[f.key+"_min"] = isNaN(v) ? null : v;
        }
        if (maxEl) {
          const v = parseFloat(maxEl.value);
          person.coverage[f.key+"_max"] = isNaN(v) ? null : v;
        }
      } else {
        const el = document.getElementById("cov_"+f.key);
        if (el) {
          const v = parseFloat(el.value);
          person.coverage[f.key] = isNaN(v) ? null : v;
        }
      }
    });
  });
}

// ── 儲存 ─────────────────────────────────────────────────
async function saveCoverage() {
  collectCurrentValues();
  // 收集所有群組（包含收起的）已在 personDataMap 中，直接儲存
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "儲存中…";

  try {
    const person = personDataMap[currentPersonId];
    person.updatedAt = new Date().toISOString();
    const member = familyData.members.find(m => m.personId === currentPersonId);

    await callGAS("saveFile", {
      email: currentUser.email,
      fileType: "person",
      fileId: currentPersonId,
      fileName: member.name + "_" + currentPersonId + ".json",
      content: person,
    });

    dirty = false;
    const hint = document.getElementById("saved-hint");
    hint.style.display = "block";
    setTimeout(() => hint.style.display = "none", 2000);

    // 重新渲染統計數字
    renderContent();
  } catch(e) {
    alert("儲存失敗：" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "儲存";
  }
}

// ── 工具函式 ──────────────────────────────────────────────
function goBack() {
  if (dirty && !confirm("有未儲存的變更，確定要離開？")) return;
  window.location.href = "family.html";
}

function callGAS(action, params) {
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  Object.entries(params || {}).forEach(([k, v]) => {
    if (typeof v === "object") {
      url.searchParams.set(k, encodeURIComponent(JSON.stringify(v)));
    } else if (v !== null && v !== undefined) {
      url.searchParams.set(k, v);
    }
  });
  return fetch(url.toString()).then(res => res.json());
}
</script>
</body>
</html>
