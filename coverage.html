<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBS - 附約保障清單</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; min-height:100vh; color:#1a1a1a; }

    .header { background:#fff; border-bottom:1px solid #eee; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .back-btn { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:0; }
    .header-title { font-size:15px; font-weight:500; flex:1; }
    .header-sub { font-size:11px; color:#bbb; }

    .member-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; overflow-x:auto; padding:0 16px; }
    .member-tab { padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; color:#888; }
    .member-tab.active { border-bottom-color:#378ADD; color:#378ADD; font-weight:500; }

    .main { padding:16px; max-width:560px; margin:0 auto; }

    /* 保單列表 */
    .policy-item {
      background:#fff; border:1px solid #e8e8e8; border-radius:10px;
      padding:12px 14px; margin-bottom:8px; cursor:pointer;
      display:flex; align-items:center; gap:12px;
      transition:background 0.12s;
    }
    .policy-item:hover { background:#fafafa; }
    .policy-item.has-coverage { border-left:3px solid #27AE8F; }
    .policy-item.no-coverage  { border-left:3px solid #e0e0e0; }

    .policy-item-left { flex:1; min-width:0; }
    .policy-item-no {
      font-size:11px; font-weight:500; font-family:monospace;
      background:#E6F1FB; color:#0C447C;
      padding:1px 7px; border-radius:99px; display:inline-block; margin-bottom:4px;
    }
    .policy-item-name { font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .policy-item-meta { font-size:11px; color:#aaa; margin-top:2px; }
    .policy-item-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
    .coverage-count {
      font-size:11px; padding:2px 7px; border-radius:99px;
      background:#EAF3DE; color:#27500A;
    }
    .coverage-count.zero { background:#f0f0f0; color:#aaa; }
    .chevron { color:#ccc; font-size:16px; }

    /* 總覽卡片 */
    .summary-card {
      background:#fff; border:1px solid #e8e8e8; border-radius:10px;
      padding:14px; margin-bottom:14px;
    }
    .summary-title { font-size:12px; font-weight:500; color:#999; margin-bottom:10px; letter-spacing:0.05em; }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .summary-item { background:#f7f7f5; border-radius:8px; padding:8px 10px; }
    .summary-label { font-size:10px; color:#aaa; margin-bottom:2px; }
    .summary-value { font-size:13px; font-weight:500; color:#333; }
    .summary-value.zero { color:#ddd; }

    /* 附約填寫頁 */
    .coverage-header {
      background:#fff; border:1px solid #e8e8e8; border-radius:10px;
      padding:12px 14px; margin-bottom:12px;
    }
    .coverage-header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .save-btn { padding:6px 16px; background:#378ADD; color:#fff; border:none; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; }
    .save-btn:disabled { background:#ccc; }

    .group-block { background:#fff; border:1px solid #e8e8e8; border-radius:10px; overflow:hidden; margin-bottom:8px; }
    .group-header { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; cursor:pointer; user-select:none; }
    .group-header-left { display:flex; align-items:center; gap:8px; }
    .group-icon { font-size:16px; }
    .group-title { font-size:13px; font-weight:500; }
    .group-count { font-size:10px; padding:1px 6px; border-radius:99px; background:#f0f0f0; color:#888; }
    .group-chevron { font-size:14px; color:#ccc; transition:transform 0.2s; }
    .group-chevron.open { transform:rotate(90deg); }
    .group-body { padding:12px 14px; border-top:1px solid #f0f0f0; }
    .fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field-full { grid-column:1/-1; }

    .field label { display:block; font-size:11px; color:#888; margin-bottom:3px; }
    .input-unit { display:flex; align-items:center; border:1px solid #e0e0e0; border-radius:6px; overflow:hidden; background:#fff; }
    .input-unit:focus-within { border-color:#378ADD; }
    .input-unit input { flex:1; padding:7px 8px; font-size:13px; border:none; outline:none; background:transparent; font-family:inherit; min-width:0; }
    .input-unit .unit { padding:0 7px; font-size:11px; color:#aaa; background:#fafafa; border-left:1px solid #f0f0f0; white-space:nowrap; }

    .range-row { display:flex; align-items:center; gap:5px; }
    .range-row input { flex:1; padding:7px 8px; font-size:13px; border:1px solid #e0e0e0; border-radius:6px; outline:none; font-family:inherit; min-width:0; }
    .range-row input:focus { border-color:#378ADD; }
    .range-sep { font-size:12px; color:#aaa; flex-shrink:0; }
    .range-unit { font-size:11px; color:#aaa; flex-shrink:0; }

    .checkbox-row { display:flex; align-items:center; gap:8px; padding:6px 0; cursor:pointer; }
    .checkbox-row input { width:16px; height:16px; cursor:pointer; accent-color:#378ADD; }
    .checkbox-row span { font-size:13px; color:#555; }

    .saved-hint { font-size:11px; color:#27AE8F; text-align:center; padding:6px 0; display:none; }
    .loading { text-align:center; padding:40px; color:#bbb; font-size:13px; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e0e0e0; border-top-color:#378ADD; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .cat-badge { font-size:10px; padding:1px 6px; border-radius:99px; }
    .cat-壽險保障     { background:#E6F1FB; color:#0C447C; }
    .cat-醫療保障     { background:#E1F5EE; color:#085041; }
    .cat-意外險       { background:#FAEEDA; color:#633806; }
    .cat-重大疾病險   { background:#EEEDFE; color:#3C3489; }
    .cat-重大傷病險   { background:#EEEDFE; color:#3C3489; }
    .cat-特定傷病險   { background:#EEEDFE; color:#3C3489; }
    .cat-儲蓄險       { background:#FBEAF0; color:#72243E; }
    .cat-年金險       { background:#FCEBEB; color:#791F1F; }
    .cat-投資型保險   { background:#f0f0f0; color:#555; }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" id="back-btn" onclick="handleBack()">‹</button>
  <div class="header-title" id="header-title">附約保障清單</div>
  <div class="header-sub" id="header-sub"></div>
</div>

<div class="member-tabs" id="member-tabs"></div>

<div class="main">
  <div id="loading" class="loading"><span class="spinner"></span> 載入中…</div>
  <div id="policy-list-view" style="display:none"></div>
  <div id="coverage-edit-view" style="display:none"></div>
  <div class="saved-hint" id="saved-hint">✓ 已儲存</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzML8PBPSfNIzLx9TT_MgrdQ43yFQmQJy17hLJqTieVPOYnHk6ZYunXkIAYX1653Kbgjg/exec";

const GROUPS = [
  { key:"accident", label:"意外險", icon:"⚡", color:"#633806", bg:"#FAEEDA", fields:[
    { key:"acc_age",      label:"保障到幾歲",        unit:"歲",    type:"age" },
    { key:"acc_opd",      label:"門診醫療",          unit:"萬元/次" },
    { key:"acc_hosp",     label:"意外住院日額",      unit:"元/日" },
    { key:"acc_icu",      label:"加護病房",          unit:"元/日" },
    { key:"acc_fracture", label:"骨折療養金",        unit:"元",    type:"range" },
    { key:"acc_burn",     label:"重大／特定燒燙傷",  unit:"萬元",  type:"range" },
    { key:"acc_special",  label:"特定事故加倍給付",  unit:"萬元",  type:"range" },
    { key:"acc_food",     label:"食物中毒",          unit:"元/次" },
    { key:"acc_disable",  label:"意外失能（殘廢）",  unit:"萬元",  type:"range" },
    { key:"acc_work",     label:"意外喪失工作能力",  unit:"萬元/月" },
    { key:"acc_support",  label:"失能扶助金（月）",  unit:"萬元/月" },
  ]},
  { key:"hospitalize", label:"住院醫療（實支實付）", icon:"🏥", color:"#085041", bg:"#E1F5EE", fields:[
    { key:"hosp_age",        label:"保障到幾歲",        unit:"歲",    type:"age_hosp" },
    { key:"hosp_room",       label:"病房費",            unit:"元/日" },
    { key:"hosp_surgery",    label:"手術費",            unit:"元/次" },
    { key:"hosp_misc",       label:"醫療雜費",          unit:"元/次" },
    { key:"hosp_icu",        label:"加護病房費",        unit:"元/日" },
    { key:"hosp_organ",      label:"重大器官移植",      unit:"萬元",  type:"range" },
    { key:"hosp_deduct",     label:"自負額",            unit:"元" },
    { key:"hosp_limit_per",  label:"每次住院總限額",    unit:"元/次" },
    { key:"hosp_limit_acct", label:"醫療給付總限額",    unit:"萬元" },
  ]},
  { key:"daily", label:"日額型住院", icon:"📅", color:"#0C447C", bg:"#E6F1FB", fields:[
    { key:"daily_room",      label:"住院日額病房費",        unit:"元/日" },
    { key:"daily_discharge", label:"出院療養金",            unit:"元/日" },
    { key:"daily_icu",       label:"加護病房",              unit:"元/日" },
    { key:"daily_burn",      label:"燒燙傷中心",            unit:"元/日" },
    { key:"daily_infect",    label:"法定傳染病",            unit:"元/日" },
    { key:"daily_senior",    label:"老年住院關懷",          unit:"元/次" },
    { key:"daily_opd",       label:"住院前後門診（1週）",   unit:"元/次" },
    { key:"daily_er",        label:"住院前急診",            unit:"元/次" },
    { key:"daily_transport", label:"緊急醫療轉送",          unit:"元/次" },
    { key:"daily_device",    label:"特殊醫材購置補助",      unit:"元/次" },
    { key:"daily_major",     label:"罹患重大疾病（1次）",   unit:"元" },
    { key:"daily_antirej",   label:"抗排斥藥物",            unit:"元" },
    { key:"daily_radiation", label:"代替手術癌症放射線",    unit:"元" },
    { key:"daily_limit",     label:"保險給付限制",          unit:"萬元" },
  ]},
  { key:"surgery", label:"定額手術", icon:"🔪", color:"#3C3489", bg:"#EEEDFE", fields:[
    { key:"surg_opd",     label:"門診手術醫療保險金",   unit:"元", type:"range" },
    { key:"surg_special", label:"特定處置項目保險金",   unit:"元", type:"range" },
    { key:"surg_hosp",    label:"住院手術醫療保險金",   unit:"元", type:"range" },
    { key:"surg_nurse",   label:"住院手術療養保險金",   unit:"元" },
    { key:"surg_limit",   label:"保險給付限制",         unit:"萬元" },
  ]},
  { key:"cancer", label:"癌症醫療", icon:"🎗️", color:"#791F1F", bg:"#FCEBEB", fields:[
    { key:"can_low",             label:"低侵襲性／特定癌症",       unit:"元" },
    { key:"can_first",           label:"初次罹患癌症（一次）",     unit:"萬元" },
    { key:"can_hosp",            label:"癌症住院醫療",             unit:"元/日" },
    { key:"can_discharge",       label:"出院療養",                 unit:"元/日" },
    { key:"can_opd",             label:"癌症門診醫療",             unit:"元/次" },
    { key:"can_proton",          label:"癌症質子治療",             unit:"萬元/次" },
    { key:"can_radiation",       label:"放射線治療",               unit:"元/日" },
    { key:"can_gene",            label:"癌症基因檢測",             unit:"萬元" },
    { key:"can_chemo",           label:"化學治療",                 unit:"元/日" },
    { key:"can_target",          label:"標靶藥物治療",             unit:"萬元" },
    { key:"can_davinci",         label:"達文西手術",               unit:"萬元" },
    { key:"can_breast",          label:"義乳重建手術",             unit:"萬元" },
    { key:"can_immune",          label:"自體免疫細胞治療",         unit:"萬元" },
    { key:"can_marrow",          label:"骨髓移植／幹細胞移植",     unit:"萬元" },
    { key:"can_total",           label:"癌症給付總限額",           unit:"萬元" },
    { key:"can_hospice",         label:"安寧照護",                 unit:"萬元" },
    { key:"can_death",           label:"癌症身故",                 unit:"萬元" },
    { key:"can_real_hosp_limit", label:"實支實付住院醫療限額",     unit:"萬元" },
    { key:"can_real_opd_limit",  label:"實支實付門診醫療限額",     unit:"萬元" },
  ]},
  { key:"ltc", label:"失能長照", icon:"🤝", color:"#27500A", bg:"#EAF3DE", fields:[
    { key:"ltc_care",     label:"長照／長看關懷保險金",         unit:"萬元" },
    { key:"ltc_monthly",  label:"長期照護療養（每月）",         unit:"萬元" },
    { key:"ltc_life",     label:"生活扶助／重大傷病（每月）",   unit:"萬元" },
    { key:"ltc_yr",       label:"特定傷病保險金（每年）",       unit:"萬元/年" },
    { key:"ltc_mo",       label:"特定傷病保險金（每月）",       unit:"萬元/月" },
    { key:"ltc_dis_amt",  label:"失能（殘廢）保險金",           unit:"萬元" },
    { key:"ltc_dis_life", label:"失能（殘廢）生活扶助金",       unit:"萬元" },
    { key:"ltc_waiver",   label:"保費豁免",                     unit:"", type:"checkbox" },
  ]},
];

let currentUser     = null;
let familyData      = null;
let familyFileName  = null;
let personDataMap   = {};
let currentPersonId = null;
let currentPolicyId = null;
let openGroups      = {};
let dirty           = false;
let viewMode        = "list"; // "list" | "edit"

// ── 初始化 ────────────────────────────────────────────────
window.onload = async function() {
  const saved = localStorage.getItem("nbs_user");
  if (!saved) { window.location.href = "index.html"; return; }
  currentUser = JSON.parse(saved);
  familyFileName = localStorage.getItem("nbs_current_family");
  if (!familyFileName) { window.location.href = "main.html"; return; }

  try {
    const fr = await callGAS("readFile", { email:currentUser.email, fileType:"family", fileName:familyFileName });
    familyData = fr.content;
    document.getElementById("header-sub").textContent = familyData.familyName;

    for (const m of familyData.members.filter(m => m.role !== "beneficiary_only")) {
      const pr = await callGAS("readFile", { email:currentUser.email, fileType:"person", fileName:m.name+"_"+m.personId+".json" });
      if (pr.status === "ok") personDataMap[m.personId] = pr.content;
    }

    const savedPerson = localStorage.getItem("nbs_current_person");
    const primary = familyData.members.find(m => m.role === "primary");
    currentPersonId = savedPerson || primary?.personId;

    renderTabs();
    showListView();
  } catch(e) {
    document.getElementById("loading").innerHTML = '<div style="color:#e74c3c">載入失敗：'+e.message+'</div>';
  }
};

// ── Tab ───────────────────────────────────────────────────
function renderTabs() {
  const members = familyData.members.filter(m => m.role !== "beneficiary_only");
  document.getElementById("member-tabs").innerHTML = members.map(m => `
    <div class="member-tab ${currentPersonId===m.personId?'active':''}" onclick="switchPerson('${m.personId}')">
      ${m.name}
    </div>`).join("");
}

function switchPerson(pid) {
  if (dirty && !confirm("有未儲存的變更，確定要切換？")) return;
  currentPersonId = pid;
  currentPolicyId = null;
  dirty = false;
  viewMode = "list";
  renderTabs();
  showListView();
}

// ── 保單列表頁 ────────────────────────────────────────────
function showListView() {
  viewMode = "list";
  document.getElementById("loading").style.display = "none";
  document.getElementById("coverage-edit-view").style.display = "none";
  document.getElementById("policy-list-view").style.display = "block";
  document.getElementById("header-title").textContent = "附約保障清單";
  document.getElementById("back-btn").onclick = handleBack;

  const person = personDataMap[currentPersonId];
  const policies = person?.policies || [];

  if (policies.length === 0) {
    document.getElementById("policy-list-view").innerHTML = `
      <div style="text-align:center;padding:40px 20px;color:#bbb;font-size:13px;">
        尚無保單，請先至「保險繳費」頁面輸入保單資料
      </div>`;
    return;
  }

  // 計算每張保單的已填保障數
  function countCoverage(policy) {
    const cov = policy.coverage || {};
    return GROUPS.flatMap(g => g.fields).filter(f => {
      if (f.type === "range") return cov[f.key+"_min"] || cov[f.key+"_max"];
      if (f.type === "checkbox") return cov[f.key];
      return cov[f.key];
    }).length;
  }

  // 計算保障總覽（加總所有保單）
  const totalCov = {};
  policies.forEach(p => {
    const cov = p.coverage || {};
    GROUPS.flatMap(g => g.fields).forEach(f => {
      if (f.type === "checkbox") {
        if (cov[f.key]) totalCov[f.key] = true;
      } else if (f.type === "range") {
        // range 取最大值
        const v = Math.max(parseFloat(cov[f.key+"_max"])||0, parseFloat(totalCov[f.key+"_max"])||0);
        if (v > 0) totalCov[f.key+"_max"] = v;
      } else {
        totalCov[f.key] = (totalCov[f.key]||0) + (parseFloat(cov[f.key])||0);
      }
    });
  });

  // 總覽卡片（顯示重要項目）
  const keyItems = [
    { key:"acc_special", label:"意外加倍",  unit:"萬" },
    { key:"hosp_room",   label:"病房費",    unit:"元/日" },
    { key:"daily_room",  label:"住院日額",  unit:"元/日" },
    { key:"can_first",   label:"初次罹癌",  unit:"萬" },
    { key:"ltc_monthly", label:"長照每月",  unit:"萬" },
    { key:"ltc_dis_amt", label:"失能一次金",unit:"萬" },
  ];

  let summaryHtml = `<div class="summary-card">
    <div class="summary-title">保障總覽（所有保單加總）</div>
    <div class="summary-grid">`;
  keyItems.forEach(item => {
    const val = totalCov[item.key] || 0;
    summaryHtml += `<div class="summary-item">
      <div class="summary-label">${item.label}</div>
      <div class="summary-value ${val?'':'zero'}">${val ? val.toLocaleString()+item.unit : '—'}</div>
    </div>`;
  });
  summaryHtml += `</div></div>`;

  // 保單列表
  let listHtml = `<div style="font-size:11px;font-weight:500;color:#999;margin-bottom:8px;letter-spacing:0.05em;">
    點選保單填寫附約保障金額</div>`;

  policies.forEach(p => {
    const count = countCoverage(p);
    const total = GROUPS.flatMap(g => g.fields).length;
    const hasCov = count > 0;
    listHtml += `
    <div class="policy-item ${hasCov?'has-coverage':'no-coverage'}" onclick="openCoverageEdit('${p.id}')">
      <div class="policy-item-left">
        <div>
          <span class="policy-item-no">${p.policyNo||p.id}</span>
          <span class="cat-badge cat-${p.category||''}" style="margin-left:6px">${p.category||''}</span>
        </div>
        <div class="policy-item-name">${p.itemName||'—'}</div>
        <div class="policy-item-meta">${p.company||'—'}　${p.payMode||''}　NT${(p.premiumTWD||0).toLocaleString()}</div>
      </div>
      <div class="policy-item-right">
        <span class="coverage-count ${count===0?'zero':''}">${count} 項已填</span>
        <span class="chevron">›</span>
      </div>
    </div>`;
  });

  document.getElementById("policy-list-view").innerHTML = summaryHtml + listHtml;
}

// ── 開啟附約編輯頁 ────────────────────────────────────────
function openCoverageEdit(policyId) {
  currentPolicyId = policyId;
  viewMode = "edit";
  openGroups = { accident:true };

  const person = personDataMap[currentPersonId];
  const policy = person?.policies?.find(p => p.id === policyId);
  if (!policy) return;

  // 確保 coverage 存在
  if (!policy.coverage) policy.coverage = {};

  document.getElementById("policy-list-view").style.display = "none";
  document.getElementById("coverage-edit-view").style.display = "block";
  document.getElementById("header-title").textContent = policy.itemName || "附約保障";
  document.getElementById("back-btn").onclick = () => {
    if (dirty && !confirm("有未儲存的變更，確定要返回？")) return;
    dirty = false;
    showListView();
  };

  renderCoverageEdit(policy);
}

function renderCoverageEdit(policy) {
  const cov = policy.coverage || {};

  // 計算各群組已填數
  const allFields = GROUPS.flatMap(g => g.fields).length;
  const filled = GROUPS.flatMap(g => g.fields).filter(f => {
    if (f.type === "range") return cov[f.key+"_min"] || cov[f.key+"_max"];
    if (f.type === "checkbox") return cov[f.key];
    return cov[f.key];
  }).length;

  let html = `
    <div class="coverage-header">
      <div class="coverage-header-top">
        <div>
          <span class="policy-item-no">${policy.policyNo||policy.id}</span>
          <span class="cat-badge cat-${policy.category||''}" style="margin-left:6px">${policy.category||''}</span>
        </div>
        <button class="save-btn" id="save-btn" onclick="saveCoverage()">儲存</button>
      </div>
      <div style="font-size:12px;color:#888;margin-top:4px">${policy.company||'—'}　已填 ${filled}/${allFields} 項</div>
    </div>`;

  GROUPS.forEach(g => {
    const filledCount = g.fields.filter(f => {
      if (f.type === "range") return cov[f.key+"_min"] || cov[f.key+"_max"];
      if (f.type === "checkbox") return cov[f.key];
      return cov[f.key];
    }).length;
    const isOpen = openGroups[g.key];

    html += `<div class="group-block">
      <div class="group-header" onclick="toggleGroup('${policy.id}','${g.key}')" style="background:${isOpen?g.bg:'#fff'}">
        <div class="group-header-left">
          <span class="group-icon">${g.icon}</span>
          <span class="group-title" style="color:${g.color}">${g.label}</span>
          <span class="group-count">${filledCount}/${g.fields.length}</span>
        </div>
        <span class="group-chevron ${isOpen?'open':''}">›</span>
      </div>`;

    if (isOpen) {
      html += `<div class="group-body"><div class="fields-grid">`;
      g.fields.forEach(f => {
        // ── 保障到幾歲（意外險）
        if (f.type === "age") {
          const av = cov[f.key]||"";
          html += `<div class="field field-full">
            <label>${f.label}</label>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              ${[70,75,80,85].map(a=>`<button onclick="setAge('${f.key}',${a})" style="padding:4px 12px;font-size:12px;border-radius:99px;cursor:pointer;font-family:inherit;border:1.5px solid ${av==a?'#633806':'#ddd'};background:${av==a?'#FAEEDA':'#fff'};color:${av==a?'#633806':'#666'}">${a}歲</button>`).join("")}
              <input type="number" id="cov_${f.key}" value="${av}" placeholder="自填" style="width:64px;padding:5px 8px;font-size:13px;border:1px solid #ddd;border-radius:6px;outline:none;font-family:inherit" oninput="markDirty()" />
              <span style="font-size:11px;color:#aaa">歲</span>
            </div>
          </div>`;
        }
        // ── 保障到幾歲（實支實付，含類型）
        else if (f.type === "age_hosp") {
          const av  = cov[f.key]||"";
          const tv  = cov[f.key+"_type"]||"一般";
          html += `<div class="field field-full">
            <label>${f.label}</label>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
              ${[75,80,85].map(a=>`<button onclick="setAge('${f.key}',${a})" style="padding:4px 12px;font-size:12px;border-radius:99px;cursor:pointer;font-family:inherit;border:1.5px solid ${av==a?'#085041':'#ddd'};background:${av==a?'#E1F5EE':'#fff'};color:${av==a?'#085041':'#666'}">${a}歲</button>`).join("")}
              <input type="number" id="cov_${f.key}" value="${av}" placeholder="自填" style="width:64px;padding:5px 8px;font-size:13px;border:1px solid #ddd;border-radius:6px;outline:none;font-family:inherit" oninput="markDirty()" />
              <span style="font-size:11px;color:#aaa">歲</span>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <span style="font-size:11px;color:#666">保障類型：</span>
              ${["一般","增高保障","延長保障"].map(t=>`<button onclick="setHospType('${f.key}','${t}')" style="padding:4px 12px;font-size:12px;border-radius:99px;cursor:pointer;font-family:inherit;border:1.5px solid ${tv===t?'#085041':'#ddd'};background:${tv===t?'#E1F5EE':'#fff'};color:${tv===t?'#085041':'#666'}">${t}</button>`).join("")}
            </div>
            ${tv==="增高保障"?`<div style="font-size:11px;color:#085041;margin-top:4px;padding:4px 8px;background:#E1F5EE;border-radius:5px">📌 增高保障：同時有兩張實支實付，理賠時互補給付</div>`:""}
            ${tv==="延長保障"?`<div style="font-size:11px;color:#085041;margin-top:4px;padding:4px 8px;background:#E1F5EE;border-radius:5px">📌 延長保障：舊保單到齡後，新保單接續實支實付給付</div>`:""}
          </div>`;
        }
        // ── 勾選
        else if (f.type === "checkbox") {
          html += `<div class="field field-full">
            <label class="checkbox-row">
              <input type="checkbox" id="cov_${f.key}" ${cov[f.key]?"checked":""} onchange="markDirty()" />
              <span>${f.label}</span>
            </label>
          </div>`;
        }
        // ── 範圍值
        else if (f.type === "range") {
          html += `<div class="field field-full">
            <label>${f.label}</label>
            <div class="range-row">
              <input type="number" id="cov_${f.key}_min" placeholder="最低" value="${cov[f.key+'_min']||''}" oninput="markDirty()" />
              <span class="range-sep">～</span>
              <input type="number" id="cov_${f.key}_max" placeholder="最高" value="${cov[f.key+'_max']||''}" oninput="markDirty()" />
              <span class="range-unit">${f.unit}</span>
            </div>
          </div>`;
        }
        // ── 一般數值
        else {
          html += `<div class="field">
            <label>${f.label}</label>
            <div class="input-unit">
              <input type="number" id="cov_${f.key}" placeholder="—" value="${cov[f.key]||''}" oninput="markDirty()" />
              <span class="unit">${f.unit}</span>
            </div>
          </div>`;
        }
      });
      html += `</div></div>`;
    }
    html += `</div>`;
  });

  document.getElementById("coverage-edit-view").innerHTML = html;
}

function toggleGroup(policyId, key) {
  collectCurrentValues();
  openGroups[key] = !openGroups[key];
  const person = personDataMap[currentPersonId];
  const policy = person?.policies?.find(p => p.id === policyId);
  if (policy) renderCoverageEdit(policy);
}

function markDirty() { dirty = true; }

function setAge(key, val) {
  const person = personDataMap[currentPersonId];
  if (!person) return;
  if (!person.coverage) person.coverage = {};
  const policy = person?.policies?.find(p => p.id === currentPolicyId);
  if (policy) {
    if (!policy.coverage) policy.coverage = {};
    policy.coverage[key] = val;
  }
  dirty = true;
  // 重新渲染以更新按鈕狀態
  const p2 = person?.policies?.find(p => p.id === currentPolicyId);
  if (p2) renderCoverageEdit(p2);
}

function setHospType(key, val) {
  const person = personDataMap[currentPersonId];
  if (!person) return;
  const policy = person?.policies?.find(p => p.id === currentPolicyId);
  if (policy) {
    if (!policy.coverage) policy.coverage = {};
    policy.coverage[key+"_type"] = val;
  }
  dirty = true;
  const p2 = person?.policies?.find(p => p.id === currentPolicyId);
  if (p2) renderCoverageEdit(p2);
}

// ── 收集畫面上的值 ────────────────────────────────────────
function collectCurrentValues() {
  const person = personDataMap[currentPersonId];
  if (!person || !currentPolicyId) return;
  const policy = person.policies?.find(p => p.id === currentPolicyId);
  if (!policy) return;
  if (!policy.coverage) policy.coverage = {};

  GROUPS.forEach(g => {
    if (!openGroups[g.key]) return;
    g.fields.forEach(f => {
      if (f.type === "age" || f.type === "age_hosp") {
        const el = document.getElementById("cov_"+f.key);
        if (el) { const v = parseInt(el.value); policy.coverage[f.key] = isNaN(v)?null:v; }
        // _type 由 setHospType 直接寫入，不需要再讀
      } else if (f.type === "checkbox") {
        const el = document.getElementById("cov_"+f.key);
        if (el) policy.coverage[f.key] = el.checked;
      } else if (f.type === "range") {
        const minEl = document.getElementById("cov_"+f.key+"_min");
        const maxEl = document.getElementById("cov_"+f.key+"_max");
        if (minEl) { const v = parseFloat(minEl.value); policy.coverage[f.key+"_min"] = isNaN(v)?null:v; }
        if (maxEl) { const v = parseFloat(maxEl.value); policy.coverage[f.key+"_max"] = isNaN(v)?null:v; }
      } else {
        const el = document.getElementById("cov_"+f.key);
        if (el) { const v = parseFloat(el.value); policy.coverage[f.key] = isNaN(v)?null:v; }
      }
    });
  });
}

// ── 儲存 ─────────────────────────────────────────────────
async function saveCoverage() {
  collectCurrentValues();
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "儲存中…";

  try {
    const person = personDataMap[currentPersonId];
    person.updatedAt = new Date().toISOString();
    const member = familyData.members.find(m => m.personId === currentPersonId);

    await callGAS("saveFile", {
      email: currentUser.email,
      fileType: "person",
      fileId: currentPersonId,
      fileName: member.name+"_"+currentPersonId+".json",
      content: person,
    });

    dirty = false;
    const hint = document.getElementById("saved-hint");
    hint.style.display = "block";
    setTimeout(() => hint.style.display = "none", 2000);

    // 重新渲染更新已填數
    const policy = person.policies?.find(p => p.id === currentPolicyId);
    if (policy) renderCoverageEdit(policy);

  } catch(e) {
    alert("儲存失敗："+e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "儲存";
  }
}

// ── 工具函式 ──────────────────────────────────────────────
function handleBack() {
  if (dirty && !confirm("有未儲存的變更，確定要離開？")) return;
  window.location.href = "family.html";
}

function callGAS(action, params) {
  if (action === "saveFile") {
    return fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action, ...params }),
    }).then(r => r.json());
  }
  
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  Object.entries(params||{}).forEach(([k,v]) => {
    if (typeof v === "object") url.searchParams.set(k, encodeURIComponent(JSON.stringify(v)));
    else if (v !== null && v !== undefined) url.searchParams.set(k, v);
  });
  return fetch(url.toString()).then(res => res.json());
}
